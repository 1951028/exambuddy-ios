损耗与（）有关","options":{"A":"负载电流","B":"短路阻抗","C":"铁芯材质","D":"运行温度"},"answer":"AB","explanation":"变压器短路损耗（铜损）P=I²Rk，与负载电流和短路阻抗有关，故AB正确；铁芯材质影响铁损、运行温度影响电阻但非短路损耗主要决定因素。","bank":"电气基础"},{"id":"572668969e17","type":"multiple","category":"电气基础","stem":"标幺值计算的优点包括（）","options":{"A":"简化计算","B":"便于比较不同电压等级设备","C":"物理意义明确","D":"无需考虑基准值"},"answer":"AB","explanation":"标幺值可简化计算、便于比较不同电压等级设备参数，故AB正确；其物理意义并不直观（C错），且必须选取基准值（D错）。","bank":"电气基础"},{"id":"a5f589187af3","type":"multiple","category":"电气基础","stem":"消弧线圈的补偿方式有（）","options":{"A":"全补偿","B":"过补偿","C":"欠补偿","D":"无补偿"},"answer":"ABC","explanation":"消弧线圈补偿方式分为全补偿、过补偿和欠补偿，故ABC正确；无补偿不属于其补偿方式。","bank":"电气基础"},{"id":"08d60582e375","type":"multiple","category":"电气基础","stem":"电压互感器的接线方式有（）","options":{"A":"单相式","B":"V-V接线","C":"Y0-Y0-Δ接线","D":"三角形接线"},"answer":"ABC","explanation":"电压互感器常用接线有单相式、V-V接线、Y0-Y0-Δ（开口三角）接线，故ABC正确；普通电压互感器一般不采用三角形接线，故D不选。","bank":"电气基础"},{"id":"1dad196557db","type":"multiple","category":"电气基础","stem":"改善电压质量的措施包括（）","options":{"A":"投切并联电容器","B":"调节变压器分接头","C":"加装静止无功发生器（SVG）","D":"增加线路电阻"},"answer":"ABC","explanation":"改善电压质量可投切并联电容器、调节变压器分接头、加装SVG，故ABC正确；增加线路电阻只会额外降压，不能改善电压质量，故D错。","bank":"电气基础"},{"id":"08349fc31183","type":"multiple","category":"电气基础","stem":"对称分量法中，三相系统可分解为（）","options":{"A":"正序分量","B":"负序分量","C":"零序分量","D":"谐波分量"},"answer":"ABC","explanation":"对称分量法将三相不对称系统分解为正序、负序和零序三组对称分量，故ABC正确；谐波分量不属于对称分量法的基本分解。","bank":"电气基础"},{"id":"a28cdf28cb90","type":"multiple","category":"电气基础","stem":"短路电流的危害包括（）","options":{"A":"热效应损坏设备","B":"电动力效应导致机械损伤","C":"电压骤降影响负荷","D":"系统频率崩溃"},"answer":"ABC","explanation":"短路电流危害包括热效应损坏设备、电动力导致机械损伤、电压骤降影响负荷，故ABC正确；频率崩溃主要因功率严重失衡，非短路直接典型危害，故D不选。","bank":"电气基础"},{"id":"3a62a3684a37","type":"multiple","category":"电气基础","stem":"属于不对称短路的故障类型有（）","options":{"A":"三相短路","B":"两相短路","C":"单相接地短路","D":"两相接地短路"},"answer":"BCD","explanation":"不对称短路指三相不对称的短路，包括两相短路、单相接地短路、两相接地短路，故BCD正确；三相短路为对称短路。","bank":"电气基础"},{"id":"39bd49826968","type":"multiple","category":"电气基础","stem":"电抗器的应用场景包括（）","options":{"A":"限制短路电流","B":"补偿线路容性无功","C":"抑制过电压","D":"改善系统稳定"},"answer":"ABCD","explanation":"电抗器可用于限制短路电流、作为并联电抗器补偿线路容性无功、抑制过电压、并改善系统稳定，故ABCD均正确。","bank":"电气基础"},{"id":"7dd40d141dbc","type":"multiple","category":"电气基础","stem":"输电线路的参数包括（）","options":{"A":"电阻","B":"电抗","C":"电导","D":"电纳"},"answer":"ABCD","explanation":"输电线路分布参数包括电阻、电抗、电导和电纳（π型等效），故ABCD均正确。","bank":"电气基础"},{"id":"6951ff3b95fe","type":"multiple","category":"电气基础","stem":"电力系统发生故障后，工频电气量变化的主要特征（）","options":{"A":"电流增大","B":"电压降低","C":"电流与电压之间的相位角改变","D":"测量阻抗发生变化"},"answer":"ABCD","explanation":"故障后工频电气量主要特征为电流增大、电压降低、电流与电压相位角改变、测量阻抗发生变化，故ABCD均正确。","bank":"电气基础"},{"id":"830b2b493bc3","type":"multiple","category":"电气基础","stem":"电力系统中两处或两处以上地点同时发生故障称为多重故障或复杂故障，它的分析方法也是以（）为基础的","options":{"A":"对称分量法","B":"回路电流法","C":"节点电压法","D":"叠加原理"},"answer":"AD","explanation":"多重（复杂）故障的分析以对称分量法和叠加原理为基础，故AD正确；回路电流法、节点电压法一般不用于复杂故障分析，故BC不选。","bank":"电气基础"},{"id":"9f0918bfefc1","type":"multiple","category":"电气基础","stem":"电力系统分析使用的输电线路参数有（）","options":{"A":"电阻","B":"电抗","C":"电导","D":"电纳"},"answer":"ABCD","explanation":"电力系统分析所用输电线路参数包括电阻、电抗、电导、电纳，故ABCD均正确。","bank":"电气基础"},{"id":"583eeec6c234","type":"multiple","category":"电气基础","stem":"电力系统发生全相振荡时，（）不会发生误动","options":{"A":"阻抗元件","B":"分相电流差动元件","C":"电流速断元件","D":"动作时间大于1.5s的距离Ⅲ段"},"answer":"BD","explanation":"全相振荡时无差流，分相电流差动元件不误动（B）；动作时间大于1.5s的距离III段可躲过振荡（D）；阻抗元件和电流速断在振荡时可能误动，故AC不选。","bank":"电气基础"},{"id":"5203b6482b07","type":"multiple","category":"电气基础","stem":"二次设备是用于对电力系统及一次设备的工况进行（）的低压电气设备","options":{"A":"检测","B":"控制","C":"调节","D":"保护"},"answer":"ABCD","explanation":"二次设备是对一次设备及系统工况进行检测、控制、调节、保护的低压电气设备，故ABCD均正确。","bank":"电气基础"},{"id":"c9e21959567d","type":"multiple","category":"电气基础","stem":"电流互感器10％误差不满足要求时，采取的措施正确的有（）","options":{"A":"增加二次电缆截面","B":"改用伏安特性较高的二次绕组","C":"提高电流互感器变比","D":"并接备用电流互感器使允许负载增加1倍"},"answer":"ABC","explanation":"CT10%误差不满足时可增加二次电缆截面、改用伏安特性较高的二次绕组或提高CT变比（ABC）；并接备用CT并不能可靠使允许负载增加一倍且可能引入误差，故D不选。","bank":"电气基础"},{"id":"a7867f995aae","type":"multiple","category":"电气基础","stem":"在电力系统中（）等都是保证(系统稳定)的重要措施","options":{"A":"采用快速保护","B":"自动重合闸装置","C":"自动按频率减负荷装置","D":"采用后备保护"},"answer":"ABC","explanation":"保证系统稳定应采用快速保护、自动重合闸、自动按频率减负荷装置（ABC）；后备保护动作慢，并非保证稳定的主要措施，故D不选。","bank":"电气基础"},{"id":"747741eb2bb6","type":"multiple","category":"电气基础","stem":"TP级电流互感器等级可分为（）","options":{"A":"TPS","B":"TPX","C":"TPY","D":"TPZ"},"answer":"ABCD","explanation":"TP级电流互感器分为TPS、TPX、TPY、TPZ四个级别，故ABCD均正确。","bank":"电气基础"},{"id":"31828c686ea0","type":"multiple","category":"电气基础","stem":"分析及计算表明，电流互感器的二次负载阻抗与（）有关","options":{"A":"二次回路接线方式","B":"一次系统故障类型","C":"二次设备的阻抗","D":"二次负载系数K"},"answer":"ABCD","explanation":"CT二次负载阻抗与二次回路接线方式、一次系统故障类型、二次设备阻抗及二次负载系数K均有关，故ABCD均正确。","bank":"电气基础"},{"id":"370015957799","type":"multiple","category":"电气基础","stem":"电流互感器工作特点是（）","options":{"A":"一次匝数多，二次匝数少","B":"铁芯中工作磁密很低、系统故障时磁密大","C":"高内阻，定流源","D":"二次回路不得开路"},"answer":"BCD","explanation":"CT一次匝数少、二次匝数多（A说反，错）；其铁芯工作磁密低、故障时磁密大，为高内阻近似恒流源，且二次回路不得开路，故BCD正确。","bank":"电气基础"},{"id":"480608c40258","type":"multiple","category":"电气基础","stem":"正弦交流电三要素的内容以及表示的含义是（）","options":{"A":"最大值：是指正弦交流量最大的有效值","B":"最大值：是指正弦交流量最大的瞬时值","C":"角频率：是指正弦交流量每秒钟变化的电角度","D":"初相角：正弦交流电在计时起点t=0时的相位，要求其绝对值小于180°"},"answer":"BCD","explanation":"正弦交流电三要素：最大值指最大瞬时值（B对，A说有效值错）、角频率指每秒变化电角度（C对）、初相角为t=0时相位且绝对值小于180°（D对），故BCD正确。","bank":"电气基础"},{"id":"c28d021eec53","type":"multiple","category":"电气基础","stem":"在纯电感电路中，电压与电流的关系是（）","options":{"A":"纯电感电路的电压与电流频率相同","B":"电流的相位滞后于外加电压u为π/2（即90°）","C":"电流的相位超前于外加电压u为π/2（即90°）","D":"电压与电流有效值的关系也具有欧姆定律的形式"},"answer":"ABD","explanation":"纯电感电路中电压与电流频率相同（A），电流相位滞后电压90°（B），电压电流有效值满足欧姆定律形式U=IX_L（D）；电流超前电压（C）错误。","bank":"电气基础"},{"id":"27f571824db2","type":"multiple","category":"电气基础","stem":"一段电路的欧姆定律用公式表示为（）","options":{"A":"U=I/R","B":"R=U/I","C":"U＝IR","D":"I=U/R"},"answer":"BCD","explanation":"一段电路欧姆定律为U=IR、R=U/I、I=U/R，故BCD正确；U=I/R（A）错误。","bank":"电气基础"},{"id":"3d31b9598de6","type":"multiple","category":"电气基础","stem":"电流所做的功叫电功，用符号A表示。电功的大小与电路中的（）成正比，用公式表示为A＝UIt＝I2Rt","options":{"A":"电流","B":"电压","C":"时间","D":"频率"},"answer":"ABC","explanation":"电功A=UIt=I²Rt，与电路中的电流、电压、时间成正比，故ABC正确；与频率无关，故D不选。","bank":"电气基础"},{"id":"bc9c14ebd2c4","type":"multiple","category":"电气基础","stem":"电路的组成部分有（）","options":{"A":"电源","B":"负载","C":"辅助设备","D":"导线"},"answer":"ABCD","explanation":"电路由电源、负载、辅助设备和导线组成，故ABCD均正确。","bank":"电气基础"},{"id":"0438aa9fa9aa","type":"multiple","category":"电气基础","stem":"电力系统发生振荡和短路的区别有（）","options":{"A":"故障时，电流和电压的幅值均呈周期性变化","B":"振荡时，电流和电压的变化速度较慢","C":"振荡时，三相完全对称","D":"短路时，电流和电压之间的相位是不变的"},"answer":"BCD","explanation":"短路时电气量突变且不呈周期性、相位由系统阻抗决定基本不变；振荡时电气量变化缓慢、呈周期性且三相对称，故BCD正确；A说故障时幅值周期性变化错误。","bank":"电气基础"},{"id":"855465a71e60","type":"multiple","category":"电气基础","stem":"分布式电源切除时间应符合（），下列说法正确的是（）","options":{"A":"线路保护","B":"重合闸","C":"同期合闸","D":"备自投"},"answer":"ABD","explanation":"分布式电源切除时间须与线路保护、重合闸、备自投配合（ABD）；同期合闸不属切除时间配合范畴，故C不选。","bank":"电气基础"},{"id":"d670ccbc824c","type":"multiple","category":"电气基础","stem":"衡量电能质量的技术指标是()","options":{"A":"电压偏移","B":"频率偏移","C":"电位角偏移","D":"电压波形畸变率"},"answer":"ABD","explanation":"电能质量技术指标为电压偏移、频率偏移和电压波形畸变率（谐波/波形），故ABD正确；电位角偏移不是标准电能质量指标，故C不选。","bank":"电气基础"},{"id":"15e52208b68e","type":"multiple","category":"电气基础","stem":"特殊方式包括以下哪几种方式()","options":{"A":"节假日运行方式","B":"主干线路、变压器或其他系统重要元件、设备计划外检修","C":"电网主要安全稳定控制装置退出","D":"其他对系统安全稳定运行影响较为严重的方式"},"answer":"ABCD","explanation":"特殊方式包括节假日运行方式、主设备计划外检修、安控装置退出及其他严重影响安全稳定运行的方式，故ABCD均正确。","bank":"电气基础"},{"id":"295a7718d9f7","type":"multiple","category":"电气基础","stem":"不需要考虑振荡闭锁的继电器有：（）","options":{"A":"极化量带记忆的阻抗继电器","B":"工频变化量距离继电器","C":"多相补偿距离继电器"},"answer":"BC","explanation":"工频变化量距离继电器和多相补偿距离继电器本身不受振荡影响，不需振荡闭锁（BC）；极化量带记忆的阻抗继电器在振荡时可能误动，需考虑闭锁，故A不选。","bank":"电气基础"},{"id":"17b285fd5fc1","type":"multiple","category":"电气基础","stem":"关于无限大功率电源，下述说法中正确的是()","options":{"A":"无限大功率电源的端电压和功率保持不变","B":"无限大功率电源供电情况下，三相短路电流中的周期分量在暂态过程中幅值保持不变","C":"无限大功率电源供电情况下，三相短路电流中的非周期分量起始值均相等","D":"无限大功率电源供电情况下，发生三相短路后的暂态过程中，各相短路电流中都包含有周期分量和非周期分量"},"answer":"ABD","explanation":"无限大功率电源端电压和功率保持不变（A），其供电时短路电流周期分量幅值保持不变（B），各相短路电流均含周期和非周期分量（D）；非周期分量起始值因合闸角不同各相不相等（C错），故选ABD。","bank":"电气基础"},{"id":"6a83f506faa5","type":"multiple","category":"电气基础","stem":"下列哪种电源属于新能源发电（）","options":{"A":"太阳能","B":"风能","C":"煤炭","D":"生物质能"},"answer":"ABD","explanation":"太阳能、风能、生物质能属新能源发电，故ABD正确；煤炭为常规化石能源，故C不选。","bank":"电气基础"},{"id":"a28997c3cc35","type":"multiple","category":"电气基础","stem":"下列哪种设备不能用于提高电力系统的功率因数（）","options":{"A":"电抗器","B":"电容器","C":"电阻器","D":"互感器"},"answer":"ACD","explanation":"提高功率因数应并联电容器（提供容性无功）；电抗器、电阻器、互感器均不能提高功率因数，故ACD正确（B为能提高者，不选）。","bank":"电气基础"},{"id":"348e1b9c5dbc","type":"multiple","category":"电气基础","stem":"关于同步发电机的励磁电流说法错误的是（）","options":{"A":"直流电流","B":"交流电流","C":"脉冲电流","D":"正弦电流"},"answer":"BCD","explanation":"同步发电机励磁电流为直流，故A正确不选；交流电流、脉冲电流、正弦电流均说法错误，故选BCD。","bank":"电气基础"},{"id":"64dda6361634","type":"multiple","category":"电气基础","stem":"下列负荷不属于一级负荷（）","options":{"A":"居民生活用电","B":"学校教学用电","C":"医院手术室用电","D":"商场照明用电"},"answer":"ABD","explanation":"一级负荷指中断供电将造成人身伤亡或重大损失者，医院手术室属一级负荷（C不选）；居民生活用电、学校教学用电、商场照明用电不属于一级负荷，故选ABD。","bank":"电气基础"},{"id":"abb7c36aac95","type":"multiple","category":"电气基础","stem":"以下不是变压器短路时的主要损耗的是（）。","options":{"A":"铜损","B":"铁损","C":"介损","D":"涡流"},"answer":"BCD","explanation":"变压器短路时的主要损耗是铜损（A属，不选）；铁损、介损、涡流不是短路时的主要损耗，故选BCD。","bank":"电气基础"},{"id":"0a1e0bc181e5","type":"multiple","category":"电气基础","stem":"电感的特性有（）。","options":{"A":"通直流，阻交流","B":"通低频，阻高频","C":"储存磁场能","D":"储存电场能"},"answer":"ABC","explanation":"电感具有通直流阻交流、通低频阻高频的特性，并能储存磁场能，故ABC正确；储存电场能是电容的特性，故D错。","bank":"电气基础"},{"id":"a317a2b0301b","type":"multiple","category":"电气基础","stem":"关于电阻，以下说法正确的是（）。","options":{"A":"电阻是导体对电流的阻碍作用","B":"电阻大小只与导体长度有关","C":"电阻单位是欧姆","D":"电阻越大，相同电压下电流越小"},"answer":"ACD","explanation":"电阻是导体对电流的阻碍作用、单位为欧姆、电阻越大相同电压下电流越小，故ACD正确；电阻大小还与截面积、材料、温度有关，非只与长度有关，故B错。","bank":"电气基础"},{"id":"be210d7482e7","type":"multiple","category":"电气基础","stem":"大电流系统，关于非全相运行，以下说法正确的是（）","options":{"A":"当采用线路电压互感器时，零序方向元件会动作","B":"当采用线路电压互感器时，负序序方向元件会动作","C":"当采用母线电压互感器时，零序方向元件会动作","D":"当采用母线电压互感器时，负序序方向元件会动作"},"answer":"CD","explanation":"大电流系统非全相运行时存在负序、零序分量；当TV在母线侧时可感受到序电压，零序方向元件和负序方向元件会动作（CD）；TV在线路侧时序电压为零，方向元件不动作（AB错）。","bank":"电气基础"},{"id":"6e6155e533dc","type":"multiple","category":"电气基础","stem":"变压器并列运行的条件为（）","options":{"A":"变比相等","B":"容量相等","C":"短路电压相等","D":"绕组接线组别相同"},"answer":"ACD","explanation":"变压器并列运行条件为变比相等、短路电压（短路阻抗）相等、绕组接线组别相同，故ACD正确；容量不要求相等（B错）。","bank":"电气基础"},{"id":"42035227c5ce","type":"multiple","category":"电气基础","stem":"当Y/d-11接线的变压器三角形侧发生AB两相短路时，以下说法正确的是（）","options":{"A":"变压器Y侧B相电流值的是A、C相电流值的两倍","B":"变压器Y侧A相电流值的是B、C相电流值的两倍","C":"变压器Y侧C相电流值的是A、B相电流值的两倍","D":"当在主变和故障点之间加入低压限流电抗器降低故障电流时，变压器Y侧后备过电流保护可能无灵敏度"},"answer":"AD","explanation":"Y/d-11变压器三角形侧AB两相短路时，星形侧电流呈B相为A、C相两倍（A）；当在主变与故障点间串入低压限流电抗器降低故障电流时，星形侧后备过流保护可能失去灵敏度（D）；BC说法错误。","bank":"电气基础"},{"id":"d1a0672a720f","type":"multiple","category":"电气基础","stem":"含有零序分量的故障有（）","options":{"A":"单相短路接地","B":"两相短路接地","C":"单相断线","D":"两相断线"},"answer":"ABD","explanation":"单相短路接地、两相短路接地以及两相断线均会引入接地/纵向不对称而产生零序分量，故ABD正确；单相断线虽为不对称故障，但按本题答案不列入，故选ABD。","bank":"电气基础"},{"id":"e8c2e5a8bd57","type":"multiple","category":"电气基础","stem":"短路故障的特点是（）","options":{"A":"电流、电压值突变","B":"电流、电压相位角基本不变","C":"含有负序和零序分量","D":"以上都对"},"answer":"AB","explanation":"短路故障特点是电流、电压值突变，且电流、电压相位角基本不变（由系统阻抗决定），故AB正确；三相短路不含负序、零序分量，故C不全面；D以上都对错误。","bank":"电气基础"},{"id":"593d86d8bc91","type":"single","category":"电气基础","stem":"以下说法正确的是","options":{"A":"电流互感器和电压互感器二次均可以开路","B":"电流互感器二次可以短路但不得开路，电压互感器二次可以开路但不得短路","C":"电流互感器和电压互感器二次均不可以短路"},"answer":"B","explanation":"电流互感器二次侧严禁开路（开路会产生危险高压），允许短路；电压互感器二次侧严禁短路（短路会产生大电流烧毁设备），允许开路。故B正确，A、C均错。","bank":"电气基础"},{"id":"b44cdeaaae51","type":"single","category":"电气基础","stem":"双母线系统，大差的计算公式中()母联电流","options":{"A":"包括","B":"不包括","C":"故障时包括","D":"区内故障时包括"},"answer":"B","explanation":"双母线母差保护的大差取除母联外所有支路电流的代数和，母联电流不计入大差（母联电流计入相应小差），故大差计算公式不包括母联电流。","bank":"电气基础"},{"id":"01ce55048681","type":"single","category":"电气基础","stem":"电力系统中不带量纲的数值是()","options":{"A":"有名值","B":"基值","C":"标么值","D":"额定值"},"answer":"C","explanation":"标么值是实际值与基准值之比，不带量纲；有名值、额定值均带有相应单位（如kV、A），基值也是有量纲的参考量。","bank":"电气基础"},{"id":"31891b4e0ce1","type":"single","category":"电气基础","stem":"()电压是愈近故障点数值越小","options":{"A":"正序","B":"负序","C":"零序","D":"以上均可"},"answer":"A","explanation":"正序电压沿网络分布：愈靠近故障点正序电压越低（短路点处正序电压最小甚至为零）；而负序、零序电压在故障点处最大。故正序电压愈近故障点数值越小。","bank":"电气基础"},{"id":"d89fec31dcb7","type":"single","category":"电气基础","stem":"零序电流I段动作电流的整定为()","options":{"A":"躲过本线路末端短路可能出现的最大短路电流","B":"躲过本线路末端接地短路流过保护的最大零序电流","C":"躲过下级线路末端接地短路流过保护的最大零序电流"},"answer":"B","explanation":"零序电流Ⅰ段（无时限零序速断）按躲过本线路末端接地短路时流过保护的最大零序电流整定，以保证选择性；不躲下级线路末端。","bank":"电气基础"},{"id":"ac41eca55710","type":"single","category":"电气基础","stem":"当故障发生在母联断路器与母联TA之间时出现动作死区，此时应该（）","options":{"A":"启动远方跳闸","B":"只启动母联失灵","C":"启动死区保护","D":"启动断路器失灵保护"},"answer":"C","explanation":"当故障发生在母联断路器与母联TA之间时出现母差死区（小差判区外、大差判区内），专门设置死区（母联死区）保护，经短延时跳开两段母线以切除该死区故障。","bank":"电气基础"},{"id":"457b63e48cc7","type":"single","category":"电气基础","stem":"交流电气设备的铭牌上所注明的额定电压和额定电流都是指电压和电流的（）","options":{"A":"瞬时值","B":"最大值","C":"有效值","D":"最小值"},"answer":"C","explanation":"交流电气设备的铭牌额定值（额定电压、额定电流）均指有效值（方均根值），如220V、5A均为有效值，而非瞬时值或最大值。","bank":"电气基础"},{"id":"640188823e7e","type":"single","category":"电气基础","stem":"在电阻并联的电路中，电路的端电压U等于（）","options":{"A":"各并联支路端电压的平均值","B":"各并联支路的端电压","C":"各并联支路的端电压之和","D":"各并联支路的端电压之差"},"answer":"B","explanation":"并联电路中各支路两端接在同一对节点上，端电压处处相等，故电路端电压U等于各并联支路的端电压。","bank":"电气基础"},{"id":"42f0c647d7f5","type":"single","category":"电气基础","stem":"发生三相对称短路时，短路电流为()","options":{"A":"正序分量","B":"负序分量","C":"零序分量"},"answer":"A","explanation":"三相对称短路属于对称故障，短路电流中只含正序分量，不含负序和零序分量。","bank":"电气基础"},{"id":"623e4278c432","type":"single","category":"电气基础","stem":"一个发电厂有三台以上机组时，则应选择其中（）台容量较大机组同时停用的方式","options":{"A":"一台","B":"两台","C":"三台","D":"四台"},"answer":"C","explanation":"继电保护整定计算中，对装有三台及以上机组的发电厂，应选择其中三台容量较大的机组同时停用的运行方式作为校验方式之一（用于校验最不利开机方式）。（注：属整定规程专门约定。）","bank":"电气基础"},{"id":"57dc9ca75c4e","type":"single","category":"电气基础","stem":"整定计算中，可靠系数K的作用是（）","options":{"A":"提高动作速度","B":"躲过最大负荷电流","C":"保证选择性","D":"补偿互感器误差"},"answer":"C","explanation":"整定计算中的可靠系数Kk（>1）用于躲过最大可能的计算值（如最大负荷电流、最大短路电流），保证保护不误动、保证选择性。它与动作速度、补偿互感器误差无直接关系。","bank":"电气基础"},{"id":"47cfe752cd80","type":"single","category":"电气基础","stem":"强油循环变压器当上层油温上升达()℃时辅助冷却器自动启动，当油温下降至()℃辅助冷却器自动停止","options":{"A":"5055","B":"5550","C":"6065","D":"6560"},"answer":"B","explanation":"强油循环变压器冷却器控制规定：上层油温上升到55℃时自动启动辅助冷却器，下降到50℃时自动停止辅助冷却器（返回）。故为55℃/50℃。","bank":"电气基础"},{"id":"9d130e64f77f","type":"single","category":"电气基础","stem":"监视跳闸线圈断线的继电器()","options":{"A":"跳位继电器TWJ","B":"合位继电器HWJ","C":"合后继电器HHJ","D":"ABC都对"},"answer":"B","explanation":"合闸位置继电器（HWJ）串接在跳闸回路中，正常合闸后HWJ励磁；若跳闸线圈或回路断线，HWJ失磁并发出告警，故HWJ用于监视跳闸线圈回路。TWJ监视合闸回路。","bank":"电气基础"},{"id":"a0a40ced72d9","type":"single","category":"电气基础","stem":"信号的传输可通过硬接线方式或报文方式实现，重要的信号应()实现方式","options":{"A":"保留硬接线","B":"采用软报文","C":"采用告警直传","D":"采用带保持的"},"answer":"A","explanation":"重要信号（如跳闸位置、事故总等）应保留硬接线方式传送，确保不依赖通信报文、在报文丢失或通信异常时仍能可靠反映，故重要的信号应保留硬接线。","bank":"电气基础"},{"id":"8970854949d9","type":"single","category":"电气基础","stem":"断路器灭弧介质压力闭锁、机构动力压力闭锁重动继电器应独立配置，()共用一个重动继电器","options":{"A":"不应","B":"可以","C":"宜","D":"必须"},"answer":"A","explanation":"断路器灭弧介质压力闭锁与机构动力压力闭锁功能独立、互不影响，其重动继电器应独立配置，不应共用，以防相互干扰导致误闭锁或拒动。","bank":"电气基础"},{"id":"6fd2bc2b9e33","type":"single","category":"电气基础","stem":"高压开关控制回路中防跳继电器采用串联自保持时，接入跳合闸回路的自保持线圈的动作电流应小于开关额定跳合闸电流的()，线圈压降应小于5%额定电压","options":{"A":"1/2","B":"1/3","C":"1/5","D":"1/10"},"answer":"A","explanation":"防跳继电器串联自保持线圈接入跳合闸回路时，其动作电流应小于断路器额定跳/合闸电流的1/2，且线圈压降小于5%额定电压，以保证可靠自保持又不致影响跳合闸。","bank":"电气基础"},{"id":"780f0ce74c5a","type":"single","category":"电气基础","stem":"从开关场引自电压互感器二次绕组星形接线的四根引出线(三相电压)中的N线和引自电压互感器三次绕组开口三角形接线的两根引出线(零序电压)中的N线()","options":{"A":"必须分别引至控制室，并在控制室接地","B":"在开关场并接后，合成一根引至控制室接地","C":"三次侧的Un在开关场接地后引入控制室N600,二次侧的Un单独引入控制室N600并接地","D":"二次侧的Un在开关场接地后引入控制室N600,三次侧的Un单独引入控制室N600并接地"},"answer":"A","explanation":"为防止干扰并保证零序电压正确，电压互感器二次星形绕组的N线与三次（开口三角）绕组的N线必须分别独立引至控制室，并在控制室一点接地，不得合并或仅在开关场接地。","bank":"电气基础"},{"id":"53fc97031d76","type":"single","category":"电气基础","stem":"电压互感器二次负荷不应超过其准确级所允许的负荷范围，按负荷()的一相进行验算","options":{"A":"最重","B":"最轻","C":"任意"},"answer":"A","explanation":"电压互感器准确度按二次负荷校验，应以二次负荷最重的一相（最大负载）进行验算，保证在最重负荷下仍满足相应准确级要求。","bank":"电气基础"},{"id":"27d4f524d48e","type":"single","category":"电气基础","stem":"一般规定在电容式电压互感器安装处发生短路故障一次电压降为零时，二次电压要求()ms内下降到10%以下","options":{"A":"10","B":"20","C":"30","D":"50"},"answer":"B","explanation":"电容式电压互感器（CVT）暂态响应较慢，规定在其安装处一次电压突降为零（短路）时，二次电压应在20ms内下降到10%以下，以保证保护快速正确动作。","bank":"电气基础"},{"id":"a076ac5962ee","type":"single","category":"电气基础","stem":"双母线接线系统中，采用隔离开关的辅助触点启动继电器实现电压自动切换的作用有()。","options":{"A":"避免两组母线电压互感器二次误并列","B":"防止电压互感器二次向一次反充电","C":"使保护装置的二次电压回路随主接线一起进行切换，避免电压一、二次不对应造成误动或拒动","D":"保证电压互感器二次电压稳定"},"answer":"C","explanation":"双母线接线中利用隔离开关辅助触点实现电压自动切换，主要作用是使保护装置的二次电压回路随一次主接线一起切换，避免一次倒母线后电压一、二次不对应引起保护误动或拒动。虽也能避免PT二次误并列，但主要作用是C。","bank":"电气基础"},{"id":"15437e4d7d2f","type":"single","category":"电气基础","stem":"一台电压互感器变比为20kV/√3/100V/√3/100V,如开口三角绕组C相接反，额定电压运行时，开口三角的输出电压为()。","options":{"A":"100V","B":"200V","C":"300V","D":"0V"},"answer":"B","explanation":"正常时开口三角输出电压为3U0=100V；若开口三角绕组C相接反，三相二次电压向量相加变为两相之差的两倍，即输出为2×100V=200V。","bank":"电气基础"},{"id":"0409949cf81c","type":"single","category":"电气基础","stem":"电力系统短路故障时，电流互感器饱和是需要时间的，下列说法错误的是()。","options":{"A":"饱和时间受短路故障时电压初相角影响","B":"饱和时间受一次回路时间常数影响","C":"电流互感器剩磁越大，饱和时间越短","D":"增大二次负载阻抗，可增长饱和时间"},"answer":"D","explanation":"CT饱和需要一定时间积累磁通，受短路初相角、一次回路时间常数、剩磁等影响；增大二次负载阻抗会加快（缩短）饱和而非增长饱和时间，故D说法错误。","bank":"电气基础"},{"id":"3ed3e7b1bfab","type":"single","category":"电气基础","stem":"如果电流互感器按三角形接线，则在三相短路时，每一相电流互感器之等效负载是实际负载(每相)的()倍。","options":{"A":"3","B":"1/3","C":"√3","D":"1/√3"},"answer":"A","explanation":"CT按三角形接线时，每相二次绕组承受线电流（为相电流的√3倍），等效负载功率∝电流平方，故每相等效负载为实际每相负载的3倍。","bank":"电气基础"},{"id":"d33720da9627","type":"single","category":"电气基础","stem":"电力系统短路故障时，电流互感器发生饱和，关于二次电流波形特征说法不正确的是()。","options":{"A":"波形失真，伴随谐波出现","B":"过零点提前，波形缺损","C":"一次电流越大时，过零点提前越多","D":"二次电流的饱和点可在该半周期内任何时刻出现，随一次电流大小而变"},"answer":"D","explanation":"CT饱和时二次电流波形失真并出现谐波、过零点提前且波形缺损，一次电流越大过零点提前越多；但饱和出现的时刻由故障初相（暂态直流分量）决定，并非随一次电流大小任意出现在半周期内任一时刻，故D不正确。","bank":"电气基础"},{"id":"7435823118f8","type":"single","category":"电气基础","stem":"某P型电流互感器，二次接纯电阻负载，若不计铁芯损耗和绕组漏抗，在某一正弦电流作用下铁芯处于线性范围内，当该正弦电流大小不变仅频率降低时，则相角误差、变比误差的变化是()。","options":{"A":"相角误差增大、变比误差值不变","B":"相角误差不变、变比误差值增大","C":"相角误差、变比误差值均不变","D":"相角误差、变比误差值均增大"},"answer":"D","explanation":"频率降低时励磁支路感抗Xm∝f下降，励磁电流相对增大，使变比误差和相角误差均增大；在线性范围且电流幅值不变时，二者均随频率降低而增大。","bank":"电气基础"},{"id":"7ff13b60b4db","type":"single","category":"电气基础","stem":"电流互感器本身造成的测量误差是由于有励磁电流存在，其角度误差是励磁支路呈现为()使电流有不同相位，造成角度误差。","options":{"A":"电阻性","B":"电容性","C":"电感性","D":"以上都可能"},"answer":"C","explanation":"CT的测量误差源于励磁电流的存在；其角度误差是因为励磁支路呈电感性（铁芯电感，含铁损可视为RL），使二次电流与折算后的一次电流之间存在相位差，造成角度误差。","bank":"电气基础"},{"id":"d44a602a8dee","type":"single","category":"电气基础","stem":"两个相同的电流互感器二次绕组串联接线时()。","options":{"A":"容量和变比都增大一倍","B":"变比增大一倍，容量不变","C":"变比不变，容量增大一倍","D":"容量和变比都不变"},"answer":"C","explanation":"两个相同变比的CT二次绕组串联时，总感应电动势相加，允许外接负载增大一倍（容量加倍），但变比保持不变。","bank":"电气基础"},{"id":"a52c1574460c","type":"single","category":"电气基础","stem":"容量为25VA的10P20电流互感器，二次额定电流为5A。当二次负载小于1.0Ω时，允许的最大短路电流倍数为()。","options":{"A":"小于10倍","B":"小于20倍","C":"等于20倍","D":"大于20倍"},"answer":"D","explanation":"10P20表示在20倍额定电流、额定负载下复合误差≤10%。额定负载Zb=S/I²n=25/25=1.0Ω；当实际二次负载小于1.0Ω时，准确限值系数增大，允许的最大短路电流倍数大于20倍。","bank":"电气基础"},{"id":"647ce459d30b","type":"single","category":"电气基础","stem":"下列电流互感器抗饱和能力最强的是()。","options":{"A":"0.2级","B":"0.5级","C":"P级","D":"TPY级"},"answer":"D","explanation":"TPY级为暂态保护用电流互感器，带气隙、抗暂态饱和能力最强，专供保护装置使用；P级为一般保护级，0.2/0.5为测量级，抗饱和能力弱。","bank":"电气基础"},{"id":"3100a2d09efb","type":"single","category":"电气基础","stem":"电压互感器的高压绕组与被测电路（）,低压绕组与测量仪表电压线圈（）。","options":{"A":"串联并联","B":"并联串联","C":"串联串联","D":"并联并联"},"answer":"D","explanation":"电压互感器高压绕组并联在被测电路上以测电压，低压绕组并联接入测量仪表的电压线圈（高阻抗负载），故高压绕组与被测电路并联、低压绕组与电压线圈并联。","bank":"电气基础"},{"id":"ff769499c2d6","type":"single","category":"电气基础","stem":"电流互感器是()。","options":{"A":"电流源，内阻视为无穷大","B":"电压源，内阻视为零","C":"电流源，内阻视为零","D":"电压源，内阻视为无穷大"},"answer":"A","explanation":"电流互感器二次近似为恒流源，其内阻（励磁阻抗）很大可视为无穷大，输出电流基本不随二次负载变化。","bank":"电气基础"},{"id":"8c9ff68050dd","type":"single","category":"电气基础","stem":"电路处于（）状态时，电路中的电流会因为过大而造成损坏电源、烧毁导线，甚至造成火灾等严重事故。","options":{"A":"通路","B":"短路","C":"断路","D":"开路"},"answer":"B","explanation":"短路时电路总电阻极小，电流极大，超过电源和导线的承受能力，会损坏电源、烧毁导线甚至引发火灾，故短路是危险状态。","bank":"电气基础"},{"id":"07c40ebee19e","type":"single","category":"电气基础","stem":"下列关于等效变换说法，正确的是(）。","options":{"A":"等效变换只保证变换的外电路的各电压、电流不变","B":"等效变换是说互换的电路部分一样","C":"等效变换对变换电路内部等效","D":"等效变换只对直流电路成立"},"answer":"A","explanation":"电路等效变换的定义是：对外部电路（被变换部分端口以外）的电压、电流保持不变，变换部分内部并不一定等效，故A正确；B、C、D均不符合等效变换概念。","bank":"电气基础"},{"id":"dc925499a86f","type":"single","category":"电气基础","stem":"欧姆定律的表达式为（）。","options":{"A":"U=IR","B":"I=U/R","C":"R=U/I","D":"U=R/I"},"answer":"A","explanation":"欧姆定律的基本表达式为U=IR（一段导体两端电压等于电流与电阻的乘积）；I=U/R、R=U/I为其变形。题面以U=IR为基本形式。","bank":"电气基础"},{"id":"e320eb7941d7","type":"single","category":"电气基础","stem":"下列关于电阻的说法，错误的是：（）。","options":{"A":"电阻是衡量电路对电流阻碍作用的物理量","B":"电阻与电流成正比","C":"电阻与电压成反比","D":"电阻的大小与电路中的电流大小无关"},"answer":"B","explanation":"电阻是导体本身的属性，由材料、长度、截面积等决定（R=ρL/S），与外加电压和电流大小无关，不会与电流成正比，故B错误；A、C、D均正确。","bank":"电气基础"},{"id":"793e3f7b538d","type":"single","category":"电气基础","stem":"电路中任意两点间的电压（）两点间任一条路径经过的各元件电压的代数和。元件电压方向与路径绕行方向一致时取正号，相反取负号。","options":{"A":"等于","B":"大于","C":"小于","D":"以上都有可能"},"answer":"A","explanation":"根据基尔霍夫电压定律，电路中任意两点间的电压与所取路径无关，等于两点间任一条路径经过各元件电压的代数和（方向一致取正、相反取负）。","bank":"电气基础"},{"id":"3aeb42cd780a","type":"single","category":"电气基础","stem":"在集总电路中，在任一时刻，流入任一节点的电流（）由该节点流出的电流。或者说，在任一瞬间，一个节点上各支路电流的代数和恒为0。","options":{"A":"大于","B":"等于","C":"小于","D":"以上都有可能"},"answer":"B","explanation":"基尔霍夫电流定律（KCL）：在任一时刻，流入任一节点的电流之和等于由该节点流出的电流之和，即节点上各支路电流的代数和恒为0。","bank":"电气基础"},{"id":"31d3116dad68","type":"single","category":"电气基础","stem":"在变压器的零序等值电路中，()绕组端点与外电路断开，但与励磁支路并联。","options":{"A":"三角形接法","B":"中性点不接地星形接法","C":"中性点接地星形接法"},"answer":"A","explanation":"变压器零序等值电路中，三角形（△）接法绕组中的零序电流只能在绕组内部环流，其端点与外电路断开（无零序电流流出），但作为闭合回路与励磁支路并联。","bank":"电气基础"},{"id":"611c524543a3","type":"single","category":"电气基础","stem":"由3只电流互感器组成的零序电流接线，在负荷电流对称的情况下有一组互感器二次侧断线，流过零序电流继电器的电流是()倍负荷电流。","options":{"A":"3","B":"√3","C":"1"},"answer":"C","explanation":"由三只CT组成的零序电流接线（三相完全星形，中性线电流为三相之和），对称负荷下正常三相电流和为零；若一组CT二次断线，则流入零流继电器的电流为该断线相电流的负值，幅值等于1倍负荷电流。","bank":"电气基础"},{"id":"3b33e2363095","type":"single","category":"电气基础","stem":"应用叠加原理分析非正弦周期电流电路的方法适用于()。","options":{"A":"线性电路","B":"非线性电路","C":"线性电路和非线性电路均适用"},"answer":"A","explanation":"叠加原理只适用于线性电路（满足齐次性和可加性）；非线性电路不满足，故不能用于分析非线性电路的非正弦周期电流。","bank":"电气基础"},{"id":"1896e69f4349","type":"single","category":"电气基础","stem":"系统故障时电流互感器磁路的饱和一般()发生。","options":{"A":"立即","B":"3～5ms后","C":"半个周波后","D":"一个周波后"},"answer":"B","explanation":"系统故障电流下CT磁路并非立即饱和，铁芯需要积累磁通，一般在故障后3～5ms（约半个工频周波内）才进入饱和，故饱和一般3～5ms后发生。","bank":"电气基础"},{"id":"b074930ce414","type":"single","category":"电气基础","stem":"断路器最低跳闸电压及最低合闸电压不应低于()的额定电压，且不应大于65%额定电压。","options":{"A":"0.3","B":"0.5","C":"0.6","D":"0.35"},"answer":"A","explanation":"规程规定断路器最低跳闸电压及最低合闸电压不应低于额定电压的30%（即0.3），且不应大于65%。故正确为0.3；其余0.5、0.6、0.35均非规程规定的最低限值。","bank":"电气基础"},{"id":"dff8bce8660f","type":"single","category":"电气基础","stem":"出口中间继电器的最低动作电压，要求不低于额定电压的55%,是为了()。","options":{"A":"防止中间继电器线圈正电源端子出现接地时与直流电源绝缘监视回路构成通路而引起误动作","B":"防止中间继电器线圈正电源端子与直流系统正电源同时接地时误动作","C":"防止中间继电器线圈负电源端子接地与直流电源绝缘监视回路构成通路而误动作","D":"防止中间继电器线圈负电源端子与直流系统负电源同时接地时误动"},"answer":"A","explanation":"出口中间继电器动作电压要求不低于额定电压的55%，是为防止其线圈正电源端子出现接地时，与直流电源绝缘监视回路构成通路而引起误动作。B为双侧同时接地情形不符，C、D为负电源端子接地，而该继电器线圈通常接负电源侧，主要防范的是正电源端子接地误动。","bank":"电气基础"},{"id":"51c1332deb99","type":"single","category":"电气基础","stem":"在同一网格状地网系统的变电站内，每一千安故障电流在完全位于同一地网范围内的最大期望纵向电压为()V。","options":{"A":"5","B":"10","C":"15"},"answer":"B","explanation":"根据变电站接地设计相关规程，同一网格状地网系统内，每千安故障电流在完全位于同一地网范围内的最大期望纵向（转移）电压为10V。","bank":"电气基础"},{"id":"1df3fd868645","type":"single","category":"电气基础","stem":"变电站直流系统的馈出网络应采用()供电方式。","options":{"A":"网状","B":"环状","C":"集中辐射或分层辐射","D":"小母线"},"answer":"C","explanation":"变电站直流系统馈出网络应采用集中辐射或分层辐射供电方式，以提高供电可靠性、便于故障隔离；环状、网状、小母线方式均不推荐。","bank":"电气基础"},{"id":"2d7cbb62846c","type":"single","category":"电气基础","stem":"分散布置的小室之间若存在相互连接的二次电缆，则小室的等电位地网之间应使用截面积不小于100mm²的铜排(缆)可靠连接，连接点应设在()。","options":{"A":"电缆用量最少的地方","B":"小室等电位地网与变电站主接地网连接处","C":"等电位地网的任何地方"},"answer":"B","explanation":"分散布置小室间若经二次电缆相连，其等电位地网间应用不小于100mm²铜排（缆）可靠连接，且连接点应设在小室等电位地网与变电站主接地网连接处，以保证等电位联结有效。","bank":"电气基础"},{"id":"bb52b33c25a2","type":"single","category":"电气基础","stem":"发电厂和变电站应采用铜芯控制电缆和导线，弱电控制回路的截面积不应小于()","options":{"A":"1.5mm²","B":"2.5mm²","C":"0.5mm²","D":"4mm²"},"answer":"C","explanation":"发电厂、变电站控制电缆采用铜芯；弱电控制回路（信号、测量等）导体截面积不应小于0.5mm²，强电控制回路不小于1.5mm²。","bank":"电气基础"},{"id":"43ad5457d3e1","type":"single","category":"电气基础","stem":"直流电压在110V及以上的中间继电器，并联在线圈上的消弧二极管的反向击穿电压不宜低于()。","options":{"A":"800V","B":"1000V","C":"1200V"},"answer":"B","explanation":"直流电压110V及以上的中间继电器，并联在线圈上的消弧二极管反向击穿电压不宜低于1000V，以保证正常运行及操作过电压下不被击穿。","bank":"电气基础"},{"id":"776f154c95ba","type":"single","category":"电气基础","stem":"光纤尾纤应呈现自然弯曲，弯曲半径大于()cm,不应存在弯折的现象。","options":{"A":"3","B":"4","C":"5","D":"6"},"answer":"A","explanation":"光纤尾纤应自然弯曲，弯曲半径应大于3cm（30mm），以避免弯折损伤光纤、增大衰耗。","bank":"电气基础"},{"id":"a1d5cd1a1977","type":"single","category":"电气基础","stem":"出口继电器作用于断路器跳(合)闸时，其触点回路中串入的电流自保持线圈的自保持电流应当是()。","options":{"A":"不大于跳(合)闸电流","B":"不大于跳(合)闸电流的一半","C":"不大于跳(合)闸电流的10%","D":"不大于跳(合)闸电流的80%"},"answer":"B","explanation":"出口继电器触点回路串入的电流自保持线圈，其自保持电流不应大于断路器跳（合）闸电流的一半，既能保证可靠保持跳闸/合闸，又避免线圈过热或影响跳闸。","bank":"电气基础"},{"id":"f3f4da138057","type":"single","category":"电气基础","stem":"下列()项不属于严重缺陷。","options":{"A":"保护通道异常，如3dB告警等","B":"保护装置故障或异常退出","C":"录波器装置故障、频繁起动或电源消失","D":"保护装置液晶显示屏异"},"answer":"B","explanation":"继电保护设备缺陷分危急、严重、一般三级。“保护装置故障或异常退出”属危急缺陷（级别高于严重缺陷），故不属于“严重缺陷”范畴；A、C、D各项属严重缺陷。","bank":"电气基础"},{"id":"39e8c648662e","type":"single","category":"电气基础","stem":"与动作评价原则不符的是()","options":{"A":"线路纵联保护按两侧分别进评价","B":"远方跳闸装置按两侧分别进行评价","C":"变压器纵差、重瓦斯保护及各侧后备保护按高压侧归类评价","D":"错误地投、停继电保护造成的继电保护不正确动作，但继电保护装置性能良好的可不进行分析评价"},"answer":"D","explanation":"动作评价原则中，错误地投、停保护造成的保护不正确动作，即使装置性能良好，仍应进行分析评价，故D项与原则不符；A、B、C均为正确评价原则。","bank":"电气基础"},{"id":"2a34ccd15ee2","type":"single","category":"电气基础","stem":"如线路短路使发电厂厂用母线或重要用户母线电压低于额定电压的()以及线路导线截面过小，不允许带时限切除短路时，应快速切除故障。","options":{"A":"0.4","B":"0.5","C":"0.6","D":"0.7"},"answer":"C","explanation":"规程规定，当线路短路使发电厂厂用母线或重要用户母线电压低于额定电压的60%（0.6），且线路导线截面过小不允许带时限切除时，应快速切除故障。","bank":"电气基础"},{"id":"83c7c83ac3e8","type":"single","category":"电气基础","stem":"对电力系统的稳定性干扰最严重的一般是()","options":{"A":"投切大型空载变压器","B":"发生三相短路故障","C":"发生两相接地短路","D":"发生单相接地"},"answer":"B","explanation":"三相短路是对称性最差、短路电流最大、对系统功角稳定冲击最严重的一类故障，对电力系统稳定性干扰最严重。","bank":"电气基础"},{"id":"3b55285d408c","type":"single","category":"电气基础","stem":"为了提高电力系统暂态稳定水平，以下属于减小加速面积的措施为()","options":{"A":"串联电容补偿","B":"加快切除短路故障","C":"电气制动","D":"自动重合闸"},"answer":"B","explanation":"按等面积法则，加快切除短路故障可缩短加速功率作用时间、减小加速面积，从而提高暂态稳定；串联补偿、电气制动、重合闸等属其他提高稳定机理。","bank":"电气基础"},{"id":"17f424d9880a","type":"single","category":"电气基础","stem":"电力系统在发生故障或断开线路等大的扰动后仍能保持同步稳定运行，我们称之为系统是()的。","options":{"A":"静态稳定","B":"暂态稳定","C":"动态稳定","D":"热稳定"},"answer":"B","explanation":"系统经受短路、断线等大扰动后仍能保持各机间同步稳定运行，此即暂态稳定的定义。","bank":"电气基础"},{"id":"aec1166dcaa6","type":"single","category":"电气基础","stem":"无功功率严重不足会造成()破坏事故。","options":{"A":"静态稳定","B":"暂态稳定","C":"电压崩溃","D":"频率崩溃"},"answer":"C","explanation":"无功功率严重不足会导致节点电压大幅下降、电压支撑崩溃，引发电压崩溃事故。","bank":"电气基础"},{"id":"296ec07554cd","type":"single","category":"电气基础","stem":"电力系统在运行中，必须同时满足三种稳定，应是()","options":{"A":"同步稳定、暂态稳定、动态稳定","B":"静态稳定、暂态稳定、动态稳定","C":"静态稳定、电压稳定、频率稳定","D":"同步稳定、电压稳定、频率稳定"},"answer":"D","explanation":"电力系统运行须同时满足同步（功角）稳定、电压稳定、频率稳定三种稳定。","bank":"电气基础"},{"id":"b094f5f001f9","type":"single","category":"电气基础","stem":"单相断线的故障断口边界条件与()的相似。","options":{"A":"单相接地短路","B":"两相短路","C":"两相短路接地"},"answer":"C","explanation":"单相断线（一相断开）的边界条件与两相短路接地在复合序网连接方式上相同（均为正、负、零序网络串联），故二者相似。","bank":"电气基础"},{"id":"847be36d282f","type":"single","category":"电气基础","stem":"空投变压器时变压器铁芯中通常会出现数值很大的励磁电流，励磁电流中的谐波含量主要以()为主。","options":{"A":"二次谐波","B":"三次谐波","C":"四次谐波","D":"五次谐波"},"answer":"A","explanation":"空投变压器产生的励磁涌流中，谐波以二次谐波含量最大，差动保护据此采用二次谐波制动来躲过涌流。","bank":"电气基础"},{"id":"a4a0a2b8abe9","type":"single","category":"电气基础","stem":"Yd11变压器高、低压侧一次电流的相位关系是()","options":{"A":"高压侧电流IA超前低压侧电流Ia30°","B":"高压侧电流IA落后低压侧电流Ia330°","C":"高压侧电流Is落后低压侧电流Ia150°"},"answer":"C","explanation":"Yd11接线组别中，低压侧（△）线电流超前高压侧（Y）线电流30°，即高压侧电流滞后低压侧；题面答案取C（以特定相别表示约为滞后150°）。（注：常规教材表述为高压侧滞后低压侧30°，以题面答案为准）","bank":"电气基础"},{"id":"831b9ee39acf","type":"single","category":"电气基础","stem":"三相短路时，各相短路电流的非周期分量()","options":{"A":"为零","B":"相等","C":"不相等","D":"不存在"},"answer":"C","explanation":"三相短路虽为对称短路，但三相电压初相相差120°，短路瞬间各相非周期（直流）分量初始值不同，故各相非周期分量不相等。","bank":"电气基础"},{"id":"62300d26444c","type":"single","category":"电气基础","stem":"下列()故障出现零序电流","options":{"A":"单相接地","B":"相间短路","C":"三相短路"},"answer":"A","explanation":"不对称接地故障产生零序电流；单相接地为接地故障，出现零序电流；两相（不接地）短路与三相短路均无零序电流。","bank":"电气基础"},{"id":"8be6e386ebae","type":"single","category":"电气基础","stem":"AB相金属性短路故障时，故障点序分量电压间的关系是()。","options":{"A":"C相负序电压超前B相正序电压的角度是120°","B":"B相正序电压超前B相负序电压的角度是120°","C":"C相正序电压超前B相负序电压的角度是120°","D":"A相负序电压超前A相正序电压的角度是120°"},"answer":"C","explanation":"AB两相金属性短路时，非故障相C的电压为正序与负序叠加，序分量间存在固定相位关系：C相正序电压超前B相负序电压120°，故C正确。","bank":"电气基础"},{"id":"b5fc181232df","type":"single","category":"电气基础","stem":"输电线路BC两相金属性短路时，短路电流Ipc()。","options":{"A":"滞后于C相电压一线路阻抗角","B":"滞后于B相电压一线路阻抗角","C":"滞后于BC相间电压一线路阻抗角"},"answer":"C","explanation":"BC两相金属性短路时，故障相短路电流滞后于BC相间电压一个线路阻抗角，故C正确。","bank":"电气基础"},{"id":"28a703c644e6","type":"single","category":"电气基础","stem":"某输电线路，当发生BC两相短路时(如不计负荷电流),故障处的边界条件是()。","options":{"A":"IA=0 UB=Uc=0","B":"IA=0 Ip=-Ic UB=Uc","C":"UA=0 Is=Ic=0","D":"IA=0 IA=Ic"},"answer":"C","explanation":"BC两相短路（不计负荷电流）边界条件为：非故障相A电流为零（IA=0）、故障相电流IB=-IC、故障相电压UB=UC。题面答案标C，按题面作答。（注：标准边界条件对应选项B，题面答案存疑）","bank":"电气基础"},{"id":"d6f39dbcf706","type":"single","category":"电气基础","stem":"两相短路时，短路点故障相电流是正序电流的()。","options":{"A":"√2倍","B":"√3倍","C":"2倍"},"answer":"B","explanation":"两相短路时，短路点故障相电流幅值等于正序电流幅值的√3倍，即故障相电流=√3×I₁。","bank":"电气基础"},{"id":"481a4ee4a567","type":"single","category":"电气基础","stem":"关于零序电压，下列描述正确的是()。","options":{"A":"外接零序电压的相电压为100V","B":"外接的零序电压的相电压为100/3V","C":"外接的零序电压的相电压大小与系统接地性质有关","D":"用于判断方向的零序电压取外接，不受TV断线的影响"},"answer":"C","explanation":"外接零序电压（开口三角）的相电压大小与系统接地方式有关；其额定线电压为100V（每相100/3V），且取自TV开口三角会受TV断线影响，故A、B、D均不严谨，C正确。","bank":"电气基础"},{"id":"2406e142711d","type":"single","category":"电气基础","stem":"双侧电源的输电线路发生不对称故障时，短路电流中各序分量受两侧电动势相差影响最大的是()。","options":{"A":"零序分量","B":"负序分量","C":"正序分量"},"answer":"C","explanation":"双侧电源不对称故障时，正序网络含两侧电源电动势，其分量大小受两侧电动势相角差影响最大；负序、零序网络通常无电源（仅一端），受影响小。","bank":"电气基础"},{"id":"ed63b3cb8a1c","type":"single","category":"电气基础","stem":"短路故障时，短路电流极限情况为三相短路电流幅值的()倍。","options":{"A":"2","B":"1.5","C":"1.2","D":"1"},"answer":"B","explanation":"单相接地短路电流最大可达三相短路电流的1.5倍（当Z₀≪Z₁的极限情形，I₍₁₎/I₍₃₎=3Z₁/(2Z₁+Z₀)→1.5），故短路电流极限情况为三相短路幅值的1.5倍。","bank":"电气基础"},{"id":"f079b33628cd","type":"single","category":"电气基础","stem":"同杆双回线运行时，第二回线中的零序电流对第一回线的零序电抗的作用是使其(),架空地线零序电流对线路的零序电抗作用是使其()。","options":{"A":"减少，增大","B":"增大，增大","C":"减少，减少","D":"增大，减少"},"answer":"D","explanation":"同杆双回线中，第二回线零序电流产生互感使第一回线零序电抗增大（助磁）；架空地线中流过的零序电流与大地返回电流反向，使线路零序电抗减小。故为增大、减少。","bank":"电气基础"},{"id":"4acbcfdc4999","type":"single","category":"电气基础","stem":"变压器三相负载不对称时将出现(C)电流。","options":{"A":"正序、负序、零序","B":"正序和零序","C":"正序和负序","D":"负序和零序"},"answer":"C","explanation":"变压器三相负载不对称且无零序通路时，将出现正序和负序电流，一般不出现零序电流。","bank":"电气基础"},{"id":"bfad19552370","type":"single","category":"电气基础","stem":"三相电流幅值：Ia=3A、Ib=4A、Ie=5A三相电流相位未知，负序电流I₂幅值不可能是()。","options":{"A":"0","B":"3","C":"4","D":"5"},"answer":"D","explanation":"负序电流幅值由三相不对称程度决定，对幅值3、4、5A的三相电流，负序电流最大可能值约为(3+4+5)/3=4A，不可能达到5A，故D不可能。","bank":"电气基础"},{"id":"ffb4ebe386dd","type":"single","category":"电气基础","stem":"对称分量法中，aU,表示()。","options":{"A":"将Ua顺时针旋转120°","B":"将Ua逆时针旋转120°","C":"将Ua逆时针旋转240°"},"answer":"B","explanation":"对称分量法中算子a=e^(j120°)，a·Uₐ表示将相量Uₐ逆时针（正向）旋转120°。","bank":"电气基础"},{"id":"077a2b48f052","type":"single","category":"电气基础","stem":"一组对称相量α、β、γ按顺时针方向排列，彼此相差120°,称为()分量。","options":{"A":"正序","B":"负序","C":"零序"},"answer":"A","explanation":"一组对称相量按顺时针方向依次排列、互差120°，对应正序分量（a→b→c顺序超前）。","bank":"电气基础"},{"id":"dd5eb6b7aade","type":"single","category":"电气基础","stem":"相当于负序分量的高次谐波是()谐波。","options":{"A":"3n次(其中n为正整数，余同)","B":"3n+1次","C":"3n+2次","D":"上述三种以外的"},"answer":"C","explanation":"谐波序列中，3n次谐波具零序性，3n+1次具正序性，3n+2次具负序性，故相当于负序分量的是3n+2次谐波。","bank":"电气基础"},{"id":"e72dbd780e16","type":"single","category":"电气基础","stem":"电力系统中的三次谐波，具有()特征。","options":{"A":"正序","B":"负序","C":"零序","D":"不定的"},"answer":"C","explanation":"电力系统中的三次谐波（属3n次）具有零序特征，三相同相位。","bank":"电气基础"},{"id":"1ddf7da33bc6","type":"single","category":"电气基础","stem":"在计算和分析三相不对称系统短路时，广泛应用()。","options":{"A":"分布系数法","B":"ZY法","C":"对称分量法"},"answer":"C","explanation":"分析三相不对称系统短路广泛采用对称分量法，将不对称量分解为正、负、零序三组对称量求解。","bank":"电气基础"},{"id":"6c51ce2a0b95","type":"single","category":"电气基础","stem":"在标幺值计算中，只需选用两个基准，通常选用的是()。","options":{"A":"电压、电流","B":"电压、功率","C":"电流、功率","D":"电压、阻抗"},"answer":"B","explanation":"标幺值计算只需选定两个独立基准，通常取基准电压（U_b）和基准功率（S_b），阻抗、电流等可由二者导出。","bank":"电气基础"},{"id":"0fde13e59909","type":"single","category":"电气基础","stem":"短距离输电线路比长距离输电线路受过渡电阻的影响要()。","options":{"A":"小","B":"大","C":"一样","D":"上述说法均不对"},"answer":"B","explanation":"短距离线路自身阻抗小，过渡电阻在其总阻抗中占比相对更大，故受过渡电阻影响比长距离线路更大。","bank":"电气基础"},{"id":"4bdc7f8c442f","type":"single","category":"电气基础","stem":"所谓选择性是指()。","options":{"A":"应该由故障设备的保护动作切除故障","B":"应由故障设备的保护或相邻的保护动作切除故障","C":"首先应由故障设备的保护动作切除故障，当上述保护拒动或断路器拒动时，再由相邻的保护动作切除故障"},"answer":"C","explanation":"选择性指首先由故障设备（或线路）的保护动作切除故障；当该保护或断路器拒动时，再由相邻保护动作切除，尽量缩小停电范围。","bank":"电气基础"},{"id":"a8e146ee4e76","type":"single","category":"电气基础","stem":"电力系统()是指电力系统受到事故扰动后保持稳定运行的能力。","options":{"A":"安全性","B":"稳定性","C":"可靠性","D":"灵活性"},"answer":"B","explanation":"稳定性是指电力系统受到事故扰动后保持稳定运行的能力。","bank":"电气基础"},{"id":"90507f4016a1","type":"single","category":"电气基础","stem":"在规定时间内，电压频率变换式数据采集系统(VFC)的计数器输出脉冲的个数与模拟输入电压量的()。","options":{"A":"积分成正比","B":"积分成反比","C":"瞬时值的绝对值成正比","D":"瞬时值的绝对值成反比"},"answer":"C","explanation":"电压频率变换式（VFC）数据采集系统将输入电压的瞬时绝对值转换为脉冲频率，规定时间内计数器累计脉冲数反映输入电压绝对值随时间的变化（累计即为积分），故与输入电压瞬时值绝对值成正比。","bank":"电气基础"},{"id":"d933830ae4b5","type":"single","category":"电气基础","stem":"由于分布电容的存在，发生短路时短路电流中将出现()电流。","options":{"A":"低频分量","B":"高频分量","C":"非周期分量"},"answer":"B","explanation":"分布电容在短路瞬间的充放电会产生高频分量，使短路电流中出现高频成分。","bank":"电气基础"},{"id":"0c8a63dff470","type":"single","category":"电气基础","stem":"“分层、分区、就地平衡”原则，是()的原则。","options":{"A":"电网有功平衡","B":"电网无功补偿","C":"低频减载配置","D":"低压减载配置"},"answer":"B","explanation":"“分层、分区、就地平衡”是电网无功补偿的基本原则，避免无功远距离传输、降低网损。","bank":"电气基础"},{"id":"eccb0857688a","type":"single","category":"电气基础","stem":"通过调整有载调压变压器分接头进行调整电压时，对系统来说()。","options":{"A":"起不了多大作用","B":"改变系统的频率","C":"改变了无功分布","D":"改变系统的谐波"},"answer":"C","explanation":"调整有载调压变压器分接头改变的是电压比，只改变系统无功功率的分布（重新分配），并不改变系统无功总量，对频率、谐波无直接影响。","bank":"电气基础"},{"id":"c9f621a1ad1a","type":"single","category":"电气基础","stem":"当变压器电源电压高于额定电压时，铁芯中的损耗()。","options":{"A":"减少","B":"不变","C":"增大","D":"变化很小"},"answer":"C","explanation":"变压器电源电压高于额定值，铁芯工作磁通密度增大，铁损（磁滞、涡流损耗）随之增大。","bank":"电气基础"},{"id":"2cbd9c94e0d3","type":"single","category":"电气基础","stem":"变压器变比与匝数()。","options":{"A":"不成比例","B":"成反比","C":"成正比","D":"无关"},"answer":"C","explanation":"变压器变比等于一、二次绕组匝数比，与匝数成正比。","bank":"电气基础"},{"id":"5361477c6bbf","type":"single","category":"电气基础","stem":"3台具有相同变比连接组别的三相变压器，其额定容量和短路电压分别为：Sa=1200kVA、Uka(%)=4.25%,Sb=1800kVA、Ukb(%)=5.6%,S。=2400kVA、Ukc(%)=6.5%。它们并联运行后，在不允许任何一台过负荷的情况下，能担负()最大负荷。","options":{"A":"5400kVA","B":"1457kVA","C":"4735kVA","D":"4135kVA"},"answer":"D","explanation":"并联变压器负荷按短路电压成反比分配，短路电压最小的A台（1200kVA、4.25%）分担比例最大、先达额定；以其额定为限求得B、C台分别约1367kVA、1569kVA，总最大负荷≈4135kVA。","bank":"电气基础"},{"id":"93939aaa7a35","type":"single","category":"电气基础","stem":"当变比不同的两台变压器并列运行时，在两台变压器内产生环流，使得两台变压器空载的输出电压()。","options":{"A":"上升","B":"降低","C":"变比大的升，小的降","D":"变比小的升，大的降"},"answer":"C","explanation":"变比不同的两台变压器并列会产生环流，使变比大的一台空载输出电压被抬高（升），变比小的一台被拉低（降）。","bank":"电气基础"},{"id":"df1050fd5744","type":"single","category":"电气基础","stem":"两台变压器并列运行的条件是()。","options":{"A":"变比相等","B":"组别相同","C":"短路阻抗相同","D":"变比相等、组别相同、短路阻抗相同"},"answer":"D","explanation":"变压器并列运行条件为：变比相等、连接组别相同、短路阻抗（百分值）相等（容量可不同），以保证负荷合理分配、避免环流。","bank":"电气基础"},{"id":"cc7893221eed","type":"single","category":"电气基础","stem":"空载高压长线路末端电压()线路始端电压。","options":{"A":"低于","B":"等于","C":"高于"},"answer":"C","explanation":"空载高压长线路因对地电容的费兰梯效应，线路末端电压高于始端电压。","bank":"电气基础"},{"id":"6630efe177e2","type":"single","category":"电气基础","stem":"为了描述架空线路传输电能的物理现象，一般用电阻来反映输电线路的热效应，用电容来反映输电线路的()。","options":{"A":"电场效应","B":"磁场效应","C":"电晕现象"},"answer":"A","explanation":"输电线路用电阻反映热效应，用电感反映磁场效应，用电容反映电场效应。","bank":"电气基础"},{"id":"f150cf8f32c9","type":"single","category":"电气基础","stem":"三相导线的几何均距越大，则导线的电抗()。","options":{"A":"越大","B":"越小","C":"不变","D":"无法确定"},"answer":"A","explanation":"三相导线几何均距越大，线路电抗越大（x∝ln(D_eq/r)）。","bank":"电气基础"},{"id":"7c85e1fdd412","type":"single","category":"电气基础","stem":"断路器在切除()时，断路器易被击穿发生重燃。","options":{"A":"正序电流","B":"零序电流","C":"电容电流","D":"电感电流"},"answer":"C","explanation":"断路器切除容性电流（如空载线路、电容器组）时，易发生电弧重燃（重击穿）。","bank":"电气基础"},{"id":"6ba7ad34138c","type":"single","category":"电气基础","stem":"为了把电流表量程扩大100倍，分流电阻的电阻值应是仪表内阻的()。","options":{"A":"1/100","B":"1/99","C":"99倍","D":"100倍"},"answer":"B","explanation":"电流表扩大量程n倍时，分流电阻R_sh=R_g/(n-1)；扩100倍则分流电阻为内阻的1/99。","bank":"电气基础"},{"id":"48aeab69dcb0","type":"single","category":"电气基础","stem":"在暂态过程中，电压或电流的暂态分量按指数规律衰减到初始值的()所需的时间，称为时间常数t。","options":{"A":"1/e","B":"1/√3","C":"1/3","D":"1/5"},"answer":"A","explanation":"时间常数τ是指暂态分量按指数规律衰减到初始值的1/e（约36.8%）所需的时间。","bank":"电气基础"},{"id":"61eae12f929e","type":"single","category":"电气基础","stem":"输电线路中某一侧的潮流是受有功功率、送无功功率，它的电压超前电流为()。","options":{"A":"0°~90","B":"90°~180°","C":"180°~270°","D":"270°~360°"},"answer":"B","explanation":"该侧“受有功（P流入为负）、送无功（Q流出为正）”，复功率位于第二象限，电压超前电流的角度在90°~180°之间。","bank":"电气基础"},{"id":"926de553a00f","type":"single","category":"电气基础","stem":"对称三相电源为星形连接，若已知Ue=220∠60°V,则Uac为()。","options":{"A":"380∠30°V","B":"380∠90°V","C":"380∠-30V","D":"380∠-90°y"},"answer":"D","explanation":"星形对称三相，已知U_c=220∠60°V（正序），得U_a=220∠-60°、U_ac=U_a-U_c≈-j381V≈380∠-90°V。","bank":"电气基础"},{"id":"cd5eacdd2eff","type":"single","category":"电气基础","stem":"所谓继电器动合触点是指()。","options":{"A":"正常时触点断开","B":"继电器线圈带电时触点断开","C":"继电器线圈不带电时触点断开"},"answer":"C","explanation":"继电器动合触点（常开触点）在线圈不带电时触点断开，线圈带电后闭合。","bank":"电气基础"},{"id":"889bbd205fb4","type":"single","category":"电气基础","stem":"监视合闸线圈断线的继电器()。","options":{"A":"跳位继电器TWJ","B":"合位继电器HWJ","C":"合后继电器HHJ","D":"ABC都对"},"answer":"A","explanation":"跳位继电器TWJ反映断路器在跳闸位置，用于监视合闸线圈（合闸回路）是否断线；HWJ监视跳闸回路。","bank":"电气基础"},{"id":"075c131fada5","type":"single","category":"电气基础","stem":"防止跳跃继电器的电流线圈应()。","options":{"A":"接在出口触点与断路器控制回路之间","B":"与断路器跳闸线圈并联","C":"与跳闸继电器出口触点并联"},"answer":"A","explanation":"防跳继电器电流线圈应串联在出口触点与断路器跳闸线圈之间（跳闸回路中），电压线圈并联，以实现防跳跃功能。","bank":"电气基础"},{"id":"66339d195e67","type":"single","category":"电气基础","stem":"电抗变压器在空载情况下，二次电压与一次电流的相位关系是()。","options":{"A":"二次电压超前一次电流近90°","B":"二次电压与一次电流接近0°","C":"二次电压滞后一次电流近90°","D":"不能确定"},"answer":"A","explanation":"电抗变压器（UX）空载时，二次输出电压正比于一次电流且超前一次电流近90°。","bank":"电气基础"},{"id":"1a8cecd3dcb1","type":"single","category":"电气基础","stem":"在不计负荷电流情况下，带有浮动门槛的相电流差突变量起动元件，下列情况不正确的是","options":{"A":"双侧电源线路上发生各种短路故障，线路两侧的元件均能起动","B":"单侧电源线路上发生相间短路故障，当负荷侧无接地中性点时，负荷侧元件不能起动","C":"单侧电源线路上发生接地故障，当负荷侧有接地中性点时，负荷侧元件能起动","D":"系统振荡时，元件不动作"},"answer":"C","explanation":"相电流差突变量起动元件在单侧电源线路发生接地故障、负荷侧虽有接地中性点时，负荷侧元件因故障电流经中性点回路、相电流差变化量未必足以可靠起动，故题中“能起动”表述不正确；A、B、D均符合其动作特性。（注：教材对负荷侧有中性点时接地故障能否起动有不同表述，以题面答案为准）","bank":"电气基础"},{"id":"83c67a173ee3","type":"single","category":"电气基础","stem":"相电流差突变量元件作为选相元件时，若△AB=AcA、△sc=0,则说明是","options":{"A":"BC相接地短路","B":"A相接地短路","C":"B相接地短路","D":"C相接地短路"},"answer":"B","explanation":"相电流差突变量选相：A相接地短路时，涉及A相的两个差流ΔAB、ΔCA均较大，而不含A相的ΔBC≈0，与题中ΔAB=ΔCA（大）、ΔBC=0对应，故选A相接地。","bank":"电气基础"},{"id":"a125896ed39f","type":"single","category":"电气基础","stem":"根据相电流差突变量选相元件△AB=20A,△Bc=18.5A,△cA=1.25A数据， 据此判断故障相别为","options":{"A":"A相故障","B":"B相故障","C":"AB相故障","D":"BC相故障"},"answer":"B","explanation":"单相故障选相判据：两个较大差流所共有的相即为故障相。题中ΔAB=20A、ΔBC=18.5A均较大且共有B相，ΔCA≈0，故为B相故障。","bank":"电气基础"},{"id":"6ad77ec7f20f","type":"single","category":"电气基础","stem":"与多模光纤相比，单模光纤","options":{"A":"带宽大、衰耗大、传输距离近、传输特性好","B":"带宽小、衰耗小、传输距离远、传输特性差","C":"带宽小、衰耗小、传输距离远、传输特性好","D":"带宽大、衰耗小、传输距离远、传输特性好"},"answer":"D","explanation":"与多模光纤相比，单模光纤带宽大、衰耗小、传输距离远、传输特性好。","bank":"电气基础"},{"id":"d4fd7c76b603","type":"single","category":"电气基础","stem":"关于独立光纤通道，下面说法正确的是","options":{"A":"同一个SDH设备采用两个独立的物理路由，可视为两条独立光纤通道","B":"两个独立的SDH设备分别采用两个独立的物理路由，视为两条独立光纤通道","C":"进入通信机房的光缆采用不同的通信管及光缆，但共用一个电缆竖井，可视为两个独立的物理路由","D":"同一光缆的不同光纤芯，可视为两个独立的物理路由"},"answer":"B","explanation":"独立光纤通道要求两个独立SDH设备分别采用两个独立物理路由，方视为两条独立通道；同一SDH、共用竖井或同一光缆不同纤芯均不满足独立性。","bank":"电气基础"},{"id":"b9f14683264a","type":"single","category":"电气基础","stem":"下列对于突变量继电器的描述，不正确的是","options":{"A":"突变量保护与故障的初相角有关","B":"突变量继电器在短暂动作后仍需保持到故障切除","C":"突变量保护在故障切除时会再次动作","D":"继电器的起动值离散较大，动作时间也有离散"},"answer":"B","explanation":"突变量继电器为短时动作元件，动作后不需保持到故障切除（由其他元件保持），故B“仍需保持到故障切除”描述不正确；A、C、D均为突变量保护特点。","bank":"电气基础"},{"id":"d76e4ce2f7e9","type":"single","category":"电气基础","stem":"当零序功率方向继电器的最大灵敏角为电流超前电压100°时，下列哪个说法是正确的","options":{"A":"其电流和电压回路应按反极性与相应的TA、TV回路连接","B":"该相位角与线路正向故障时零序电流与零序电压的相位关系一致","C":"该元件适用于中性点不接地系统零序方向保护"},"answer":"B","explanation":"零序功率方向继电器最大灵敏角为电流超前电压100°时，该相位关系与线路正向故障时零序电流滞后（或超前）零序电压的关系一致，故B正确；其应按正极性接入相应TA、TV回路。","bank":"电气基础"},{"id":"e68dda6ae2cb","type":"single","category":"电气基础","stem":"关于电气化铁路供电线路，以下说法错误的是","options":{"A":"采用三相电源对电铁负荷供电的线路，可装设与一般线路相同的保护","B":"采用两相电源对电铁负荷供电的线路，可装设两段式距离、两段式电流保护","C":"两相电源供电线路供电产生的不对称分量和冲击负荷可能会使线路保护装置频繁起动，必要时，可增设保护装置快速复归的回路","D":"两相电源供电线路供电在电网中造成的谐波分量可能导致线路保护装置误动，必要时可退出可能误动的保护"},"answer":"D","explanation":"电铁两相电源供电产生的谐波不应通过“退出可能误动的保护”解决，而应采取抗扰措施，故D说法错误；A、B、C均为正确做法。","bank":"电气基础"},{"id":"b1ace917e337","type":"single","category":"电气基础","stem":"由母线向线路送出有功100兆瓦，无功100兆瓦。电压超前电流的角度是()度。","options":{"A":"0","B":"30","C":"90","D":"45"},"answer":"D","explanation":"母线向线路送出有功100MW、无功100MW，功率因数角φ=arctan(Q/P)=45°，电压超前电流45°。","bank":"电气基础"},{"id":"04b95d401b78","type":"single","category":"电气基础","stem":"输送相同的负荷，提高输送系统的电压等级会（）","options":{"A":"提高负荷功率因数","B":"减少线损","C":"改善电能波形","D":"改善电能质量"},"answer":"B","explanation":"输送相同负荷时提高电压等级可减小线路电流，从而按I²R显著降低线损。","bank":"电气基础"},{"id":"4b3b53004ca4","type":"single","category":"电气基础","stem":"电力系统发生故障时最基本的特征是（）","options":{"A":"电压降低，电流增大","B":"电流增大，电压升高","C":"电流减少，电压升高","D":"电流减少，电压减小"},"answer":"A","explanation":"电力系统故障最基本特征是故障点电压降低、短路电流增大。","bank":"电气基础"},{"id":"24406ef5cf73","type":"single","category":"电气基础","stem":"关于UPS电源的使用，以下说法错误的是（）","options":{"A":"即使UPS电源并没有与市电相连接，但是它的电源输出插座仍有高电压（220V/110V）","B":"为了降低负载设备接地不良而引发电击危险，在安装计算机接口信号时，须将交流输入电源切断，确保在连接了全部信号接头后才能接上电源","C":"避免电池正负极短路，易导致电击或着火","D":"每节电池的电压不高，可以直接触碰连接端子"},"answer":"D","explanation":"UPS电池端子虽单节电压不高，但正负极短路仍会产生大电流、电击或着火危险，不可直接触碰，故D说法错误；A、B、C均为正确安全注意事项。","bank":"电气基础"},{"id":"0d58d437a923","type":"single","category":"电气基础","stem":"对于功率变送器，当三相电流极性接反时，它的输出（）","options":{"A":"数值大小不变，符号不变","B":"数值大小改变，符号不变","C":"数值大小不变，符号相反","D":"数值大小改变，符号相反"},"answer":"C","explanation":"功率变送器输出正比于三相有功功率之和；三相电流极性接反使功率符号反号，但数值大小不变，故输出数值不变、符号相反。","bank":"电气基础"},{"id":"11296784bf2d","type":"single","category":"电气基础","stem":"三道防线是对（）方面提出的要求","options":{"A":"电力系统受到不同扰动时电网保持稳定可靠供电","B":"电网发生故障时快速保护、近后备保护和远后备保护可靠切除故障","C":"电网发生多重故障时继电保护能可靠切除故障","D":"电网发生事故时保持对重要用户可靠供电"},"answer":"A","explanation":"三道防线是针对电力系统受到不同扰动时电网保持稳定可靠供电提出的要求（第一道预防、第二道稳定控制、第三道崩溃防止）。","bank":"电气基础"},{"id":"42c80b99f404","type":"single","category":"电气基础","stem":"下列关于功率预测中短期预测曲线的说法正确的是（）","options":{"A":"预测次日功率曲线，时间分辨率15分钟，每日预测一次","B":"预测次日功率曲线，时间分辨率1小时，每日预测一次","C":"预测未来4h功率曲线，时间分辨率15分钟，每15分钟预测一次","D":"预测未来4h功率曲线，时间分辨率1小时，每15分钟预测一次"},"answer":"A","explanation":"短期功率预测指预测次日功率曲线，时间分辨率15分钟，每日预测一次。","bank":"电气基础"},{"id":"ce45dbc8e0cc","type":"single","category":"电气基础","stem":"下面不属于配网DTU柜的核心设备有（）","options":{"A":"DTU装置","B":"电源管理模块","C":"蓄电池","D":"无线模块"},"answer":"D","explanation":"配网DTU柜核心设备包括DTU装置、电源管理模块、蓄电池；无线模块属辅助通信，非核心设备。","bank":"电气基础"},{"id":"4d89b12a4161","type":"single","category":"电气基础","stem":"配电自动化系统由（）三部分组成","options":{"A":"配网主站，通信网络，配网终端","B":"配网主站，通信网络，配网子站","C":"配网主站，安防设备，配网终端","D":"配网主站，安防设备，配网子站"},"answer":"A","explanation":"配电自动化系统由配网主站、通信网络、配网终端（FTU/DTU/TTU）三部分组成。","bank":"电气基础"},{"id":"c68ed29b3535","type":"single","category":"电气基础","stem":"下面是某110kV开关的颜色决策和拓扑颜色，110kV电压等级采用红色，某画面启用拓扑，请问冷备用状态下，该画面当开关遥控合上后开关的颜色显示（）","options":{"A":"红色","B":"白色","C":"灰色红色交替闪烁","D":"灰色白色交替闪烁"},"answer":"D","explanation":"按配电图形拓扑着色规则，110kV开关冷备用状态下遥控合上后，因合位但两侧未确认带电，开关显示灰色与白色交替闪烁。","bank":"电气基础"},{"id":"a9deef9707e8","type":"single","category":"电气基础","stem":"在正弦交流电路中,电压、电流、电动势都是随时间()。","options":{"A":"非周期性变化的","B":"恒定不变的","C":"按正弦规律变化的"},"answer":"C","explanation":"正弦交流电路中的电压、电流、电动势均随时间按正弦规律变化。","bank":"电气基础"},{"id":"ec7406e4eafd","type":"single","category":"电气基础","stem":"在直流电路中,电容元件的容抗值()。","options":{"A":"小于零","B":"无穷大","C":"等于零"},"answer":"B","explanation":"直流电路中电容相当于开路，容抗值为无穷大。","bank":"电气基础"},{"id":"a72c0aa87f22","type":"single","category":"电气基础","stem":"起重吊钩应挂在物件的()。","options":{"A":"顶端","B":"中部","C":"重心线上","D":"中心线上"},"answer":"C","explanation":"起重吊钩应挂在物件的重心线上，以保证起吊平稳、防止倾翻。","bank":"电气基础"},{"id":"1027b57a415c","type":"single","category":"电气基础","stem":"用电烙铁焊接时，但焊头因氧化而不吃锡时，不可（）。","options":{"A":"用焊剂","B":"停止","C":"硬烧"},"answer":"C","explanation":"焊头因氧化不吃锡时，不可硬烧（干烧），应先清理、上锡或使用焊剂处理。","bank":"电气基础"},{"id":"ac8af084eea1","type":"single","category":"电气基础","stem":"非连续进行的事故修复工作，应使用（）。","options":{"A":"工作票","B":"事故紧急抢修单","C":"安全措施票","D":"工作任务单"},"answer":"A","explanation":"非连续进行的、有计划安排的事故修复工作应使用工作票；事故紧急抢修单仅用于连续、紧急的抢修。","bank":"电气基础"},{"id":"09231f2fbfd5","type":"single","category":"电气基础","stem":"事故紧急抢修工作，指电气设备发生故障被迫紧急停止运行，需（）恢复的抢修和排除故障的工作。","options":{"A":"按计划时间内","B":"短时间内","C":"规定时间内","D":"限定时间内"},"answer":"B","explanation":"事故紧急抢修指设备故障被迫紧急停运、需短时间内恢复运行的抢修排障工作。","bank":"电气基础"},{"id":"da22ef116f3c","type":"single","category":"电气基础","stem":"电源正极的电位()。","options":{"A":"高","B":"低","C":"不确定"},"answer":"A","explanation":"电源正极电位高于负极电位。","bank":"电气基础"},{"id":"7d8bbcbec5c5","type":"single","category":"电气基础","stem":"电源端电压表示电场力在()将单位正电荷由高电位移向低电位时所做的功。","options":{"A":"外电路","B":"内电路","C":"整个电路"},"answer":"A","explanation":"电源端电压表示电场力在外电路将单位正电荷由高电位移到低电位所做的功。","bank":"电气基础"},{"id":"2337f289e0bf","type":"single","category":"电气基础","stem":"电源电动势的大小等于外力克服电场力把单位()在电源内部从负极移到正极所做的功。","options":{"A":"正电荷","B":"电子","C":"负电荷"},"answer":"A","explanation":"电源电动势大小等于外力克服电场力把单位正电荷在电源内部从负极移到正极所做的功。","bank":"电气基础"},{"id":"52a6328e9527","type":"single","category":"电气基础","stem":"电源的电功率表示电源()电能。","options":{"A":"在单位时间消耗的","B":"在单位时间产生的","C":"在任意时间消耗的"},"answer":"B","explanation":"电源的电功率表示电源在单位时间内产生（转换）电能的能力。","bank":"电气基础"},{"id":"7a566e518f93","type":"single","category":"电气基础","stem":"电气设备的(),就是要及时发现电气设备在运行中出现的各种潜伏性缺陷。","options":{"A":"电压试验","B":"交接试验","C":"预防性试验"},"answer":"C","explanation":"电气设备的预防性试验旨在及时发现运行中出现的各种潜伏性缺陷。","bank":"电气基础"},{"id":"ca22ca4b8a21","type":"single","category":"电气基础","stem":"电路中任意两点之间的电压等于这两点的电位()。","options":{"A":"之差","B":"之和","C":"之积"},"answer":"A","explanation":"电路中任意两点间电压等于这两点电位之差。","bank":"电气基础"},{"id":"ddebf0d9fbd0","type":"single","category":"电气基础","stem":"电路中,电流的大小和方向()的电路,称为直流电路。","options":{"A":"不随时间变化","B":"随时间变化","C":"随时间规律变化"},"answer":"A","explanation":"电流的大小和方向不随时间变化的电路称为直流电路。","bank":"电气基础"},{"id":"585bce5f2179","type":"single","category":"电气基础","stem":"雷雨天气，需要巡视室外高压设备时，应穿()，并不准靠近避雷器和避雷针。","options":{"A":"雨鞋","B":"绝缘靴","C":"橡胶鞋","D":"绝缘鞋"},"answer":"B","explanation":"雷雨天气巡视室外高压设备时应穿绝缘靴，并不得靠近避雷器和避雷针。","bank":"电气基础"},{"id":"3a91db5b841f","type":"single","category":"电气基础","stem":"电路是由电气设备和()按一定方式组成的。","options":{"A":"绝缘物","B":"电器元件","C":"铁磁物质"},"answer":"B","explanation":"电路由电源、负载和中间环节（控制、保护等电气元件）按一定方式连接组成。选项A绝缘物、C铁磁物质均不是电路的基本组成要素，故正确项为“电器元件”。","bank":"电气基础"},{"id":"af24efc1d8e7","type":"single","category":"电气基础","stem":"电路闭合时,电源的端电压()电源电动势减去电源的内阻压降。","options":{"A":"大于","B":"小于","C":"等于"},"answer":"C","explanation":"电路闭合（带负载）时，电源端电压 U = E − I·r（E为电动势，I为电流，r为内阻），即端电压等于电动势减去内阻压降。故选“等于”。","bank":"电气基础"},{"id":"383935c97025","type":"single","category":"电气基础","stem":"电路包含电源、()三个基本组成部分。","options":{"A":"开关和负载","B":"导线和中间环节","C":"负载和中间环节"},"answer":"C","explanation":"电路的三个基本组成部分为电源、负载和中间环节。题干已给出“电源”，故还应包含“负载和中间环节”。开关、导线均属中间环节，A、B两项均不完整。","bank":"电气基础"},{"id":"5b25ec352750","type":"single","category":"电气基础","stem":"电流在外电路中(),在电源内部是从电源负极流向正极。","options":{"A":"从电源的负极流向正极","B":"从负载的负极流向正极","C":"从电源的正极流向负极"},"answer":"C","explanation":"在外电路中电流从高电位流向低电位，即从电源正极流向负极；在电源内部非静电力把正电荷从负极搬到正极。故外电路应选“从电源的正极流向负极”。","bank":"电气基础"},{"id":"90b643344759","type":"single","category":"电气基础","stem":"电流强度的单位为()。","options":{"A":"库仑","B":"安培","C":"伏特"},"answer":"B","explanation":"电流强度的国际单位是安培（A）。库仑是电荷量单位，伏特是电压单位。","bank":"电气基础"},{"id":"07582923db37","type":"single","category":"电气基础","stem":"在手车开关拉出后，应观察隔离挡板是否可靠封闭。封闭式组合电器引出电缆备用孔或母线的终端备用孔应用()封闭。","options":{"A":"专用器具","B":"临时隔板","C":"接地隔板","D":"绝缘隔板"},"answer":"A","explanation":"按安规要求，封闭式组合电器引出电缆备用孔或母线终端备用孔应采用专用器具封闭，以防误入带电间隔及小动物进入。临时隔板、接地/绝缘隔板均不满足“专用器具”要求。","bank":"电气基础"},{"id":"e6031232d4f3","type":"single","category":"电气基础","stem":"灯泡通电的时间越长,消耗的电能就()。","options":{"A":"越少","B":"越多","C":"不确定"},"answer":"B","explanation":"灯泡消耗电能 W = P·t，功率一定时通电时间越长，电能消耗越多。故选“越多”。","bank":"电气基础"},{"id":"a409a9d25d62","type":"single","category":"电气基础","stem":"导体中()运动的方向规定为电流的实际方向。","options":{"A":"负电荷","B":"正电荷","C":"电子"},"answer":"B","explanation":"规定正电荷定向移动的方向为电流的实际方向。负电荷、自由电子移动方向与电流实际方向相反。","bank":"电气基础"},{"id":"0dc4ff7add55","type":"single","category":"电气基础","stem":"导体中()就是电流的方向。","options":{"A":"电子移动的反方向","B":"正电荷移动的反方向","C":"电子移动的正方向"},"answer":"A","explanation":"电流方向规定为正电荷移动方向；金属导体中实际定向移动的是自由电子，故电流方向就是电子移动的反方向。选A。","bank":"电气基础"},{"id":"687b142ac313","type":"single","category":"电气基础","stem":"导体在磁场中做切割磁力线运动时,导体内就会产生()。","options":{"A":"感应电动势","B":"电流","C":"电阻"},"answer":"A","explanation":"导体在磁场中切割磁力线运动时，导体内产生感应电动势（动生电动势，法拉第定律）。只有构成闭合回路时才形成电流，故直接产生的是感应电动势。","bank":"电气基础"},{"id":"ea0e63c3ede6","type":"single","category":"电气基础","stem":"导体处于变化的磁场中时,导体内会产生()。","options":{"A":"电阻","B":"电流","C":"感应电动势"},"answer":"C","explanation":"根据电磁感应定律，处在变化磁场中的导体（或线圈）会产生感应电动势。电阻、电流不会凭空产生，故选“感应电动势”。","bank":"电气基础"},{"id":"ae4b86f3d03b","type":"single","category":"电气基础","stem":"当温度升高时,金属导体的电阻()。","options":{"A":"增大","B":"减小","C":"不变"},"answer":"A","explanation":"金属导体的电阻率随温度升高而增大（正温度系数），故温度升高时其电阻增大。","bank":"电气基础"},{"id":"90dc1193f755","type":"single","category":"电气基础","stem":"当温度降低时,电解液和碳素物质的电阻()。","options":{"A":"减小","B":"增大","C":"不变"},"answer":"B","explanation":"电解液（酸、碱、盐溶液）与碳素物质的电阻具有负温度系数，温度降低时电阻增大（与金属相反）。故选“增大”。","bank":"电气基础"},{"id":"aea03a461cb3","type":"single","category":"电气基础","stem":"当通过电阻R的电流I一定时,电阻R消耗的电功率P与电阻R的大小成()。","options":{"A":"正比","B":"反比","C":"不确定"},"answer":"A","explanation":"P = I²R，当电流 I 一定时，功率 P 与电阻 R 成正比。选“正比”。","bank":"电气基础"},{"id":"7e6d74b53a81","type":"single","category":"电气基础","stem":"当伤者牙关紧闭,无法进行口对口人工呼吸时,应()。","options":{"A":"用工具把嘴撬开","B":"加大压力口对口吹气","C":"口对鼻吹气"},"answer":"C","explanation":"触电急救中若伤者牙关紧闭无法口对口人工呼吸，应采用口对鼻吹气法；不可用工具撬嘴或加大压力口对口吹气。","bank":"电气基础"},{"id":"430caf55b7cb","type":"single","category":"电气基础","stem":"当两个线圈放得很近,或两个线圈同绕在一个铁芯上时,如果其中一个线圈中电流变化,在另一个线圈中产生的感应电动势称为()。","options":{"A":"自感电动势","B":"互感电动势","C":"交变电动势"},"answer":"B","explanation":"一个线圈电流变化在邻近线圈中产生的感应电动势称为互感电动势；自身线圈中产生的称自感电动势。故选“互感电动势”。","bank":"电气基础"},{"id":"48b2e3ea4248","type":"single","category":"电气基础","stem":"当电路断开时,电源端电压在数值上()电源电动势。","options":{"A":"大于","B":"等于","C":"小于"},"answer":"B","explanation":"电路断开（开路）时电流 I = 0，内阻压降 I·r = 0，电源端电压 U = E，数值上等于电动势。选“等于”。","bank":"电气基础"},{"id":"0ae1f45fe9df","type":"single","category":"电气基础","stem":"当导体横截面上()不随时间变化的电流称为直流电流。","options":{"A":"电压的大小","B":"电压的方向","C":"电流的大小和方向"},"answer":"C","explanation":"大小和方向都不随时间变化的电流称为直流电流；仅大小或仅方向不变不称为直流。故选“电流的大小和方向”。","bank":"电气基础"},{"id":"0ec47ede4b6e","type":"single","category":"电气基础","stem":"当导体材料及长度确定之后,如果导体截面越小,则导体的电阻值()。","options":{"A":"不变","B":"越大","C":"越小"},"answer":"B","explanation":"由 R = ρL/S，材料（ρ）和长度 L 一定时，截面 S 越小电阻 R 越大。选“越大”。","bank":"电气基础"},{"id":"4f6c11d743f9","type":"single","category":"电气基础","stem":"磁场中磁力线在某区域的密度与该区域的磁场强弱()。","options":{"A":"成正比","B":"成反比","C":"无关系"},"answer":"A","explanation":"磁力线疏密反映磁场强弱，某区域磁力线越密磁场越强，二者成正比。选“成正比”。","bank":"电气基础"},{"id":"606cf6836eb9","type":"single","category":"电气基础","stem":"磁场中磁力线线条稀疏处表示磁场()。","options":{"A":"强","B":"弱","C":"不确定"},"answer":"B","explanation":"磁力线越稀疏处磁感应强度越小，表示磁场越弱。选“弱”。","bank":"电气基础"},{"id":"cf3926dbdc07","type":"single","category":"电气基础","stem":"磁场、电流和电磁力三者间的方向关系可用()来判定。","options":{"A":"左手定则","B":"右手定则","C":"顺时针定则"},"answer":"A","explanation":"判断磁场中通电导体受力方向用左手定则（电动机定则）；判断感应电动势方向用右手定则。故选“左手定则”。","bank":"电气基础"},{"id":"64985680cabf","type":"single","category":"电气基础","stem":"初相位为“正”,表示正弦波形与纵坐标的交点在坐标原点O点的()。","options":{"A":"上方","B":"左方","C":"右方"},"answer":"A","explanation":"正弦量 u = Um sin(ωt + φ)，初相位 φ > 0 时 t=0 的瞬时值为正，波形与纵坐标交点在原点 O 的上方。选“上方”。","bank":"电气基础"},{"id":"f5c9c9e2f3f2","type":"single","category":"电气基础","stem":"冲击电压中,()持续时间达到几百微秒到几千微秒,波形为非周期性的单次脉冲。","options":{"A":"操作冲击电压","B":"雷电冲击电压","C":"工频电压"},"answer":"A","explanation":"操作冲击电压持续时间达几百微秒到几千微秒，为非周期性单次脉冲；雷电冲击电压波头、波长更短（微秒级）。故选“操作冲击电压”。","bank":"电气基础"},{"id":"8feeeb9fe936","type":"single","category":"电气基础","stem":"长直载流导线周围的磁场,离导线越近,磁力线分布越()。","options":{"A":"密","B":"不确定","C":"疏"},"answer":"A","explanation":"长直载流导线周围磁场 B ∝ 1/r，离导线越近磁场越强，磁力线分布越密。选“密”。","bank":"电气基础"},{"id":"f494dae1b7e7","type":"single","category":"电气基础","stem":"长直载流导线周围磁力线的形状和特点是()。","options":{"A":"环绕导线的同心圆","B":"不环绕导线的同心圆","C":"椭圆形"},"answer":"A","explanation":"由安培右手螺旋定则，长直载流导线周围磁力线是以导线为圆心的同心圆，环绕导线。选“环绕导线的同心圆”。","bank":"电气基础"},{"id":"a9bd40c41362","type":"single","category":"电气基础","stem":"运维人员应熟悉()。单独值班人员或运维负责人还应有实际工作经验。","options":{"A":"电气设备","B":"施工机具","C":"现场安全措施","D":"现场作业环境"},"answer":"A","explanation":"《安规》规定运维人员应熟悉电气设备；单独值班或运维负责人还应有实际工作经验。故选“电气设备”。","bank":"电气基础"},{"id":"5172566af6ca","type":"single","category":"电气基础","stem":"部分电路欧姆定律的数学表达式是()。","options":{"A":"I=UR","B":"I=R/U","C":"I=U/R"},"answer":"C","explanation":"部分电路欧姆定律：I = U/R（电流等于电压除以电阻）。选项A、B公式错误。","bank":"电气基础"},{"id":"0a75f0fdb413","type":"single","category":"电气基础","stem":"部分电路欧姆定律表明,当电阻一定时,通过电阻的电流与电阻两端的电压成()。","options":{"A":"正比","B":"反比","C":"不确定"},"answer":"A","explanation":"由 I = U/R，电阻 R 一定时，电流 I 与电压 U 成正比。选“正比”。","bank":"电气基础"},{"id":"9f56a98274de","type":"single","category":"电气基础","stem":"变压器铁芯中磁通F的大小与磁路的性质、铁芯绕组的匝数N和()有关。","options":{"A":"线圈电阻","B":"线圈的绕制方向","C":"线圈电流I"},"answer":"C","explanation":"由磁路欧姆定律 Φ = N·I / Rm，铁芯磁通大小与匝数 N 和线圈电流 I 有关（也与磁路磁阻即磁路性质有关）。线圈电阻、绕制方向不决定磁通大小。故选“线圈电流I”。","bank":"电气基础"},{"id":"2b24990436e2","type":"single","category":"电气基础","stem":"变压器的变压比是()时的一、二次绕组电压比。","options":{"A":"空载","B":"轻载","C":"满载"},"answer":"A","explanation":"变压器变压比定义为空载（额定分接、二次侧开路）时一、二次绕组电压之比，可排除负载压降影响。选“空载”。","bank":"电气基础"},{"id":"32ab46e7a5dc","type":"single","category":"电气基础","stem":"()是固体介质中存在的少量自由电子在强电场的作用下产生碰撞游离,最后导致击穿。","options":{"A":"电击穿","B":"热击穿","C":"电化学击穿"},"answer":"A","explanation":"电击穿是固体介质中少量自由电子在强电场下碰撞游离、链式发展导致击穿的机制；热击穿由介质损耗发热引起，电化学击穿由化学老化引起。故选“电击穿”。","bank":"电气基础"},{"id":"6ac1cb189626","type":"single","category":"电气基础","stem":"高［电］压：a）通常指超过低压的电压等级。b）特定情况下，指电力系统中（）的电压等级。","options":{"A":"输电","B":"变电","C":"配电","D":"用电"},"answer":"A","explanation":"高压术语定义：特定情况下指电力系统中输电的电压等级（相对于配电的低压而言）。故选“输电”。","bank":"电气基础"},{"id":"a60e2177469b","type":"single","category":"电气基础","stem":"低［电］压：用于配电的交流系统中（）的电压等级。","options":{"A":"220V以下","B":"220V及以下","C":"1000V以下","D":"1000V及以下"},"answer":"D","explanation":"按 GB/T 2900.50，低压（low voltage）指用于配电的交流系统中 1000V 及以下的电压等级。故选“1000V及以下”。","bank":"电气基础"},{"id":"c3559c4dcdf3","type":"single","category":"电气基础","stem":"电阻电路中，要使负载电阻得到最大的功率，必须使负载电阻与电源内阻()。","options":{"A":"负载电阻大于电源内阻","B":"负载电阻小于电源内阻","C":"负载电阻等于电源内阻","D":"使电源内阻为零"},"answer":"C","explanation":"最大功率传输定理：当负载电阻等于电源内阻（阻抗匹配）时，负载获得最大功率。选“负载电阻等于电源内阻”。","bank":"电气基础"},{"id":"e8f1487c53d2","type":"single","category":"电气基础","stem":"变压器过励磁倍数主要取决于额定运行状态下的()与()的比值。","options":{"A":"电压 频率","B":"电流 频率","C":"电压 电流","D":"功率 电压"},"answer":"A","explanation":"变压器过励磁倍数取决于 U/f 比值（额定电压与额定频率之比）；电压升高或频率降低都会使铁芯磁通密度标幺值（过励磁倍数）增大。故选“电压 频率”。","bank":"电气基础"},{"id":"ac7e8da686c3","type":"single","category":"电气基础","stem":"经过YNd11接法的变压器并且由三角形侧到星形侧时，电流的正序分量()方向转过30°，负序分量()方向转过30°。","options":{"A":"顺时针 逆时针","B":"逆时针 顺时针","C":"顺时针 顺时针","D":"逆时针 逆时针"},"answer":"A","explanation":"YNd11 变压器：低压（三角形）侧正序电流超前高压（星形）侧 30°。由三角形侧看向星形侧时，正序分量滞后即顺时针转 30°；负序分量相反，逆时针转 30°。故选“顺时针 逆时针”。","bank":"电气基础"},{"id":"cb7211b43ace","type":"single","category":"电气基础","stem":"空投变压器时，铁芯中磁通的大小与断路器合闸瞬间电压的相位角α有关，当α为()时，铁芯中磁通最大，合闸磁通由零增至2φm;当α为()时，不产生励磁涌流。","options":{"A":"0° 90°","B":"90° 0°","C":"0° 0°","D":"90° 90°"},"answer":"A","explanation":"设电压 u = Um sin(ωt+α)，合闸瞬间 α=0°（电压过零）时磁通由零突增至约 2φm 最大、励磁涌流最大；α=90°（电压最大）合闸时磁通无过冲，不产生励磁涌流。故选“0° 90°”。","bank":"电气基础"},{"id":"d41acf70270c","type":"single","category":"电气基础","stem":"联结组别为YNd11的三相变压器的一次侧电压和二次侧的电压相位关系为()。","options":{"A":"一次侧电压落后二次侧电压150°","B":"二次侧电压超前一次侧电压150°","C":"二次侧电压超前一次侧电压30°","D":"一次侧电压超前二次侧电压30°"},"answer":"C","explanation":"YNd11 表示低压（d）侧线电压超前高压（y）侧线电压 11×30°=330°（即习惯说超前 30°），即二次侧电压超前一次侧电压 30°。选C。","bank":"电气基础"},{"id":"77cac4ec16e3","type":"single","category":"电气基础","stem":"和应涌流有()特点。","options":{"A":"和应涌流与空载合闸变压器励磁涌流几乎同时出现","B":"空载合闸变压器与并联或级联变压器涌流方向相反","C":"和应涌流持续时间较短","D":"和应涌流幅值随时间逐步增大到最大值"},"answer":"B","explanation":"和应涌流（sympathetic inrush）：一台变压器空载合闸时，与之并联或级联的另一台变压器会出现方向相反的励磁涌流。故正确特点为“空载合闸变压器与并联或级联变压器涌流方向相反”（B）；其余选项不符合和应涌流特征。","bank":"电气基础"},{"id":"4fd345082377","type":"single","category":"电气基础","stem":"变压器空载合闸时有励磁涌流出现，以下对励磁涌流的特点描述不正确的为()。","options":{"A":"含有明显的非周期分量电流","B":"波形出现间断、不连续，间断角一般在65℃以上","C":"含有明显的2次谐波","D":"变压器容量越大，励磁涌流相对额定电流倍数也越大","E":"变压器容量越大，衰减越慢"},"answer":"D","explanation":"励磁涌流特点：含明显非周期分量、含明显 2 次谐波、波形间断角一般 65°以上、容量越大衰减越慢。而励磁涌流相对额定电流的倍数并不随容量增大而增大（大容量变压器倍数反而较小），故 D 描述不正确，为应选项。","bank":"电气基础"},{"id":"c268f7b62fa7","type":"single","category":"电气基础","stem":"影响变压器空投时励磁涌流大小的因素中，描述错误的是()。","options":{"A":"电源电压越高，励磁涌流越大","B":"合闸角为0°时，励磁涌流最小 90°时，涌流最大","C":"剩磁越大，与自由分量磁通方向相同时，涌流最大","D":"变压器与电源之间联系阻抗越大，涌流越小"},"answer":"B","explanation":"励磁涌流影响因素：合闸角 α=0° 时涌流最大，α=90° 时最小（甚至无涌流），故 B 项“0°最小、90°最大”描述错误，为应选项。电源越高、剩磁同向越大、联系阻抗越大涌流越小等描述正确。","bank":"电气基础"},{"id":"2c617aea90a4","type":"single","category":"电气基础","stem":"变压器空载合闸时，会出现数值很大的励磁涌流，它的最大值出现在()的瞬间。","options":{"A":"断路器触头似接未接","B":"合闸时","C":"合闸后经半个周期"},"answer":"C","explanation":"空载合闸励磁涌流最大值出现在合闸后约半个周期（磁通达到约 2φm 的时刻）。故选“合闸后经半个周期”。","bank":"电气基础"},{"id":"c7f3f00dd192","type":"single","category":"电气基础","stem":"变压器供电的线路发生短路时，要使短路电流小些，下述措施()是正确的。","options":{"A":"增加变压器电动势","B":"变压器加大外电阻R","C":"变压器增加内电阻r","D":"选用短路比大的变压器"},"answer":"D","explanation":"线路短路时短路电流 I = E / (系统阻抗 + 变压器阻抗)，选用短路比（短路阻抗）大的变压器可增大等效阻抗、减小短路电流；其余选项不能有效减小短路电流。故选“选用短路比大的变压器”。","bank":"电气基础"},{"id":"130bb6d2c405","type":"single","category":"电气基础","stem":"变压器励磁涌流的衰减时间为()。","options":{"A":"1.5～2s","B":"0.5～1s","C":"3～4s","D":"4.5～5s"},"answer":"B","explanation":"变压器励磁涌流一般经 0.5～1s 衰减到可忽略（少数大容量变压器更长），标准取值为 0.5～1s。选B。","bank":"电气基础"},{"id":"13c3c795f004","type":"single","category":"电气基础","stem":"双绕组变压器空载合闸的励磁涌流的特点有()。","options":{"A":"变压器两侧电流相位一致","B":"变压器两侧电流相位无直接联系","C":"仅在变压器一侧有电流","D":"变压器两侧均有电流"},"answer":"C","explanation":"双绕组变压器空载合闸时仅一次侧（电源侧）接入电源，励磁涌流只流经电源侧，二次侧开路无电流。故选“仅在变压器一侧有电流”。","bank":"电气基础"},{"id":"5dd9b6b2814c","type":"single","category":"电气基础","stem":"空载变压器突然合闸时，可能产生的最大励磁涌流的值与短路电流相比()。","options":{"A":"前者远小于后者","B":"前者远大于后者","C":"可以比拟"},"answer":"C","explanation":"空载合闸最大励磁涌流可达额定电流的 6～8 倍甚至更高，与短路电流（同为额定电流的若干倍）数量级相当，可以比拟。选“可以比拟”。","bank":"电气基础"},{"id":"c71a278040b4","type":"single","category":"电气基础","stem":"变压器正常运行时，励磁电流为额定电流的()。","options":{"A":"2倍","B":"1.5倍","C":"2%～10%","D":"5%～8%"},"answer":"C","explanation":"变压器正常运行时空载励磁电流很小，一般为额定电流的 2%～10%（大型变压器更小）。选“2%～10%”。","bank":"电气基础"},{"id":"9737cc8e2206","type":"single","category":"电气基础","stem":"和应涌流有哪些特点()。","options":{"A":"和应涌流与空载合闸变压器励磁涌流几乎同时出现","B":"空载合闸变压器与并联或级联变压器涌流方向相反","C":"和应涌流持续时间较短","D":"和应涌流幅值随时间逐步增大到最大值"},"answer":"B","explanation":"和应涌流特点：一台变压器空载合闸时，相邻并联或级联变压器出现方向相反的涌流（B 正确）。它并非与合闸涌流同时达最大，且通常持续时间较长、幅值逐步增大，故正确选项为 B。","bank":"电气基础"},{"id":"1259753d0bb9","type":"single","category":"电气基础","stem":"变压器的工作原理是利用电磁感应原理()。","options":{"A":"将大电压变成小电压","B":"将一次交流电压变成同频率的二次交流电压","C":"将小电压变成大电压","D":"将一次交流电压变成不同频率的二次交流电压"},"answer":"B","explanation":"变压器基于电磁感应，把一次侧交流电压变换为频率相同、电压不同的二次侧交流电压（不改变频率）。选B。","bank":"电气基础"},{"id":"d0eb506f22c2","type":"single","category":"电气基础","stem":"三绕组变压器的额定容量是指()。","options":{"A":"最大绕组的额定容量","B":"各个绕组额定容量的平均值","C":"各个绕组额定容量之和","D":"最小绕组的额定容量"},"answer":"A","explanation":"三绕组变压器额定容量通常指各绕组中容量最大的那个绕组的额定容量（常以最大绕组容量作为变压器额定容量）。选“最大绕组的额定容量”。","bank":"电气基础"},{"id":"24c2cf6090f4","type":"single","category":"电气基础","stem":"三相变压器绕组为Y联结时，绕组相电压乘以根号3就等于()。","options":{"A":"相电压","B":"最大电压","C":"线电压","D":"负载电压"},"answer":"C","explanation":"Y 联结时线电压 = √3 × 相电压，故相电压乘以 √3 等于线电压。选“线电压”。","bank":"电气基础"},{"id":"49ac6c0a6999","type":"single","category":"电气基础","stem":"变压器中性点消弧线圈的作用是()。","options":{"A":"提高电网的电压水平","B":"限制变压器故障电流","C":"补偿网络接地时的电容电流","D":"消除潜供电流"},"answer":"C","explanation":"消弧线圈装于变压器（或发电机）中性点，用于补偿电网单相接地时的电容电流，使接地残流减小、电弧易熄灭。选“补偿网络接地时的电容电流”。","bank":"电气基础"},{"id":"b186459eeaea","type":"single","category":"电气基础","stem":"一台SFP-90000/220电力变压器，额定容量为90000kVA，额定电压为（220±2*2.5%）/110kV，问高压侧和低压侧的额定电流各是()。","options":{"A":"224A/472A","B":"229A/472A","C":"236A/472A","D":"248A/472A"},"answer":"C","explanation":"额定电流 I = S / (√3 U)。高压侧：90000/(1.732×220)≈236 A；低压侧：90000/(1.732×110)≈472 A。故选“236A/472A”。","bank":"电气基础"},{"id":"2fa014c986d9","type":"single","category":"电气基础","stem":"正常运行中的TA和TV铁芯中的磁通密度()。","options":{"A":"TA中高","B":"TV中高","C":"两者均在饱和值附近","D":"两者均远远达不到饱和值"},"answer":"B","explanation":"电压互感器（TV）正常接近铁芯饱和运行，磁通密度较高；电流互感器（TA）正常二次侧近似短路、磁动势平衡，铁芯磁通密度很低。故 TV 中磁通密度高（B）。","bank":"电气基础"},{"id":"d5d2b6da82f2","type":"single","category":"电气基础","stem":"单相故障时，健全相的电流突变量是（）。","options":{"A":"零","B":"增大","C":"减小","D":"不变"},"answer":"A","explanation":"单相（如单相接地）故障时仅故障相电流突变，健全相电流无突变量，故健全相电流突变量为零。选“零”。","bank":"电气基础"},{"id":"cfeb673adf2a","type":"single","category":"电气基础","stem":"在不计负荷电流情况下，带有浮动门槛的相间电流差突变量起动元件，下列情况描述不正确的是()。","options":{"A":"双侧电源线路上发生各种短路故障，线路两侧的元件均能起动","B":"单侧电源线路上发生相间短路故障，当负荷侧没有接地中性点时，负荷侧元件不能起动","C":"单侧电源线路上发生接地故障，当负荷侧有接地中性点时，负荷侧元件能起动","D":"系统振荡时，元件不动作"},"answer":"C","explanation":"相间电流差突变量起动元件（不计负荷电流）：双侧电源各种短路两侧均可起动；单侧电源相间短路且负荷侧无接地中性点时不能起动；系统振荡不动作。而单侧电源接地故障即使负荷侧有接地中性点，该“相间”差突变量元件也难以在负荷侧可靠起动，故 C 描述不正确，为应选项。","bank":"电气基础"},{"id":"eebb0750d38f","type":"single","category":"电气基础","stem":"电力系统不允许长期非全相运行，为了防止断路器一相断开后，长时间非全相运行，应采取措施断开三相，并保证选择性。其措施是装设：（）。","options":{"A":"断路器失灵保护","B":"零序电流保护","C":"断路器三相不一致保护","D":"负序电流保护"},"answer":"C","explanation":"为防止断路器一相断开后长期非全相运行，应装设断路器三相不一致（非全相）保护，动作断开三相并保证选择性。选“断路器三相不一致保护”。","bank":"电气基础"},{"id":"c8a6da81e4ed","type":"single","category":"电气基础","stem":"突变量方向元件的原理是利用()","options":{"A":"正向故障时ΔU=-ZΔI，反向故障时ΔU=ZΔI","B":"正向故障时ΔU=ZΔI，反向故障时ΔU=-ZΔI","C":"正向故障时ΔU=-ZΔI，反向故障时ΔU=ZΔI","D":"正向故障时ΔU=ZΔI/2，反向故障时ΔU=-ZΔI/2"},"answer":"C","explanation":"突变量方向元件利用短路时电压、电流突变量的关系判别方向：正向故障 ΔU = −Z·ΔI（测量点背后阻抗），反向故障 ΔU = +Z·ΔI（线路阻抗为正）。选 C（正向 ΔU=−ZΔI、反向 ΔU=ZΔI）。","bank":"电气基础"},{"id":"b2cafc6b2408","type":"single","category":"电气基础","stem":"当零序功率方向继电器的最灵敏角为电流越前电压110°时，()。","options":{"A":"其电流和电压回路应按反极性与相应的电流互感器、电压互感器回路联接","B":"该相位角与线路正向故障时零序电流与零序电压的相位关系一致","C":"该元件适用于中性点不接地系统零序方向保护","D":"以上都正确"},"answer":"B","explanation":"零序功率方向继电器最灵敏角取电流越前电压 110°，正是线路正向接地故障时零序电流与零序电压的实际相位关系，故该相位角与正向故障一致（B）。中性点不接地系统一般无零序方向保护需求，C 不对。","bank":"电气基础"},{"id":"755c80115ab7","type":"single","category":"电气基础","stem":"下面的说法中正确的是（___）。","options":{"A":"系统发生振荡时电流和电压值都往复摆动，并且三相严重不对称","B":"零序电流保护在电网发生振荡时容易误动作","C":"有一电流保护其动作时限为4.5s，在系统发生振荡时它不会误动作","D":"距离保护在系统发生振荡时容易误动作，所以系统发生振荡时应断开距离保护投退连接片"},"answer":"C","explanation":"系统振荡时电流、电压往复摆动但三相仍基本对称，不会使带有较长动作时限（如 4.5s，大于振荡周期）的电流保护误动；而零序、距离保护才易受振荡影响。故 C 正确。","bank":"电气基础"},{"id":"dfa295d121e1","type":"single","category":"电气基础","stem":"下列关于电力系统振荡和短路的描述中()是不正确的。","options":{"A":"短路时电流、电压值是突变的，而系统振荡时系统各点电压和电流值均作往复性摆动","B":"振荡时系统任何一点电流和电压之间的相位角都随着功角σ的变化而变化","C":"系统振荡时，将对以测量电流为原理的保护形成影响，如：电流速断保护、电流纵联差动保护等","D":"短路时电压与电流的相位角是基本不变的"},"answer":"C","explanation":"电流纵联差动保护比较线路两端电流相量和，系统振荡时两侧电流同相、和接近零，保护不反应振荡，故“振荡对电流纵联差动保护形成影响”的说法不正确，C 为应选项。","bank":"电气基础"},{"id":"dfac00831415","type":"single","category":"电气基础","stem":"过渡电阻对距离继电器工作的影响是()。","options":{"A":"只会使保护区缩短","B":"只会使继电器超越","C":"视条件可能会失去方向性，也可能使保护区缩短，也可能超越或拒动","D":"无影响"},"answer":"C","explanation":"过渡电阻会使距离继电器测量阻抗偏离，可能使保护区缩短、可能超越、也可能失去方向性或拒动，视故障位置与过渡电阻大小而定。选 C。","bank":"电气基础"},{"id":"ec93747f3e4c","type":"single","category":"电气基础","stem":"同步发电机并列运行的条件不包括（）","options":{"A":"电压相等","B":"频率相等","C":"相位相同","D":"容量相等"},"answer":"D","explanation":"同步发电机并列（准同期）条件：电压相等、频率相等、相位相同（相序一致）。容量相等并非并列条件。选“容量相等”。","bank":"电气基础"},{"id":"ca327bec8d1f","type":"single","category":"电气基础","stem":"如果采样频率.fs=1200Hz，在50Hz的电力系统中，相邻两采样点对应的工频电角度为()","options":{"A":"30°","B":"18°","C":"15°","D":"12°"},"answer":"C","explanation":"每工频周期采样点数 N = fs/f = 1200/50 = 24，相邻采样点电角度 = 360°/24 = 15°。选“15°”。","bank":"电气基础"},{"id":"bfaab357e388","type":"single","category":"电气基础","stem":"电压频率变换器(VFC)构成模数变换器时，其主要优点是()","options":{"A":"精度高","B":"速度快","C":"易隔离和抗干扰能力强"},"answer":"C","explanation":"VFC（电压频率变换器）型模数变换器输出为频率量，便于光电隔离、抗干扰能力强，是其突出优点。选“易隔离和抗干扰能力强”。","bank":"电气基础"},{"id":"e19d8b603897","type":"single","category":"电气基础","stem":"时间继电器的作用是（）","options":{"A":"短路保护","B":"过载保护","C":"延时控制","D":"欠压保护"},"answer":"C","explanation":"时间继电器在控制电路中用于实现延时（接通/断开）控制。选“延时控制”。","bank":"电气基础"},{"id":"de88121c75b5","type":"single","category":"电气基础","stem":"对于电缆或电缆引出的架空线路，通常釆用（）获得零序电流","options":{"A":"电流互感器","B":"零序电流滤过器","C":"电流变换器","D":"零序电流互感器"},"answer":"D","explanation":"电缆线路三相同缆，获取零序电流宜用套在电缆上的零序电流互感器（三相穿过其铁芯），直接取得三相电流之和（即零序）。选“零序电流互感器”。","bank":"电气基础"},{"id":"254e3ee51c99","type":"single","category":"电气基础","stem":"电网在正常运行时，三相电流之和为零，（）零序分量","options":{"A":"不存在","B":"存在很小的","C":"存在很大的","D":"不能确定"},"answer":"A","explanation":"系统正常运行三相对称，三相电流之和为零，不存在零序分量。故选“不存在”。","bank":"电气基础"},{"id":"5df71ed62e59","type":"single","category":"电气基础","stem":"功率方向继电器的潜动是指（）","options":{"A":"只给继电器加入电流或电压时，继电器不动作","B":"只给继电器加入电流或电压时，继电器就动作","C":"加入继电器的电流与电压反相时，继电器动作","D":"与加入继电器的电流电压无关"},"answer":"B","explanation":"功率方向继电器潜动：仅加入电流或仅加入电压（无正常功率方向条件）时继电器就误动作的现象。选B。","bank":"电气基础"},{"id":"07bc3cb8b0d8","type":"single","category":"电气基础","stem":"电力系统的运行方式有（）等几种","options":{"A":"正常运行和故障运行方式","B":"最大运行和最小运行方式","C":"正常运行和特殊运行方式","D":"最大运行，最小运行及正常运行"},"answer":"D","explanation":"电力系统运行方式通常分为最大运行方式、最小运行方式和正常运行方式。选D。","bank":"电气基础"},{"id":"14997f72553d","type":"single","category":"电气基础","stem":"只有发生（）零序电流才可能出现","options":{"A":"相间故障","B":"不对称故障时","C":"接地故障","D":"短路故障"},"answer":"C","explanation":"零序电流只在中性点接地系统发生接地故障（有零序通路）时才出现；相间短路无零序。故选“接地故障”。","bank":"电气基础"},{"id":"c2fce090b964","type":"single","category":"电气基础","stem":"（）的作用是将系统的高电压转变为低电压","options":{"A":"高压断路器","B":"隔离开关","C":"电压互感器","D":"电流互感器"},"answer":"C","explanation":"电压互感器（TV/PT）把系统高电压按比例变换为低电压，供测量和保护使用。选“电压互感器”。","bank":"电气基础"},{"id":"80c96069c4c2","type":"single","category":"电气基础","stem":"电力系统在运行中发生各种类型短路故障，将伴随着很大的短路电流和（）","options":{"A":"电压降低","B":"电压升高","C":"电压为零","D":"电压不变"},"answer":"A","explanation":"短路时故障点附近电压大幅下降，并伴随很大的短路电流。选“电压降低”。","bank":"电气基础"},{"id":"028182efb1bc","type":"single","category":"电气基础","stem":"线路非全相运行时，负序功率方向元件（）","options":{"A":"一定误动","B":"视TV位置而定","C":"一定不动作","D":"动作特性不确定"},"answer":"B","explanation":"线路非全相运行时负序功率方向元件的动作情况取决于电压互感器（TV）的安装位置（母线侧或线路侧），故“视TV位置而定”。选B。","bank":"电气基础"},{"id":"450ecae52e16","type":"single","category":"电气基础","stem":"发生不对称短路时（）","options":{"A":"正序电压和负序电压越靠近故障点数值越小，零序电压是越靠近故障点数值越大","B":"正序电压越靠近故障点数值越小，负序电压和零序电压是越靠近故障点数值越大","C":"零序电压越靠近故障点数值越小，正序电压和负序电压是越靠近故障点数值越大"},"answer":"B","explanation":"不对称短路时：正序电压越靠近故障点越小；负序、零序电压越靠近故障点越大（故障点处负序、零序电压最高）。选B。","bank":"电气基础"},{"id":"7b38fb9a8a8c","type":"single","category":"电气基础","stem":"控制电缆应选用（）电缆，尽量减少电缆根数","options":{"A":"单芯","B":"多芯","C":"绝缘","D":"屏蔽"},"answer":"B","explanation":"控制电缆为减少电缆根数、便于敷设，一般选用多芯电缆。选“多芯”。","bank":"电气基础"},{"id":"624154bb7103","type":"single","category":"电气基础","stem":"若电源为直流220V,而中间继电器额定电压为110V,串联电阻的一端应接于（）","options":{"A":"正电源","B":"负电源","C":"不能直接接于正负电源端"},"answer":"B","explanation":"直流 220V 电源接 110V 中间继电器需串联分压电阻，电阻一端应接负电源侧，这样即使继电器线圈另一端偶然接地，也不会造成 220V 电源经线圈直接接地短路。选“负电源”。","bank":"电气基础"},{"id":"adf8c2329937","type":"single","category":"电气基础","stem":"突变量可以反映()状况","options":{"A":"短路","B":"过负荷","C":"振荡","D":"以上都是"},"answer":"A","explanation":"突变量（故障分量）主要反映短路故障引起的电气量突变，对过负荷、振荡不敏感。选“短路”。","bank":"电气基础"},{"id":"040c4c714f2a","type":"single","category":"电气基础","stem":"综自系统中，如果某线路的测控单元故障，则下列哪种情况是正确的（）","options":{"A":"后台不能接收到保护动作信号","B":"保护动作后开关不能跳闸","C":"保护动作后开关能正确跳闸"},"answer":"C","explanation":"综合自动化中测控单元负责测量、控制、通信；保护跳闸由保护装置独立出口，测控单元故障不影响保护动作跳闸。故选“保护动作后开关能正确跳闸”。","bank":"电气基础"},{"id":"047fc550d13b","type":"single","category":"电气基础","stem":"变压器过激磁与系统频率的关系是（）","options":{"A":"与系统频率成反比","B":"与系统频率无关","C":"与系统频率成正比"},"answer":"A","explanation":"变压器过励磁倍数 ∝ U/f，系统频率降低时过励磁增大，故过励磁与系统频率成反比。选“与系统频率成反比”。","bank":"电气基础"},{"id":"66341acae83d","type":"single","category":"电气基础","stem":"线路发生短路故障，通常情况下故障线路中的电流含有非周期分量，相应的故障线路的母线电压也含有非周期分量，下列正确的是（）","options":{"A":"电流和电压中非周期分量的含量两者相当","B":"电流中非周期分量含量要比电压中非周期分量含量大","C":"电压中非周期分量含量比电流中非周期分量大"},"answer":"B","explanation":"短路故障电流含显著非周期分量（衰减直流分量），而母线电压由系统电势决定，其非周期分量含量相对很小，故电流中非周期分量含量比电压中更大。选B。","bank":"电气基础"},{"id":"cabcc208bd0f","type":"single","category":"电气基础","stem":"有一空载运行线路，首端电压和末端电压分别为U1和U2，下面正确的是（）","options":{"A":"U1>U2","B":"U1=U2","C":"U1\u003cU2","D":"不确定"},"answer":"C","explanation":"空载线路由于线路电容的充电（费兰梯效应），末端电压高于首端，即 U1 \u003c U2。选C。","bank":"电气基础"},{"id":"138846e1b728","type":"single","category":"电气基础","stem":"零序不平衡电流主要是（）谐波分量","options":{"A":"2次","B":"3次","C":"5次","D":"7次"},"answer":"B","explanation":"三相不平衡电流主要含 3 次及其整数倍谐波，3 次谐波为零序性谐波，是零序不平衡电流的主要成分。选“3次”。","bank":"电气基础"},{"id":"23aa4d4ffc35","type":"single","category":"电气基础","stem":"突变量包括（）","options":{"A":"工频分量和暂态分量","B":"正序、负序和零序分量","C":"工频正序分量和暂态正序分量","D":"工频正序分量和工频负序分量和工频零序分量"},"answer":"A","explanation":"突变量（故障分量）包括工频故障分量与暂态分量两部分。选“工频分量和暂态分量”。","bank":"电气基础"},{"id":"820b3d770c1d","type":"single","category":"电气基础","stem":"距离继电器必须避开（）电流和（）电流，并要求对线路末端的短路有足够的灵敏度","options":{"A":"负荷、稳态","B":"故障、不对称","C":"故障、充电","D":"负荷、充电"},"answer":"D","explanation":"距离继电器应避开工况下的负荷电流和线路充电（电容）电流，并对末端短路有足够灵敏度。选“负荷、充电”。","bank":"电气基础"},{"id":"d597eec37c98","type":"single","category":"电气基础","stem":"线路非全相运行时，负序电流的大小与负荷电流的大小关系为（）","options":{"A":"成正比","B":"成反比","C":"不确定"},"answer":"A","explanation":"非全相运行相当于断相，其负序电流大小与流过线路的负荷电流成正比。选“成正比”。","bank":"电气基础"},{"id":"62341034ccbb","type":"single","category":"电气基础","stem":"输电线路BC两相金属性短路时，短路电流IBC（）","options":{"A":"滞后于C相电压一线路阻抗角","B":"滞后于B相电压一线路阻抗角","C":"滞后于BC相间电压一线路阻抗角"},"answer":"C","explanation":"BC 两相金属性短路时，故障相短路电流 IBC 滞后于故障相间电压 UBC 一个线路阻抗角（按短路阻抗呈感性）。选C。","bank":"电气基础"},{"id":"703ed016647f","type":"single","category":"电气基础","stem":"若取相电压基准值为额定相电压，则功率标么值等于（）","options":{"A":"电压标么值","B":"电流标么值","C":"电流标么值的3倍","D":"电流标么值的倒数"},"answer":"B","explanation":"取相电压基准值为额定相电压，则电压标幺值 U*=1。三相功率标幺值 S* = 3UφIφ/SB，而电流基准 IB = SB/(3UφB)，于是 S* = I/IB = I*，即功率标幺值等于电流标幺值。选B。","bank":"电气基础"},{"id":"558edbad3738","type":"single","category":"电气基础","stem":"电抗互感器的作用是什么（）","options":{"A":"一次电流转换成二次电压","B":"一次电流转换成二次电流","C":"一次电压转换成二次电压","D":"一次模拟量转换成二次数字量"},"answer":"A","explanation":"电抗互感器（DK）一次侧通入电流，二次侧输出与之成正比的电压（呈感性、带相位偏移），作用是将一次电流转换成二次电压。选A。","bank":"电气基础"},{"id":"7d9fd0c2dd06","type":"single","category":"电气基础","stem":"电力系统新技术特高压输电是指（）以上电压等级","options":{"A":"500kV","B":"750kV","C":"1000kV","D":"220kV"},"answer":"C","explanation":"特高压输电指交流 1000kV 及以上、直流 ±800kV 及以上的电压等级。故选“1000kV”。","bank":"电气基础"},{"id":"ca1607fd0c8f","type":"single","category":"电气基础","stem":"根据在电力系统中的作用，电力网又分为输电网和（）。","options":{"A":"高压网","B":"低压网","C":"配电网","D":"智能电网"},"answer":"C","explanation":"按在系统中的作用，电力网分为输电网（送电）和配电网（分配电能到用户）。选“配电网”。","bank":"电气基础"},{"id":"bfce1aad6b8b","type":"single","category":"电气基础","stem":"电力系统“动态稳定”是指（）","options":{"A":"系统受到小扰动后的稳定性","B":"系统受到大扰动后的稳定性","C":"系统频率稳定","D":"系统电压稳定"},"answer":"B","explanation":"动态稳定指电力系统受到大扰动后，在自动调节和控制装置作用下保持长时间稳定运行的能力（对应大扰动稳定性）。选B。","bank":"电气基础"},{"id":"29dbd34596f2","type":"single","category":"电气基础","stem":"变压器励磁涌流的特点是（）","options":{"A":"含有大量非周期分量和二次谐波","B":"仅含周期分量","C":"仅含三次谐波","D":"与负荷电流波形一致"},"answer":"A","explanation":"励磁涌流含有大量非周期分量（偏磁）和明显的 2 次谐波，可借此与短路电流区分。选A。","bank":"电气基础"},{"id":"764430943733","type":"single","category":"电气基础","stem":"电力系统短路电流计算中，假设电源为“无限大功率电源”的条件是（）","options":{"A":"电源阻抗远小于短路回路阻抗","B":"电源阻抗远大于短路回路阻抗","C":"电源电压恒定","D":"电源频率恒定"},"answer":"A","explanation":"假设“无限大功率电源”的条件是电源内阻抗远小于短路回路总阻抗（A），这样短路时电源端电压和频率基本保持不变。B将阻抗关系说反；C、D是无限大电源的表现（电压、频率恒定），而非判定条件。","bank":"电气基础"},{"id":"3b85b64af291","type":"single","category":"电气基础","stem":"电力系统中，“电磁环网”是指（）","options":{"A":"不同电压等级通过变压器电磁耦合的环路","B":"同电压等级的环形电网","C":"高压直流输电与交流电网的混合环网","D":"以上都不对"},"answer":"A","explanation":"电磁环网是指不同电压等级的线路通过变压器电磁耦合形成的电磁环路（A）。同电压等级的环形电网只是普通环网（B）；交直流混合（C）不符合该定义。","bank":"电气基础"},{"id":"fc080062cf39","type":"single","category":"电气基础","stem":"综合应用与概念辨析下列故障中，会出现零序电流的是（）","options":{"A":"三相短路","B":"两相短路","C":"单相接地短路","D":"以上都有"},"answer":"C","explanation":"只有不对称接地故障才会出现零序电流。单相接地短路（C）会产生零序分量；三相短路、两相短路均为对称或金属性不对称但不接地，无零序电流，故A、B、D均错。","bank":"电气基础"},{"id":"7f64f6e7f85f","type":"single","category":"电气基础","stem":"消弧线圈的作用是（）","options":{"A":"补偿接地电容电流","B":"限制短路电流","C":"提高系统电压","D":"抑制谐波"},"answer":"A","explanation":"消弧线圈装于中性点，提供电感电流补偿电网单相接地时的电容电流，使接地电弧自行熄灭（A）。它不用于限制短路电流（B）、提高电压（C）或抑制谐波（D）。","bank":"电气基础"},{"id":"f2720fe4a4bb","type":"single","category":"电气基础","stem":"调度自动化系统的基本功能不包括（）","options":{"A":"数据采集与监控","B":"故障录波","C":"负荷预测","D":"经济调度"},"answer":"B","explanation":"调度自动化（SCADA/EMS）基本功能含数据采集与监控、负荷预测、经济调度等；故障录波由独立的故障录波装置完成，不属于调度自动化基本功能，故选B。","bank":"电气基础"},{"id":"5969cb853a3a","type":"single","category":"电气基础","stem":"标幺值计算中，基准值的选择原则是（）","options":{"A":"任意选择","B":"电压、功率基准值独立选择","C":"电流基准值由电压和功率基准值确定","D":"以上都是"},"answer":"D","explanation":"标幺值计算中选基准值：电压、功率基准值可任意选取且相互独立（A、B正确），电流、阻抗基准值由电压和功率基准值导出（如Ib=Sb/(√3Ub)、Zb=Ub²/Sb，C正确），故选D。","bank":"电气基础"},{"id":"cdce66581f31","type":"single","category":"电气基础","stem":"某三相电路中，线电压为380V，线电流为10A，功率因数为0.8，则有功功率为（）","options":{"A":"3.8kW","B":"5.3kW","C":"5.7kW","D":"6.5kW"},"answer":"C","explanation":"三相有功功率 P=√3·U线·I线·cosφ=√3×380×10×0.8≈5.27kW，约为5.3kW。按题面答案选C（5.7kW）。（注：按标准公式计算结果约为5.3kW，对应选项B，题面所给答案C恐有误。）","bank":"电气基础"},{"id":"b12bde7ed10c","type":"single","category":"电气基础","stem":"下列设备中，用于限制工频过电压的是（）","options":{"A":"并联电抗器","B":"串联电容器","C":"并联电容器","D":"消弧线圈"},"answer":"A","explanation":"空载长线路因对地电容的容升效应会引起工频过电压，并联电抗器可吸收容性无功、限制此种工频过电压（A）。串联电容用于提高输送能力（B），并联电容用于补偿无功（C），消弧线圈用于补偿接地电容电流（D）。","bank":"电气基础"},{"id":"e48d8a1b5373","type":"single","category":"电气基础","stem":"电力系统振荡时，电压最低点称为（）","options":{"A":"振荡中心","B":"电压中心","C":"功率中心","D":"电流中心"},"answer":"A","explanation":"系统振荡时两侧电势夹角摆开，电压最低、相角变化最剧烈的点称为振荡中心（A），通常位于系统纵向等值阻抗的中点。","bank":"电气基础"},{"id":"a576eeaf8e9a","type":"single","category":"电气基础","stem":"提高电力系统暂态稳定的措施不包括（）","options":{"A":"快速切除故障","B":"采用自动重合闸","C":"增加系统阻抗","D":"发电机快速强行励磁"},"answer":"C","explanation":"提高暂态稳定的措施有快速切除故障、自动重合闸、发电机强行励磁等；增加系统阻抗会减小输送功率、降低稳定性，故不属于提高措施，选C。","bank":"电气基础"},{"id":"2955b90f1a70","type":"single","category":"电气基础","stem":"电力系统稳定与运行电力系统静态稳定是指（）","options":{"A":"系统受到小扰动后恢复到原状态的能力","B":"系统受到大扰动后保持同步的能力","C":"系统短路故障后的恢复能力","D":"系统频率稳定的能力"},"answer":"A","explanation":"静态稳定指系统遭受小扰动（如负荷微小波动）后自动恢复到原运行状态的能力（A）。大扰动后保持同步属暂态稳定（B）；短路后恢复属暂态/恢复问题。","bank":"电气基础"},{"id":"afea441cc14b","type":"single","category":"电气基础","stem":"对称分量法中，α运算子表示（）","options":{"A":"逆时针旋转120°的相量","B":"顺时针旋转120°的相量","C":"逆时针旋转90°的相量","D":"顺时针旋转90°的相量"},"answer":"A","explanation":"对称分量法中运算子 α=e^(j120°)，表示将某相量逆时针旋转120°（A）。α²为逆时针转240°（即顺时针120°）。","bank":"电气基础"},{"id":"ff88111ac7ae","type":"single","category":"电气基础","stem":"短路故障分析下列短路故障中，属于对称故障的是（）","options":{"A":"三相短路","B":"两相短路","C":"单相接地短路","D":"两相接地短路"},"answer":"A","explanation":"三相短路时三相仍保持对称，属对称故障（A）；两相短路、单相接地、两相接地均为不对称故障（B、C、D）。","bank":"电气基础"},{"id":"3034f2a67925","type":"single","category":"电气基础","stem":"电力系统无功功率不足会导致（）","options":{"A":"系统频率升高","B":"系统频率降低","C":"系统电压升高","D":"系统电压降低"},"answer":"D","explanation":"无功功率用于建立磁场、维持电压。无功不足时系统电压支撑不够，导致电压降低（D）；频率由有功平衡决定，与无功无直接关系（A、B错）。","bank":"电气基础"},{"id":"b922fba0e0e2","type":"single","category":"电气基础","stem":"电力系统的电能质量指标不包括（）","options":{"A":"电压偏差","B":"频率偏差","C":"谐波含量","D":"线路长度"},"answer":"D","explanation":"电能质量指标包括电压偏差、频率偏差、谐波（波形畸变）等；线路长度是网络结构参数，不属于电能质量指标，选D。","bank":"电气基础"},{"id":"c0b70f40e4d8","type":"single","category":"电气基础","stem":"采用全双工通信方式，数据传输的方向性结构为（）。","options":{"A":"可以在两个方向上同时传输","B":"只能在一个方向上传输","C":"可以在两个方向上传输，但不能同时进行","D":"都不对"},"answer":"A","explanation":"全双工通信允许在两个方向上同时传输数据（A）；单工只能单向（B），半双工可双向但不可同时进行（C）。","bank":"电气基础"},{"id":"3e01dd71ad1c","type":"single","category":"电气基础","stem":"电压和电流的关联参考方向是指（）","options":{"A":"电压、电流的实际方向一致","B":"电压、电流参考方向一致","C":"电压、电流的实际方向不一致"},"answer":"B","explanation":"关联参考方向是指为分析方便而设定的电压、电流参考方向一致（电流从电压“+”端流入），选项B正确；实际方向未必一致（实际功率可能为负）。","bank":"电气基础"},{"id":"81134285dd30","type":"single","category":"电气基础","stem":"电容具有隔直通交的作用，在直流情况下，电容相当于（）","options":{"A":"电阻","B":"短路","C":"开路"},"answer":"C","explanation":"电容对直流呈开路（隔直）：稳态直流下电容充电完毕、电流为零，相当于开路（C）；对交流则可导通。","bank":"电气基础"},{"id":"e4d84a8c3444","type":"single","category":"电气基础","stem":"纯电感电路的电压与电流频率相同，电流的相位滞后于外加电压u为（）度。","options":{"A":"60","B":"30","C":"90","D":"180"},"answer":"C","explanation":"纯电感电路中电压超前电流90°，即电流滞后于外加电压90°（C）。","bank":"电气基础"},{"id":"cd5e62243861","type":"single","category":"电气基础","stem":"正弦交流电的幅值就是（）。","options":{"A":"正弦交流电最大值的2倍","B":"正弦交流电最大值","C":"正弦交流电波形正负振幅之和","D":"正弦交流电最大值的√2倍"},"answer":"B","explanation":"正弦交流电的幅值即其最大值（峰值），选项B正确；有效值为最大值的1/√2倍（D错）。","bank":"电气基础"},{"id":"97f939519c29","type":"single","category":"电气基础","stem":"三相交流电在某一确定的时间内，到达最大值(或零位)的先后顺序叫（）。","options":{"A":"次序","B":"顺序","C":"反序","D":"相序"},"answer":"D","explanation":"三相交流电各相达到最大值或零位的先后顺序称为相序（D），如A—B—C为正序。","bank":"电气基础"},{"id":"35000c389d3d","type":"single","category":"电气基础","stem":"三相对称负载的功率P=√3UIcosφ，其中φ角是（）的相位角。","options":{"A":"线电压与线电流之间","B":"相电压与对应相电流之间","C":"线电压与相电流之间","D":"相电压与线电流之间"},"answer":"B","explanation":"公式P=√3UIcosφ中的φ是每相负载的功率因数角，即相电压与对应相电流之间的相位差（B），而非线电压与线电流之间的夹角。","bank":"电气基础"},{"id":"8ed41b6347bf","type":"single","category":"电气基础","stem":"对称的三相电源星形连接时，相电压是线电压的（）倍。","options":{"A":"1","B":"2","C":"1/√3","D":"√3"},"answer":"C","explanation":"星形（Y）连接时线电压=√3×相电压，故相电压=线电压×(1/√3)，选C。","bank":"电气基础"},{"id":"84736ad5e31a","type":"single","category":"电气基础","stem":"为解决系统无功电源容量不足、提高功率因数、改善电压质量、降低线损，可采用（）。","options":{"A":"并联电容","B":"串联电容","C":"串联电容和并联电抗","D":"并联电抗"},"answer":"A","explanation":"系统无功不足、功率因数低时，采用并联电容器补偿无功，可提高功率因数、改善电压、降低线损（A）。串联电容用于串补提稳（B），并联电抗用于限压（D）。","bank":"电气基础"},{"id":"d8ebd58e9546","type":"single","category":"电气基础","stem":"一个两输入端的门电路，当输入为1和0时，输出不是1的门是（）。","options":{"A":"与非门","B":"或","C":"或非门","D":"异或门"},"answer":"C","explanation":"输入为1、0时：与非门输出1，或门输出1，异或门输出1，而或非门输出0（非1），故选C。","bank":"电气基础"},{"id":"16c01cba5452","type":"single","category":"电气基础","stem":"整流电路的输出电压是指一个周期内的输出电压的（）。","options":{"A":"有效值","B":"平均值","C":"最小值","D":"最大值"},"answer":"B","explanation":"整流电路输出为脉动直流，其“输出电压”通常指一个周期内的平均值（直流分量），选B。","bank":"电气基础"},{"id":"a19ba6f93ab9","type":"single","category":"电气基础","stem":"欧姆定律阐述的是（）。","options":{"A":"导体电阻与导体长度、截面及导体电阻率的关系","B":"电流与电压的正比关系","C":"电流与电压的反比关系","D":"电阻、电流和电压三者之间关系"},"answer":"D","explanation":"欧姆定律I=U/R阐述导体中电流、电压与电阻三者间的关系（D）；A是电阻定律，B、C只片面描述。","bank":"电气基础"},{"id":"4b802b27c66f","type":"single","category":"电气基础","stem":"一个电池的电动势为E、内阻为r，外接负载为两个并联电阻，阻值各为R，当负载上消耗的功率最大时，R＝（）。","options":{"A":"0","B":"r／2","C":"r","D":"2r"},"answer":"D","explanation":"两相同阻值R并联等效为R/2。按最大功率传输定理，当等效负载R/2等于电源内阻r时负载获得最大功率，故R=2r，选D。","bank":"电气基础"},{"id":"9bcc96c77c55","type":"single","category":"电气基础","stem":"周期与频率的关系是（）。","options":{"A":"成正比","B":"成反比","C":"无关","D":"非线性"},"answer":"B","explanation":"周期
