    a = ii(a, b, c, d, w[0], 6, -198630844); d = ii(d, a, b, c, w[7], 10, 1126891415);
    c = ii(c, d, a, b, w[14], 15, -1416354905); b = ii(b, c, d, a, w[5], 21, -57434055);
    a = ii(a, b, c, d, w[12], 6, 1700485571); d = ii(d, a, b, c, w[3], 10, -1894986606);
    c = ii(c, d, a, b, w[10], 15, -1051523); b = ii(b, c, d, a, w[1], 21, -2054922799);
    a = ii(a, b, c, d, w[8], 6, 1873313359); d = ii(d, a, b, c, w[15], 10, -30611744);
    c = ii(c, d, a, b, w[6], 15, -1560198380); b = ii(b, c, d, a, w[13], 21, 1309151649);
    a = ii(a, b, c, d, w[4], 6, -145523070); d = ii(d, a, b, c, w[11], 10, -1120210379);
    c = ii(c, d, a, b, w[2], 15, 718787259); b = ii(b, c, d, a, w[9], 21, -343485551);
    a = (a + oa) | 0; b = (b + ob) | 0; c = (c + oc) | 0; d = (d + od) | 0;
  }
  const hex = n => {
    let s = '';
    for (let i = 0; i < 4; i++) s += ((n >> (i * 8 + 4)) & 15).toString(16) + ((n >> (i * 8)) & 15).toString(16);
    return s;
  };
  return hex(a) + hex(b) + hex(c) + hex(d);
}

function qid(q) {
  return md5_12((q.stem || '') + '|' + JSON.stringify(q.answer)).slice(0, 12);
}

function finalize(cur) {
  const stem = cur.stemLines.filter(Boolean).join(' ').trim();
  if (!stem) return null;
  let options = cur.options, ans = (cur.answer || '').trim(), answer = null, qtype = 'fill';
  const vals = Object.values(options).map(v => v.trim());
  const isJudge = vals.length > 0 && vals.every(v => ['对', '错', '正确', '错误'].includes(v));
  if (isJudge) {
    qtype = 'judge';
    const m = ans.match(/[A-Ha-h]/);
    if (m) {
      const L = m[0].toUpperCase();
      answer = (options[L] || '').trim() === '对' || (options[L] || '').trim() === '正确' ? '对' : '错';
    } else if (JUDGE_OK.includes(ans)) answer = '对';
    else if (JUDGE_NO.includes(ans)) answer = '错';
  } else if (vals.length) {
    const letters = (ans.match(/[A-Ha-h]/g) || []).map(x => x.toUpperCase());
    if (letters.length > 1) { qtype = 'multiple'; answer = letters; }
    else if (letters.length === 1) { qtype = 'single'; answer = letters[0]; }
    else { qtype = 'single'; answer = ans; }
  } else {
    if (JUDGE_OK.includes(ans)) { qtype = 'judge'; answer = '对'; options = { A: '对', B: '错' }; }
    else if (JUDGE_NO.includes(ans)) { qtype = 'judge'; answer = '错'; options = { A: '对', B: '错' }; }
    else { qtype = 'fill'; answer = ans; }
  }
  if (answer == null || answer === '' || (Array.isArray(answer) && !answer.length)) return null;
  const q = {
    type: qtype,
    category: cur.category || '未分类',
    stem,
    options: Object.keys(options).length ? options : {},
    answer,
    explanation: (cur.explanation || '').trim()
  };
  q.id = qid(q);
  return q;
}

function parseText(text) {
  const lines = String(text).replace(/\r/g, '').split('\n');
  const out = [];
  let cur = { stemLines: [], options: {}, answer: null, explanation: '', category: null, started: false };
  const newQ = cat => ({ stemLines: [], options: {}, answer: null, explanation: '', category: cat, started: false });
  const flush = () => {
    if (cur.stemLines.length || Object.keys(cur.options).length || cur.answer) {
      const q = finalize(cur);
      if (q) out.push(q);
    }
    cur = newQ(cur.category);
  };
  for (const raw of lines) {
    const s = raw.trim();
    if (!s) { if (cur.answer || Object.keys(cur.options).length) flush(); continue; }
    let m;
    if ((m = s.match(RE.cat)) && !cur.started) { cur.category = m[1].trim(); continue; }
    if ((m = s.match(RE.ans)) && cur.started) { cur.answer = m[1].trim(); continue; }
    if ((m = s.match(RE.exp)) && cur.started) { cur.explanation += m[1].trim() + ' '; continue; }
    if ((m = s.match(RE.opt))) {
      cur.started = true;
      cur.options[m[1].toUpperCase()] = m[2].trim();
      continue;
    }
    if ((m = s.match(RE.num)) && cur.started) {
      flush();
      cur.stemLines.push(m[1].trim()); cur.started = true; continue;
    }
    if (!Object.keys(cur.options).length && cur.answer === null) {
      cur.stemLines.push(s); cur.started = true;
    } else {
      cur.explanation += s + ' ';
    }
  }
  flush();
  // 补题库名（与文件名一致由调用方处理）
  return out;
}

/* 读文件 → 题目数组 */
async function parseFile(file) {
  const text = await file.text();
  const name = file.name.replace(/\.[^.]+$/, '').trim();
  if (/\.json$/i.test(file.name)) {
    let data;
    try { data = JSON.parse(text); } catch (e) { throw new Error('JSON 格式不对'); }
    let arr = [];
    if (Array.isArray(data)) arr = data;
    else if (data && Array.isArray(data.questions)) arr = data.questions;
    else throw new Error('这个 JSON 里没有题目数组');
    const norm = [];
    for (const q of arr) {
      if (!q || typeof q !== 'object' || !q.stem || q.answer == null) continue;
      norm.push({
        type: q.type || 'single',
        category: q.category || name || '未分类',
        stem: String(q.stem),
        options: q.options || {},
        answer: q.answer,
        explanation: q.explanation || '',
        id: q.id || qid({ stem: q.stem, answer: q.answer }),
        bank: q.bank || name || DEFAULT_BANK
      });
    }
    return norm;
  }
  const qs = parseText(text).map(q => ({ ...q, bank: name || DEFAULT_BANK }));
  if (qs.length) qs.forEach(q => { if (!q.category || q.category === '未分类') q.category = q.bank; });
  return qs;
}

/* ================= 判分 ================= */
const answerText = q => {
  const a = q.answer;
  if (Array.isArray(a)) return a.join('、');
  if (q.type === 'judge' || q.type === 'fill') return String(a);
  return `${a}. ${(q.options || {})[a] || ''}`;
};
const normTxt = s => String(s == null ? '' : s).replace(/\s+/g, '').replace(/[，。、；：,.;:]/g, '').toLowerCase();

// 长答案的「填空题」其实是简答题（题库里 297 道全是十几字到几百字的答案），
// 逐字比对永远判错，所以超过 12 个字改成「自己对照参考答案评」。
const LONG_ANSWER = 12;
function isLongFill(q) {
  return !!q && q.type === 'fill' && normTxt(q.answer).length > LONG_ANSWER;
}
// 这一题判对没：自评过的用自评结果，其余按答案比对
function judgedOk(s, i) {
  if (s && s.result && s.result[i] != null) return !!s.result[i];
  return isCorrect(s.list[i], s.ans[i]);
}

function isCorrect(q, user) {
  if (user == null) return false;
  if (q.type === 'multiple') {
    const a = [...q.answer].sort().join(''), b = [...(user || [])].sort().join('');
    return a === b && b.length > 0;
  }
  if (q.type === 'fill') return normTxt(user) === normTxt(q.answer);
  // 判断题：题库答案存的是「对/错」，而点击拿到的是选项号 A/B，
  // 必须先把 A 映射成「对」再比，否则判断题无论选哪个都判错。
  let u = user;
  if (q.type === 'judge' && typeof u === 'string' && u.length === 1
      && q.options && Object.prototype.hasOwnProperty.call(q.options, u)) {
    u = q.options[u];
  }
  return String(u) === String(q.answer);
}

// 选项号 k 是不是正确答案。判断题题库里存的是「对/错」而选项号是 A/B，
// 必须拿选项文字去比，否则解析里永远标不亮正确选项。
function keyIsRight(q, k) {
  if (q.type === 'judge' && q.options && Object.prototype.hasOwnProperty.call(q.options, k)) {
    return String(q.options[k]) === String(q.answer);
  }
  if (Array.isArray(q.answer)) return q.answer.includes(k);
  return String(q.answer) === k;
}

/* ================= 今日进度 / 连续天数（首页、统计页、桌面小组件共用） ================= */
function todayDone() {
  const t = S.stats.daily[today()];
  return t ? (t.p || 0) : 0;
}
function goalLeft() {
  return Math.max(0, (S.goal || GOALS[1]) - todayDone());
}

/* ================= 记忆曲线复习（错题按 1/3/7/15 天滚） =================
   答错 → 档位归零，明天再来；答对 → 升一档，隔 1/3/7/15 天后再考一次；
   连着答对 4 次就算记住了，自动移出错题本（想留着可以收藏）。 */
const SRS_GAP = [1, 3, 7, 15];
const SRS_MASTER = 4;
function dPlus(n) { const d = new Date(); d.setDate(d.getDate() + n); return dkey(d); }
function dayGap(a, b) {      // b 比 a 晚几天（两个都传 'YYYY-MM-DD'）
  return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
}
function srsWrong(id) {
  const w = S.wrong[id] || { count: 0, ts: 0 };
  S.wrong[id] = { count: (w.count || 0) + 1, ts: Date.now(), lv: 0, due: dPlus(1) };
}
// 答对时调用；返回 true 表示这题已经「出本」
function srsRight(id) {
  const w = S.wrong[id];
  if (!w) return false;
  const lv = (w.lv || 0) + 1;
  if (lv >= SRS_MASTER) { delete S.wrong[id]; return true; }
  S.wrong[id] = {
    count: Math.max(0, (w.count || 0) - 1),
    ts: w.ts || Date.now(), lv, due: dPlus(SRS_GAP[lv - 1]),
  };
  return false;
}
// 到期没？老数据没有 due，当成今天就要复习
function isDue(w) { return !w || !w.due || w.due <= today(); }
function dueCount() {
  const ids = new Set(S.bank.map(q => q.id));   // 题库里已经删掉的旧错题不算
  return Object.keys(S.wrong).filter(id => ids.has(id) && isDue(S.wrong[id])).length;
}
function dueList() {
  const byId = new Map(S.bank.map(q => [q.id, q]));
  return Object.keys(S.wrong)
    .filter(id => isDue(S.wrong[id]) && byId.get(id))
    .sort((a, b) => ((S.wrong[b].count || 0) - (S.wrong[a].count || 0)))
    .map(id => byId.get(id));
}
function dueText(w) {
  if (!w || !w.due) return '待复习';
  const n = dayGap(today(), w.due);
  if (n <= 0) return '今天复习';
  return n === 1 ? '明天复习' : n + ' 天后复习';
}
/* 考试倒计时：设置里填了日期才有 */
function examDaysLeft() {
  if (!S.examDate || !/^\d{4}-\d{2}-\d{2}$/.test(S.examDate)) return null;
  return dayGap(today(), S.examDate);
}
// 剩余未做的题分到每天要多少，超过 10 就取整到 5，看着像人话
function examPlanPerDay() {
  const n = examDaysLeft();
  if (n == null || n < 0) return 0;
  const remain = S.bank.filter(q => !S.seen[q.id]).length;
  if (!remain) return 0;
  const raw = Math.ceil(remain / Math.max(1, n));
  return raw <= 10 ? raw : Math.ceil(raw / 5) * 5;
}
function examPlanDesc() {
  const n = examDaysLeft();
  if (n == null) return '';
  if (n < 0) return `已经考完 ${-n} 天，可以设下一个日期了`;
  const plan = examPlanPerDay();
  return n === 0 ? '就是今天，稳住节奏' : `还有 ${n} 天${plan ? ' · 每天约 ' + plan + ' 题' : ''}`;
}
function shuffleArr(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// 最后一次真正做题的日期：小组件靠它判断「连续学习」有没有断
function lastDayKey() {
  const ks = Object.keys(S.stats.daily).filter(k => (S.stats.daily[k] || {}).p > 0).sort();
  return ks.length ? ks[ks.length - 1] : '';
}
// 一份给外部（APK 桌面小组件）看的快照，不含任何题目内容
function statsSnapshot() {
  const total = S.stats.total || 0;
  return {
    goal: S.goal || GOALS[1], done: todayDone(), left: goalLeft(), streak: dayStreak(),
    date: today(), lastDay: lastDayKey(), total: total, seen: Object.keys(S.seen).length,
    wrong: Object.keys(S.wrong).length,
    due: dueCount(),
    exam: (S.examDate || ''),
    rate: total ? Math.round((S.stats.correct || 0) / total * 100) : 0,
  };
}
// 只在 APK 壳里有效（安卓桌面小组件）；网页版没有这个桥，静默跳过
function pushWidget() {
  try {
    if (window.AndroidSaver && AndroidSaver.stats) {
      AndroidSaver.stats(JSON.stringify(statsSnapshot()));
    }
  } catch (e) { /* 小组件更新失败不影响刷题 */ }
}
// 连续学习天数：今天还没练不算断，从昨天接着数
function dayStreak() {
  let n = 0;
  const d = new Date();
  const t0 = S.stats.daily[dkey(d)];
  if (!t0 || !t0.p) d.setDate(d.getDate() - 1);
  while (true) {
    const t = S.stats.daily[dkey(d)];
    if (t && t.p > 0) { n++; d.setDate(d.getDate() - 1); } else break;
  }
  return n;
}

/* ================= 续练：把没做完的一轮存下来 =================
   只存题号 + 进度 + 答案，题目本身还在题库里；重开 App 时按题号还原，
   题库里已经没有的题会自动跳过。 */
const SESSION_VER = 1;

function packSession() {
  const s = S.session;
  if (!s || !s.list || !s.list.length) return null;
  if (s.mode === 'recite') return null;   // 背题不存档，别把「看答案」当成做过题
  return {
    v: SESSION_VER, mode: s.mode, idx: s.idx,
    ans: s.ans || {}, revealed: s.revealed || {}, blank: s.blank || {},
    pending: s.pending || {}, result: s.result || {},
    endsAt: s.endsAt || 0, startedAt: s.startedAt || 0,
    ids: s.list.map(q => q.id),
    savedAt: Date.now(),
  };
}

function unpackSession(sv) {
  if (!sv || sv.v !== SESSION_VER || !Array.isArray(sv.ids) || !sv.ids.length) return null;
  if (sv.mode === 'recite') return null;
  const byId = new Map(S.bank.map(q => [q.id, q]));
  const list = sv.ids.map(id => byId.get(id)).filter(Boolean);
  if (!list.length) return null;
  return {
    list, idx: Math.min(sv.idx || 0, list.length - 1),
    ans: sv.ans || {}, revealed: sv.revealed || {}, blank: sv.blank || {},
    pending: sv.pending || {}, result: sv.result || {},
    mode: sv.mode === 'exam' ? 'exam' : 'practice',
    endsAt: sv.endsAt || 0, startedAt: sv.startedAt || 0,
    savedAt: sv.savedAt || 0,
  };
}

function dropResume() {
  S.resume = null;
  scheduleSave();
}

function resumeSession() {
  const s = unpackSession(S.resume);
  if (!s) {
    toast('上次那轮的题目已经不在了');
    dropResume(); renderPractice(); return;
  }
  // 考试是有时限的，超时那场不再恢复（否则一进来就自动交卷，很吓人）
  if (s.mode === 'exam' && s.endsAt && Date.now() > s.endsAt) {
    toast('上次的模拟考试已超时，那场没计成绩', 2200);
    dropResume(); renderPractice(); return;
  }
  S.session = s;
  S.resume = null;
  S.lastExam = null;
  S.examSetup = false;
  S.flash = null;
  document.body.classList.add('in-quiz');
  if (s.mode === 'exam') startExamTimer();
  renderPractice(true);
  toast('接着上次：第 ' + (s.idx + 1) + ' / ' + s.list.length + ' 题', 1800);
}

function agoText(ts) {
  if (!ts) return '';
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return '刚刚';
  if (m < 60) return m + ' 分钟前';
  const h = Math.round(m / 60);
  if (h < 24) return h + ' 小时前';
  return Math.round(h / 24) + ' 天前';
}

/* ================= 练习 ================= */
const RANGES = ['全部', '未做', '错题', '易错', '收藏'];

/* 题型专项：题库底层是 4 种类型，做题的人只关心 3 类——
   选择（单选+多选）、判断、简答/填空。分组放在这里，页面和统计都按它来。 */
const QTYPES = [
  { key: 'choice', name: '选择', icon: '◉', types: ['single', 'multiple'],
    desc: '单选 + 多选，选项里挑答案' },
  { key: 'judge', name: '判断', icon: '✓', types: ['judge'],
    desc: '判断对错，考的是概念边界' },
  { key: 'short', name: '简答', icon: '✎', types: ['fill'],
    desc: '填空与简答，答完自己判分' },
];
const QT_KEYS = QTYPES.map(t => t.key);
function qtypeOf(q) {
  const t = q && q.type;
  if (t === 'judge') return 'judge';
  if (t === 'fill') return 'short';
  return 'choice';
}
function qtGroup(name) {
  return QTYPES.find(t => t.name === name || t.key === name) || null;
}

/** 当前题型设定：'全部' 或 选择 / 判断 / 简答 */
function curType() {
  const v = S.meta.qtype || '全部';
  return qtGroup(v) ? v : '全部';
}

/** 题库 + 分类 + 范围（不含题型）——题型 chips 要在这个池子上数题 */
function basePool(rng) {
  let arr = S.bank;
  if (S.meta.bank && S.meta.bank !== '全部题库') arr = arr.filter(q => bankOf(q) === S.meta.bank);
  if (S.meta.cat && S.meta.cat !== '全部') arr = arr.filter(q => (q.category || '未分类') === S.meta.cat);
  const r = rng || S.meta.range || '全部';
  if (r === '错题') arr = arr.filter(q => S.wrong[q.id]);
  else if (r === '易错') arr = arr.filter(q => (S.wrong[q.id] || {}).count >= 2);
  else if (r === '收藏') arr = arr.filter(q => S.fav[q.id]);
  else if (r === '未做') arr = arr.filter(q => !S.seen[q.id]);
  return arr;
}

/** 按「范围 + 题型」取题：和电脑版的 全部/错题本/易错题(错≥2)/收藏夹/未做过 一致 */
function rangePool(rng) {
  const arr = basePool(rng);
  const ct = curType();
  if (ct === '全部') return arr;
  const g = qtGroup(ct);
  return arr.filter(q => g.types.includes(q.type));
}

/** 某个题型在「题库+分类+范围」里有多少题 */
function typeCount(name) {
  const arr = basePool(S.meta.range);
  if (name === '全部') return arr.length;
  const g = qtGroup(name);
  return g ? arr.filter(q => g.types.includes(q.type)).length : 0;
}

/** 题型专项面板的一格数据：题量 / 已做 / 错题 / 历史正确率
    正确率取 per_type（累计作答，不看当前题型筛选）；题量默认跟当前题库+分类，
    统计页要看全库就传 all=true */
function typeStat(name, all) {
  const g = qtGroup(name);
  const src = all ? S.bank : basePool('全部');
  const list = src.filter(q => g.types.includes(q.type));
  const done = list.filter(q => S.seen[q.id]).length;
  const wrong = list.filter(q => S.wrong[q.id]).length;
  const pt = (S.stats.per_type || {})[g.key] || { p: 0, c: 0 };
  return {
    key: g.key, name: g.name, icon: g.icon, desc: g.desc,
    total: list.length, done, wrong,
    answered: pt.p || 0,
    rate: pt.p ? Math.round((pt.c || 0) / pt.p * 100) : null,
  };
}

/** 打乱（就地） */
function shuffleIn(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/** 题型专项的开练顺序：没做过的 → 做错过的 → 其余。
    专项就是补短板，先保证有新题可刷，刷完了自然轮到错题；不按题库原序，免得每次都在前 50 题里打转。 */
function typePool(name, all) {
  const g = qtGroup(name);
  if (!g) return [];
  const src = all ? S.bank : basePool('全部');
  const all_ = src.filter(q => g.types.includes(q.type));
  const fresh = [], wrong = [], rest = [];
  all_.forEach(q => {
    if (!S.seen[q.id]) fresh.push(q);
    else if (S.wrong[q.id]) wrong.push(q);
    else rest.push(q);
  });
  return shuffleIn(fresh).concat(shuffleIn(wrong), shuffleIn(rest));
}

function filteredQuestions() {
  let arr = rangePool(S.meta.range);
  // 搜索覆盖题干 / 选项 / 答案 / 解析（和电脑版一致）
  const kw = (S.meta.kw || '').trim().toLowerCase();
  if (kw) {
    arr = arr.filter(q =>
      (q.stem || '').toLowerCase().includes(kw) ||
      Object.values(q.options || {}).some(v => String(v || '').toLowerCase().includes(kw)) ||
      answerText(q).toLowerCase().includes(kw) ||
      (q.explanation || '').toLowerCase().includes(kw));
  }
  return arr;
}

function rangeCount(r) { return rangePool(r).length; }

function startSession(list) {

  S.resume = null;
  S.flash = null;

/* 背题模式：不选答案，直接把答案和解析摊开看，适合考前过一遍。
   不记统计、不记错题、不算「已做」，纯看。 */
function startRecite(pool, num) {
  const p = pool || filteredQuestions();
  if (!p.length) return toast('这个范围没有题目');
  const list = num > 0 ? p.slice(0, Math.min(num, p.length)) : p.slice();
  S.session = { list, idx: 0, ans: {}, revealed: {}, blank: {}, mode: 'recite', startedAt: Date.now() };
  S.lastExam = null;
  S.lastRound = null;
  S.resume = null;
  S.flash = null;
  document.body.classList.add('in-quiz');
  renderPractice(true);
  toast('背题模式：直接看答案，不记成绩', 2000);
}

function endRecite() {
  const n = S.session ? S.session.list.length : 0;
  S.session = null;
  S.lastRound = null;

/* 做到一半退出：把这一轮存成「续练」，回首页还能接着做 */
function pauseSession() {
  const s = S.session;
  if (!s) return;
  const answered = Object.keys(s.revealed || {}).length;
  askConfirm(answered
    ? `退出这一轮？\n\n已经答的 ${answered} 题会存下来，下次在首页点「接着做」继续。`
    : '还没开始答，退出这一轮？', () => {
    if (s.mode !== 'recite') S.resume = packSession();
    S.session = null;
    closeSheet();
    document.body.classList.remove('in-quiz');
    scheduleSave();
    renderPractice();
    toast(s.mode === 'recite' ? '已退出背题' : '已退出，进度存好了', 1700);
  }, { title: s.mode === 'recite' ? '退出背题' : '退出本轮', ok: '退出', no: '继续练' });
}

/* v2.4：顶栏那个「退出」——练到一半随手能退，不用先点开答题卡 */
function quitTop() {
  const s = S.session;
  if (s) {
    if (s.mode === 'exam') {
      const left = s.list.length - s.list.filter((q, i) => s.ans[i] != null && s.ans[i] !== '').length;
      if (left > 0) {
        return askConfirm(`还有 ${left} 题没答，确定交卷？`, () => submitExam(false),
          { title: '交卷', ok: '交卷', no: '再答一会', danger: true });
      }
      submitExam(false);
      return;
    }
    pauseSession();
    return;
  }
  if (S.flash) {                       // 闪卡也能从这里退出，回到抽卡界面
    exitFlash();
  }
}

/* 退闪卡：回到抽卡界面（不弹确认，闪卡没有进度损失） */
function exitFlash() {
  if (!S.flash) return;
  S.flash = null;
  document.body.classList.remove('in-quiz');
  renderStudy();
  toast('已退出闪卡', 1500);
}

/* v2.7：安卓返回键 / 全面屏手势的「返回」全走这里。
   顺序：关弹层 → 退这一轮 → 回练习首页，都说没处理才退出 App。
   返回 true 表示这一下已经用掉了，Java 那边就不再杀进程。 */
function appBack() {
  try {
    if (askOpen()) { closeAsk(); return true; }                       // 确认框
    if ($('#noteSheet') && $('#noteSheet').classList.contains('on')) { closeNote(); return true; }
    if ($('#sheet') && $('#sheet').classList.contains('on')) { closeSheet(); return true; }   // 答题卡
    if ($('#setPage') && $('#setPage').classList.contains('on')) { closeSettings(); return true; }
    if (S.flash) { exitFlash(); return true; }                        // 闪卡这一轮
    if (S.session) { quitTop(); return true; }                        // 练习/背题/考试这一轮
    const on = document.querySelector('.view.on');
    if (on && on.id !== 'v-practice') { switchTab('practice'); return true; }   // 不在首页 → 回首页
    return false;                                                     // 交回去，让系统退出 App
  } catch (e) {
    return false;
  }
}
window.appBack = appBack;

/* 顶栏按钮跟着这一轮改名字：考试是「交卷」，练习/背题是「退出」 */
function syncQuitTop() {
  const b = $('#btnQuitTop');
  if (!b) return;
  const isExam = !!(S.session && S.session.mode === 'exam');
  b.textContent = isExam ? '交卷' : '退出';
  b.classList.toggle('warn', isExam);
  b.title = isExam ? '交卷，看这一场的成绩' : '退出这一轮（进度会保留）';
}

/* 备份是不是该提醒了：没备份过（且练过 20 题以上）或超过 14 天 */
function backupStale() {
  if (!S.lastBackup) return Object.keys(S.seen).length >= 20;
  return Date.now() - S.lastBackup > 14 * 86400000;
}
function backupStatusText() {
  if (!S.lastBackup) {
    return Object.keys(S.seen).length >= 20
      ? '还没备份过。错题、笔记、连续天数只在这台手机上，清缓存就没了'
      : '练到 20 题以后会提醒你导出；换手机、清缓存前也记得先备份';
  }
  return '备份里带题库、错题、笔记、设置；换手机时在下面「从备份恢复」选它';
}

/* 首页那条备份提醒：练过一阵但很久没备份，或者从来没备份过才出现 */
function backupTipHtml() {
  if (S.backupTipOff) return '';
  const done = Object.keys(S.seen).length;
  if (done < 20) return '';
  const days = S.lastBackup ? Math.floor((Date.now() - S.lastBackup) / 86400000) : -1;
  if (days >= 0 && days < 14) return '';
  const txt = days < 0
    ? `已经练了 <b>${done}</b> 题，但还没备份过。错题、笔记、连续天数都只在这台手机上，清缓存或换手机就没了。`
    : `上次备份是 <b>${days}</b> 天前。题库和练习记录只在这台手机上，建议再导出一份。`;
  return `<div class="tipbar">
    <div class="tx">${txt}</div>
    <button class="go" id="tipBackup">去备份</button>
    <button class="x" id="tipBackupOff" aria-label="不再提醒">✕</button>
  </div>`;
}

      ${backupTipHtml()}

        const rows = QTYPES.map(t => typeStat(t.name));

    $$('#practiceBox [data-range]').forEach(el => el.onclick = () => {

    $$('#practiceBox [data-qtype]').forEach(el => el.onclick = () => {

      if (v !== '全部' && !typeCount(v)) return toast('这个范围里没有' + v + '题');

    // 题型专项：自成一套口径——不受当前搜索和「错题/收藏」范围影响，

          ? `<button class="btn" id="btnSkip">看答案</button>
             <button class="btn primary" id="btnSubmit">提交答案</button>`
          : `<button class="btn primary" id="btnNext">${idx === total - 1 ? (isExam ? '交卷' : (isRecite ? '看完了' : '完成')) : '下一题'}</button>`}
    </div>`;

  // 交互
  syncQuitTop();                       // 顶栏那颗按钮：练习「退出」/ 考试「交卷」
  $$('.opt').forEach(el => el.onclick = () => {
    if (done) return;
    if (Date.now() - practiceSwipedAt < 400) return;   // 刚滑过，别把滑动当成选项点击
    const k = el.dataset.k;
    if (isExam) { pickExam(k, isMulti); return; }
    if (isMulti) {
      const cur = new Set(S.session.ans[idx] || []);
      cur.has(k) ? cur.delete(k) : cur.add(k);
      S.session.ans[idx] = [...cur].sort();
      renderPractice();
    } else {
      judgeNow(k);
    }
  });
  if (isFill && !done) {
    const inp = $('#fillInput');
    if (isExam) {
      // 考试模式边输入边记，不判分
      inp.oninput = () => { S.session.ans[idx] = inp.value.trim(); };
    } else {
      inp.onkeydown = e => { if (e.key === 'Enter') judgeNow(inp.value.trim()); };
    }
  }
  const bs = $('#btnSubmit');
  if (bs) bs.onclick = () => {
    if (isFill) judgeNow(($('#fillInput').value || '').trim());
    else judgeNow(S.session.ans[idx] || []);
  };
  $('#btnPrev').onclick = () => {
    if (idx > 0) { S.session.idx--; scheduleSave(); renderPractice(); }
  };
  const bnext = $('#btnNext');
  if (bnext) bnext.onclick = () => {
    if (isExam) {
      if (idx < total - 1) { S.session.idx++; scheduleSave(); renderPractice(); }
      else submitExam(false);
      return;
    }
    if (idx < total - 1) { S.session.idx++; scheduleSave(); renderPractice(); }
    else if (isRecite) endRecite();
    else finishSession();
  };
  const bskip = $('#btnSkip');
  if (bskip) bskip.onclick = () => {
    // v2.12：原来的「跳过」只是闷头翻页，名字和做的事对不上——
    // 改成「看答案」：摊开解析、记未作答进错题本，语义统一
    revealBlank();
  };
  // 简答题自评（解析里和底栏各一组按钮，点哪个都一样）
  ['#btnSelfOk', '#btnSelfOk2'].forEach(sel => {
    const b = $(sel); if (b) b.onclick = () => selfJudge(true);
  });
  ['#btnSelfNo', '#btnSelfNo2'].forEach(sel => {
    const b = $(sel); if (b) b.onclick = () => selfJudge(false);
  });
  $('#btnSheet').onclick = openSheet;
  const bh = $('#btnHand');
  if (bh) bh.onclick = () => {
    const left = total - S.session.list.filter((qq, i) => S.session.ans[i] != null && S.session.ans[i] !== '').length;
    if (left > 0) {
      return askConfirm(`还有 ${left} 题没答，确定交卷？`, () => submitExam(false),
        { title: '交卷', ok: '交卷', no: '再答一会', danger: true });
    }
    submitExam(false);
  };
  if (!isExam) $('#btnFav').onclick = toggleFav;
  const bnote = $('#btnNote');
  if (bnote) bnote.onclick = () => openNote(q.id);
  // 手动认领「这题我会了」：不用非得连对 4 次才出本
  const bm = $('#btnMastered');
  if (bm) bm.onclick = () => {
    if (!confirm('把这道题移出错题本？\n\n移出后不会再排复习，收藏和笔记都留着。')) return;
    delete S.wrong[q.id];
    scheduleSave(); renderPractice(); renderWrong(); renderStats();
    toast('已移出错题本，这题不用再复习了');
  };
  installPracticeSwipe();
  if (scrollTop) { const m = $('main'); if (m) m.scrollTop = 0; }
  if (isExam) syncTimer();
}

/* 练习/考试页左右滑动切题：左滑下一题、右滑上一题，和闪卡手势保持一致 */
let practiceSwipedAt = 0;
function goStep(n) {
  const s = S.session;
  if (!s) return;
  const at = s.idx + n;
  if (at < 0) return toast('已经是第一题了');
  if (at >= s.list.length) {
    return toast(s.mode === 'exam' ? '已经是最后一题，可以交卷了' : '已经是最后一题了');
  }
  s.idx = at;
  scheduleSave();
  renderPractice(true);
  buzz(6);
}

/* v2.7：整屏都能横滑（v2.5 那条「只认上半屏」的线撤了——用户要的是随手一划都能翻）。
   只排掉三种地方：底栏按钮、题库/分类那种能横向滚动的胶囊条、输入框。 */
function installPracticeSwipe() {
  // v2.8：手势挂在整个滚动容器 main 上，而不是 #v-practice。
  // 卡片比较短的时候，卡片下面那片空白根本不属于 section（section 只有内容那么高），
  // 手指落在那里等于划在 main 上，之前就拖不动——这就是「下半屏控制不了卡片」的根因。
  const box = $('main');
  // 只挂一次，免得越挂越多一次滑动跳好几题
  if (!box || box.dataset.pSwipeOn === '1') return;
  box.dataset.pSwipeOn = '1';
  // 挂在 main 上就得分清是哪个页面在接手，别的 tab 上不乱动
  const onPage = () => {
    const v = $('#v-practice');
    return !!(v && v.classList.contains('on'));
  };
  const cardOf = () => $('#practiceBox .card');
  // 底栏按钮、能横滚的胶囊条上不接管：蹭一下不该被当成「切题」
  const blocked = t => !!(t && t.closest && t.closest('.pbar, .chips'));
  let sx = 0, sy = 0, dx = 0, dy = 0, active = false, moved = false;
  const part = (x, y) => {
    sx = x; sy = y; dx = 0; dy = 0; active = true; moved = false;
  };
  const move = (x, y, ev) => {
    if (!active) return;
    dx = x - sx; dy = y - sy;
    if (!moved) {
      // 竖向为主就是翻页滚动，不拦；横向超过 12px 才算滑动
      if (Math.abs(dx) < 12 || Math.abs(dx) <= Math.abs(dy)) return;
      moved = true;
    }
    const card = cardOf();
    if (card) {
      card.style.transition = 'none';
      card.style.transform = 'translateX(' + Math.max(-80, Math.min(80, dx * 0.3)) + 'px)';
    }
    if (ev && ev.cancelable) ev.preventDefault();
  };
  const end = () => {
    if (!active) return;
    active = false;
    const card = cardOf();
    if (card) { card.style.transition = ''; card.style.transform = ''; }
    if (!moved) return;
    practiceSwipedAt = Date.now();
    if (dx <= -70) goStep(1);
    else if (dx >= 70) goStep(-1);
  };
  const skip = t => !!(t && t.closest && t.closest('input, textarea'));
  box.addEventListener('touchstart', e => {
    if (!onPage() || !S.session || e.touches.length !== 1 || skip(e.target) || blocked(e.target)) return;
    part(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  box.addEventListener('touchmove', e => {
    if (!onPage() || !S.session || e.touches.length !== 1 || skip(e.target)) return;
    move(e.touches[0].clientX, e.touches[0].clientY, e);
  }, { passive: false });
  box.addEventListener('touchend', end);
  box.addEventListener('touchcancel', end);
  box.addEventListener('mousedown', e => {
    if (!onPage() || !S.session || e.button !== 0 || skip(e.target) || blocked(e.target)) return;
    part(e.clientX, e.clientY);
    const mv = ev => move(ev.clientX, ev.clientY, null);
    const up = () => {
      document.removeEventListener('mousemove', mv);
      document.removeEventListener('mouseup', up);
      end();
    };
    document.addEventListener('mousemove', mv);
    document.addEventListener('mouseup', up);
  });
  // v2.12：点空白 / 点题干 = 直接看答案。按钮、选项、输入框、解析区、笔记、
  // 底栏、顶栏、胶囊/进度那行都不算「空白」；刚横滑完 400ms 内也不算（别把收手当点击）
  box.addEventListener('click', e => {
    if (!onPage() || !S.session) return;
    if (Date.now() - practiceSwipedAt < 400) return;
    const t = e.target;
    if (t.closest && t.closest(
      'button, input, textarea, a, .opt, .exp, .note, .nrow, .pbar, .chips, .qmeta, .tipbar, header')) return;
    revealBlank();
  });
}

function recordResult(q, ok, blank) {
  S.seen[q.id] = Date.now();
  // 统计：空白提交只是「看了解析」，不算一次作答，免得把正确率拉花
  if (!blank) {
    S.stats.total = (S.stats.total || 0) + 1;
    if (ok) S.stats.correct = (S.stats.correct || 0) + 1;
    const d = today();
    S.stats.daily[d] = S.stats.daily[d] || { p: 0, c: 0 };
    S.stats.daily[d].p++; if (ok) S.stats.daily[d].c++;
    // 分类正确率：导到电脑版后统计页要按分类看，手机端也得记
    const _c = S.stats.per_cat || (S.stats.per_cat = {});
    const _cc = _c[q.category || '未分类'] || (_c[q.category || '未分类'] = { p: 0, c: 0 });
    _cc.p++; if (ok) _cc.c++;
    // 题型正确率：题型专项面板靠它算「这一类我到底掌握得怎么样」
    const _tp = S.stats.per_type || (S.stats.per_type = {});
    const _tk = qtypeOf(q);
    const _tt = _tp[_tk] || (_tp[_tk] = { p: 0, c: 0 });
    _tt.p++; if (ok) _tt.c++;
  }
  // 错题：按记忆曲线排下次复习时间（答对升档，答错归零）
  let mastered = false;
  if (!ok) {
    srsWrong(q.id);
  } else if (S.wrong[q.id]) {
    mastered = srsRight(q.id);
  }
  return mastered;
}

// 答题节奏（练习设置里可改）：right 答对才跳 / any 答完就跳 / manual 不跳
function advanceAfterJudge(idx, ok) {
  const adv = S.advance || 'right';
  const last = idx >= S.session.list.length - 1;
  if (adv !== 'manual' && (ok || adv === 'any') && !last) {
    const at = idx;
    setTimeout(() => {
      // 用户已经自己翻页 / 退出，或者这一场已经结束，就别抢
      if (!S.session || S.session.idx !== at || !S.session.revealed[at]) return;
      if (S.session.pending && S.session.pending[at]) return;   // 还没自评，别跳
      S.session.idx++; renderPractice(true); scheduleSave();
    }, adv === 'any' ? 700 : 1000);
  }
}

// v2.12：点空白 / 点题干 / 点「看答案」——不想选了，直接摊开答案与解析（自测）。
// 记「未作答」：这题进错题本、不占正确率，跟填空题空着提交一个待遇
function revealBlank() {
  const s = S.session;
  if (!s || s.mode === 'exam' || s.mode === 'recite') return;   // 考试绝不给偷看
  const idx = s.idx, q = s.list[idx];
  if (s.revealed[idx] || (s.pending && s.pending[idx])) return; // 已经摊开 / 等自评，不用再触发
  s.ans[idx] = q.type === 'multiple' ? [] : '';
  s.revealed[idx] = true;
  (s.blank || (s.blank = {}))[idx] = true;
  recordResult(q, false, true);
  scheduleSave();
  renderPractice(); renderWrong(); renderStats();
  toast('已展开答案与解析；这题记进错题本，正确率不计', 2600);
  // 不自动跳下一题：来看答案的，700ms 肯定读不完，让人自己翻
}

function judgeNow(user) {
  const idx = S.session.idx, q = S.session.list[idx];
  if (S.session.revealed[idx]) return;
  const isFill = q.type === 'fill';
  if (user == null || (Array.isArray(user) && !user.length) || user === '') {
    // 填空题 / 简答题：写不出来也可以直接提交，把空白当答案，直接展开解析
    if (!isFill) { toast('先选一个答案'); return; }
    user = '';
  }
  // 简答题：写了答案但和参考答案不一样，不硬判错，先摊开参考答案让用户自己评
  if (isLongFill(q) && user !== '' && normTxt(user) !== normTxt(q.answer)) {
    S.session.ans[idx] = user;
    S.session.revealed[idx] = true;
    (S.session.pending || (S.session.pending = {}))[idx] = true;
    renderPractice();
    setTimeout(() => {
      const b = $('#btnSelfOk');
      if (b) b.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }, 60);
    return;
  }
  const blank = isFill && user === '';
  S.session.ans[idx] = user;
  S.session.revealed[idx] = true;
  const blanks = S.session.blank || (S.session.blank = {});
  if (blank) blanks[idx] = true; else delete blanks[idx];
  const ok = isCorrect(q, user);
  const mastered = recordResult(q, ok, blank);
  scheduleSave();
  renderPractice();
  renderWrong(); renderStats();
  if (blank) toast('没写答案，已展开解析；这题记进错题本，正确率不计', 2800);
  else if (mastered) toast('这题连着答对 4 次，已移出错题本 🎉', 1800);
  else buzz(ok ? 16 : [0, 26, 52, 26]);          // 对：一下；错：两下
  advanceAfterJudge(idx, ok);
}

// 简答题自评：用户对着参考答案点「答到了 / 没答到」，这时候才计分
function selfJudge(ok) {
  const s = S.session;
  if (!s || !s.pending || !s.pending[s.idx]) return;
  const idx = s.idx, q = s.list[idx];
  delete s.pending[idx];
  (s.result || (s.result = {}))[idx] = !!ok;
  const mastered = recordResult(q, !!ok, false);
  scheduleSave();
  renderPractice(); renderWrong(); renderStats();
  if (mastered) toast('这题连着答对 4 次，已移出错题本 🎉', 1800);
  else toast(ok ? '记下了：这题算答对' : '记下了：这题进错题本，明天再复习', 1700);
  buzz(ok ? 16 : [0, 26, 52, 26]);
  advanceAfterJudge(idx, !!ok);
}

function finishSession() {
  const s = S.session;
  if (!s) return;
  clearInterval(examTimer);
  let done = 0, ok = 0;
  const wrongQ = [];
  s.list.forEach((q, i) => {
    if (!s.revealed[i]) return;
    // 简答题写了但没点自评：不算做过，也不算错，留到下次
    if (s.pending && s.pending[i]) return;
    // 空着提交的题：不计入「做了几题」和正确率，但算需要重刷的
    if (s.blank && s.blank[i]) { wrongQ.push(q); return; }
    done++;
    if (judgedOk(s, i)) ok++; else wrongQ.push(q);
  });
  const total = s.list.length;
  S.lastRound = {
    total, done, ok,
    rate: done ? Math.round(ok / done * 100) : 0,
    spent: s.startedAt ? Math.max(1, Math.round((Date.now() - s.startedAt) / 60000)) : 0,
    ids: s.list.map(q => q.id),
    wrongIds: wrongQ.map(q => q.id),
  };
  S.session = null;
  document.body.classList.remove('in-quiz');
  scheduleSave();                 // 顺带把「续练」记录清掉
  renderRoundSummary();
}

/* ================= 本轮小结 ================= */
function renderRoundSummary() {
  const r = S.lastRound;
  if (!r) return renderPractice();
  const box = $('#practiceBox');
  const byId = new Map(S.bank.map(q => [q.id, q]));
  const wrongQ = r.wrongIds.map(id => byId.get(id)).filter(Boolean);
  const skipped = r.total - r.done;
  const preview = wrongQ.slice(0, 5).map(q =>
    `<div class="muted" style="padding:7px 0;border-bottom:1px solid var(--line);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(q.stem)}</div>`).join('');

  let feedback;
  if (!r.done) {
    feedback = `<div class="card" style="text-align:center;">
      <div style="font-size:15px;font-weight:700;">这轮一题都没答</div>
      <div class="muted" style="margin-top:4px;">下次慢慢来，先把题看明白</div></div>`;
  } else if (!wrongQ.length) {
    feedback = `<div class="card" style="text-align:center;">
      <div style="font-size:15px;font-weight:700;">这轮全对，漂亮</div>
      <div class="muted" style="margin-top:4px;">${skipped > 0 ? `还有 ${skipped} 题没答，可以再补一轮` : '换一批题继续吧'}</div></div>`;
  } else {
    feedback = `<div class="card">
      <div class="row" style="justify-content:space-between;">
        <div style="font-weight:700;">这轮错的 ${wrongQ.length} 道</div>
        <div class="muted" style="font-size:12.5px;">建议当天重刷一遍</div>
      </div>
      <div style="margin-top:4px;">${preview}${wrongQ.length > 5
        ? `<div class="muted" style="padding-top:7px;">…还有 ${wrongQ.length - 5} 道</div>` : ''}</div>
    </div>`;
  }

  box.innerHTML = `
    <div class="card" style="text-align:center;padding:20px 16px 16px;">
      <div class="muted" style="font-size:13px;">本轮正确率</div>
      <div class="score" style="margin:2px 0 6px;">${r.rate}%</div>
      <div class="muted">共 ${r.total} 题 · 答对 ${r.ok} · 答错 ${wrongQ.length}${
        skipped > 0 ? ' · 没答 ' + skipped : ''}${r.spent ? ' · 约 ' + r.spent + ' 分钟' : ''}</div>
    </div>
    ${feedback}
    <div class="card">
      ${wrongQ.length ? `<button class="btn primary" id="btnRedoWrong" style="width:100%;margin-bottom:8px;">重刷这 ${wrongQ.length} 道错题</button>` : ''}
      <button class="btn ${wrongQ.length ? '' : 'primary'}" id="btnAgainSame" style="width:100%;margin-bottom:8px;">再来一轮（同样 ${r.total} 题）</button>
      <button class="btn" id="btnHome" style="width:100%;">换个范围 / 回首页</button>
    </div>`;

  const bw = $('#btnRedoWrong');
  if (bw) bw.onclick = () => { S.lastRound = null; startSession(wrongQ); };
  $('#btnAgainSame').onclick = () => {
    const list = r.ids.map(id => byId.get(id)).filter(Boolean);
    S.lastRound = null;
    if (list.length) startSession(list); else renderPractice();
  };
  $('#btnHome').onclick = () => { S.lastRound = null; renderPractice(); };
}

/* ================= 模拟考试 ================= */
let examTimer = null;

function renderExamSetup() {
  const box = $('#practiceBox');
  const pool = filteredQuestions();
  const NUMS = [20, 50, 100, 0];
  const MINS = [30, 60, 90];
  const n = S.examCfg.num, m = S.examCfg.min;
  box.innerHTML = `
    <div class="card">
      <div style="font-size:17px;font-weight:700;margin-bottom:6px;">模拟考试</div>
      <div class="muted" style="margin-bottom:14px;">
        按当前范围（${esc(S.meta.bank)}${S.meta.cat !== '全部' ? ' · ' + esc(S.meta.cat) : ''}）出卷，共 ${pool.length} 题可用。
        考试中不显示对错，交卷后统一评分。
      </div>
      <div class="muted" style="font-size:13px;margin-bottom:8px;">题目数量</div>
      <div class="chips" style="flex-wrap:wrap;overflow:visible;margin-bottom:14px;">
        ${NUMS.map(x => `<button class="chip ${n === x ? 'on' : ''}" data-en="${x}">${x === 0 ? '全部' : x + ' 题'}</button>`).join('')}
      </div>
      <div class="muted" style="font-size:13px;margin-bottom:8px;">考试时长</div>
      <div class="chips" style="flex-wrap:wrap;overflow:visible;margin-bottom:16px;">
        ${MINS.map(x => `<button class="chip ${m === x ? 'on' : ''}" data-em="${x}">${x} 分钟</button>`).join('')}
      </div>
      <button class="btn primary" id="btnExamGo" style="width:100%;margin-bottom:8px;" ${pool.length ? '' : 'disabled'}>开始考试</button>
      <button class="btn" id="btnExamBack" style="width:100%;">返回练习</button>
    </div>`;
  $$('#practiceBox [data-en]').forEach(el => el.onclick = () => {
    S.examCfg.num = +el.dataset.en; renderExamSetup();
  });
  $$('#practiceBox [data-em]').forEach(el => el.onclick = () => {
    S.examCfg.min = +el.dataset.em; renderExamSetup();
  });
  $('#btnExamBack').onclick = () => { S.examSetup = false; renderPractice(); };
  $('#btnExamGo').onclick = () => {
    const p = filteredQuestions();
    if (!p.length) return toast('这个范围没有题目');
    const take = S.examCfg.num > 0 ? Math.min(S.examCfg.num, p.length) : p.length;
    const a = p.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; }
    startExam(a.slice(0, take));
  };
}

function startExam(list) {
  S.examSetup = false;
  S.lastExam = null;
  S.lastRound = null;
  S.resume = null;
  scheduleSave();
  S.session = {
    list, idx: 0, ans: {}, revealed: {}, blank: {}, mode: 'exam',
    endsAt: Date.now() + S.examCfg.min * 60000,
    startedAt: Date.now(),
  };
  document.body.classList.add('in-quiz');
  startExamTimer();
  renderPractice(true);
}

function startExamTimer() {
  clearInterval(examTimer);
  examTimer = setInterval(syncTimer, 1000);
  syncTimer();
}

function syncTimer() {
  const s = S.session;
  if (!s || s.mode !== 'exam') { clearInterval(examTimer); return; }
  const el = $('#examTimer');
  const left = Math.max(0, Math.round((s.endsAt - Date.now()) / 1000));
  if (el) {
    const mm = String(Math.floor(left / 60)).padStart(2, '0');
    const ss = String(left % 60).padStart(2, '0');
    el.textContent = left > 0 ? `剩 ${mm}:${ss}` : '时间到';
    el.classList.toggle('urgent', left <= 60);
  }
  if (left <= 0) submitExam(true);
}

function pickExam(k, isMulti) {
  const idx = S.session.idx;
  if (isMulti) {
    const cur = new Set(S.session.ans[idx] || []);
    cur.has(k) ? cur.delete(k) : cur.add(k);
    S.session.ans[idx] = [...cur].sort();
  } else {
    S.session.ans[idx] = k;
  }
  scheduleSave();
  renderPractice();
}

function submitExam(auto) {
  const s = S.session;
  if (!s) return;
  clearInterval(examTimer);
  const total = s.list.length;
  let done = 0, ok = 0;
  const wrongList = [];
  const answered = i => {
    const u = s.ans[i];
    return u != null && !(Array.isArray(u) && !u.length) && u !== '';
  };
  s.list.forEach((q, i) => {
    if (!answered(i)) return;
    done++;
    const good = isCorrect(q, s.ans[i]);
    S.stats.total = (S.stats.total || 0) + 1;
    if (good) S.stats.correct = (S.stats.correct || 0) + 1;
    const d = today();
    S.stats.daily[d] = S.stats.daily[d] || { p: 0, c: 0 };
    S.stats.daily[d].p++; if (good) S.stats.daily[d].c++;
    const _pc = S.stats.per_cat || (S.stats.per_cat = {});
    const _pcc = _pc[q.category || '未分类'] || (_pc[q.category || '未分类'] = { p: 0, c: 0 });
    _pcc.p++; if (good) _pcc.c++;
    const _pt = S.stats.per_type || (S.stats.per_type = {});
    const _ptk = qtypeOf(q);
    const _ptt = _pt[_ptk] || (_pt[_ptk] = { p: 0, c: 0 });
    _ptt.p++; if (good) _ptt.c++;
    S.seen[q.id] = Date.now();
    if (good) {
      srsRight(q.id);
      ok++;
    } else {
      srsWrong(q.id);
      wrongList.push(q);
    }
  });
  S.lastExam = {
    total, done, ok, wrong: wrongList, auto: !!auto,
    secs: Math.round((Date.now() - s.startedAt) / 1000),
    score: total ? Math.round(ok / total * 100) : 0,
  };
  // 存一笔成绩，统计页看趋势用（最多留 30 次，旧的自动淘汰）
  S.exams = [{
    ts: Date.now(), score: S.lastExam.score, total, ok, done,
    secs: S.lastExam.secs, auto: !!auto,
    wrongIds: wrongList.map(q => q.id),
  }].concat(S.exams || []).slice(0, 30);
  S.session = null;
  document.body.classList.remove('in-quiz');
  scheduleSave();
  renderPractice(true);
  renderWrong(); renderStats();
}

function renderExamResult() {
  const r = S.lastExam;

  box.innerHTML = `

      <div class="score">${r.score}<span style="font-size:18px;font-weight:600;"> 分</span></div>
      <div class="muted" style="margin:6px 0 4px;">${level} · 共 ${r.total} 题，答对 ${r.ok}，答错 ${r.done - r.ok}，未答 ${r.total - r.done}</div>
      <div class="muted" style="margin-bottom:4px;">${cmp}</div>

      ${r.wrong.map((q, i) => `<div class="blank" style="padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.6;">

/* ---------- 答题卡 ---------- */
function openSheet() {
  const s = S.session, list = s.list;
  const isExam = s.mode === 'exam';
  let ok = 0, no = 0, filled = 0, peek = 0, wait = 0;
  const cells = list.map((q, i) => {
    let cls = 'cell';
    if (isExam) {
      const u = s.ans[i];
      if (u != null && u !== '' && !(Array.isArray(u) && !u.length)) { cls += ' ans'; filled++; }
    } else if (s.pending && s.pending[i]) {
      cls += ' ans'; wait++;
    } else if (s.revealed[i]) {
      if (s.blank && s.blank[i]) { cls += ' seen'; peek++; }
      else if (judgedOk(s, i)) { cls += ' ok'; ok++; } else { cls += ' no'; no++; }
    }
    if (i === s.idx) cls += ' cur';
    return `<div class="${cls}" data-i="${i}">${i + 1}</div>`;
  }).join('');
  $('#sheetStat').textContent = isExam
    ? `已答 ${filled} · 未答 ${list.length - filled}`
    : `对 ${ok} · 错 ${no}${peek ? ' · 看解析 ' + peek : ''}${wait ? ' · 待评 ' + wait : ''} · 未答 ${list.length - ok - no - peek - wait}`;
  $('#sheetGrid').innerHTML = cells;
  $('#sheetLegend').innerHTML = isExam
    ? `<span><i class="l-ans"></i>已答</span><span><i class="l-peek"></i>未答</span>`
    : `<span><i class="l-ok"></i>答对</span><span><i class="l-no"></i>答错</span>`
      + `<span><i class="l-peek"></i>看了解析</span><span><i class="l-ans"></i>已答待评</span>`;
  // 练习/背题可以中途退出（进度存成续练）；考试只能交卷，不给退路
  const bq = $('#btnQuit');
  if (bq) {
    bq.style.display = isExam ? 'none' : 'block';
    bq.textContent = s.mode === 'recite' ? '退出背题' : '退出本轮（进度会保留）';
    bq.onclick = pauseSession;
  }
  $('#mask').classList.add('on'); $('#sheet').classList.add('on');
  $$('#sheetGrid .cell').forEach(el => el.onclick = () => {
    s.idx = +el.dataset.i;
    scheduleSave();
    closeSheet(); renderPractice(true);
  });
}

function renderBankList() {
  const counts = {};
  S.bank.forEach(q => { counts[bankOf(q)] = (counts[bankOf(q)] || 0) + 1; });
  const names = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  if (!names.length) {
    $('#bankList').innerHTML = `<div class="empty"><div class="big">▤</div>还没有题库<br>点上面的「导入题库文件」</div>`;
    return;
  }
  $('#bankList').innerHTML = names.map(n => {
    const cats = new Set(S.bank.filter(q => bankOf(q) === n).map(q => q.category || '未分类'));
    return `<div class="item ${S.meta.bank === n ? 'on' : ''}" data-bank="${esc(n)}">
      <div class="grow">
        <div class="t">${esc(n)}</div>
        <div class="s">${counts[n]} 题 · ${cats.size} 个分类</div>
      </div>
      <button class="go" data-ren="${esc(n)}" style="color:var(--primary);font-size:13px;">改名</button>
      <button class="go" data-del="${esc(n)}" style="color:var(--err);font-size:13px;">删除</button>
    </div>`;
  }).join('');
  $$('#bankList .item').forEach(el => {
    const name = el.dataset.bank;
    el.onclick = ev => {
      if (ev.target.dataset.del || ev.target.dataset.ren) return;
      S.meta.bank = name; S.meta.cat = '全部';
      scheduleSave(); S.session = null;
      renderChips(); renderPractice(); renderBankList(); switchTab('practice');
    };
  });
  $$('#bankList [data-ren]').forEach(btn => btn.onclick = async ev => {
    ev.stopPropagation();
    const old = btn.dataset.ren;
    const name = (prompt('题库新名字（该题库下所有题目一起改）', old) || '').trim();
    if (!name || name === old) return;
    if (allBanks().includes(name)) return alert('已经有同名题库了，换一个名字。');
    S.bank.forEach(q => {
      if (bankOf(q) === old) {
        q.bank = name;
        if (!q.category || q.category === old) q.category = name;
      }
    });
    if (S.meta.bank === old) S.meta.bank = name;
    await saveBank(); scheduleSave();
    renderAll(); toast('已改名');
  });
  $$('#bankList [data-del]').forEach(btn => btn.onclick = async ev => {
    ev.stopPropagation();
    const name = btn.dataset.del;
    if (!confirm(`删除题库《${name}》？该题库下的题目会一起删掉（本机数据，不可恢复）。`)) return;
    S.bank = S.bank.filter(q => bankOf(q) !== name);
    if (S.meta.bank === name) { S.meta.bank = '全部题库'; S.meta.cat = '全部'; }
    S.session = null;
    await saveBank(); scheduleSave();
    renderAll(); toast('已删除');
  });
}

$('#fileInput').onchange = async e => {
  const files = [...e.target.files];
  if (!files.length) return;
  const fail = [], parsed = [];
  // 1) 先把文件都解析出来（拿题库名）
  for (const f of files) {
    try {
      const qs = await parseFile(f);
      if (!qs.length) { fail.push(f.name + '（没解析出题目）'); continue; }
      parsed.push({ name: qs[0].bank || f.name.replace(/\.[^.]+$/, ''), qs });
    } catch (err) { fail.push(f.name + '（' + err.message + '）'); }
  }
  // 2) 同名题库已在库里 → 问一次：覆盖还是追加
  const existing = new Set(S.bank.map(bankOf));
  const clash = [...new Set(parsed.map(p => p.name).filter(n => existing.has(n)))];
  let replace = false;
  if (clash.length) {
    replace = confirm('这些题库已经有了：\n' + clash.join('、') +
      '\n\n点「确定」= 用新文件【覆盖】这些题库\n点「取消」= 只【追加】新题（重复的跳过）');
  }
  // 3) 写入：去重只看同一个题库内部，同题可以存在于不同题库
  let added = 0, dup = 0;
  for (const { name, qs } of parsed) {
    if (replace) S.bank = S.bank.filter(q => bankOf(q) !== name);
    const have = new Set(S.bank.filter(q => bankOf(q) === name).map(q => q.id));
    for (const q of qs) {
      if (have.has(q.id)) { dup++; continue; }
      have.add(q.id); S.bank.push(q); added++;
    }
  }
  await saveBank(); renderAll();
  toast(`新增 ${added} 题${dup ? '，本库重复 ' + dup + ' 题' : ''}${fail.length ? '，失败 ' + fail.length + ' 个' : ''}`, 2600);
  if (fail.length) alert('以下文件没有导入成功：\n' + fail.join('\n'));
  e.target.value = '';
};

function renderWrong() {

    const da = isDue(S.wrong[a]) ? 0 : 1, db = isDue(S.wrong[b]) ? 0 : 1;
    return da - db || ((S.wrong[b].count || 0) - (S.wrong[a].count || 0));
  });

  $('#favNum').textContent = favIds.length ? `(${favIds.length})` : '';
  $('#tabWrong').classList.toggle('primary', S.wrongTab === 'wrong');
  $('#tabFav').classList.toggle('primary', S.wrongTab === 'fav');
  const ids0 = S.wrongTab === 'wrong' ? wrongIds : favIds;
  const wf = S.wrongFilter || 'all';
  const ids = (S.wrongTab !== 'wrong' || wf === 'all') ? ids0 : ids0.filter(id =>
    wf === 'due' ? isDue(S.wrong[id]) : ((S.wrong[id] || {}).count || 0) >= 2);
  const byId = new Map(S.bank.map(q => [q.id, q]));
  const list = ids.map(id => byId.get(id)).filter(Boolean);

  const fbox = $('#wrongFilters');

    if (S.wrongTab !== 'wrong' || !wrongIds.length) fbox.innerHTML = '';
    else {
      const nDue = wrongIds.filter(id => isDue(S.wrong[id])).length;
      const nOften = wrongIds.filter(id => ((S.wrong[id] || {}).count || 0) >= 2).length;
      const opts = [['all', '全部 ' + wrongIds.length], ['due', '今天到期 ' + nDue], ['often', '错≥2 次 ' + nOften]];
      fbox.innerHTML = opts.map(([k, t]) =>
        `<button class="chip ${wf === k ? 'on' : ''}" data-wf="${k}">${t}</button>`).join('');
      $$('#wrongFilters [data-wf]').forEach(b => b.onclick = () => {
        S.wrongFilter = b.dataset.wf; renderWrong();

  // 记忆曲线复习入口（只在错题本这一栏显示）

      <div class="row" style="justify-content:space-between;align-items:baseline;">

        错过一次的题，隔 1 / 3 / 7 / 15 天再考你一遍；连着答对 4 次就移出错题本。
      </div>
      <button class="btn primary" id="btnReview" style="width:100%;">开始复习（${Math.min(due, 30)} 题）</button>
    </div>` : (wrongIds.length ? `
    <div class="card" style="margin-bottom:12px;">
      <div class="muted" style="font-size:13px;line-height:1.7;">
        今天没有到期的错题，先练别的。列表里每道题都写了下次复习的日子。
      </div>
    </div>` : ''));
  const brv = $('#btnReview');
  if (brv) brv.onclick = () => {
    const dl = dueList().slice(0, 30);
    if (!dl.length) return toast('今天没有要复习的题');
    S.lastRound = null; S.lastExam = null;
    switchTab('practice');
    startSession(shuffleArr(dl));

  $('#btnPracticeWrong').textContent = S.wrongTab === 'wrong' ? '专练错题' : '专练收藏';
  if (!list.length) {
    const filtered = S.wrongTab === 'wrong' && wf !== 'all';
    $('#wrongList').innerHTML = filtered
      ? `<div class="empty"><div class="big">✗</div>这个筛选下没有题<br>点上面的「全部 ${wrongIds.length}」看所有错题</div>`
      : `<div class="empty"><div class="big">${S.wrongTab === 'wrong' ? '✗' : '☆'}</div>${S.wrongTab === 'wrong' ? '还没有错题，去练习吧' : '还没有收藏的题'}</div>`;
    return;

  $('#wrongList').innerHTML = list.map(q => {
    const w = S.wrong[q.id];

    if (w) {

    return `<div class="item" data-id="${q.id}">
      <div class="grow">

    S.session.idx = i;
    switchTab('practice'); renderPractice(true);
  });
  $('#btnPracticeWrong').onclick = () => {
    startSession(list.filter(q => S.wrongTab === 'wrong' ? S.wrong[q.id] : true));
    switchTab('practice'); renderPractice(true);
  };
}

/* ================= 学习：闪卡 ================= */
let flashSwipedAt = 0;          // 上一次滑动的时间戳，用来抑制「滑完顺手翻面」
let flashEnterDir = 0;          // 刚才是往哪边翻的：+1 下一张 / -1 上一张 / 0 不播入场动画
/* v2.7：闪卡手势改成挂在整页（#v-study）上，每次渲染只换这里的处理函数。
   这样手指落在卡片外面——下半屏空白、底栏上方——也能拖动卡片。 */
let flashSwipe = null;

function installFlashGesture() {
  // v2.8：和练习页一样挂到 main 上——卡片外面、下半屏空白都能拖
  const zone = $('main');
  if (!zone || zone.dataset.fSwipeOn === '1') return;
  zone.dataset.fSwipeOn = '1';
  // 只在学习页的「试题闪卡」分栏、且真有一轮卡片时才接手
  const onPage = () => {
    const v = $('#v-study');
    return !!(v && v.classList.contains('on')) && S.seg !== 'point' && !!S.flash;
  };
  // 底栏按钮、顶部分段、收藏星不接管
  const skip = t => !!(t && t.closest && t.closest('.pbar, .seg, button, input, textarea'));
  zone.addEventListener('touchstart', e => {
    if (!onPage() || !flashSwipe || e.touches.length !== 1 || skip(e.target)) return;
    flashSwipe.start(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  zone.addEventListener('touchmove', e => {
    if (!onPage() || !flashSwipe || e.touches.length !== 1) return;
    flashSwipe.move(e.touches[0].clientX, e.touches[0].clientY, e);
  }, { passive: false });
  zone.addEventListener('touchend', () => { if (onPage() && flashSwipe) flashSwipe.end(); });
  zone.addEventListener('touchcancel', () => { if (onPage() && flashSwipe) flashSwipe.end(); });
  zone.addEventListener('mousedown', e => {
    if (!onPage() || !flashSwipe || skip(e.target)) return;
    flashSwipe.mouse(e);
  });
}

function renderStudy() {
  $$('#studySeg button').forEach(b => b.classList.toggle('on', b.dataset.seg === S.seg));
  if (S.seg === 'point') return renderPoints();
  return renderFlash();
}

function renderFlash() {
  flashSwipe = null;                  // 这一帧先撤掉旧手势，渲染成功再挂新的
  const box = $('#studyBox');
  const f = S.flash;
  if (!f) {
    document.body.classList.remove('in-quiz');
    $('#v-study').classList.remove('flashfill');   // 开始页不放大，按内容自然高
    const pool = rangePool(S.meta.range);
    box.innerHTML = `
      <div class="card">
        <div style="font-size:17px;font-weight:700;margin-bottom:6px;">试题闪卡</div>
        <div class="muted" style="margin-bottom:12px;">
          正面看题，点一下卡片翻面看答案与解析。范围与练习页同步。
        </div>
        <div class="muted" style="font-size:13px;margin-bottom:8px;">范围</div>
        <div class="chips" style="flex-wrap:wrap;overflow:visible;margin-bottom:14px;">
          ${RANGES.map(r => `<button class="chip ${S.meta.range === r ? 'on' : ''}" data-fr="${r}">${r}${r === '全部' ? '' : ' ' + rangeCount(r)}</button>`).join('')}
        </div>
        <div class="muted" style="margin-bottom:12px;">当前 ${pool.length} 张卡</div>
        <button class="btn primary" id="btnFlashGo" style="width:100%;margin-bottom:8px;" ${pool.length ? '' : 'disabled'}>开始闪卡（随机）</button>
        <button class="btn" id="btnFlashSeq" style="width:100%;margin-bottom:8px;" ${pool.length ? '' : 'disabled'}>按顺序看</button>
        <button class="btn" id="btnFlashAuto" style="width:100%;">记住后自动下一张：${S.flashAuto ? '开' : '关'}</button>
      </div>`;
    $$('#studyBox [data-fr]').forEach(el => el.onclick = () => {
      S.meta.range = el.dataset.fr; scheduleSave(); renderFlash();
    });
    const start = (shuffle) => {
      const p = rangePool(S.meta.range).slice();
      if (shuffle) for (let i = p.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [p[i], p[j]] = [p[j], p[i]]; }
      S.flash = { list: p, idx: 0, flipped: false, known: 0 };
      renderFlash(true);
    };
    $('#btnFlashGo').onclick = () => start(true);
    $('#btnFlashSeq').onclick = () => start(false);
    $('#btnFlashAuto').onclick = () => {
      S.flashAuto = !S.flashAuto; scheduleSave(); renderFlash();
    };
    return;
  }
  document.body.classList.add('in-quiz');
  syncQuitTop();                       // 闪卡这一轮也能从顶栏退出去
  if (f.idx >= f.list.length) {
    $('#v-study').classList.remove('flashfill');   // 看完的小结页同样不放大
    box.innerHTML = `
      <div class="card" style="text-align:center;padding:26px 14px;">
        <div style="font-size:22px;font-weight:700;margin-bottom:8px;">这一轮看完了</div>
        <div class="muted" style="margin-bottom:18px;">共 ${f.list.length} 张，标记记住 ${f.known} 张</div>
        <button class="btn primary" id="fcDone" style="width:100%;">再抽一轮</button>
      </div>`;
    S.flash = null;
    document.body.classList.remove('in-quiz');
    $('#fcDone').onclick = () => renderFlash();
    return;
  }
  const q = f.list[f.idx];
  const isMulti = q.type === 'multiple';
  $('#v-study').classList.add('flashfill');   // 抽卡中：卡片铺满可视区（v2.11）
  const keys = Object.keys(q.options || {}).sort();
  const optsHtml = keys.map(k => `<div class="fo"><span class="k">${k}</span><span>${esc(q.options[k])}</span></div>`).join('');
  box.innerHTML = `
    <div class="flash" id="flashCard">
      <span class="hint">${f.flipped ? '点卡片翻回题目' : '点卡片看答案'}</span>
      <span class="stamp l" id="fcStampL">${f.idx === 0 ? '已是最前一张' : '← 上一张'}</span>
      <span class="stamp r" id="fcStampR">下一张 →</span>
      <div class="fh">
        <span class="qtype">${({ single: '单选', multiple: '多选', judge: '判断', fill: '填空' })[q.type] || q.type}</span>
        <span>${f.idx + 1} / ${f.list.length}</span>
        <span style="margin-left:auto;color:${S.fav[q.id] ? 'var(--star)' : 'var(--muted)'}" id="fcFav">${S.fav[q.id] ? '★ 已收藏' : '☆ 收藏'}</span>
      </div>
      <div class="fs">${esc(q.stem)}</div>
      ${isMulti ? `<div class="muted" style="margin-bottom:8px;font-size:12.5px;">多选题，答案有多个</div>` : ''}
      ${optsHtml}
      ${f.flipped ? `<div class="ans">
        <div class="kv">答案：<b>${esc(answerText(q))}</b></div>
        <div class="body">${q.explanation ? rich(q.explanation) : '（这题没有解析）'}</div>
      </div>` : `<div class="fb">← 左右滑动切换 →　点卡片看答案</div>`}
    </div>
    <div class="pbar">
      <button class="btn" id="fcPrev" ${f.idx === 0 ? 'disabled' : ''}>上一张</button>
      <button class="btn mini" id="fcAgain" style="color:var(--err);">没记住</button>
      <button class="btn primary" id="fcKnow">记住了</button>
    </div>`;
  // 左右滑动切换：左滑下一张、右滑上一张（手机手势；桌面也能按住鼠标拖）
  // 拖的时候整张卡跟着倾斜——转轴压在卡片下缘，越拖到底角度越大；
  // 松手够远就顺着这个角度甩出屏幕，不够就带弹性弹回原位。
  const card = $('#flashCard');
  const stampL = $('#fcStampL'), stampR = $('#fcStampR');
  let sx = 0, sy = 0, dx = 0, swActive = false, dragged = false, tDown = 0, flying = false;
  const goPrevCard = () => { if (f.idx > 0) { f.idx--; f.flipped = false; flashEnterDir = -1; renderFlash(true); } };
  const goNextCard = () => { f.idx++; f.flipped = false; flashEnterDir = 1; renderFlash(true); };
  // 阈值不写死：窄屏手机 52px、宽屏也就 78px，约卡片宽度的 18%
  const TH = Math.max(52, Math.min(78, (card.offsetWidth || 340) * 0.18));

  /* 按当前位移画卡片：倾斜 + 上抬 + 轻微放大，越拖到底越明显 */
  const paint = (mx) => {
    const w = card.offsetWidth || 340;
    let k = Math.max(-1, Math.min(1, mx / (w * 0.55)));      // -1 左到底 … +1 右到底
    const stuck = (mx > 0 && f.idx === 0);                    // 已是最前一张，右滑拖不动
    if (stuck) k *= 0.28;
    // 位移走平方：轻推时几乎不挪（题还读得到），拖到底才明显甩开；
    // 倾斜由旋转承担，平移只作辅助，不然刚拖一点题干就被裁掉半个字
    const shift = k * Math.abs(k);
    // 倾斜上限跟着卡片高度收敛：题目卡 16° 正好，翻面后解析很长时压到 7° 左右，
    // 不然半个卡片会被转到屏幕外
    const h = card.offsetHeight || 320;
    const maxRot = Math.max(7, Math.min(16, 16 * 420 / Math.max(h, 1)));
    const rot = k * maxRot;
    card.style.transform =
      'translate(' + (shift * w * 0.30) + 'px,0px)' +
      ' rotate(' + rot + 'deg) scale(' + (1 + Math.abs(k) * 0.014) + ')';
    card.style.opacity = String(1 - Math.abs(k) * 0.10);
    // 方向标：过阈值一半才显，显出来就直接不透明——
    // 半透明会让下面的「单选 1 / 6」透上来，看着像乱码
    const near = Math.max(0, Math.min(1, (Math.abs(mx) - TH * 0.45) / (TH * 0.55)));
    const nl = mx > 0 ? near : 0;
    const nr = mx < 0 ? near : 0;
    stampL.style.opacity = String(nl > 0.1 ? Math.min(1, nl * 2.8) : 0);
    stampR.style.opacity = String(nr > 0.1 ? Math.min(1, nr * 2.8) : 0);
    stampL.style.transform = 'scale(' + (0.9 + nl * 0.1) + ')';
    stampR.style.transform = 'scale(' + (0.9 + nr * 0.1) + ')';
  };

  /* 松手没到阈值：带一点回弹地弹回原位 */
  const springBack = () => {
    card.classList.remove('dragging');
    card.style.transition = 'transform .36s cubic-bezier(.22,1.3,.36,1), opacity .24s ease-out, box-shadow .2s';
    card.style.transform = '';
    card.style.opacity = '';
    stampL.style.opacity = 0; stampR.style.opacity = 0;
    setTimeout(() => { if (card.isConnected) card.style.transition = ''; }, 380);
  };

  /* 够远了：顺着当前角度继续转、飞出屏幕，落定后再换下一张 */
  const flyOut = (dirX) => {
    flying = true;
    card.classList.remove('dragging');
    stampL.style.opacity = 0; stampR.style.opacity = 0;
    const off = ((window.innerWidth || 380) + card.offsetWidth) * dirX;
    card.style.transition = 'transform .19s cubic-bezier(.45,.05,.55,.95), opacity .19s linear';
    card.style.transform = 'translate(' + off + 'px,' + (-30 * dirX) + 'px) rotate(' + (20 * dirX) + 'deg) scale(.97)';
    card.style.opacity = '0';
    setTimeout(() => {
      if (!card.isConnected) return;
      if (dirX < 0) goNextCard(); else goPrevCard();
    }, 185);
  };

  const swStart = (x, y) => {
    if (flying) return;
    // 入场动画还没播完就上手拖：先收掉动画，否则 animation 会盖住 inline 位移
    card.classList.remove('slide-in-next', 'slide-in-prev');
    sx = x; sy = y; dx = 0; swActive = true; dragged = false; tDown = Date.now();
    card.classList.add('dragging');
  };
  const swMove = (x, y, ev) => {
    if (!swActive) return;
    const mx = x - sx, my = y - sy;
    if (!dragged) {
      // 竖向为主就是滚动页面，不拦；横向超过 10px 才认定是滑动
      if (Math.abs(mx) < 10 || Math.abs(mx) <= Math.abs(my)) return;
      dragged = true;
    }
    dx = mx;
    paint(mx);
    if (ev && ev.cancelable) ev.preventDefault();
  };
  const swEnd = () => {
    if (!swActive) return;
    swActive = false;
    if (!dragged) { card.classList.remove('dragging'); return; }
    flashSwipedAt = Date.now();          // 记一笔，免得松手时被当成「点一下翻面」
    const v = Math.abs(dx) / Math.max(1, Date.now() - tDown);    // px/ms
    // 拖够远了，或者距离不算长但甩得快（轻扫一下也能翻）
    const pass = Math.abs(dx) >= TH || (Math.abs(dx) > 70 && v > 1.1);
    if (pass && (dx < 0 || f.idx > 0)) return flyOut(dx < 0 ? -1 : 1);
    springBack();
  };
  // v2.7：手势交给挂在整页上的 installFlashGesture（见下），这里只把这轮的处理函数挂上去。
  // 以前事件挂在卡片上，手指落在卡片外面（下半屏空白、底栏上方）就拖不动。
  flashSwipe = {
    start: swStart,
    move: swMove,
    end: swEnd,
    mouse: (e) => {
      if (e.button !== 0 || e.target.id === 'fcFav') return;
      swStart(e.clientX, e.clientY);
      const mv = ev => swMove(ev.clientX, ev.clientY, null);
      const up = () => {
        document.removeEventListener('mousemove', mv);
        document.removeEventListener('mouseup', up);
        swEnd();
      };
      document.addEventListener('mousemove', mv);
      document.addEventListener('mouseup', up);
    }
  };
  installFlashGesture();
  // 入场：从上一次翻动的方向斜着飘进来（点按钮翻页也走这里）
  if (flashEnterDir) {
    const cls = flashEnterDir > 0 ? 'slide-in-next' : 'slide-in-prev';
    card.classList.add(cls);
    setTimeout(() => { if (card.isConnected) card.classList.remove(cls); }, 300);
  }
  flashEnterDir = 0;
  $('#flashCard').onclick = ev => {
    if (ev.target.id === 'fcFav') return;
    if (Date.now() - flashSwipedAt < 350) return;   // 刚滑过，别顺手把卡翻了
    f.flipped = !f.flipped; renderFlash(true);
  };
  $('#fcFav').onclick = () => {
    if (S.fav[q.id]) delete S.fav[q.id]; else S.fav[q.id] = Date.now();
    scheduleSave(); renderFlash();
  };
  $('#fcPrev').onclick = () => goPrevCard();
  $('#fcAgain').onclick = () => goNextCard();
  $('#fcKnow').onclick = () => {
    f.known++;
    if (S.flashAuto) { goNextCard(); }
    else { toast('已记住，自己翻下一张'); }
  };
  if (f.idx === 0) { const m = $('main'); if (m) m.scrollTop = 0; }
}

/* ================= 学习：考点速记 ================= */
function renderPoints() {
  const box = $('#studyBox');
  flashSwipe = null;              // 考点速记没有卡片，别让上一轮的闪卡手势还挂着
  document.body.classList.remove('in-quiz');
  $('#v-study').classList.remove('flashfill');   // 考点速记列表按内容自然高
  const total = S.points.length;
  box.innerHTML = `
    <div class="row" style="margin-bottom:10px;">
      <button class="btn primary" id="ptGen">从题库解析生成</button>
      <button class="btn mini" id="ptBlind">${S.blind ? '显示内容' : '背诵模式'}</button>
    </div>
    <div class="muted" style="margin:0 4px 10px;">共 ${total} 条考点。生成范围＝练习页当前题库与分类，一次最多 300 条。</div>
    ${total ? `<div id="ptList">${S.points.map(p => `
      <div class="point ${S.blind ? 'blind' : ''}" data-pid="${esc(p.id)}">
        <button class="del" data-delp="${esc(p.id)}">删</button>
        <div class="pt">${esc(p.title)}</div>
        <div class="pc">${esc(p.cat || '未分类')}</div>
        <div class="pb">${rich(p.content)}</div>
        ${S.blind ? '<div class="reveal">点一下看内容</div>' : ''}
      </div>`).join('')}</div>`
      : `<div class="empty"><div class="big">✦</div>还没有考点<br>点上面的「从题库解析生成」</div>`}`;
  $('#ptGen').onclick = genPoints;
  $('#ptBlind').onclick = () => { S.blind = !S.blind; renderPoints(); };
  $$('#studyBox [data-delp]').forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const id = b.dataset.delp;
    if (!confirm('删除这条考点？')) return;
    S.points = S.points.filter(p => p.id !== id);
    scheduleSave(); renderPoints(); toast('已删除');
  });
  $$('#studyBox .point').forEach(el => el.onclick = () => {
    if (el.classList.contains('blind')) {
      el.classList.remove('blind');
      const r = el.querySelector('.reveal'); if (r) r.remove();
    }
  });
}

function genPoints() {
  const pool = rangePool(S.meta.range);
  const exist = new Set(S.points.map(p => p.src).filter(Boolean));
  let added = 0, hitCap = false;
  for (const q of pool) {
    if (added >= 300) { hitCap = true; break; }
    const exp = (q.explanation || '').trim();
    if (!exp || exist.has(q.id)) continue;
    S.points.push({
      id: q.id + '-pt',
      cat: q.category || '未分类',
      title: q.stem.slice(0, 46),
      content: '【答案】' + answerText(q) + '\n【解析】' + exp,
      src: q.id,
    });
    exist.add(q.id); added++;
  }
  scheduleSave(); renderPoints();
  if (!added) return toast('没有新考点了（这个范围都生成过）');
  toast(`生成了 ${added} 条考点${hitCap ? '（已达 300 上限，可再点一次继续）' : ''}`, 2400);
}
function renderStats() {
  const total = S.stats.total || 0, correct = S.stats.correct || 0;
  const rate = total ? Math.round(correct / total * 100) : 0;
  const d = today();
  const t = S.stats.daily[d] || { p: 0, c: 0 };
  const streak = dayStreak();
  const left = goalLeft();
  const perBank = {};
  S.bank.forEach(q => { const b = bankOf(q); perBank[b] = (perBank[b] || 0) + 1; });
  const seenN = Object.keys(S.seen).length;
  const comp = S.bank.length ? Math.round(seenN / S.bank.length * 100) : 0;

  // 最近 7 天做题量
  const WD = ['日', '一', '二', '三', '四', '五', '六'];
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const dt = new Date();
    dt.setDate(dt.getDate() - i);
    const k = dkey(dt), dd = S.stats.daily[k] || { p: 0, c: 0 };
    days.push({ p: dd.p || 0, wd: WD[dt.getDay()], isToday: i === 0 });
  }
  const maxP = Math.max(1, ...days.map(x => x.p));
  const weekSum = days.reduce((a, x) => a + x.p, 0);

  // 分类正确率：找出拖后腿的
  const pcat = S.stats.per_cat || {};
  const weak = Object.keys(pcat).map(k => {
    const v = pcat[k] || {}, p = v.p || 0, c = v.c || 0;
    return { k, p, rate: p ? Math.round(c / p * 100) : 0 };
  }).filter(x => x.p >= 3).sort((a, b) => a.rate - b.rate).slice(0, 5);
  // 只有一类题（比如单个题库没分章节）时，分类对比没意义，改成列「最易错的题」
  const useWeak = weak.length >= 2;
  const byId = new Map(S.bank.map(q => [q.id, q]));
  const wrongTop = Object.keys(S.wrong).map(id => ({ q: byId.get(id), w: S.wrong[id] || {} }))
    .filter(x => x.q).sort((a, b) => (b.w.count || 0) - (a.w.count || 0)).slice(0, 5);

  // 模拟考试记录
  const exAll = S.exams || [];
  const ex = exAll.slice(0, 10);
  const exTrend = exAll.slice(0, 12).reverse();
  const exAvg = exAll.length
    ? Math.round(exAll.slice(0, 10).reduce((a, x) => a + x.score, 0) / Math.min(10, exAll.length)) : 0;
  const exBest = exAll.length ? Math.max(...exAll.map(x => x.score)) : 0;
  const fmt = ts => {
    const dt = new Date(ts), p = n => String(n).padStart(2, '0');
    return (dt.getMonth() + 1) + '/' + dt.getDate() + ' ' + p(dt.getHours()) + ':' + p(dt.getMinutes());
  };
  const fmtD = ts => (new Date(ts).getMonth() + 1) + '/' + new Date(ts).getDate();

  $('#statsBox').innerHTML = `
    <div class="stats-grid" style="margin-bottom:10px;">
      <div class="stat"><div class="v">${total}</div><div class="l">累计练习</div></div>
      <div class="stat"><div class="v">${rate}%</div><div class="l">总正确率</div></div>
      <div class="stat"><div class="v">${t.p}<span style="font-size:13px;font-weight:400;color:var(--muted);">/${S.goal}</span></div><div class="l">今日已练</div></div>
      <div class="stat"><div class="v">${streak}</div><div class="l">连续学习（天）</div></div>
    </div>
    <div class="card" style="margin-bottom:12px;">
      <div class="row" style="justify-content:space-between;align-items:baseline;">
        <span style="font-weight:700;">每日目标</span>
        <span class="muted" style="font-size:13px;">${left > 0 ? `今天还差 ${left} 题` : '今天已达标 ✓'}</span>

/* 今日学习：先清到期的错题，不够再补没做过的新题；全都做过了就随机保持手感 */
function startToday() {
  const due = dueList();
  const list = due.slice(0, 30);
  const target = Math.min(30, Math.max(10, goalLeft() || 10));
  if (list.length < target) {
    const have = new Set(list.map(q => q.id));
    const fresh = shuffleArr(S.bank.filter(q => !have.has(q.id) && !S.seen[q.id]));
    for (const q of fresh) { if (list.length >= target) break; list.push(q); }
  }
  if (!list.length) {                       // 全做过了，随机凑一轮
    const pool = shuffleArr(S.bank.slice());
    for (const q of pool) { if (list.length >= target) break; list.push(q); }
  }
  if (!list.length) return toast('题库是空的，先去「题库」页导入');
  S.lastRound = null; S.lastExam = null;
  switchTab('practice');
  startSession(list);
  toast(due.length ? `先复习 ${Math.min(due.length, 30)} 道到期错题` : `今日练习 ${list.length} 题`, 1900);
}

/* 题型补弱：统计页「去练最弱的一类」——正确率最低的那类先上，
   都没练过就挑题量最大的那类；开练前把范围重置成全库，免得只剩几道 */
function practiceTypeWeak() {
  const rows = QTYPES.map(t => typeStat(t.name, true)).filter(r => r.total);
  if (!rows.length) return toast('题库还是空的，先去导入题库');
  const rank = rows.slice().sort((a, b) =>
    (a.rate == null ? 999 : a.rate) - (b.rate == null ? 999 : b.rate) ||
    b.wrong - a.wrong || b.total - a.total);
  const pick = rank[0];
  const pool = typePool(pick.name, true);
  if (!pool.length) return toast('题库里没有' + pick.name + '题');
  S.meta.bank = '全部题库'; S.meta.cat = '全部';
  S.meta.qtype = pick.name; S.meta.range = '全部'; S.meta.kw = '';
  const n = S.meta.num == null ? 50 : S.meta.num;
  const list = n > 0 ? pool.slice(0, n) : pool.slice();
  scheduleSave();
  S.lastRound = null; S.lastExam = null;
  switchTab('practice');
  startSession(list);
  toast(pick.name + '题专项 · 这一轮 ' + list.length + ' 题', 2000);
}

/* 弱项专项：把正确率低的分类挑出来，错题排前面，凑一轮 20 题 */
function practiceWeak() {
  const pcat = S.stats.per_cat || {};
  const weakCats = Object.keys(pcat).filter(k => {
    const v = pcat[k] || {}, p = v.p || 0;
    return p >= 3 && (v.c || 0) / p < 0.85;
  });
  let pool = S.bank.filter(q => weakCats.includes(q.category || '未分类'));
  if (!pool.length) pool = S.bank.filter(q => S.wrong[q.id]);
  if (!pool.length) return toast('还没有足够的答题数据，先做几轮练习');
  const wrong = pool.filter(q => S.wrong[q.id]);
  const rest = pool.filter(q => !S.wrong[q.id]);
  for (let i = rest.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [rest[i], rest[j]] = [rest[j], rest[i]]; }
  const list = wrong.concat(rest).slice(0, 20);
  S.lastRound = null; S.lastExam = null;
  switchTab('practice');
  startSession(list);
  toast('弱项专项 ' + list.length + ' 题', 1800);
}

/* 题少分类少时用这个：把错得最多的题凑一轮 */
function practiceTopWrong() {
  const byId = new Map(S.bank.map(q => [q.id, q]));
  const list = Object.keys(S.wrong).map(id => ({ q: byId.get(id), w: S.wrong[id] || {} }))
    .filter(x => x.q)
    .sort((a, b) => (b.w.count || 0) - (a.w.count || 0))
    .slice(0, 10).map(x => x.q);
  if (!list.length) return toast('错题本是空的，继续刷题吧');
  S.lastRound = null; S.lastExam = null;
  switchTab('practice');
  startSession(list);
  toast('最易错 ' + list.length + ' 题', 1800);
}

    <div class="muted" style="text-align:center;font-size:12px;margin:14px 0 0;">
      设置会自动保存，下次打开还是这样
    </div>`;

  // 答题节奏
  $$('#setBox [data-adv]').forEach(b => b.onclick = () => {
    S.advance = b.dataset.adv;
    scheduleSave(); renderSettings();
    toast('答题节奏：' + ADV_NAME[S.advance]);
  });
  // 震动
  $('#swVib').onclick = () => {
    S.vibrate = !S.vibrate;
    scheduleSave(); renderSettings();
    if (S.vibrate) buzz(18);
    toast(S.vibrate ? '震动已开' : '震动已关');
  };
  // 字号
  $$('#setBox [data-font]').forEach(b => b.onclick = () => {
    S.font = b.dataset.font; applyFont(); scheduleSave(); renderSettings();
  });
  // 主题
  $$('#setBox [data-theme]').forEach(b => b.onclick = () => {
    S.theme = b.dataset.theme; applyTheme(); scheduleSave(); renderSettings();
  });
  // 每日目标
  $$('#setBox [data-goal]').forEach(b => b.onclick = () => {
    S.goal = Number(b.dataset.goal) || GOALS[1];
    scheduleSave(); renderSettings(); renderStats(); pushWidget();
  });
  // 考试日期（首页倒计时 / 每天建议题量靠它）
  const ed = $('#examDate');
  if (ed) ed.onchange = () => {
    const v = (ed.value || '').trim();
    S.examDate = /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : '';
    scheduleSave(); renderSettings(); renderPractice(); renderStats(); pushWidget();
    toast(S.examDate ? '考试日期已设好' : '已清除考试日期');
  };
  const bcd = $('#btnClearDate');
  if (bcd) bcd.onclick = () => {
    S.examDate = '';
    scheduleSave(); renderSettings(); renderPractice(); renderStats(); pushWidget();
    toast('已清除考试日期');
  };
  $('#btnBackupAll').onclick = exportFullBackup;
  $('#btnRestoreBackup').onclick = () => $('#restoreInput').click();
  $('#btnSetReset').onclick = async () => { await resetPracticeData(); renderSettings(); };
  $('#btnSetRestoreBank').onclick = async () => { await restoreBuiltinBank(); renderSettings(); };
  $('#setMask').onclick = closeSettings;
  $('#setBack').onclick = closeSettings;
}

function downloadJSON(name, obj) {
  const blob = new Blob([JSON.stringify(obj)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

// 完整备份：题库 + 记录 + 设置，换手机时一条龙搬过去
function exportFullBackup() {
  downloadJSON('考试宝宝完整备份_' + String(today()).replace(/-/g, '') + '.json', {
    app: 'exam-buddy-mobile', ver: 2, kind: 'full',
    exportedAt: new Date().toISOString(), count: S.bank.length,
    bank: S.bank, wrong: S.wrong, fav: S.fav, seen: S.seen,
    notes: S.notes, stats: S.stats, points: S.points, exams: S.exams,
    settings: {
      goal: S.goal, font: S.font, theme: S.theme, advance: S.advance,
      vibrate: S.vibrate, examDate: S.examDate,
    },
  });
  markBackedUp();
  toast('备份已导出：' + S.bank.length + ' 题 + 练习记录');
}

// 记一下「刚备份过」，首页那条提醒和设置页的时间戳都用它
function markBackedUp() {
  S.lastBackup = Date.now();
  S.backupTipOff = false;
  DB.set('lastBackup', S.lastBackup);
  if ($('#setPage') && $('#setPage').classList.contains('on')) renderSettings();
  renderPractice();
}

// 从备份恢复：完整备份 / 手机端练习数据 / 电脑版导出的题库都能认
async function applyBackup(data, fname) {
  if (!data || typeof data !== 'object') { alert('这个文件不是有效的备份'); return; }
  if (!Array.isArray(data.bank) && Array.isArray(data.questions)) {
    alert('这是一份题库文件，不是备份。\n\n请到「题库」页点「导入题库文件」导入它。');
    return;
  }
  const bank = Array.isArray(data.bank) ? data.bank : null;
  const hasRec = !!(data.wrong || data.fav || data.seen || data.stats);
  if (!bank && !hasRec) { alert('这个文件里没有认出题库或练习记录。\n\n备份需要是 App 里「导出完整备份」或「导出练习数据」生成的文件。'); return; }

  const lines = [];
  if (bank) lines.push('· 题库 ' + bank.length + ' 题（替换本机题库）');
  if (data.wrong) lines.push('· 错题 ' + Object.keys(data.wrong).length + ' 条');
  if (data.notes) lines.push('· 笔记 ' + Object.keys(data.notes).length + ' 条');
  if (data.fav) lines.push('· 收藏 ' + Object.keys(data.fav).length + ' 条');
  if (data.stats) lines.push('· 累计练习 ' + (data.stats.total || 0) + ' 次');
  if (!confirm('将从「' + fname + '」恢复：\n\n' + lines.join('\n') + '\n\n本机现有记录会被覆盖，恢复后当前这一轮练习会结束。确定继续？')) return;

  if (bank) {
    S.bank = bank.map(q => q.id ? q : Object.assign({}, q, { id: qid(q) }));
    await saveBank();
  }
  if (data.wrong) S.wrong = data.wrong;
  if (data.fav) S.fav = data.fav;
  if (data.seen) S.seen = data.seen;
  if (data.notes && typeof data.notes === 'object') S.notes = data.notes;
  if (data.stats) { S.stats = data.stats; if (!S.stats.daily) S.stats.daily = {}; }
  if (Array.isArray(data.points) && data.points.length) S.points = data.points;
  if (Array.isArray(data.exams)) S.exams = data.exams;
  const st = data.settings || data;
  if (st.goal) S.goal = Number(st.goal) || S.goal;
  if (st.font) S.font = st.font;
  if (st.theme) S.theme = st.theme;
  if (st.advance) S.advance = st.advance;
  if (typeof st.vibrate === 'boolean') S.vibrate = st.vibrate;
  if (typeof st.examDate === 'string') S.examDate = st.examDate;
  applyFont(); applyTheme();

  await DB.set('wrong', S.wrong);
  await DB.set('fav', S.fav);
  await DB.set('seen', S.seen);
  await DB.set('notes', S.notes);
  await DB.set('examDate', S.examDate);
  await DB.set('stats', S.stats);
  await DB.set('exams', S.exams);
  await DB.set('points', S.points);
  await DB.set('goal', S.goal);
  await DB.set('font', S.font);
  await DB.set('theme', S.theme);
  await DB.set('advance', S.advance);
  await DB.set('vibrate', S.vibrate);
  // 恢复后旧的一轮练习已经没有意义，清掉存档
  S.session = null; S.resume = null; S.lastRound = null; S.lastExam = null; S.flash = null;
  document.body.classList.remove('in-quiz');
  await DB.set('session', null);

  renderAll(); renderSettings(); pushWidget();
  toast('已从备份恢复', 2200);
}

$('#restoreInput').onchange = async e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';                       // 允许连续选同一个文件
  if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); }
  catch (err) { alert('文件读不出来，可能不是 .json 备份：\n' + err.message); return; }
  await applyBackup(data, f.name);
};

/* ================= tab 切换 ================= */
function switchTab(name) {
  $$('.view').forEach(v => v.classList.remove('on'));
  $('#v-' + name).classList.add('on');
  $$('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  $('main').scrollTop = 0;
}
$$('.tabbar button').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
$('#btnGear').onclick = openSettings;
$('#btnQuitTop').onclick = quitTop;
$$('#studySeg button').forEach(b => b.onclick = () => { S.seg = b.dataset.seg; renderStudy(); });

  addEventListener('load', function () {

  });

<script>
/* 导入备份：错题/收藏/已做/统计/考点，按并集合并，不覆盖本机已有记录 */
(function () {
  var btn = document.getElementById('btnImportData');
  if (!btn) return;
  btn.onclick = function () {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = async function () {
      var f = inp.files[0]; if (!f) return;
      var d;
      try { d = JSON.parse(await f.text()); } catch (e) { return toast('文件读不出来，不是合法的 JSON'); }
      if (!d || (!d.wrong && !d.fav && !d.seen)) return toast('这不是练习备份文件');
      var nw = 0, nf = 0, ns = 0;
      Object.keys(d.wrong || {}).forEach(function (k) { if (!S.wrong[k]) { S.wrong[k] = d.wrong[k]; nw++; } });
      Object.keys(d.fav || {}).forEach(function (k) { if (!S.fav[k]) { S.fav[k] = d.fav[k]; nf++; } });
      Object.keys(d.seen || {}).forEach(function (k) { if (!S.seen[k]) { S.seen[k] = d.seen[k]; ns++; } });
      if (d.stats) {
        S.stats.total += d.stats.total || 0;
        S.stats.correct += d.stats.correct || 0;
        Object.keys(d.stats.daily || {}).forEach(function (k) {
          var a = S.stats.daily[k] || { p: 0, c: 0 }, b = d.stats.daily[k] || { p: 0, c: 0 };
          S.stats.daily[k] = { p: Math.max(a.p || 0, b.p || 0), c: Math.max(a.c || 0, b.c || 0) };
        });
      }
      if (Array.isArray(d.points)) {
        var have = new Set(S.points.map(function (p) { return p.src + '|' + p.title; }));
        d.points.forEach(function (p) {
          var k = p.src + '|' + p.title;
          if (!have.has(k)) { S.points.push(p); have.add(k); }
        });
      }
      scheduleSave(); renderAll();
      toast('已导入：错题 +' + nw + '，收藏 +' + nf + '，已做 +' + ns, 2600);
    };
    inp.click();
  };
})();
</script>
