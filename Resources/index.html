T与频率f互为倒数（T=1/f），故成反比，选B。","bank":"电气基础"},{"id":"061510420185","type":"single","category":"电气基础","stem":"两个并联在10V电路中的电容器是10μF，现在将电路中电压升高至20V，此时每个电容器的电容将（）。","options":{"A":"增大","B":"减少","C":"不变","D":"先增大后减小"},"answer":"C","explanation":"电容器的电容是器件本身参数（由极板面积、介质、间距决定），与外加电压无关，电压升高时电容不变，选C。","bank":"电气基础"},{"id":"1454924a3be0","type":"single","category":"电气基础","stem":"电容器在电路中的作用是（）。","options":{"A":"通直流阻交流","B":"通交流隔直流","C":"通低频阻高频","D":"通直流"},"answer":"B","explanation":"电容器隔直通交：对直流相当于开路、对交流可导通，即通交流隔直流（B）。","bank":"电气基础"},{"id":"c5319a5d87f5","type":"single","category":"电气基础","stem":"我们把两点之间的电位之差称为（）。","options":{"A":"电动势","B":"电势差","C":"电压","D":"电压差"},"answer":"C","explanation":"电路中两点之间的电位之差称为电压（即电位差），选C。","bank":"电气基础"},{"id":"668775be6e1c","type":"single","category":"电气基础","stem":"快速切除线路和母线的短路故障，是提高电力系统（）的重要手段。","options":{"A":"静态稳定","B":"暂态稳定","C":"动态稳定"},"answer":"B","explanation":"快速切除线路和母线短路故障可缩短故障切除时间、减小加速面积，是提高电力系统暂态稳定的重要手段，选B。","bank":"电气基础"},{"id":"6959630bc3de","type":"single","category":"电气基础","stem":"电力系统的潮流计算主要是计算（）","options":{"A":"电压","B":"电流","C":"功率","D":"以上都是"},"answer":"D","explanation":"潮流计算是在给定运行条件下求解电网各节点电压和各支路功率分布，主要计算功率（同时得出电压、电流），选D。","bank":"电气基础"},{"id":"161bfbe53ec9","type":"single","category":"电气基础","stem":"带负荷测相量得到的负荷相角()。","options":{"A":"负荷中心的综合负荷相角，是由负荷性质决定的","B":"是母线电压与本线电流的相角差，是由系统潮流决定的","C":"线路阻抗角"},"answer":"B","explanation":"带负荷测相量（六角图）所得负荷相角是母线电压与本线路电流的相角差，由当时系统潮流（负荷大小与性质、网络结构）决定，选B。","bank":"电气基础"},{"id":"e4190fa574c3","type":"single","category":"电气基础","stem":"钳形电流表使用时应先用较大量程，然后再视被测电流的大小变换量程。切换量程时应（）","options":{"A":"直接转动量程开关","B":"先退出导线，再转动量程开关","C":"一边进线一边换挡"},"answer":"B","explanation":"钳形电流表测量中切换量程必须先退出被测导线再转动量程开关，以免切换时线圈感应产生高压或电弧损坏仪表，选B。","bank":"电气基础"},{"id":"938b7c268906","type":"single","category":"电气基础","stem":"电力系统中，负荷的类型不包括（）。","options":{"A":"电阻性负荷","B":"电感性负荷","C":"电容性负荷","D":"电池性负荷"},"answer":"D","explanation":"按负荷性质可分为电阻性、电感性、电容性负荷；“电池性负荷”不是电力系统负荷分类，选D。","bank":"电气基础"},{"id":"b15b29f38c03","type":"single","category":"电气基础","stem":"同步发电机的转速与（）有关。","options":{"A":"频率","B":"磁极对数","C":"电压","D":"频率和磁极对数"},"answer":"D","explanation":"同步发电机转速n=60f/p（p为磁极对数），故转速与频率f和磁极对数p均有关，选D。","bank":"电气基础"},{"id":"39a30e9ee5cc","type":"single","category":"电气基础","stem":"电力系统中，有功功率与无功功率的关系是（）。","options":{"A":"相互独立","B":"相互影响","C":"有功功率决定无功功率","D":"无功功率决定有功功率"},"answer":"B","explanation":"电力系统中，有功功率与无功功率在潮流分布上相互耦合、彼此影响（如无功影响电压进而影响有功分布），选B，并非完全独立。","bank":"电气基础"},{"id":"2d839c20e462","type":"single","category":"电气基础","stem":"电力系统中，备用容量的类型不包括（）。","options":{"A":"负荷备用","B":"事故备用","C":"检修备用","D":"经济备用"},"answer":"D","explanation":"系统备用容量通常分负荷备用、事故备用、检修备用、国民经济备用等，没有“经济备用”这一标准分类，选D。","bank":"电气基础"},{"id":"2bf52c76a85a","type":"single","category":"电气基础","stem":"输电线路的电阻主要与（）有关。","options":{"A":"导线材料","B":"导线长度","C":"导线截面积","D":"以上都是"},"answer":"D","explanation":"导线电阻R=ρL/S，与材料电阻率ρ、长度L、截面积S均有关，选D。","bank":"电气基础"},{"id":"0412746a43c0","type":"single","category":"电气基础","stem":"同步发电机的励磁方式有（）","options":{"A":"直流励磁机励磁","B":"交流励磁机励磁","C":"静止励磁","D":"以上都是"},"answer":"D","explanation":"同步发电机励磁方式包括直流励磁机励磁、交流励磁机励磁（他励/无刷）和静止励磁（机端励磁变压器），故选D。","bank":"电气基础"},{"id":"75beab1e20dd","type":"single","category":"电气基础","stem":"电力系统的电压等级中，110kV属于（）","options":{"A":"高压","B":"超高压","C":"特高压","D":"低压"},"answer":"A","explanation":"我国电压等级划分中，110kV属高压（35~220kV为高压），选A；超高压为330/500kV，特高压为1000kV及以上。","bank":"电气基础"},{"id":"4e9f1bbe78bc","type":"single","category":"电气基础","stem":"电力系统中，短路故障不包括（）","options":{"A":"三相短路","B":"两相短路","C":"单相接地短路","D":"过载"},"answer":"D","explanation":"短路故障指三相短路、两相短路、单相接地短路、两相接地短路等；过载（过负荷）属不正常运行状态，不是短路故障，选D。","bank":"电气基础"},{"id":"8c55eb4c9de1","type":"single","category":"电气基础","stem":"下列哪种设备属于一次设备（）","options":{"A":"电流表","B":"电压表","C":"断路器","D":"继电器"},"answer":"C","explanation":"一次设备是直接生产、输送、分配电能的设备，断路器属一次设备（C）；电流表、电压表、继电器均属二次设备（A、B、D）。","bank":"电气基础"},{"id":"748161ce623b","type":"single","category":"电气基础","stem":"我国电力系统的额定频率为（）","options":{"A":"60Hz","B":"50Hz","C":"40Hz","D":"30Hz"},"answer":"B","explanation":"我国电力系统额定频率为50Hz，选B（美国、日本部分地区为60Hz）。","bank":"电气基础"},{"id":"1145db945dc0","type":"single","category":"电气基础","stem":"电力系统的组成包括（）","options":{"A":"发电、输电","B":"发电、输电、变电","C":"发电、输电、变电、配电、用电","D":"发电、输电、变电、配电"},"answer":"C","explanation":"电力系统由发电、输电、变电、配电、用电五个环节组成，选C。","bank":"电气基础"},{"id":"560cafbd2d00","type":"single","category":"电气基础","stem":"电力系统中，短路电流的大小与（）有关。","options":{"A":"电源容量","B":"短路点位置","C":"系统阻抗","D":"以上都是"},"answer":"D","explanation":"短路电流大小与电源容量（短路功率）、短路点位置（决定系统阻抗）等均有关，选D。","bank":"电气基础"},{"id":"9e506789b937","type":"single","category":"电气基础","stem":"电力系统中，频率的调整主要通过（）实现。","options":{"A":"调节发电机的有功出力","B":"调节变压器的分接头","C":"调节无功补偿装置","D":"调节输电线路的电抗"},"answer":"A","explanation":"系统频率由有功功率供需平衡决定，频率调整主要通过调节发电机有功出力实现，选A；调分接头/无功装置主要调电压。","bank":"电气基础"},{"id":"0e966df5c3c6","type":"single","category":"电气基础","stem":"下列哪种传感器可以将非电量转换为电量（）","options":{"A":"温度传感器","B":"压力传感器","C":"光电传感器","D":"以上都是"},"answer":"D","explanation":"温度传感器、压力传感器、光电传感器等均可把温度、压力、光强等非电量转换为电量（电信号），故选D。","bank":"电气基础"},{"id":"508ea60aae18","type":"single","category":"电气基础","stem":"变压器的主要作用是（）","options":{"A":"变电压","B":"变电流","C":"变阻抗","D":"以上都是"},"answer":"D","explanation":"变压器通过电磁感应实现变电压，并由此变电流、变阻抗（一、二次电压/电流/阻抗按变比变换），选D。","bank":"电气基础"},{"id":"cb97a03f544f","type":"single","category":"电气基础","stem":"三相对称负载作三角形连接时，线电流与相电流的关系是（）","options":{"A":"线电流等于相电流","B":"线电流是相电流的根号3倍","C":"相电流是线电流的根号3倍","D":"线电流是相电流的2倍"},"answer":"B","explanation":"三相对称负载三角形（Δ）连接时，线电流=√3×相电流且滞后30°，选B。","bank":"电气基础"},{"id":"8e564e2d1832","type":"single","category":"电气基础","stem":"二进制数1011转换为十进制数是（）","options":{"A":"10","B":"11","C":"12","D":"13"},"answer":"B","explanation":"二进制1011=1×2³+0×2²+1×2¹+1×2⁰=8+2+1=11，选B。","bank":"电气基础"},{"id":"5996676623d3","type":"single","category":"电气基础","stem":"下列哪种逻辑门的输出只有在所有输入都为高电平时才为高电平（）","options":{"A":"与门","B":"或门","C":"非门","D":"或非门"},"answer":"A","explanation":"与门（AND）仅当所有输入均为高电平时输出才为高，选A；或门有一高即高，非门单输入取反，或非门全高才低。","bank":"电气基础"},{"id":"efaec273d511","type":"single","category":"电气基础","stem":"电力系统中，功率因数的定义是（）","options":{"A":"有功功率与视在功率之比","B":"无功功率与视在功率之比","C":"有功功率与无功功率之比","D":"视在功率与有功功率之比"},"answer":"A","explanation":"功率因数λ=cosφ=P/S，即有功功率与视在功率之比，选A。","bank":"电气基础"},{"id":"9872826763eb","type":"single","category":"电气基础","stem":"输电线路采用高压输电的主要目的是（）","options":{"A":"降低线路损耗","B":"提高输送容量","C":"减少线路投资","D":"以上都是"},"answer":"D","explanation":"采用高压输电可减小电流，从而降低线路损耗并提高输送容量（同时利于减小导线截面、节约投资），综合选D。","bank":"电气基础"},{"id":"b353dea8335d","type":"single","category":"电气基础","stem":"系统发生两相短路，短路点距母线远近与母线上负序电压值的关系是（）","options":{"A":"与故障点的位置无关","B":"故障点越近负序电压越高","C":"故障点越远负序电压越高","D":"不确定"},"answer":"B","explanation":"两相短路时负序电压在短路点最高、向电源侧递减；故障点离母线越近，母线上感受的负序电压越高，选B。","bank":"电气基础"},{"id":"e99b3ef65d46","type":"single","category":"电气基础","stem":"有一组负序对称向量，彼此间相位角是120°，它按（）方向旋转。","options":{"A":"顺时针","B":"逆时针","C":"平行方向"},"answer":"B","explanation":"负序对称分量三相之间相位差120°，其在空间上仍按逆时针方向旋转（相序为A—C—B），选B。","bank":"电气基础"},{"id":"6f405a076424","type":"single","category":"电气基础","stem":"电力系统发生振荡时，各点电压和电流（）。","options":{"A":"均会发生突变","B":"均作往复性摆动","C":"在振荡的频率高时会发生突变","D":"之间的相位角基本不变"},"answer":"B","explanation":"电力系统振荡是发电机间失步，各点电压和电流作平滑的往复性摆动而非突变，选B；振荡时无电流电压的突变（区别于短路）。","bank":"电气基础"},{"id":"d263c6f0eb51","type":"single","category":"电气基础","stem":"把三相不对称相量分解为正序、负序及零序三组对称分量时，其中正序分量A1为（）。","options":{"A":"1/3(A+αB+α^2C)","B":"1/3(A+α2B+αC)","C":"1/3(A+B+C)","D":"1/3(αA+α^2B+C)"},"answer":"A","explanation":"由对称分量法分解公式，正序分量A1=1/3(A+αB+α²C)，选A（α为逆时针转120°算子）。","bank":"电气基础"},{"id":"2667e5038b91","type":"single","category":"电气基础","stem":"一般情况下述哪种故障对电力系统稳定运行的影响最小（）。","options":{"A":"单相接地","B":"两相短路","C":"两相接地短路","D":"两相接地短路"},"answer":"A","explanation":"各类故障中单相接地短路对系统冲击最小、最易被继电保护处理，对稳定运行影响最小，选A。","bank":"电气基础"},{"id":"e0253159d8a1","type":"single","category":"电气基础","stem":"只有发生（），零序电流才会出现。","options":{"A":"相间故障","B":"振荡时","C":"不对称接地故障或非全相运行时","D":"短路"},"answer":"C","explanation":"零序电流只在不对称接地故障或三相不对称（非全相）运行时才出现，选C；相间故障（无接地）不产生零序，振荡时一般也无零序。","bank":"电气基础"},{"id":"5b13e030965f","type":"single","category":"电气基础","stem":"零序电流的分布，主要取决于（）。","options":{"A":"发电机是否接地","B":"变压器中性点接地的数目","C":"用电设备的外壳是否接地","D":"故障电流"},"answer":"B","explanation":"零序网络的通路取决于变压器中性点是否接地，零序电流分布主要取决于变压器中性点接地的数目与位置，选B。","bank":"电气基础"},{"id":"41207978394e","type":"single","category":"电气基础","stem":"输电线路空载时，其末端电压比首端电压()。","options":{"A":"高","B":"低","C":"相同"},"answer":"A","explanation":"输电线路空载（轻载）时，线路对地电容电流引起容升效应，使末端电压高于首端，选A（费兰梯效应）。","bank":"电气基础"},{"id":"81c074ae55a7","type":"single","category":"电气基础","stem":"有功功率流过线路电抗时，产生的功率损耗一定是（）。","options":{"A":"有功损耗","B":"无功损耗","C":"有功电能损耗","D":"无功电能损耗"},"answer":"B","explanation":"有功功率P流过线路电抗X时，产生的损耗ΔQ=P²X/U²为无功损耗（感性），选B；流过电阻才产生有功损耗。","bank":"电气基础"},{"id":"95ef7f0e53a5","type":"single","category":"电气基础","stem":"架空三相输电线，相间距离不变，增大导线半径时其线路电抗()。","options":{"A":"增大","B":"减小","C":"不变","D":"无法确定"},"answer":"B","explanation":"架空线路单位长度电抗x∝ln(D/r)，导线半径r增大使ln(D/r)减小，故电抗减小，选B（D为相间距离）。","bank":"电气基础"},{"id":"114ecc841c24","type":"single","category":"电气基础","stem":"在电力系统稳态分析的标幺值计算中，通常预先指定()基准值。","options":{"A":"一个","B":"二个","C":"三个","D":"任意个"},"answer":"B","explanation":"标幺值计算中通常只需预先指定两个相互独立的基本基准值（如功率基准Sb和电压基准Ub），其余（电流、阻抗基准）由关系导出，选B。","bank":"电气基础"},{"id":"b5af1c84c71f","type":"single","category":"电气基础","stem":"在电力系统的有名制中，电压、电流、功率的关系表达式为（）","options":{"A":"S=√3UI","B":"S=2UI","C":"S=UIcosφ","D":"S=UIsinφ"},"answer":"A","explanation":"三相电路有名制下视在功率S=√3UI（U、I为线电压、线电流），选A。","bank":"电气基础"},{"id":"990f56753db6","type":"single","category":"电气基础","stem":"电力系统振荡时，系统中存在（）分量电流。","options":{"A":"正序","B":"正序、负序和零序","C":"负序和零序","D":"正序和负序"},"answer":"A","explanation":"系统振荡属对称的不平衡状态，仅有正序分量，不出现负序和零序分量，选A。","bank":"电气基础"},{"id":"e15a46fe3c35","type":"single","category":"电气基础","stem":"下列哪个不是电力系统常见的不正常工作情况?","options":{"A":"过负荷","B":"最大运行方式","C":"过电压","D":"电力系统振荡"},"answer":"B","explanation":"电力系统的不正常工作情况包括过负荷、过电压、振荡等；“最大运行方式”是一种运行方式而非不正常情况，选B。","bank":"电气基础"},{"id":"d38c10acefb6","type":"single","category":"电气基础","stem":"11110010转换为16进制码为（）","options":{"A":"C3","B":"B4","C":"F2","D":"F1"},"answer":"C","explanation":"二进制11110010按4位分组：1111=F，0010=2，故十六进制为F2，选C。","bank":"电气基础"},{"id":"9afbbceb12cf","type":"judge","category":"电气基础","stem":"分布式电源接入会增大配电网短路电流","options":{"A":"对","B":"错"},"answer":"错","explanation":"逆变型分布式电源受限流控制，故障电流通常被限制在额定电流的1.2~2倍，对短路电流的助增有限，且可能改变上游短路电流的方向或幅值，故笼统说“会增大配电网短路电流”不准确。（注：同步机型DG仍会显著增大短路电流，本题答案为“错误”主要针对逆变型DG的限流特性，结论具有一定条件性。）","bank":"电气基础"},{"id":"539cf6c23be9","type":"judge","category":"电气基础","stem":"变压器高、中、低压侧复压元件由各侧电压经“或门”构成。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"按变压器保护惯例，高、中压侧复合电压闭锁元件由各侧电压经“或门”构成（任一侧复合电压动作即可开放），题干说法本身符合常规设计。（注：本题答案为“错误”存疑，常规设计中高、中压侧复压元件确由各侧电压经“或门”构成，应为正确。）","bank":"电气基础"},{"id":"1f79bc96d569","type":"judge","category":"电气基础","stem":"动态稳定是指电力系统受到小的扰动(如负荷和电压较小的变化)后，能自动地恢复到原来运行状态的能力。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"题干描述的是“小扰动后自动恢复”的能力，属静态稳定（或小扰动稳定）范畴；动态稳定指系统在扰动后保持较长过程稳定运行的能力（常涉及阻尼、振荡）。故错误，正确说法应为“静态稳定”。","bank":"电气基础"},{"id":"407546f26ef6","type":"judge","category":"电气基础","stem":"快速切除线路和母线的短路故障是提高电力系统静态稳定的重要手段。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"快速切除短路故障是提高电力系统暂态稳定（及动态稳定）的重要手段，不能提高静态稳定；静态稳定主要取决于运行参数、电压水平和系统结构。故错误。","bank":"电气基础"},{"id":"c9069bfc7d4f","type":"judge","category":"电气基础","stem":"电力系统产生动态不稳定的根本原因是系统的阻尼力矩为负值。()","options":{"A":"对","B":"错"},"answer":"对","explanation":"电力系统动态（小扰动）稳定的根本条件是系统具有正阻尼；当阻尼力矩为负值时，小扰动将引发增幅振荡而失稳。故正确。","bank":"电气基础"},{"id":"64fd73e6f729","type":"judge","category":"电气基础","stem":"出现非全相运行状态，不一定会出现负序电流和零序电流。()","options":{"A":"对","B":"错"},"answer":"对","explanation":"非全相运行（如单相断开）一般产生负序、零序分量，但当中性点不接地或断相处无零序通路（如△侧、不接地系统）时不一定出现零序；且某些断相组合下负序也不一定明显。故“不一定”正确。","bank":"电气基础"},{"id":"a91f6081213b","type":"judge","category":"电气基础","stem":"在系统发生非对称故障时，故障点的正序电压最低，向电源侧逐步增大为电源电势，而故障点的负序电压最高，向电源侧逐步降低为零。()","options":{"A":"对","B":"错"},"answer":"对","explanation":"非对称故障时，正序电压越靠近故障点越低（电源侧最高、接近电源电势），负序电压越靠近故障点越高（电源侧为零）。故正确。","bank":"电气基础"},{"id":"da4afbbafeaa","type":"judge","category":"电气基础","stem":"故障点的序网络与短路故障点的相别、类型无关，与短路故障点的位置、系统运行方式有关。()","options":{"A":"对","B":"错"},"answer":"对","explanation":"正、负、零序网络是系统本身的固有网络，其构成与故障点的相别、类型无关（仅影响边界条件），序网络本身取决于故障点位置和系统运行方式。故正确。","bank":"电气基础"},{"id":"23c64d0593cf","type":"judge","category":"电气基础","stem":"对于两相短路故障，任何时候母线上的正序电压都不会低于50%UN。()","options":{"A":"对","B":"错"},"answer":"对","explanation":"两相短路时，母线正序电压最低值（金属性短路、母线处）也不低于50%UN，这是两相短路序网分析的常规结论。故正确。","bank":"电气基础"},{"id":"95802f2b53a9","type":"judge","category":"电气基础","stem":"三相短路电流一定大于单相短路电流。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"在大接地电流系统中，当零序电抗X0小于正序X1时，单相短路电流可能大于三相短路电流，故“一定大于”不成立。故错误。","bank":"电气基础"},{"id":"578310ba6ee3","type":"judge","category":"电气基础","stem":"只要出现非全相运行状态，一定会出现负序电流和零序电流。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"同1073，非全相运行不一定产生零序（中性点不接地系统或△侧断相时无零序通路），故“一定会出现”错误。","bank":"电气基础"},{"id":"a17cb2864260","type":"judge","category":"电气基础","stem":"零序电流和零序电压由A、B、C三相同相位三次谐波组成。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"零序分量指A、B、C三相大小相等、相位相同的基频（或直流）分量，并非由三次谐波组成；三次谐波虽同相位但属谐波概念而非零序。故错误。","bank":"电气基础"},{"id":"997179560a70","type":"judge","category":"电气基础","stem":"对于正、负序电压而言，越靠近故障点其数值越小;而零序电压则是越靠近故障点数值越大。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"正序电压越靠近故障点越小（正确）；但负序电压与零序电压一样，越靠近故障点越大，而非越小。题干说负序“越靠近故障点越小”错误，故整句错误。","bank":"电气基础"},{"id":"aa495ae6140d","type":"judge","category":"电气基础","stem":"任何情况下线电压都不存在零序分量。()","options":{"A":"对","B":"错"},"answer":"对","explanation":"线电压为相间电压之差（uab=ua−ub），三相零序分量相互抵消，因此任何情况下线电压都不含零序分量。故正确。","bank":"电气基础"},{"id":"24b9c17fa5fc","type":"judge","category":"电气基础","stem":"故障电流中有直流分量时，直流分量将会以零序电流的形式反映出来。()","options":{"A":"对","B":"错"},"answer":"对","explanation":"故障电流中的非周期（直流）分量三相大小相等、方向相同，性质上等同于零序，在3I0=ia+ib+ic中将以3倍直流量反映出来。故正确。","bank":"电气基础"},{"id":"41bf23373ed8","type":"judge","category":"电气基础","stem":"YNd11升压变压器，YN侧发生相间短路时，d侧三相均有电流通过，对应于故障相得两相中的滞后相电流最大。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"YNd11变压器YN（高压）侧相间短路时，d（低压）侧三相均有电流，但实际分布为与故障相关的两相电流相等、第三相为零（或对应第三相最大），题述“故障相中滞后相电流最大”规律错误。故错误。","bank":"电气基础"},{"id":"0cea2156f9af","type":"judge","category":"电气基础","stem":"RS-485通信，数据速率达到10Mbit/s时，有效距离可以达到1200m。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"RS-485通信速率与传输距离成反比，10Mbit/s属高速，有效距离仅约十几米；1200m只能在很低速率（如≤100kbit/s）下达到。故错误。","bank":"电气基础"},{"id":"5f33c24b2ef8","type":"judge","category":"电气基础","stem":"电力系统中各电气设备分布电容的存在使发生短路时短路电流中会产生频率大于工频频率的谐波分量电流，该谐波分量电流的频率是工频频率的整数倍。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"分布电容引起的暂态分量属高频，但其频率并非工频的整数倍（不是谐波），而是与线路参数相关的非整数倍高频。故错误。","bank":"电气基础"},{"id":"dab29b17c1b8","type":"judge","category":"电气基础","stem":"我国高压输电通常采用三相四线制。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"我国高压输电采用三相三线制（不引出中性线）；三相四线制用于低压配电系统。故错误。","bank":"电气基础"},{"id":"c4bc5c17e397","type":"judge","category":"电气基础","stem":"一般来说，高低压电磁环网运行可以给变电站提供多路电源，提高对用户供电的可靠性，因此应尽可能采用这种运行方式。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"高低压电磁环网会降低系统稳定性、造成潮流分布不合理、增大短路容量，一般应避免，而非尽可能采用。故错误。","bank":"电气基础"},{"id":"a74411f3cd21","type":"judge","category":"电气基础","stem":"电力系统有功出力不足时，不只影响系统的频率，对系统电压的影响更大。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"有功出力不足主要影响系统频率（频率下降），电压主要受无功平衡影响；题干说“对电压影响更大”错误。故错误。","bank":"电气基础"},{"id":"7c0520e94275","type":"judge","category":"电气基础","stem":"由母线向线路送出有功功率100MW,无功功率100Mvar。电压超前电流的角度是135。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"母线送出P=100MW、Q=100Mvar（感性），φ=arctan(100/100)=45°，电流滞后电压45°，即电压超前电流45°，而非135°。故错误。","bank":"电气基础"},{"id":"ce2430e96d0a","type":"judge","category":"电气基础","stem":"在电力系统中，负荷吸取的有功功率与系统频率的变化有关，系统频率升高时，负荷吸取的有功功率随着增高，频率下降时，负荷吸取的有功功率随着下降。()","options":{"A":"对","B":"错"},"answer":"对","explanation":"负荷的有功功率随频率变化（负荷调节效应），频率升高时负荷吸收有功增加，频率下降时减少。故正确。","bank":"电气基础"},{"id":"71b9da5125c5","type":"judge","category":"电气基础","stem":"距离继电器能判别线路的区内、区外故障，是因为加入了带记忆的故障相电压极化量。","options":{"A":"对","B":"错"},"answer":"错","explanation":"距离继电器判别区内/区外靠测量阻抗与整定阻抗比较；带记忆极化电压主要用于消除电压死区和保证方向性，并非判别区内外的原因。故错误。","bank":"电气基础"},{"id":"7d4f60f43d72","type":"judge","category":"电气基础","stem":"过渡电阻不影响序电压和序电流之间的相位关系，也不影响突变量电压和突变量电流间的相位关系。","options":{"A":"对","B":"错"},"answer":"错","explanation":"过渡电阻会改变故障点等效阻抗，从而影响序电压与序电流、突变量电压与突变量电流之间的相位关系及测量阻抗。故错误。","bank":"电气基础"},{"id":"a0e86f8c1f80","type":"judge","category":"电气基础","stem":"平行线路之间存在零序互感，当相邻平行线流过零序电流时，将在线路上产生感应零序电动势，有可能改变零序电流大小，但不会改变零序电流与零序电压的相量关系。","options":{"A":"对","B":"错"},"answer":"错","explanation":"平行线路零序互感产生的感应电动势既会改变零序电流幅值，也会改变零序电流与零序电压的相量关系（见1094）。故“不会改变相量关系”错误。","bank":"电气基础"},{"id":"c5e4059a6a81","type":"judge","category":"电气基础","stem":"平行线路之间存在零序互感，当相邻平行线流过零序电流时，将在线路上产生感应零序电势，对线路零序电流幅值产生影响，有时甚至改变零序电流与零序电压的相量关系。","options":{"A":"对","B":"错"},"answer":"对","explanation":"平行线路零序互感使相邻线零序电流在线路上感应零序电动势，影响本线零序电流幅值，且因感应电势相位的加入，可能改变零序电流与零序电压的相量关系。故正确。","bank":"电气基础"},{"id":"4cf078d5af3d","type":"judge","category":"电气基础","stem":"运行站个人笔记本如果升级病毒库且进行杀毒处理的，可以通过网线接入站控层网络","options":{"A":"对","B":"错"},"answer":"错","explanation":"运行站生产控制大区（站控层）网络有严格安全防护规定，禁止未经许可的外部设备（即便已杀毒）随意接入，以防病毒或非法访问。故错误。","bank":"电气基础"},{"id":"32c688835f70","type":"judge","category":"电气基础","stem":"二极管只要工作在反向击穿区,一定会被击穿。","options":{"A":"对","B":"错"},"answer":"错","explanation":"反向击穿区需反向电压达到击穿值才会击穿；稳压二极管专门工作在反向击穿区而不损坏，普通二极管达击穿值才损坏。故“只要工作在反向击穿区一定会被击穿（损坏）”不准确。故错误。","bank":"电气基础"},{"id":"181e10e6f2fa","type":"judge","category":"电气基础","stem":"直流电弧的烧伤较交流电弧烧伤严重。","options":{"A":"对","B":"错"},"answer":"对","explanation":"直流电弧无自然过零点，难以自行熄灭，电弧持续烧灼更重，故直流电弧烧伤较交流严重。故正确。","bank":"电气基础"},{"id":"5237beece729","type":"judge","category":"电气基础","stem":"在串联电路中,电路总电压等于各电阻的分电压之和。","options":{"A":"对","B":"错"},"answer":"对","explanation":"串联电路中总电压等于各电阻分电压之和（基尔霍夫电压定律）。故正确。","bank":"电气基础"},{"id":"c560381f1910","type":"judge","category":"电气基础","stem":"在串联电路中,电流处处相等。","options":{"A":"对","B":"错"},"answer":"对","explanation":"串联电路电流处处相等。故正确。","bank":"电气基础"},{"id":"5f1f49477a8c","type":"judge","category":"电气基础","stem":"电压表内阻越大越好。","options":{"A":"对","B":"错"},"answer":"对","explanation":"电压表并联测量，内阻越大则分流越小、对被测电路影响越小，测量越准确，故内阻越大越好。故正确。","bank":"电气基础"},{"id":"637ba0d9fb7b","type":"judge","category":"电气基础","stem":"按功能模块设计,采用主从CPU协同工作方式,各功能模块之间无通讯,由监控主机与各功能子系统通讯的方式称为集中式变电站自动化系统。","options":{"A":"对","B":"错"},"answer":"错","explanation":"题干描述的是各功能模块分散、由监控主机与各子系统通讯的分布式（分散式）结构；集中式是由单台（或主从）计算机集中完成全部功能。故错误。","bank":"电气基础"},{"id":"42bee863a04b","type":"judge","category":"电气基础","stem":"电气原理图中的所有元件均按未通电状态或无外力作用时的状态画出。","options":{"A":"对","B":"错"},"answer":"对","explanation":"电气原理图按国家标准，所有元件均按未通电（未动作）或无外力作用时的常态绘制。故正确。","bank":"电气基础"},{"id":"a138997dc860","type":"judge","category":"电气基础","stem":"几个电阻并联后的总电阻等于各并联电阻的倒数之和。","options":{"A":"对","B":"错"},"answer":"错","explanation":"并联总电阻的倒数等于各电阻倒数之和（1/R=Σ1/Ri），而非总电阻等于倒数之和。故错误。","bank":"电气基础"},{"id":"626d23b4cf85","type":"judge","category":"电气基础","stem":"电感性负载并联电容器后,电压和电流之间的电角度会减小。","options":{"A":"对","B":"错"},"answer":"对","explanation":"电感性负载并联电容器可补偿无功功率、提高功率因数，使电压与电流的相位差（电角度）减小。故正确。","bank":"电气基础"},{"id":"49a4c6e2be34","type":"judge","category":"电气基础","stem":"禁止与工作无关人员在起重工作区域内行走或停留。","options":{"A":"对","B":"错"},"answer":"对","explanation":"为保障安全，禁止与工作无关人员在起重工作区域内行走或停留。故正确。","bank":"电气基础"},{"id":"3f14f81c9081","type":"judge","category":"电气基础","stem":"起吊物件应绑扎牢固，若物件有棱角或特别光滑的部位时，在棱角和滑面与绳索（吊带）接触处应加以包垫。","options":{"A":"对","B":"错"},"answer":"对","explanation":"物件有棱角或特别光滑部位时，棱角、滑面与绳索接触处应加包垫，防止磨伤绳索或打滑。故正确。","bank":"电气基础"},{"id":"254b3865b63e","type":"judge","category":"电气基础","stem":"起重搬运时只能由一人统一指挥，必要时可设置中间指挥人员帮助指挥。","options":{"A":"对","B":"错"},"answer":"错","explanation":"起重搬运应由一人统一指挥，不得另设中间指挥人员，以免指令混乱。题干“可设置中间指挥人员帮助指挥”错误。故错误。","bank":"电气基础"},{"id":"0b89ecca0c9b","type":"judge","category":"电气基础","stem":"梯子应坚固完整，有防滑措施。梯子的支柱应能承受作业人员及所携带的工具、材料攀登时的总重量。","options":{"A":"对","B":"错"},"answer":"对","explanation":"梯子应坚固完整并有防滑措施，其支柱应能承受作业人员及所携带工具、材料攀登时的总重量。故正确。","bank":"电气基础"},{"id":"d10c29aa6eb1","type":"judge","category":"电气基础","stem":"高处作业应一律使用工具袋。","options":{"A":"对","B":"错"},"answer":"对","explanation":"高处作业应一律使用工具袋，防止工具掉落伤人。故正确。","bank":"电气基础"},{"id":"ee2dcf51044d","type":"judge","category":"电气基础","stem":"补偿电容器的容量越大越好。","options":{"A":"对","B":"错"},"answer":"错","explanation":"并联补偿容量并非越大越好，过补偿会引起电压升高、无功倒送，增加损耗。故错误。","bank":"电气基础"},{"id":"a67a5f19470e","type":"judge","category":"电气基础","stem":"变压器容量的单位是kW。","options":{"A":"对","B":"错"},"answer":"错","explanation":"变压器容量指视在功率，单位为kVA（或MVA），kW是有功功率单位。故错误。","bank":"电气基础"},{"id":"d2ab39b31ac9","type":"judge","category":"电气基础","stem":"在正常情况下，避雷器内部处在导通状态。","options":{"A":"对","B":"错"},"answer":"错","explanation":"避雷器正常时呈高阻态（截止），仅在过电压达到动作值时才导通泄流。故“正常导通”错误。","bank":"电气基础"},{"id":"c5d9ac788e1e","type":"judge","category":"电气基础","stem":"有两个频率和初相位不同的正选交流电压U1和U2，若它们的有效值相同，则瞬时值也相同。","options":{"A":"对","B":"错"},"answer":"对","explanation":"两个正弦交流电压即使有效值相同，若频率或初相位不同，其瞬时值并不相同（瞬时值取决于幅值、频率、初相）。（注：本题答案为“正确”存疑，按正弦量定义，频率、初相位不同则瞬时值一般不同，应判“错误”。）","bank":"电气基础"},{"id":"ae6f8d7f1fb9","type":"judge","category":"电气基础","stem":"巡视室内设备，应随手关门。","options":{"A":"对","B":"错"},"answer":"对","explanation":"巡视室内设备应随手关门，防止小动物进入及保障安全。故正确。","bank":"电气基础"},{"id":"a7e1cf1a8929","type":"judge","category":"电气基础","stem":"高压设备上工作，在手车开关拉出后，应观察隔离挡板是否可靠封闭。","options":{"A":"对","B":"错"},"answer":"对","explanation":"高压设备手车开关拉出后，应检查观察隔离挡板是否可靠封闭，防止误入带电间隔。故正确。","bank":"电气基础"},{"id":"4aa7a7779287","type":"judge","category":"电气基础","stem":"事故紧急抢修工作，指电气设备发生故障被迫紧急停止运行，需按计划恢复的抢修和排除故障的工作。","options":{"A":"对","B":"错"},"answer":"错","explanation":"事故紧急抢修指设备突发故障紧急停运、需立即恢复的抢修；题干“需按计划恢复”错误，紧急抢修可不填工作票而用紧急抢修单，并非按计划。故错误。","bank":"电气基础"},{"id":"a999265d4c4f","type":"judge","category":"电气基础","stem":"变压器内部故障系指变压器线圈内发生故障。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"变压器内部故障不仅指线圈内故障，还包括铁芯故障、内部放电、分接开关故障、油面异常等。故错误。","bank":"电气基础"},{"id":"285e6310debf","type":"judge","category":"电气基础","stem":"变压器励磁涌流含有大量的高次谐波分量，并以2次谐波为主。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"变压器励磁涌流含大量高次谐波，其中以2次谐波为主，常作为涌流识别（闭锁）依据。故正确。","bank":"电气基础"},{"id":"64ef15253b2b","type":"judge","category":"电气基础","stem":"变压器励磁涌流中含有大量的高次谐波，其中以3次谐波为主。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"励磁涌流以2次谐波为主，而非3次谐波。故错误。","bank":"电气基础"},{"id":"88a977c9f18e","type":"judge","category":"电气基础","stem":"变压器涌流具有如下特点：①有很大成分的非周期分量，往往使涌流偏离时间轴的一侧;②有大量的高次谐波分量，并以5次谐波为主;③涌流波形之间出现间断。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"涌流特点含大非周期分量、以2次谐波为主、波形间断；题干说“以5次谐波为主”错误（应为2次）。故错误。","bank":"电气基础"},{"id":"b59079eadf32","type":"judge","category":"电气基础","stem":"相对于变压器容量而言，大容量变压器励磁涌流的标么值大于小容量变压器励磁涌流的标么值。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"相对变压器容量，小容量变压器励磁涌流标幺值更大，大容量变压器因额定电流大，涌流标幺值反而较小。故错误。","bank":"电气基础"},{"id":"2b34eb2f22c6","type":"judge","category":"电气基础","stem":"Y/△-11变压器在角侧发生两相短路，Y侧三相电流中有两相电流为另一相电流的2倍。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"Y/△-11变压器△侧两相短路时，Y侧（星侧）是一相电流为零、另两相电流大小相等方向相反，并非“两相为另一相2倍”（后者是星侧两相短路时角侧的特征）。故错误。","bank":"电气基础"},{"id":"99aca35084f9","type":"judge","category":"电气基础","stem":"YN/d11变压器的YN侧发生AC相间短路，则d侧a、c相电流大小相等，方向相同。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"YN/d11变压器YN侧AC相间短路时，d侧三相均有电流，其中与故障无关的一相（b相）最大，a、c两相大小相等、方向相反（非“方向相同”）。故错误。","bank":"电气基础"},{"id":"1f5444d88f73","type":"judge","category":"电气基础","stem":"YN/d11变压器d侧的负序电流在相位上超前于YN侧的负序电流30°。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"YNd11接线中，d侧负序电流相对YN侧负序电流滞后30°（正序才超前30°），故“d侧负序超前YN侧30°”错误。故错误。","bank":"电气基础"},{"id":"cd001258e7f2","type":"judge","category":"电气基础","stem":"同一母线上有两台变压器，其中一台正常运行，另一台空载合闸，空载合闸变压器的励磁涌流处于峰值附近时，母线电压的瞬时值较低，此时不产生和应涌流。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"和应涌流由并列运行变压器间磁通耦合产生；当空载合闸变压器涌流处于峰值附近、母线电压瞬时值较低时，非周期分量小，不易激发运行变压器的和应涌流。故正确。","bank":"电气基础"},{"id":"a9bf9da9c1c0","type":"judge","category":"电气基础","stem":"变压器过电压将会产生5次谐波和2次谐波分量，其中以2次谐波分量为主。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"变压器过励磁（过电压）时励磁电流中5次谐波分量显著增大（常作过励磁判据），而非以2次谐波为主（2次谐波是涌流特征）。故错误。","bank":"电气基础"},{"id":"cc0f0f4648d4","type":"judge","category":"电气基础","stem":"双绕组变压器的励磁涌流分布在变压器两侧，大小为变比关系。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"励磁涌流仅出现在合闸（电源）侧，另一侧（无源侧）基本无涌流，并非“分布在两侧且为变比关系”。故错误。","bank":"电气基础"},{"id":"dd4b91505e87","type":"judge","category":"电气基础","stem":"励磁涌流的衰减时间为1.5~2s.（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"励磁涌流衰减时间随变压器容量、铁芯等而变，小型约0.5~1s，大型可达数秒至更长，并非固定为1.5~2s。故错误。","bank":"电气基础"},{"id":"80a0f4c1f361","type":"judge","category":"电气基础","stem":"变压器的励磁涌流的大小与变压器额定电流幅值的倍数有关，变压器容量越小，励磁涌流对额定电流幅值的倍数越大。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"变压器容量越小，其额定电流越小，励磁涌流相对额定电流的标幺倍数越大。故正确。","bank":"电气基础"},{"id":"abbe5140a6d1","type":"judge","category":"电气基础","stem":"对于YNd11变压器，若高压侧B相电流是AC相的两倍，且方向相反，则可确定为低压侧发生AB两相短路。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"YNd11变压器低压（角）侧两相短路时，高压（星）侧表现为一相电流为零、另两相相等，并不出现“某相为另两相2倍”；故不能据所述高压侧电流特征判定为低压侧AB两相短路。故错误。","bank":"电气基础"},{"id":"e4c829405650","type":"judge","category":"电气基础","stem":"某三绕组变压器，三个绕组容量配合为100/50/100，是指三个绕组间的实际功率分配比例为2/1/2。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"三绕组变压器容量配合100/50/100指各绕组额定容量比，并非实际功率分配比例（实际功率分配由运行方式决定）。故错误。","bank":"电气基础"},{"id":"996f056d0847","type":"judge","category":"电气基础","stem":"低电压选相原理是当仅有一个相电压低于某一门槛电压且有零序电压时选该相为故障相。当有两个或两个以上相电压，或者一个或一个以上相间电压低于某一门槛电压时选为多相故障。低电压选相元件在单侧电源的负荷侧使用时简单、选相正确。","options":{"A":"对","B":"错"},"answer":"对","explanation":"低电压选相按相电压/相间电压低于门槛并有零序电压判单相/多相故障，在单侧电源负荷侧使用简单且选相正确（因电源侧无反方向电源干扰）。故正确。","bank":"电气基础"},{"id":"a11172c16da0","type":"judge","category":"电气基础","stem":"工作电压突变量选相元件工作灵敏，选相正确。在单侧电源的负荷侧也能进行选相。但是由于它运用的是电压、电流的变化量，所以在短路稳态时无法选相。在转换性故障时可能不能指出最终的故障类型。","options":{"A":"对","B":"错"},"answer":"对","explanation":"工作电压突变量选相元件灵敏、在负荷侧也能选相，但其基于变化量，短路稳态时无法选相，转换性故障可能不能指明最终类型。描述符合实际。故正确。","bank":"电气基础"},{"id":"968d1ba57240","type":"judge","category":"电气基础","stem":"断路器非全相运行时，会产生负序电流，其大小随着负荷电流的增大而增大。","options":{"A":"对","B":"错"},"answer":"对","explanation":"断路器非全相运行产生负序电流，其大小与流经断路器的负荷电流成正比，负荷电流越大负序越大。故正确。","bank":"电气基础"},{"id":"22637afebb18","type":"judge","category":"电气基础","stem":"欠补偿和全补偿方式电网发生故障时，都容易出现数值很大的过电压。","options":{"A":"对","B":"错"},"answer":"对","explanation":"欠补偿、全补偿方式电网接近谐振点，发生故障或操作时易产生数值很大的谐振过电压。故正确。","bank":"电气基础"},{"id":"7ff0ed3cde58","type":"judge","category":"电气基础","stem":"远距离输电线路上，当终端断路器因故跳开后，在“电容效应”的影响下终端处会产生过电压，因此要在长距离输电线路上采用过压远跳始端断路器，防止过电压对电气设备的伤害。","options":{"A":"对","B":"错"},"answer":"对","explanation":"远距离空载线路因电容效应（费兰梯效应）末端电压升高，终端断路器跳开后更明显，需采用远跳保护跳开始端断路器以防过电压损坏设备。故正确。","bank":"电气基础"},{"id":"95698d9239ef","type":"judge","category":"电气基础","stem":"当发生近处的永久性故障时，故障相断路器跳开以后线路侧的故障相电压接近于零，而当是瞬时性的故障或者是远处的永久性故障时，故障相断路器跳开以后线路侧的故障相电压由于非故障相的电流经过相间互感、非故障相的电压经过相间电容的影响其值不为零。","options":{"A":"对","B":"错"},"answer":"对","explanation":"近处永久性故障跳开后故障相电压近零；瞬时性或远处永久故障跳开后，因非故障相电流经互感、电压经电容耦合，故障相电压不为零。描述正确。故正确。","bank":"电气基础"},{"id":"68e4f51b0dea","type":"judge","category":"电气基础","stem":"电力系统一次设备包括发电机、变压器、母线、输电线路、电动机、电抗器、电容器、仪表等。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"发电机、变压器、母线、线路、电动机、电抗器、电容器属一次设备；仪表属二次设备，故“包括仪表”错误。故错误。","bank":"电气基础"},{"id":"b3e7f673f4d5","type":"judge","category":"电气基础","stem":"电力系统发生了不对称短路一定会出现负序分量。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"不对称短路（两相、单相、两相接地）均产生负序分量。故正确。","bank":"电气基础"},{"id":"21db4e72ca15","type":"judge","category":"电气基础","stem":"三相短路时，零序电流和负序电流均为零。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"三相短路为对称短路，系统中无负序、零序分量（仅正序）。故正确。","bank":"电气基础"},{"id":"4be7b6e3a308","type":"judge","category":"电气基础","stem":"无论线路末端开关是否合入，始端电压必定高于末端电压。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"线路末端带电源（如发电机、无功倒送）或空载电容效应时，末端电压可能高于始端，并非“必定高于”。故错误。","bank":"电气基础"},{"id":"c8d0c1063bcf","type":"judge","category":"电气基础","stem":"零序电压和零序电流一定是三次谐波。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"零序分量与三次谐波是两个不同概念，零序是三相同相的基频分量，并非一定是三次谐波。故错误。","bank":"电气基础"},{"id":"1000852b8c2a","type":"judge","category":"电气基础","stem":"在现有系统下，线路上同故障点上、同一运行方式下，三相短路电流一般小于单相短路电流。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"一般（X0>X1）三相短路电流大于单相短路电流；题干“三相一般小于单相”错误。故错误。","bank":"电气基础"},{"id":"69c0d79fb456","type":"judge","category":"电气基础","stem":"平行线路之间存在零序互感，当相邻平行线流过零序电流时，将在线路上产生感应零序电势，但不会改变零序电流与零序电压的相量关系。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"同1094，平行线路零序互感会改变零序电流与零序电压的相量关系，故“不会改变”错误。故错误。","bank":"电气基础"},{"id":"8b44c3633c4c","type":"judge","category":"电气基础","stem":"在短路电流实用计算中，通常只用周期分量电流有效值来计算短路容量。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"短路容量Sk=√3·U·Ik，其中Ik为短路电流周期分量有效值，实用计算中短路容量确用周期分量有效值计算。（注：本题答案为“错误”存疑，按短路容量标准定义Sk=√3U·Ik，Ik即周期分量有效值，题干说法应为正确。）","bank":"电气基础"},{"id":"68a00ad910aa","type":"judge","category":"电气基础","stem":"励磁涌流中含有大量的高次谐波，其中以2次谐波为主。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"励磁涌流是变压器空载合闸或外部故障切除后电压恢复时产生的暂态励磁电流，含有大量非周期分量和各次谐波，其中二次谐波含量最大，故常用二次谐波制动原理闭锁差动保护，防止误动。题干正确。","bank":"电气基础"},{"id":"1bd53b700047","type":"judge","category":"电气基础","stem":"变压器的断路器失灵时，除应跳开失灵断路器相邻的全部断路器外，还必须跳开本变压器其他侧的断路器（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"断路器失灵保护动作时，应跳开失灵断路器所在母线上的全部断路器；对于变压器失灵，为防止故障从其他侧倒送电，通常还要求跳开变压器其余各侧断路器。题干把“相邻的全部断路器”与“跳开本变压器其他侧断路器”并列，表述不够准确。判为错误。（注：按现行规程，变压器断路器失灵保护一般应跳开其余各侧断路器，本题判错存疑）","bank":"电气基础"},{"id":"69a39cca76d1","type":"judge","category":"电气基础","stem":"把三相不对称相量ABC分解为正序、负序及零序三组对称分量时，A相正序分量A1和A相负序分量A2的计算式分别为：A1=1/3（A+a2B+aC）A2=1/3（A+aB+a2C）（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"对称分量法公式为：A相正序 A1=(1/3)(A+a²B+aC)，A相负序 A2=(1/3)(A+aB+a²C)，其中 a=e^(j120°)。题目将正、负序算式中的 a、a² 系数位置写反，故错误。","bank":"电气基础"},{"id":"104c5cb51505","type":"judge","category":"电气基础","stem":"在同一点发生相间短路，两相短路电流为三相短路电流的0.866倍（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"同一故障点处，两相（相间）短路电流与三相短路电流满足 I(2)=(√3/2)I(3)≈0.866 I(3)，故两相短路电流约为三相短路电流的0.866倍。题干正确。","bank":"电气基础"},{"id":"54f6a071a1c3","type":"judge","category":"电气基础","stem":"变比K=n的Y／△-11变压器，Y侧发生BC相短路，短路电流为ID，则△侧的A、C相电流应同相，且等于nId/3（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"Y/△-11 接线变压器星形侧两相短路时，三角形侧各相电流的分布须按接线组别进行相量换算，故障相所对应绕组的电流最大，且各相电流相位由△-11组别决定，并非如题所述 A、C 相电流同相且等于 nId/3。判为错误。","bank":"电气基础"},{"id":"1f433a15e1e6","type":"judge","category":"电气基础","stem":"由于距离继电器都要反映补偿电压或其它由电压与电流组成的复合电压，故为了做出它们的相量不仅要确定电压和电流的相位，但不要确定它们的幅值（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"作距离继电器补偿电压或复合电压相量图时，既要确定电压、电流的相位关系，也要确定其幅值大小，才能进行相量合成与比较。题目中“不要确定它们的幅值”说法错误，故判错。","bank":"电气基础"},{"id":"0e6d1f62eb5a","type":"judge","category":"电气基础","stem":"线路故障时，从母线流向故障点的电流大小及方向与系统中性点的位置无关（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"线路故障时由电源经线路流向故障点的短路电流（正、负序分量）由电源电势和系统阻抗决定，其大小和方向与系统中性点是否接地及中性点位置无关（中性点位置只影响零序网络与零序电流分布）。题干正确。","bank":"电气基础"},{"id":"73f0dd8f0274","type":"judge","category":"电气基础","stem":"由母线向线路送出有功100MW,无功100MW。电压超前电流的角度是45度（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"母线向线路送出有功 P 与无功 Q 相等时，功率因数角 φ 满足 tanφ=Q/P=1，即 φ=45°；送出感性无功时电流滞后电压，亦即电压超前电流45°。题干正确。","bank":"电气基础"},{"id":"d293ba8f397c","type":"judge","category":"电气基础","stem":"变压器励磁涌流中含有大量二次谐波，可通过谐波制动原理躲涌流","options":{"A":"对","B":"错"},"answer":"对","explanation":"变压器空载合闸产生的励磁涌流含有大量二次谐波，差动保护常采用二次谐波制动（或波形间断角判据）来躲过励磁涌流，防止误动。题干正确。","bank":"电气基础"},{"id":"6bb59980ee33","type":"judge","category":"电气基础","stem":"特高压输电是指1000kV及以上电压等级，可减少线路损耗和提高输送容量","options":{"A":"对","B":"错"},"answer":"对","explanation":"特高压输电通常指交流1000kV及以上、直流±800kV及以上电压等级，可提高输送容量并降低线路损耗。题干正确。","bank":"电气基础"},{"id":"91f3704a6ef2","type":"judge","category":"电气基础","stem":"电磁环网是指不同电压等级通过变压器电磁耦合形成的环路，易导致系统稳定问题","options":{"A":"对","B":"错"},"answer":"对","explanation":"电磁环网是指不同电压等级电网通过变压器电磁耦合形成的环路，电磁环网中潮流难以控制、短路水平升高，易引发稳定问题。题干正确。","bank":"电气基础"},{"id":"943601d196be","type":"judge","category":"电气基础","stem":"调度自动化系统中的SCADA功能主要用于数据采集与监控","options":{"A":"对","B":"错"},"answer":"对","explanation":"SCADA（数据采集与监视控制系统）是调度自动化的基础功能，主要用于对远方厂站进行数据采集、监视与控制。题干正确。","bank":"电气基础"},{"id":"a30c353c6718","type":"judge","category":"电气基础","stem":"三相电路中，有功功率P=√3UIcosφ，其中φ为线电压与线电流的相位差","options":{"A":"对","B":"错"},"answer":"错","explanation":"三相功率公式 P=√3 U线 I线 cosφ 中的 φ 应为功率因数角（相电压与相电流的相位差/负载阻抗角）。虽对称三相中该角数值上等于线电压与线电流夹角，但严格表述 φ 指相电压与相电流相位差，题目表述不严谨，判为错误。（注：实际数值相同，此题存疑）","bank":"电气基础"},{"id":"3ee8c4a4725a","type":"judge","category":"电气基础","stem":"变压器的短路损耗与负载电流的平方成正比","options":{"A":"对","B":"错"},"answer":"对","explanation":"变压器短路损耗主要是负载损耗（铜损）I²R，与负载电流的平方成正比，故与负载电流平方成正比。题干正确。","bank":"电气基础"},{"id":"f4b70c9495cd","type":"judge","category":"电气基础","stem":"标幺值计算中，基准值的选择不影响物理量的相对关系","options":{"A":"对","B":"错"},"answer":"对","explanation":"标幺值=实际值/基准值，改变基准值只会使各量按同一比例折算，不改变它们之间的相对关系（如比值、相位）。题干正确。","bank":"电气基础"},{"id":"42df0ac8aea1","type":"judge","category":"电气基础","stem":"快速切除故障是提高系统暂态稳定的最有效措施","options":{"A":"对","B":"错"},"answer":"对","explanation":"提高电力系统暂态稳定的措施中，快速切除故障（快速继电保护及快速断路器）被公认是最有效、最主要的措施。题干正确。","bank":"电气基础"},{"id":"1befaf69c1b5","type":"judge","category":"电气基础","stem":"电力系统静态稳定是指系统受到大扰动后保持同步的能力","options":{"A":"对","B":"错"},"answer":"错","explanation":"静态稳定是指系统受到微小扰动后自动恢复到原运行状态的能力；受到大扰动后保持同步运行的能力称为暂态稳定。题目混淆二者，故错误。","bank":"电气基础"},{"id":"6f39b2bef6ae","type":"judge","category":"电气基础","stem":"短路电流的热效应主要由周期分量决定，动效应主要由非周期分量决定","options":{"A":"对","B":"错"},"answer":"错","explanation":"短路电流热效应由短路全电流有效值决定，主要由周期分量贡献（非周期分量衰减快、发热占比较小）；电动效应（动稳定）由短路冲击电流即全电流最大瞬时值决定。题干将“动效应主要由非周期分量决定”简单割裂表述，不够准确，故判错。","bank":"电气基础"},{"id":"d4fec5febad0","type":"judge","category":"电气基础","stem":"三相短路是对称故障，故障时三相电流和电压仍保持对称","options":{"A":"对","B":"错"},"answer":"对","explanation":"三相短路是对称短路，故障过程中三相电流、电压仍保持对称（仅幅值降低），不产生负序、零序分量。题干正确。","bank":"电气基础"},{"id":"111d8ccf8ed1","type":"judge","category":"电气基础","stem":"电抗器的主要作用是补偿容性无功，限制短路电流","options":{"A":"对","B":"错"},"answer":"对","explanation":"串联电抗器用于限制短路电流，并联电抗器用于补偿线路容性无功、抑制轻载过电压，故电抗器兼具限制短路电流与补偿容性无功（并联时）的作用。题干正确。","bank":"电气基础"},{"id":"431dbf4267b5","type":"judge","category":"电气基础","stem":"电容器在直流电路中相当于短路，在交流电路中相当于开路","options":{"A":"对","B":"错"},"answer":"错","explanation":"电容器“隔直通交”：直流稳态时相当于开路（无电流），交流时呈现容抗 Xc=1/(ωC)，频率越高越接近短路。题干说法完全相反，故错误。","bank":"电气基础"},{"id":"21b3090422b9","type":"judge","category":"电气基础","stem":"输电线路的电抗与导线截面积成反比，与长度成正比","options":{"A":"对","B":"错"},"answer":"对","explanation":"输电线路单位长度电抗 xl≈0.1445lg(D/GMR) Ω/km，与线路长度成正比；导线截面积增大使几何均距相对减小、感抗略有减小，故可认为电抗与截面积成反比。题干正确。（注：架空线电抗对截面积变化不敏感，此题为简化结论）","bank":"电气基础"},{"id":"bb27f27f0a08","type":"judge","category":"电气基础","stem":"变压器的变比等于一次侧匝数与二次侧匝数之比","options":{"A":"对","B":"错"},"answer":"对","explanation":"变压器变比 K= N1/N2 ≈ U1/U2（电压比），即等于一次侧匝数与二次侧匝数之比。题干正确。","bank":"电气基础"},{"id":"47bcf7e4fc0c","type":"judge","category":"电气基础","stem":"电力系统的“不正常运行状态”包括短路、断线等故障","options":{"A":"对","B":"错"},"answer":"错","explanation":"电力系统的“不正常运行状态”指未发生故障但参数偏离正常（如过负荷、频率/电压异常、非全相运行等）；短路、断线等属于“故障状态”。题目混淆，故错误。","bank":"电气基础"},{"id":"d35b9a5f91d8","type":"judge","category":"电气基础","stem":"一次设备是指直接参与电能生产和传输的设备，如变压器、断路器","options":{"A":"对","B":"错"},"answer":"对","explanation":"一次设备是指直接生产、输送和分配电能的电气设备，如发电机、变压器、断路器、隔离开关、母线等。题干正确。","bank":"电气基础"},{"id":"9e809f60df99","type":"judge","category":"电气基础","stem":"电力系统由发电、输电、变电、配电和用电环节组成","options":{"A":"对","B":"错"},"answer":"对","explanation":"电力系统由发电、输电、变电、配电和用电五个环节组成。题干正确。","bank":"电气基础"},{"id":"d5e67d3f331d","type":"judge","category":"电气基础","stem":"基尔霍夫电流定律不仅适用于电路中的任意一个节点，而且也适用于包含部分电路的任一假设的闭合面","options":{"A":"对","B":"错"},"answer":"对","explanation":"基尔霍夫电流定律（KCL）不仅适用于电路任一节点（Σi=0），也适用于包围部分电路的任一假设闭合面（流入闭合面的电流代数和为零）。题干正确。","bank":"电气基础"},{"id":"6bcb7820327e","type":"judge","category":"电气基础","stem":"把三相不对称相量分解为正序、负序及零序三组对称分量时，其中正序分量为A1=1/3(A+aB+a2C)","options":{"A":"对","B":"错"},"answer":"对","explanation":"对称分量法中 A 相正序分量 A1=(1/3)(A+aB+a²C)、负序 A2=(1/3)(A+a²B+aC)，其中 a=e^(j120°)。题目所列正序公式正确。","bank":"电气基础"},{"id":"54c9aa4427ae","type":"judge","category":"电气基础","stem":"三相电路中，线电压为100V，线电流2A，负载功率因数为0.8，则负载消耗的功率为277.1w","options":{"A":"对","B":"错"},"answer":"对","explanation":"三相功率 P=√3 U线 I线 cosφ=1.732×100×2×0.8≈277.1W，与题给数值一致。题干正确。","bank":"电气基础"},{"id":"35ef207e1e3e","type":"judge","category":"电气基础","stem":"标么值是某一个物理量的实际值与选定一个固定数值的比值，标么值的一般数学表达式为：标么值=有名值/基准值","options":{"A":"对","B":"错"},"answer":"对","explanation":"标幺值是某物理量的实际值（有名值）与所选基准值的比值，即 标幺值=有名值/基准值。题干正确。","bank":"电气基础"},{"id":"20d45a174d65","type":"judge","category":"电气基础","stem":"任意一组不对称三相正弦周期量可分解成三组对称分量，即正序、负序和零序分量","options":{"A":"对","B":"错"},"answer":"对","explanation":"对称分量法前提：任意一组不对称的三相正弦周期量都可分解为三组对称分量——正序、负序和零序。题干正确。","bank":"电气基础"},{"id":"aa0f175ca0de","type":"judge","category":"电气基础","stem":"在三相电路星形连接的供电系统中，电源的中性点与负载的中性点之间产生的电位差，称为中性点位移","options":{"A":"对","B":"错"},"answer":"对","explanation":"在星形连接的三相系统中，若中性线阻抗不为零或负载不对称，电源中性点与负载中性点之间出现电位差，称为中性点位移。题干正确。","bank":"电气基础"},{"id":"93304ba01027","type":"judge","category":"电气基础","stem":"三相交流电是由三个频率相同、电动势振幅相等、相位相差120°角的交流电路组成的电力系统","options":{"A":"对","B":"错"},"answer":"对","explanation":"对称三相交流电由三个频率相同、最大值（或有效值）相等、相位互差120°的正弦交流电量组成。题干正确。","bank":"电气基础"},{"id":"645233d2eb00","type":"judge","category":"电气基础","stem":"电容并联时，总电容的倒数等于各电容倒数之和","options":{"A":"对","B":"错"},"answer":"错","explanation":"电容器并联时总电容等于各电容之和（C=C1+C2+…+Cn）；倒数之和等于各电容倒数之和的关系是电容串联时的公式。题目说反，故错误。","bank":"电气基础"},{"id":"a581e4ea7204","type":"judge","category":"电气基础","stem":"一个220V、40w的白炽灯接在110V的电压上，灯的电阻值变为原阻值的1/2","options":{"A":"对","B":"错"},"answer":"错","explanation":"白炽灯灯丝电阻随温度变化显著，不能视为常数；接110V时灯丝温度降低、电阻比额定热态电阻小，但并非简单地变为“原阻值的1/2”（若按额定参数 R=U²/P 推算只会得出功率降为1/4，而电阻本身随温度非线性变化）。故错误。","bank":"电气基础"},{"id":"b8a34355c193","type":"judge","category":"电气基础","stem":"在闭合的电路中，电路中的电流与电源的电动势成正比，与负载电阻及电源内阻之和成反比，表达公式为：I=U/R","options":{"A":"对","B":"错"},"answer":"错","explanation":"全电路欧姆定律为 I=E/(R+r)，即电流与电源电动势 E 成正比，与总电阻（负载 R+内阻 r）成反比；题中写成 I=U/R 是部分电路欧姆定律，不适用于含电源内阻的全电路。故错误。","bank":"电气基础"},{"id":"de93c47faaf9","type":"judge","category":"电气基础","stem":"电流从高电势点流向低电势点时，电场做正功，电流从低电势点流向高电势点时，电源做正功","options":{"A":"对","B":"错"},"answer":"对","explanation":"在电源外部，电流从高电势流向低电势，电场力做正功（释放电能）；在电源内部，电流从低电势流向高电势，靠电源非静电力做正功（将其他能转化为电能）。题干正确。","bank":"电气基础"},{"id":"3f5a8b80b3c7","type":"judge","category":"电气基础","stem":"电力系统发生两相金属性短路故障时，故障点非故障相电压保持原有的幅值和相位，两故障相电压在非故障相电压的相同方向上，其值等于非故障相电压一半","options":{"A":"对","B":"错"},"answer":"错","explanation":"两相金属性短路（如B、C相短接）时，非故障相（A相）电压保持原有幅值与相位；两故障相电压大小相等、各为正常相电压的一半，但方向相反（相位相差180°），而非“相同方向”。故错误。","bank":"电气基础"},{"id":"268c285ebf9f","type":"judge","category":"电气基础","stem":"电路是由电气设备和电器元件按一定方式组成的，是电流的流通路径","options":{"A":"对","B":"错"},"answer":"对","explanation":"电路是由电气设备和电器元件按一定方式连接组成、提供电流流通路径的整体。题干正确。","bank":"电气基础"},{"id":"7358647d7449","type":"judge","category":"电气基础","stem":"磁力线在某区域的密度与该区域的磁场强弱成正比","options":{"A":"对","B":"错"},"answer":"对","explanation":"磁力线（磁感应线）的疏密程度表示磁感应强度 B 的大小，某区域磁力线越密，磁场越强，即密度与磁场强弱成正比。题干正确。","bank":"电气基础"},{"id":"d1372bfe2e89","type":"judge","category":"电气基础","stem":"在一个电路中，电源产生的功率和负载消耗功率以及内阻损耗的功率是平衡的","options":{"A":"对","B":"错"},"answer":"对","explanation":"根据功率平衡，电源产生的电功率等于负载消耗功率与电源内阻损耗功率之和（ΣP产生=ΣP消耗）。题干正确。","bank":"电气基础"},{"id":"71f8a4704726","type":"judge","category":"电气基础","stem":"磁力线是闭合曲线","options":{"A":"对","B":"错"},"answer":"对","explanation":"磁场是无源场（∇·B=0），磁力线是闭合曲线，不像静电场电力线那样有起点和终点。题干正确。","bank":"电气基础"},{"id":"45dbfc7851ce","type":"judge","category":"电气基础","stem":"当电源内阻为零时，电源端电压等于电源电动势","options":{"A":"对","B":"错"},"answer":"对","explanation":"含内阻的电源端电压 U=E−Ir；当内阻 r=0 时，U=E，即端电压等于电源电动势。题干正确。","bank":"电气基础"},{"id":"cd9d93fe1682","type":"judge","category":"电气基础","stem":"部分电路欧姆定律表明，当电压一定时，通过电阻的电流与电阻大小成正比","options":{"A":"对","B":"错"},"answer":"错","explanation":"部分电路欧姆定律 I=U/R，在电压 U 一定时，电流与电阻成反比，而非正比。故错误。","bank":"电气基础"},{"id":"d604e10e10d0","type":"judge","category":"电气基础","stem":"导体的电阻大小与温度变化无关，在不同温度时，同一导体的电阻相同","options":{"A":"对","B":"错"},"answer":"错","explanation":"导体电阻 R=ρL/A，电阻率 ρ 随温度变化，金属导体电阻一般随温度升高而增大，故电阻与温度有关。题干错误。","bank":"电气基础"},{"id":"3088df49dbf3","type":"judge","category":"电气基础","stem":"右手螺旋定则可以用已知电流方向来判断他所产生的磁场方向，也可以用已知磁场的方向来判断产生磁场的电流方向","options":{"A":"对","B":"错"},"answer":"对","explanation":"右手螺旋定则（安培定则）既可由电流方向判断其产生磁场的方向，也可由已知磁场方向反推产生该磁场的电流方向。题干正确。","bank":"电气基础"},{"id":"382c88b4b533","type":"judge","category":"电气基础","stem":"磁力线上某点的法线方向就是该点磁场的方向","options":{"A":"对","B":"错"},"answer":"错","explanation":"磁场方向是磁力线在该点的切线方向；法线方向垂直于磁力线，并不代表磁场方向。题干错误。","bank":"电气基础"},{"id":"b30d401bf74e","type":"judge","category":"电气基础","stem":"大小不随时间变化的电流称为直流电流","options":{"A":"对","B":"错"},"answer":"错","explanation":"直流电流指方向不随时间变化的电流（大小可波动，如脉动直流）；仅以“大小不随时间变化”来定义直流不准确（恒定电流才是大小、方向均不变）。故错误。","bank":"电气基础"},{"id":"41db8b8ce8d4","type":"judge","category":"电气基础","stem":"在电阻串联的电路中，电路的总功率等于各串联电阻的功率之和","options":{"A":"对","B":"错"},"answer":"对","explanation":"串联电路中电流处处相等，总功率 P=I²(R1+R2+…)=I²R1+I²R2+…，即总功率等于各电阻功率之和。题干正确。","bank":"电气基础"},{"id":"8388db3b10ff","type":"judge","category":"电气基础","stem":"磁力线是描述磁场结构的一组曲线，磁力线的疏密程度，反映磁场中各点磁场的强弱","options":{"A":"对","B":"错"},"answer":"对","explanation":"磁力线是用于描述磁场分布的一组曲线，其疏密程度反映各点磁场的强弱（磁感应强度大小）。题干正确。","bank":"电气基础"},{"id":"54d4f61c1e4c","type":"judge","category":"电气基础","stem":"通过电磁感应现象可以知道，线圈中磁通变化越快，感应电动势越小","options":{"A":"对","B":"错"},"answer":"错","explanation":"法拉第电磁感应定律 e=−N·dΦ/dt，感应电动势大小与磁通变化率成正比，磁通变化越快感应电动势越大，而非越小。故错误。","bank":"电气基础"},{"id":"e7db3c551dfb","type":"judge","category":"电气基础","stem":"只要电源是正弦的，电路中的各个部分电流和电压也是正弦的","options":{"A":"对","B":"错"},"answer":"错","explanation":"只有在线性电路中，正弦电源才会产生正弦响应；若电路含非线性元件（如铁磁饱和、半导体器件、整流电路），即使电源为正弦，电流、电压也会出现非正弦畸变。故错误。","bank":"电气基础"},{"id":"0756dda211b8","type":"judge","category":"电气基础","stem":"只要电压或电流的波形不是标准的正弦波，其中必定包含高次谐波","options":{"A":"对","B":"错"},"answer":"对","explanation":"根据傅里叶分析，任意非正弦周期波形必含有基波以外的谐波分量（高次谐波），故非标准正弦波必含高次谐波。题干正确。","bank":"电气基础"},{"id":"3f3de1c85592","type":"judge","category":"电气基础","stem":"同步发电机的转速与频率和磁极对数有关，频率越高，转速越低","options":{"A":"对","B":"错"},"answer":"错","explanation":"同步转速 n=60f/p（rpm），频率 f 与转速 n 成正比、与磁极对数 p 成反比，频率越高转速越高，而非越低。故错误。","bank":"电气基础"},{"id":"4ad47f8cb388","type":"judge","category":"电气基础","stem":"变压器的短路损耗与负载大小有关","options":{"A":"对","B":"错"},"answer":"对","explanation":"变压器短路损耗主要是负载损耗（铜损）I²R，随负载电流变化，故与负载大小有关。题干正确。","bank":"电气基础"},{"id":"4d9b1be923bc","type":"judge","category":"电气基础","stem":"电力系统中，备用容量越大越好","options":{"A":"对","B":"错"},"answer":"错","explanation":"系统应保留必要的备用容量（负荷备用、事故备用等），但备用并非越大越好，过大会增加设备投资与运行成本、降低经济性。故错误。","bank":"电气基础"},{"id":"318df61217d2","type":"judge","category":"电气基础","stem":"变压器的空载损耗与负载大小无关","options":{"A":"对","B":"错"},"answer":"对","explanation":"变压器空载损耗主要是铁损（励磁损耗），由电源电压决定，基本不随负载变化，故与负载大小无关。题干正确。","bank":"电气基础"},{"id":"9333788ec936","type":"judge","category":"电气基础","stem":"电力系统中，频率的变化主要是由负荷变化引起的","options":{"A":"对","B":"错"},"answer":"对","explanation":"系统频率由有功功率供需平衡决定，负荷变化（及机组出力变化）会引起频率波动，频率变化主要源于负荷变化。题干正确。","bank":"电气基础"},{"id":"0c67e79ebee8","type":"judge","category":"电气基础","stem":"同步发电机的励磁电流越大，发出的无功功率越多","options":{"A":"对","B":"错"},"answer":"对","explanation":"同步发电机增大励磁电流（过励磁）时电动势升高，向系统输出更多感性无功功率，故励磁越大发出无功越多。题干正确。","bank":"电气基础"},{"id":"81a249eeceee","type":"judge","category":"电气基础","stem":"电力系统的运行状态只有正常运行状态和故障状态","options":{"A":"对","B":"错"},"answer":"错","explanation":"电力系统运行状态分为正常运行、异常运行（不正常运行，如过负荷、频率/电压异常）和故障状态，并非只有正常与故障两种。故错误。","bank":"电气基础"},{"id":"752a1afb5730","type":"judge","category":"电气基础","stem":"一次设备是指直接用于生产、输送和分配电能的生产过程的高压电气设备","options":{"A":"对","B":"错"},"answer":"对","explanation":"一次设备是直接用于生产、输送和分配电能的生产过程的高压电气设备（如发电机、变压器、断路器等）。题干正确。","bank":"电气基础"},{"id":"e5a38c993a6e","type":"judge","category":"电气基础","stem":"变压器的变比越大，二次侧电压越高","options":{"A":"对","B":"错"},"answer":"错","explanation":"变比 K=U1/U2，K 越大表示一次侧相对二次侧电压越高，即二次侧电压越低（对降压变压器而言），并非变比越大二次侧电压越高。故错误。","bank":"电气基础"},{"id":"8095294abfab","type":"judge","category":"电气基础","stem":"输电线路的电阻越大，线路损耗越小","options":{"A":"对","B":"错"},"answer":"错","explanation":"线路损耗 ΔP=I²R，在电流一定时电阻越大损耗越大，而非越小。故错误。","bank":"电气基础"},{"id":"67ce65f9d1a1","type":"judge","category":"电气基础","stem":"新能源发电都是清洁能源，对环境没有任何影响","options":{"A":"对","B":"错"},"answer":"错","explanation":"新能源（风、光等）虽属低碳清洁能源，但设备制造、土地占用、生态影响等仍会对环境产生一定影响，“没有任何影响”说法过于绝对且不符合实际。故错误。","bank":"电气基础"},{"id":"33854bd106d2","type":"judge","category":"电气基础","stem":"三相交流电路中，负载作星形连接时，线电流一定等于相电流","options":{"A":"对","B":"错"},"answer":"对","explanation":"星形（Y）连接中，每相负载直接接在相线与中性线（或中性点）之间，流过相线的线电流即该相负载的相电流，故线电流等于相电流。题干正确。","bank":"电气基础"},{"id":"bc3b02602973","type":"judge","category":"电气基础","stem":"对称分量法中，α²表示将相量顺时针旋转120°","options":{"A":"对","B":"错"},"answer":"错","explanation":"对称分量法运算子 α=e^(j120°)，表示将相量逆时针旋转120°；α²=e^(j240°)，标准表述为逆时针旋转240°（几何上等效于顺时针120°）。严格按定义，α² 对应的标准表述是“逆时针旋转240°”，题目直接说“顺时针旋转120°”不严谨，判为错误。（注：α² 在几何上等效于顺时针120°，此题判错存疑）","bank":"电气基础"},{"id":"a711a06e0c2f","type":"judge","category":"电气基础","stem":"系统发生两相短路，短路点距母线越远，母线上负序电压值越高","options":{"A":"对","B":"错"},"answer":"错","explanation":"两相短路时，母线负序电压由负序电流在系统（电源）负序阻抗上的压降决定。故障点距母线越远，线路负序阻抗越大，负序电流 I2=E/(Z1Σ+Z2Σ) 越小，母线上负序电压越低，而非越高。故错误。","bank":"电气基础"},{"id":"5e84f2b0a61f","type":"judge","category":"电气基础","stem":"开关非全相运行时，负序电流的大小与负荷电流的大小关系成反比","options":{"A":"对","B":"错"},"answer":"错","explanation":"开关非全相运行（如一相断开）产生三相不对称，出现负序（及零序）电流，其大小与流过断口的负荷电流成正比（负荷越大负序电流越大），而非成反比。故错误。","bank":"电气基础"},{"id":"b294440b297f","type":"judge","category":"电气基础","stem":"对称分量法就是将一组不对称的三相电压或电流分解为正序、负序和零序三组对称的电压或电流，例如：UA=UAl+UA2+UAo;UB=α2UA1+αUA2+UAo;Uc=αUAl+α2UA2+UAo，其中α是运算子，表示将某相量逆时针旋转120°","options":{"A":"对","B":"错"},"answer":"对","explanation":"对称分量法将不对称三相量分解为正、负、零序三组对称分量，运算子 α=e^(j120°) 表示将相量逆时针旋转120°，公式 U_A=U_A1+U_A2+U_A0、U_B=α²U_A1+αU_A2+U_A0、U_C=αU_A1+α²U_A2+U_A0 正确。","bank":"电气基础"},{"id":"f5d233a61cd9","type":"judge","category":"电气基础","stem":"在串联谐振电路中，电感和电容的电压数值相等，方向相反","options":{"A":"对","B":"错"},"answer":"对","explanation":"串联谐振时感抗等于容抗（XL=XC），电感电压 UL 与电容电压 UC 大小相等、相位相反（相差180°），二者相互抵消，总电压等于电阻电压。题干正确。","bank":"电气基础"},{"id":"709a6f123646","type":"fill","category":"电气基础","stem":"操作箱检验应符合哪些要求?","options":{},"answer":"(1)进行每一项试验时，试验人员须准备详细的试验方案，尽量减少断路器的操作次数。(2)对分相操作断路器，应逐相传动防止断路器跳跃回路。(3)对于操作箱中的出口继电器，还应进行动作电压范围的检验，其值应在55%~70%额定电压之间。对于其他逻辑回路的继电器，应满足80%额定电压下可靠动作。","explanation":"操作箱检验要求：①每项试验前须有详细方案，尽量减少断路器实际操作次数（保护设备、节时）；②对分相操作断路器，应逐相传动验证防跳跃回路；③出口继电器动作电压范围应在55%~70%额定电压之间（保证足够灵敏又不误动），其他逻辑回路继电器应在80%额定电压下可靠动作。这些指标来自继电器检验规程，是验收关键点。","bank":"电气基础"},{"id":"d1a1828b0700","type":"fill","category":"电气基础","stem":"保护操作箱一般由哪些继电器组成?","options":{},"answer":"答：保护操作箱由下列继电器组成： (1)监视断路器合闸回路的跳闸位置继电器及监视断路器跳闸回路的合闸位置继电器。 (2)防止断路器跳跃继电器。 (3)手动合闸继电器。 (4)压力监察或闭锁继电器。 (5)手动跳闸继电器及保护三相跳闸继电器。 (6)一次重合闸脉冲回路(重合闸继电器)。 (7)辅助中间继电器。 (8)跳闸信号继电器及备用信号继电器。","explanation":"保护操作箱一般由以下继电器/回路组成：①跳闸位置继电器TWJ（监合闸回路）、合闸位置继电器HWJ（监跳闸回路）；②防跳跃继电器；③手动合闸继电器；④压力监察/闭锁继电器；⑤手动跳闸继电器及保护三相跳闸继电器；⑥一次重合闸脉冲回路（重合闸继电器）；⑦辅助中间继电器；⑧跳闸信号继电器及备用信号继电器。它集控制、防跳、重合闸、信号于一体。","bank":"电气基础"},{"id":"7f7fd0aee7bf","type":"fill","category":"电气基础","stem":"双母线母差保护在倒闸操作中为何要投入互联压板？","options":{},"answer":"投入互联压板后，母差保护切换为单母线方式，大差元件统一判别故障，避免双母线分列运行时小差元件误判;防止倒闸过程中两母线隔离开关同时闭合时，区外故障导致误切母线","explanation":"双母线倒闸操作（隔离开关切换）过程中，运行元件可能短时跨接两组母线。投入互联压板后，母差保护改为单母线（大差）方式，由大差元件统一判别故障，避免双母线分列运行时小差元件因电流互感器二次回路短时并联而误判；同时防止倒闸中两母线隔离开关同时闭合（元件跨接两母线）时区外故障误切母线。倒闸结束恢复正常方式后应退出互联压板。","bank":"电气基础"},{"id":"3a24aad822e6","type":"multiple","category":"电气基础","stem":"操作箱检验应注意的项目正确的是()","options":{"A":"进行每一项试验时，试验人员须准备详细的试验方案，尽量减少断路器的操作次数","B":"对分相操作断路器，应逐相传动防止断路器跳跃回路","C":"对于操作箱中的出口继电器，还应进行动作电压范围的检验，其值应在55%～70%额定电压","D":"对于其他逻辑回路的继电器，应满足90%额定电压下可靠动作"},"answer":"ABC","explanation":"操作箱检验应制定详细方案尽量减少断路器操作次数（A），分相操作断路器应逐相传动防跳跃回路（B），出口继电器动作电压应在55%～70%额定电压（C）；其他逻辑回路继电器并非要求90%额定电压可靠动作（D错），故选ABC。","bank":"电气基础"},{"id":"500c2945abd8","type":"multiple","category":"电气基础","stem":"新参加电气工作的人员、（），应经过安全知识教育后，方可到现场参加指定的工作，并且不准单独工作。","options":{"A":"实习人员","B":"临时参加劳动的人员（管理人员、非全日制用工等）","C":"外来人员","D":"配合工作人员"},"answer":"AB","explanation":"安规规定新参加电气工作的人员、实习人员、临时参加劳动的人员（管理人员、非全日制用工等）经安全教育后可参加指定工作且不准单独工作，故AB正确；外来人员、配合工作人员不属此条，故CD不选。","bank":"电气基础"},{"id":"9f5e654794bf","type":"multiple","category":"电气基础","stem":"倒闸操作可以通过()完成。","options":{"A":"就地操作","B":"模拟操作","C":"遥控操作","D":"程序操作"},"answer":"ACD","explanation":"倒闸操作可通过就地操作、遥控操作、程序操作完成，故ACD正确；模拟操作是操作前的预演，并非实际操作方式，故B不选。","bank":"电气基础"},{"id":"42e250238d02","type":"multiple","category":"电气基础","stem":"高压设备符合下列()条件，可由单人值班或单人操作。","options":{"A":"室内高压设备的隔离室设有遮栏，遮栏的高度在1.7m以上，安装牢固并加锁者","B":"室内高压断路器（开关）的操动机构（操作机构）用墙或金属板与该断路器（开关）隔离","C":"室内高压断路器（开关）装有远方操动机构（操作机构）者","D":"室内高压设备的隔离室设有遮栏，遮栏的高度在1.5m以上，安装牢固并加锁者"},"answer":"ABC","explanation":"单人值班或单人操作条件：隔离室遮栏高1.7m以上并加锁（A，D的1.5m错误）、断路器操动机构用墙或金属板隔离（B）、装有远方操动机构（C），故ABC正确。","bank":"电气基础"},{"id":"ec67ca410c97","type":"multiple","category":"电气基础","stem":"双母线倒闸操作中，母差保护需（）","options":{"A":"投入互联压板","B":"退出电压闭锁","C":"切换CT二次回路","D":"解除失灵保护"},"answer":"AC","explanation":"双母线倒闸操作过程中，母差保护需投入互联压板并将CT二次回路切换至对应母线（AC）；不应退出电压闭锁、也不应解除失灵保护（BD错），故选AC。","bank":"电气基础"},{"id":"5aeb4a989aca","type":"single","category":"电气基础","stem":"母线保护的主要作用是快速切除母线()，保证电力系统的安全稳定运行。","options":{"A":"故障","B":"负荷","C":"异常","D":"过载"},"answer":"A","explanation":"母线保护的核心任务是在母线发生短路故障时快速、可靠地切除故障母线，限制事故范围，选A。","bank":"电气基础"},{"id":"a84d8f5ce78c","type":"single","category":"电气基础","stem":"电力监控系统网络安全工作应当坚持“()”的原则，保障电力监控系统的安全。","options":{"A":"网络分区、专网专用、横向隔离、纵向认证","B":"安全分区、网络专用、横向隔离、纵向加密","C":"安全分区、网络专用、横向隔离、纵向认证","D":"网络分区、专网专用、横向隔离、纵向加密"},"answer":"C","explanation":"电力监控系统安全防护坚持“安全分区、网络专用、横向隔离、纵向认证”的原则（国家发改委2014年14号令），选C。","bank":"电气基础"},{"id":"db6a12df9a48","type":"single","category":"电气基础","stem":"电力设备由一种运行方式转为另一种运行方式的操作过程中，对保护的要求是()。","options":{"A":"没有要求","B":"不可失去选择性","C":"部分保护装置可短时失去选择性","D":"被操作的有关设备可在保护范围之外"},"answer":"C","explanation":"设备进行运行方式转换的操作过程中，允许被操作的相关设备其保护短时失去选择性，但应尽快恢复，选C。","bank":"电气基础"},{"id":"380c5a61abd5","type":"single","category":"电气基础","stem":"母线保护的通信协议应符合()，以实现与其他设备的互操作。","options":{"A":"电力行业标准","B":"国际标准","C":"厂家标准","D":"设计标准"},"answer":"A","explanation":"母线保护的通信协议应符合电力行业相关标准（如DL/T及配套通信规约），以保证与其他设备的互操作，选A。","bank":"电气基础"},{"id":"8f5f84c1b3f0","type":"single","category":"电气基础","stem":"安全带的挂钩或绳子应挂在结实牢固的构件或专为挂安全带用的钢丝绳上，并应采用（）的方式。","options":{"A":"低挂低用","B":"高挂高用","C":"高挂低用","D":"低挂高用"},"answer":"C","explanation":"安全带应采用“高挂低用”（挂钩挂在高处牢固构件、人在下方作业），可减小坠落冲击，选C。","bank":"电气基础"},{"id":"a2ad47075a4a","type":"single","category":"电气基础","stem":"工作班成员应（）。","options":{"A":"熟悉工作内容、工作流程","B":"掌握安全措施","C":"明确工作中的危险点","D":"在工作票上履行交底签名确认手续。"},"answer":"A","explanation":"工作班成员应熟悉工作内容、工作流程，掌握安全措施，明确危险点，并履行确认手续；题干按题面选A（熟悉工作内容、工作流程）。（注：B、C、D亦属工作班成员职责，本题按题面选A。）","bank":"电气基础"},{"id":"2d66042115c6","type":"single","category":"电气基础","stem":"在高压设备上工作，应至少由两人进行，并完成保证安全的()。","options":{"A":"技术措施和应急措施","B":"组织措施和现场措施","C":"组织措施和技术措施","D":"应急措施和现场措施"},"answer":"C","explanation":"在高压设备上工作应至少由两人进行，并认真执行保证安全的组织措施（工作票、许可、监护、间断转移、终结）和技术措施（停电、验电、接地、悬挂标示牌和装设遮栏），选C。","bank":"电气基础"},{"id":"35834b641832","type":"single","category":"电气基础","stem":"电磁操动机构是利用（）产生的机械操作力矩使开关完成合闸的。","options":{"A":"电磁功","B":"电动力","C":"弹簧力"},"answer":"A","explanation":"电磁操动机构利用合闸线圈通电产生的电磁功（电磁力）驱动机构完成合闸，选A；弹簧机构才用弹簧力（C）。","bank":"电气基础"},{"id":"95f766b9fd19","type":"single","category":"电气基础","stem":"作业人员因故间断电气工作连续（）个月以上者，应重新学习本规程，并经考试合格后，方能恢复工作","options":{"A":"半","B":"一","C":"二","D":"三"},"answer":"D","explanation":"安规规定，因故间断电气工作连续三个月以上者，应重新学习本规程并经考试合格后方可恢复工作，选D。","bank":"电气基础"},{"id":"f820a89db924","type":"single","category":"电气基础","stem":"倒闸操作中发生疑问时，应立即停止操作并向（）报告。待其再行许可后，方可进行操作。","options":{"A":"负责人","B":"监护人","C":"防误专责人","D":"发令人"},"answer":"D","explanation":"倒闸操作中发生疑问时，应立即停止操作并向发令人报告，待发令人再行许可后方可继续，选D。","bank":"电气基础"},{"id":"5eccda6ede1c","type":"single","category":"电气基础","stem":"电气设备倒闸操作时，发令人和受令人应先互报单位和姓名，发布指令的全过程(包括对方复诵指令)和听取指令的报告时应()。","options":{"A":"录音","B":"录音并作好记录","C":"记录","D":"汇报"},"answer":"B","explanation":"电气设备倒闸操作发布指令的全过程（含对方复诵指令）应录音并作好记录，选B。","bank":"电气基础"},{"id":"d10d0e87ac75","type":"single","category":"电气基础","stem":"电气设备倒闸操作时，发布指令应准确、清晰，使用规范的调度术语和()。","options":{"A":"设备编号","B":"设备双重名称","C":"设备名称","D":"设备标识"},"answer":"B","explanation":"倒闸操作发布指令应准确、清晰，使用规范的调度术语和设备双重名称（名称+编号），选B。","bank":"电气基础"},{"id":"461fbcab244f","type":"single","category":"电气基础","stem":"倒闸操作应根据()或运维负责人的指令，受令人复诵无误后执行。","options":{"A":"技术员","B":"工区领导","C":"值班调控人员","D":"班站长"},"answer":"C","explanation":"倒闸操作应根据值班调控人员（调度员）或运维负责人的指令进行，受令人复诵无误后执行，选C。","bank":"电气基础"},{"id":"e43035f23806","type":"single","category":"电气基础","stem":"待用间隔(母线连接排、引线已接上母线的备用间隔)应有名称、编号，并列入()管辖范围。其隔离开关(刀闸)操作手柄、网门应加锁。","options":{"A":"调度控制中心","B":"设备运行单位","C":"设备检修单位","D":"设备维护单位"},"answer":"A","explanation":"待用间隔应纳入调度控制中心管辖范围，其名称、编号齐全，隔离开关操作手柄及网门加锁，选A。","bank":"电气基础"},{"id":"a92f7b938347","type":"single","category":"电气基础","stem":"现场使用的安全工器具应（）并符合有关要求。","options":{"A":"规范","B":"合格","C":"齐备","D":"可靠"},"answer":"B","explanation":"现场使用的安全工器具应经检验合格并符合有关要求，选B。","bank":"电气基础"},{"id":"edb4404c5d33","type":"single","category":"电气基础","stem":"作业现场的生产条件和安全设施等应符合有关标准、规范的要求，工作人员的（）应合格、齐备。","options":{"A":"劳动防护用品","B":"安全工器具","C":"施工机具","D":"装备"},"answer":"A","explanation":"作业现场工作人员的劳动防护用品应合格、齐备，选A（安规基本要求）。","bank":"电气基础"},{"id":"f168459f203e","type":"single","category":"电气基础","stem":"（）的电气设备，系指全部带有电压、一部分带有电压或一经操作即带有电压的电气设备。","options":{"A":"试验中","B":"运行中","C":"运用中","D":"调试中"},"answer":"C","explanation":"安规中“运用中的电气设备”指全部带有电压、一部分带有电压或一经操作即带有电压的电气设备，选C。","bank":"电气基础"},{"id":"76086873646f","type":"single","category":"电气基础","stem":"母线保护设置了母联、分段分列运行压板，在母联、分段分裂运行时，投入了分裂运行压板，在进行母联或分段断路器由断开到合上的操作时，应在（）退出分裂运行压板。","options":{"A":"操作前","B":"操作后","C":"操作中","D":"操作前或操作后"},"answer":"A","explanation":"母联、分段分裂运行压板在分裂运行时投入；当将母联/分段由断开合上时，应在操作前退出该压板，防止产生虚假差流导致保护误动，选A。","bank":"电气基础"},{"id":"920387e1e6c8","type":"single","category":"电气基础","stem":"在双侧电源的系统上发生经过渡电阻的短路时，送电侧的保护有可能超越，而受电侧的保护则有可能()。","options":{"A":"不确定","B":"超越","C":"拒动","D":"误动"},"answer":"C","explanation":"双侧电源系统经高阻（过渡电阻）短路时，送电侧测量阻抗变小可能超越（误动于区外），受电侧测量阻抗变大可能拒动，选C。","bank":"电气基础"},{"id":"4f61d62a45fd","type":"single","category":"电气基础","stem":"在操作箱中，关于断路器位置继电器线圈正确的接法是（）","options":{"A":"TWJ在跳闸回路中，HWJ在合闸回路中","B":"TWJ在合闸回路中，HWJ在跳闸回路中","C":"TWJ、HWJ均在跳闸回路中","D":"TWJ、HWJ均在合闸回路中"},"answer":"B","explanation":"操作箱中，跳闸位置继电器TWJ串接于合闸回路（监测断路器是否跳开），合闸位置继电器HWJ串接于跳闸回路（监测是否合上），选B。","bank":"电气基础"},{"id":"253ee2f3a223","type":"judge","category":"电气基础","stem":"按照规程规定，双重化配置的两套保护不共用同一根光缆，但可以共用一个ODF配线架。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"按继电保护双重化配置原则，两套保护及其通道（光缆、光纤配线架 ODF 等）应相互独立、物理隔离，不得共用同一根光缆，也不宜共用同一 ODF 配线架（应分架或分插槽布置），以防共模故障导致两套保护同时失效。题干说可共用一个 ODF 配线架错误。","bank":"电气基础"},{"id":"9d22fd71ae89","type":"judge","category":"电气基础","stem":"双侧电源供电的线路上受电侧的距离一段在背后母线上发生三相短路，会因故障处有小过渡电阻而失去方向性，送电侧不会。","options":{"A":"对","B":"错"},"answer":"对","explanation":"在双侧电源线路中，受电侧距离保护Ⅰ段背后母线（反向）发生三相短路并带有小过渡电阻时，过渡电阻会使测量阻抗落入动作区并可能失去方向性（反向故障误判为正向）；送电侧因电源支撑情况不同一般不易失去方向性。题干正确。","bank":"电气基础"},{"id":"379a40b5dec4","type":"judge","category":"电气基础","stem":"在超高压大负荷送电线路末端发生经过渡电阻故障，送电侧超前相距离继电器有超越情况，而且以母线电压为极化量的距离继电器比以正序电压为极化的继电器严重。","options":{"A":"对","B":"错"},"answer":"对","explanation":"在超高压大负荷线路末端经小过渡电阻故障时，送电侧超前相（如 A 相）距离继电器易因过渡电阻产生测量阻抗超越（误动）；且以母线电压作极化量的距离继电器受过渡电阻影响更大，比采用正序电压（或记忆电压）极化的继电器超越更严重。题干正确。","bank":"电气基础"},{"id":"35a41b5b6c88","type":"judge","category":"电气基础","stem":"在安全色标中用绿色表示安全、通过、允许、工作。","options":{"A":"对","B":"错"},"answer":"对","explanation":"我国安全色标准中，绿色表示安全、通行、允许、工作（如安全出口、安全运行指示）。题干正确。","bank":"电气基础"},{"id":"9640f7126681","type":"judge","category":"电气基础","stem":"在安全色标中用红色表示禁止、停止或消防。","options":{"A":"对","B":"错"},"answer":"对","explanation":"我国安全色标准中，红色表示禁止、停止或消防。题干正确。","bank":"电气基础"},{"id":"93c887c78395","type":"judge","category":"电气基础","stem":"高处作业区周围的孔洞、沟道等应设置盖板、安全网或围栏并有固定其位置的措施。同时，应设置安全标志，夜间还应设红灯示警。","options":{"A":"对","B":"错"},"answer":"对","explanation":"安规要求高处作业区周围孔洞、沟道等设置盖板、安全网或围栏并固定，设置安全标志，夜间还应设红灯示警。题干正确。","bank":"电气基础"},{"id":"badbbb9ce0fe","type":"judge","category":"电气基础","stem":"待用间隔的隔离开关(刀闸)操作手柄、网门可不加锁。","options":{"A":"对","B":"错"},"answer":"错","explanation":"待用间隔的隔离开关（刀闸）操作手柄和网门应加锁并列入调度管辖，以防止误操作。题干说“可不加锁”错误。","bank":"电气基础"},{"id":"fdc95692c1ec","type":"judge","category":"电气基础","stem":"换流站不允许单人值班或单人操作。","options":{"A":"对","B":"错"},"answer":"对","explanation":"换流站属高压、大容量重要场所，按安规不允许单人值班或单人操作，须执行监护制。题干正确。","bank":"电气基础"},{"id":"ed481a510bd6","type":"judge","category":"电气基础","stem":"对于传输大功率的输电线路保护，一般宜于强调可信赖性;而对于其他线路保护，则往往宜于强调安全性。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"继电保护配置原则中，对于传输大功率、联系重要电源或系统的主干输电线路，误动后果严重，一般应强调“安全性”（防止误动）；对其他次要线路或后备保护则可适当强调“可信赖性”（防止拒动）。题目把二者颠倒，故错误。","bank":"电气基础"}];

const BUILTIN_POINTS = [{"id":"k-ct","cat":"考点精讲","title":"电流互感器（CT）","content":"电流互感器把一次大电流按固定变比变成二次小电流（通常 5A 或 1A），供测量和保护使用。它工作时二次回路接近短路状态，所以**二次侧严禁开路**：一旦开路，一次电流全部变成励磁电流，铁芯高度饱和，二次绕组会感应出数千伏高压，既危及人身安全，也会击穿绝缘、烧毁绕组。同时二次侧必须有一端可靠接地，防止一、二次绝缘击穿时高压窜入二次回路。\n小技巧：记住一对反义：CT 怕开路、PT 怕短路。","src":""},{"id":"k-pt","cat":"考点精讲","title":"电压互感器（PT）","content":"电压互感器把一次高电压按变比降为二次标准电压（100V 或 100/√3 V），供测量与保护使用。它工作时二次侧接近开路（接的是高阻抗电压表、继电器电压线圈），所以**二次侧严禁短路**：短路后二次电流剧增，会烧毁绕组，一次侧也可能因过热损坏。为此 PT 的一次侧和二次侧都要装熔断器，二次侧一端还必须接地。\n小技巧：CT 与 PT 的禁忌正好相反：CT 禁开路、PT 禁短路。","src":""},{"id":"k-iso_switch","cat":"考点精讲","title":"隔离开关","content":"隔离开关没有灭弧装置，只能在**无负荷电流**（电路已由断路器断开）的情况下操作，作用是隔离电源、造成肉眼可见的明显断开点，保证检修人员安全。带负荷拉合隔离开关会产生强烈电弧，可能造成相间短路甚至人身伤亡，是严重的误操作。它一般只能拉合很小的电流（如电压互感器、避雷器、空载母线、励磁电流等），具体范围以规程为准。\n小技巧：操作顺序：送电先合隔离开关再合断路器；停电先断断路器再拉隔离开关。","src":""},{"id":"k-breaker","cat":"考点精讲","title":"断路器","content":"断路器是唯一能**带负荷开断和接通电路**的开关设备，靠灭弧室（真空或 SF6）熄灭电弧，既能切正常负荷电流，也能切断短路电流，并由保护装置驱动自动跳闸。所以「切断短路电流」一定是断路器（或熔断器）的工作，而不是隔离开关的工作。","src":""},{"id":"k-lf_switch","cat":"考点精讲","title":"负荷开关与熔断器配合","content":"负荷开关能开断正常负荷电流，但不能开断短路电流；熔断器能开断短路电流，却不能频繁操作。两者组合使用时分工明确：**负荷开关管正常通断，熔断器管短路保护**。这是配电网络中很常见的廉价方案，缺点是一相熔断后会造成缺相运行。","src":""},{"id":"k-trans","cat":"考点精讲","title":"变压器","content":"变压器由**铁芯（磁路）**和**绕组（电路）**两部分组成，靠电磁感应把电压升高或降低，频率不变、功率基本不变（忽略损耗）。变压器油起绝缘和散热双重作用；铁芯必须**单点接地**，否则会因悬浮电位产生放电。","src":""},{"id":"k-trans_parallel","cat":"考点精讲","title":"变压器并列运行条件","content":"变压器并列运行必须满足四个条件：**变比相同、接线组别相同、短路阻抗（阻抗电压）相近、容量比不超过 3:1**。变比不同会产生环流；组别不同相位差会造成很大的电位差，相当于短路；阻抗相差大则负荷分配不均，容量小的先过载。","src":""},{"id":"k-prot_4","cat":"考点精讲","title":"继电保护的「四性」","content":"继电保护的基本要求是**可靠性、选择性、灵敏性、速动性**。选择性指只切除故障元件、让停电范围最小；速动性指尽快切除故障以减小设备损坏和系统失稳；灵敏性指对保护范围内最小故障也能可靠动作；可靠性指该动就动、不该动就不动。这四条互相制约，整定时要折中。","src":""},{"id":"k-prot_ct_ratio","cat":"考点精讲","title":"保护整定与变比换算","content":"整定的通用原则是「按最严重工况下不误动、保护范围内故障时可靠动作」：过流元件按躲过最大负荷电流整定，速断按躲过末端短路整定，并引入可靠系数。整定值换算是抓一个不变量：**一次电流不变**。一次电流 = 二次整定值 × 变比。CT 变比改变后，用同一次电流除以新变比，就得到新的二次整定值。例如 200/5、整定 4A，一次电流 4×40=160A；改用 300/5（变比 60）后，整定值 = 160/60 ≈ 2.67A。","src":""},{"id":"k-neutral","cat":"考点精讲","title":"中性点接地方式","content":"电力系统中性点运行方式主要有三类：**不接地、经消弧线圈（消弧电抗器）接地、直接接地**。不接地系统发生单相接地时，线电压仍对称，可短时继续运行（一般不超过 2 小时），但非故障相电压升高 √3 倍；经消弧线圈接地用电感电流补偿接地容性电流，抑制电弧；110kV 及以上电网一般采用中性点直接接地，以限制过电压水平和绝缘投资。","src":""},{"id":"k-short","cat":"考点精讲","title":"短路及其后果","content":"短路是相与相之间或相与地之间不经负载直接连通。后果有四个：**电流剧增导致发热烧损设备、产生巨大电动力使导体变形、系统电压骤降影响用户、破坏并列运行稳定性**。限制短路电流的常用手段是串联电抗器、合理选择接线方式和采用限流熔断器。","src":""},{"id":"k-busbar","cat":"考点精讲","title":"母线","content":"母线是变电站里汇集、分配电能的公共导体，把电源进线与各条出线连接起来。母线按材料分铜、铝，按形状分矩形、管形、槽形；母线涂色便于识别相别：**A 相黄、B 相绿、C 相红**，中性线淡蓝，接地线黄绿相间。\n小技巧：母线涂色口诀：黄绿红对应 A、B、C。","src":""},{"id":"k-mege","cat":"考点精讲","title":"绝缘电阻测量","content":"测绝缘电阻用兆欧表（摇表），被测设备必须**先停电、验电、充分放电**，否则残余电荷会损坏仪表、也可能伤人。测量时转速保持额定（约 120 r/min）读数才稳定。测完还要对设备放电。低压设备一般用 500V 兆欧表，高压设备用 1000V 或 2500V。","src":""},{"id":"k-ground_wire","cat":"考点精讲","title":"装设接地线","content":"装设接地线的顺序是**先接接地端、后接导体端**，拆除时顺序相反。这样万一导体带电，电流经接地线入地，人体不会串在回路里。接地线必须用多股软铜线，截面满足短路电流热稳定要求，严禁用缠绕的方法接地。\n小技巧：先接地、后接电；拆的时候反过来。","src":""},{"id":"k-power_cut","cat":"考点精讲","title":"停电、验电、接地","content":"保证检修安全的组织技术措施是：**停电、验电、装设接地线、悬挂标示牌并装设遮栏**。验电要用电压等级合适且合格的验电器，在装设接地线处对各相分别验电；倒闸操作必须填写操作票、两人进行（一人操作、一人监护），并核对设备双重名称。","src":""},{"id":"k-work_ticket","cat":"考点精讲","title":"工作票制度","content":"工作票是准许在电气设备上工作的书面命令。**第一种工作票**用于需要停电（或装设遮栏）的工作，**第二种工作票**用于不需要停电的工作。工作票由工作负责人填写，签发人签发，工作许可人与工作负责人共同到现场检查安全措施后办理许可手续。","src":""},{"id":"k-motor","cat":"考点精讲","title":"三相异步电动机","content":"三相异步电动机靠定子旋转磁场切割转子导体、在其中感应电流而产生转矩，所以转子转速必然低于同步转速，两者之差用**转差率 s=(n₁−n)/n₁** 表示，额定转差率一般 1%~5%。直接启动时启动电流可达额定电流的 4~7 倍，因此容量较大的电机要降压启动（星-三角、自耦降压、软启动）。","src":""},{"id":"k-cap","cat":"考点精讲","title":"并联电容器与功率因数","content":"并联电容器用来**补偿感性无功**，从而提高功率因数、减少线路电流和线损、改善电压质量。功率因数 cosφ = P/S，其中 P 是有功、S 是视在功率、Q 是无功，三者构成功率三角形 S²=P²+Q²。电容器组一般配置过流（相间短路）、过压、欠压和不平衡（差动或零序）保护。","src":""},{"id":"k-reactor","cat":"考点精讲","title":"电抗器","content":"串联电抗器接入电路后增大系统阻抗，作用是**限制短路电流**、维持母线电压水平，使断路器容易开断、减轻设备动热稳定负担。并联电抗器则用于补偿长线路的容性充电功率、抑制工频过电压。","src":""},{"id":"k-arrester","cat":"考点精讲","title":"避雷器","content":"避雷器**与被保护设备并联**，正常时对地绝缘，出现过电压时迅速导通把雷电流泄放入地，并把残压限制在设备绝缘耐受水平以下，过电压消失后自动恢复绝缘。它是限制过电压的主要设备，不能用来防短路。\n小技巧：并联不是串联——避雷器接在相与地之间。","src":""},{"id":"k-fuse","cat":"考点精讲","title":"熔断器","content":"熔断器靠熔体过热熔断来切断电路，主要作**短路和过载保护**，结构简单、价格低、分断能力强。但它熔断后必须更换熔体，不能作为正常操作电器频繁通断负荷，也不宜用于电动机的频繁启动回路。","src":""},{"id":"k-dc_sys","cat":"考点精讲","title":"直流系统与蓄电池","content":"变电站直流系统为**控制、保护、信号、事故照明**提供可靠电源，即使全站交流失电也必须继续工作。通常由蓄电池组+充电装置构成，蓄电池浮充电运行。直流回路一点接地尚可运行但必须尽快查找（防止发展为两点接地造成保护误动或拒动）。","src":""},{"id":"k-ac_basic","cat":"考点精讲","title":"交流电三要素与有效值","content":"正弦交流电三要素：**幅值（最大值）、角频率 ω、初相位**。ω = 2πf = 2π/T；有效值 = 最大值 ÷ √2；工频 50Hz 对应 ω≈314 rad/s，周期 0.02s。平时说的 220V、380V 都是有效值。\n小技巧：ω=2π/T，T=0.01s 时 ω=628 rad/s。","src":""},{"id":"k-three_phase","cat":"考点精讲","title":"三相电路","content":"三相电源星形（Y）接法时，**线电压 = √3 × 相电压**，线电流 = 相电流；三角形（△）接法时，线电压 = 相电压，线电流 = √3 × 相电流。低压 380/220V 中，380V 是线电压、220V 是相电压，正是 √3 的关系。三相电流对称时，中性线电流为零。","src":""},{"id":"k-si_esd","cat":"考点精讲","title":"静电防护","content":"静电由摩擦、剥离产生，能量虽小但电压可达数千伏，足以击穿半导体器件或引燃可燃气体。防护措施包括穿防静电服/鞋、戴防静电手环并可靠接地、器件用防静电袋包装、工作台铺防静电台垫、控制环境湿度。**正确做法是全程戴手环并接地**，单纯用手碰一下机壳「放一下电」并不能保证人体电荷已释放干净。","src":""},{"id":"k-fire","cat":"考点精讲","title":"电气火灾与灭火","content":"电气火灾要先**切断电源**再灭火，且必须用绝缘灭火剂：干粉、二氧化碳灭火器，**严禁用水或泡沫**（导电，会造成触电并扩大事故）。如果无法断电，灭火时要保持足够安全距离，防止触电。","src":""},{"id":"k-first_aid","cat":"考点精讲","title":"触电急救","content":"触电急救第一步是**迅速使触电者脱离电源**（拉开关、用绝缘物挑开导线），再就地判断意识与呼吸，呼吸心跳停止时立即进行心肺复苏（按压 100~120 次/分、深度 5~6cm），并持续到专业急救人员到达，不能轻易放弃。","src":""},{"id":"k-second_circuit","cat":"考点精讲","title":"二次回路","content":"二次回路包括**控制、保护、测量、信号、直流电源**等回路，是相对一次主电路而言的低压回路。二次回路虽电压低，但接线错误会引起保护误动、拒动，后果同样严重，因此要严格按图施工、逐条核对。","src":""},{"id":"k-eddy","cat":"考点精讲","title":"涡流与集肤效应","content":"交变磁通在铁芯中感应出的环流叫**涡流**，会使铁芯发热造成损耗，所以铁芯用彼此绝缘的薄硅钢片叠成，以增大涡流回路电阻。高频电流集中在导体表面的现象叫**集肤效应**，使有效截面减小、电阻增大，因此高频电路用多股绞线或空心导线。","src":""},{"id":"k-power_calc","cat":"考点精讲","title":"电功率与电能","content":"单相有功功率 P=UIcosφ，三相 P=√3·U线·I线·cosφ；视在功率 S=UI（单位 VA），无功 Q=UIsinφ（单位 var）。电能 W=Pt，1 度电 = 1kW·h = 3.6×10⁶ J。","src":""},{"id":"k-ohm","cat":"考点精讲","title":"欧姆定律与电阻","content":"欧姆定律 I=U/R。电阻 R=ρL/S：与电阻率、长度成正比，与截面积成反比，所以导线越细越长电阻越大、损耗越大。串联电路电流处处相等、电压按阻值分配；并联电路电压相同、电流按阻值反比分配。","src":""},{"id":"k-magnet","cat":"考点精讲","title":"磁场与电磁感应","content":"通电导体周围产生磁场，方向用**右手螺旋定则**判断；导体在磁场中切割磁力线会产生感应电动势，方向用**右手定则**；载流导体在磁场中受力，方向用**左手定则**。楞次定律说明感应电流的磁场总是阻碍原磁通的变化。\n小技巧：发电用右手、电动用左手——「右手发电、左手电动」。","src":""},{"id":"k-digit","cat":"考点精讲","title":"数字电路基础","content":"数字电路中的基本逻辑门：与（AND，全 1 出 1）、或（OR，有 1 出 1）、非（NOT，取反）、与非（NAND，与之后取反）、或非（NOR）。任何逻辑函数都可以只用「与非门」或只用「或非门」实现，这叫逻辑功能的完备性。","src":""},{"id":"k-485","cat":"考点精讲","title":"RS-485 通信接线","content":"RS-485 用**一对差分线（A/B 或 D+/D-）**传输信号，靠两根线的电压差表示 0 和 1，所以必须成对接线：同一对双绞线的两根分别接正、负，不能把不同对的两根凑成一对，否则抗干扰能力大幅下降。屏蔽层单端接地，总线两端加终端电阻。","src":""},{"id":"k-cable","cat":"考点精讲","title":"电缆与导线","content":"选择导线截面要考虑**载流量、机械强度、允许电压损失和经济电流密度**四个条件，取其中最大者。电缆敷设时弯曲半径不能过小，否则会损伤绝缘；铜芯比铝芯导电好、机械强度高，重要回路和移动设备都用铜芯。","src":""},{"id":"k-dist_net","cat":"考点精讲","title":"配电网与供电电压","content":"供电电压允许偏差以**实际值与额定值之差、比额定值**的百分数表示，基准是额定电压。电压偏低会使电动机电流增大、发热；偏高会缩短设备寿命。常用调压手段有载调压变压器、投切电容器、调整运行方式。","src":""},{"id":"k-tool_ins","cat":"考点精讲","title":"手持电动工具分类","content":"手持电动工具按防触电方式分三类：**Ⅰ类**靠基本绝缘+接地保护（绝缘电阻≥2MΩ）；**Ⅱ类**是双重绝缘或加强绝缘，不需要接地（≥7MΩ）；**Ⅲ类**由安全特低电压供电（≥1MΩ）。潮湿场所应优先用Ⅱ类或Ⅲ类。\n小技巧：绝缘电阻要求 Ⅰ类 2MΩ、Ⅱ类 7MΩ、Ⅲ类 1MΩ。","src":""},{"id":"k-lightning","cat":"考点精讲","title":"防雷与接地","content":"防雷装置由**接闪器（避雷针/避雷线）、引下线、接地装置**三部分组成，作用是把雷电流引向大地，保护范围内不受直击雷。接地电阻越小泄流越快，独立避雷针的接地装置与被保护设备接地体之间要保持足够距离，防止反击。","src":""},{"id":"k-overload","cat":"考点精讲","title":"过负荷与过热","content":"设备发热来自铜损（I²R）和铁损，温升超过绝缘允许值会加速绝缘老化，一般绝缘寿命按「温度每升高 8℃ 寿命减半」的规律估算（A 级绝缘）。过负荷保护的目的是防止长期过热，而短路保护要求快速切断，两者不能互相替代。","src":""},{"id":"k-auto","cat":"考点精讲","title":"自动装置与备自投","content":"**备用电源自动投入（BZT）**在工作电源失电后自动把备用电源投入，缩短停电时间；**自动重合闸（ZCH）**在断路器跳闸后经延时自动重合一次，因为架空线路的故障多为瞬时性（雷击、鸟害、树枝碰线），重合成功率较高。","src":""},{"id":"k-scada","cat":"考点精讲","title":"测量与仪表","content":"万用表测电压要**并联**、测电流要**串联**，量程要先大后小；钳形电流表利用电流互感器原理，可不断开电路测电流，测量时只能钳一根导线，钳两根会互相抵消。测量前必须确认档位正确，用电流档去测电压会直接烧表。\n小技巧：钳形表一次只能夹一根线，夹两根读数近似为零。","src":""},{"id":"k-transformer_oil","cat":"考点精讲","title":"变压器油与呼吸器","content":"变压器油起**绝缘和散热**作用，油位过低会露出绕组影响散热和绝缘。呼吸器里的硅胶吸收空气中水分，正常为蓝色，**变粉红说明已受潮失效**，需要更换或烘干。\n小技巧：硅胶变粉红 = 受潮，要换。","src":""},{"id":"k-arc","cat":"考点精讲","title":"电弧与灭弧","content":"开关电器分断电流时会产生电弧，灭弧的基本思路是**拉长电弧、冷却电弧、把电弧分割成短弧**或利用高压力/真空环境提高介质恢复强度。真空断路器靠真空度、SF6 断路器靠 SF6 的强负电性吸附自由电子来灭弧。","src":""},{"id":"k-insulation","cat":"考点精讲","title":"绝缘与击穿","content":"绝缘材料在强电场下会失去绝缘性能，称为**击穿**。固体绝缘击穿往往不可恢复，气体和液体绝缘击穿后一般能恢复。影响击穿电压的因素有电场均匀程度、电压作用时间、温度、湿度和杂质。预防性试验（绝缘电阻、介损、耐压）就是提前发现绝缘缺陷。","src":""},{"id":"k-capac_react","cat":"考点精讲","title":"电容器的容抗","content":"电容器的容抗 Xc = 1/(2πfC)：频率越低容抗越大。所以在**直流电路（f=0）中容抗无穷大，相当于开路**；在交流电路中才有电流通过，相当于「通交流、阻直流」。这也解释了电容器为什么能隔直流通交流、为什么投入电容器能补偿无功。\n小技巧：口诀：电容隔直通交——直流当开路，交流才有电流。","src":""},{"id":"k-color","cat":"考点精讲","title":"安全色标与标识","content":"安全色标规定：**红色表示禁止、停止、消防和危险**；**黄色表示警告、注意**；**绿色表示安全、允许、通行**；**蓝色表示指令、必须遵守**。设备上还常用红、黄、绿三色区分相别（A 黄、B 绿、C 红）。","src":""},{"id":"k-busbar_prot","cat":"考点精讲","title":"母线保护（母差）","content":"母线保护的核心是**差动原理**：把连接在母线上的各支路电流按同一方向相加，正常和区外故障时各支路电流之和接近零（流入等于流出），差流很小；母线内部故障时流入电流全部流向故障点，差流等于故障电流，保护立即跳开母线所连全部断路器。实现上要解决两个难题：**TA 饱和**（区外故障时差流可能很大，用比率制动、抗饱和判据解决）和**TA 断线**（用各支路电流幅值、相位比较检测，断线时闭锁差动并报警）。\n小技巧：母差要防两件事：区外故障 TA 饱和、TA 二次断线。","src":""},{"id":"k-dist_prot","cat":"考点精讲","title":"距离保护","content":"距离保护测的是**故障点到保护安装处的阻抗**，因为线路阻抗与长度成正比，所以测出阻抗就等于知道了故障距离，动作范围稳定、不受系统运行方式影响，常用在 110kV 及以上线路作主保护或后备保护。分段配置：Ⅰ段保护线路全长约 80%~85%（躲过末端故障，瞬时动作），Ⅱ段保护全长并延伸（带时限），Ⅲ段作远后备。它受**系统振荡**和 **PT 断线**影响，因此要装振荡闭锁和电压回路断线闭锁。","src":""},{"id":"k-zero_seq","cat":"考点精讲","title":"零序保护","content":"零序分量只在**接地故障**时出现（对称三相系统正常运行没有零序），所以零序保护专门反映接地短路，灵敏度高、不受负荷电流影响。零序电流可由三只 CT 接成零序滤过器或由中性点套管 CT 取得；零序Ⅰ段按躲过线路末端接地故障整定，不能保护全长，需要Ⅱ、Ⅲ段配合。注意：**线电压中永远不含零序分量**（零序只存在于相电压和中性点回路）。","src":""},{"id":"k-diff_prot","cat":"考点精讲","title":"差动保护","content":"差动保护比较**被保护设备两侧电流的差**：正常和区外故障时两侧电流大小相等方向（折算后）相反，差流为零；设备内部故障时差流等于故障电流，保护动作。它**有绝对的选择性**，不需要与其他保护配合，动作快，是变压器、母线、发电机的主要保护。难点是**不平衡电流**：由 TA 变比/特性差异、变压器励磁涌流、有载调压分接头变化引起，所以要用比率制动和二次谐波制动来躲过。","src":""},{"id":"k-sym_comp","cat":"考点精讲","title":"对称分量法","content":"对称分量法把一组**不对称**的三相量分解成三组**对称**的分量：**正序**（A-B-C 顺序，反映正常运行和三相短路）、**负序**（A-C-B 逆序，反映不对称故障）、**零序**（三相同相位，反映接地故障）。分解公式：正序 = (A + aB + a²C)/3，负序 = (A + a²B + aC)/3，零序 = (A+B+C)/3，其中 a = e^(j120°)。这是分析不对称故障的基础工具。\n小技巧：负序指示不对称故障，零序指示接地故障。","src":""},{"id":"k-inrush","cat":"考点精讲","title":"励磁涌流与谐波制动","content":"变压器空载合闸时，铁芯可能严重饱和，产生幅值可达额定电流 6~8 倍的**励磁涌流**，它只流过一次侧、二次侧没有对应电流，因此在差动保护里表现为**差流**，可能造成误动。涌流的特征是：**含有大量二次谐波（占比可达 20% 以上）、波形偏于时间轴一侧、有明显间断角**。所以变压器差动保护用**二次谐波制动**（二次谐波占比超过定值就闭锁差动）或波形识别来躲过它。\n小技巧：励磁涌流 → 二次谐波大 → 用它闭锁差动。","src":""},{"id":"k-gis","cat":"考点精讲","title":"GIS 与 SF6 设备","content":"GIS（气体绝缘全封闭组合电器）把断路器、隔离开关、接地开关、CT、PT、母线等封闭在充 SF6 气体的金属壳体内，优点是**占地小、不受外界环境影响、运行可靠、检修周期长**。SF6 是强负电性气体，能吸附自由电子、绝缘强度高、灭弧能力强；但**SF6 比空气重，泄漏后易积聚在低洼处导致缺氧**，进入 SF6 配电室前必须通风并检测含氧量。水分会降低 SF6 绝缘性能，所以要装吸附剂并监测微水含量。","src":""},{"id":"k-vacuum","cat":"考点精讲","title":"真空断路器","content":"真空断路器利用**真空（高真空度）中电弧难以为继**的原理灭弧：触头分开时产生的金属蒸气电弧在电流过零时迅速熄灭，介质强度恢复极快，所以**开断能力强、触头磨损小、寿命长、体积小、无火灾爆炸危险**，广泛应用于 10~35kV 配电。它开断后**断口耐压高但不能隔离**，仍需串联隔离开关或手车抽出形成明显断开点。","src":""},{"id":"k-insulator","cat":"考点精讲","title":"绝缘子与污闪","content":"绝缘子用来支撑和绝缘导线，要有足够的**电气强度、机械强度和耐热性**。表面污秽（灰尘、盐雾、化工污物）遇雾雨潮解后形成导电水膜，泄漏电流增大，沿面放电发展成**污闪**，是户外绝缘的主要威胁。防污措施：增大爬电比距（用防污型绝缘子）、定期清扫、涂 RTV 防污闪涂料。","src":""},{"id":"k-rcd","cat":"考点精讲","title":"剩余电流（漏电）保护","content":"剩余电流保护装置（漏电保护器）用**零序电流互感器**检测相线与中性线电流的矢量和：正常时和为零，有人触电或设备漏电时部分电流经大地返回，矢量和不为零，达到动作值就跳闸。它**只能防人身触电和设备漏电，不能防过载和短路**，所以要和熔断器/断路器配合使用。一般末级保护动作电流 30mA、动作时间小于 0.1s。","src":""},{"id":"k-star_delta","cat":"考点精讲","title":"星-三角（Y-△）降压启动","content":"星-三角启动只适用于**正常运行时为三角形接法**的电动机：启动时先接成星形，每相绕组电压降为原来的 1/√3，启动电流和启动转矩都降为直接启动的 **1/3**。代价是启动转矩只有 1/3，所以只适合**轻载或空载启动**。其他降压方式还有自耦变压器降压、软启动器、变频器启动。\n小技巧：星三角启动：电流降到 1/3，转矩也降到 1/3。","src":""},{"id":"k-power_sys","cat":"考点精讲","title":"电力系统的组成与电压等级","content":"电力系统由**发电、输电、变电、配电、用电**五个环节组成，加上保证安全经济运行的调度与保护自动化装置。我国常用的交流电压等级有 0.4、10、35、110、220、500、1000kV，一般把 1kV 以下称低压、1~35kV 称中压、110~220kV 称高压、330kV 及以上称超高压。提高输电电压可以减少线路电流、降低线损、增大输送容量。","src":""},{"id":"k-micro_prot","cat":"考点精讲","title":"微机保护","content":"微机保护用**微处理器**采集电流电压量、按软件算法判断故障并出口跳闸，替代了原来的电磁型、整流型继电器。主要特点：**自检能力强**（能发现自身元件故障并报警闭锁）、**通信与录波方便**（可上传故障录波、接入监控系统）、**功能集成度高**（一台装置可含多段相间、零序、重合闸等功能）、**定值可整定可修改**、**动作特性由软件决定**，改逻辑不用换硬件。缺点是依赖电源与软件可靠性，需要抗干扰措施。","src":""},{"id":"k-quick_break","cat":"考点精讲","title":"电流速断保护","content":"电流速断是**无时限电流保护（Ⅰ段）**，按**躲过被保护线路末端最大短路电流**整定，因此它只能保护线路的一部分（通常 50%~80%），末端必然有死区，需要Ⅱ段（限时速断）或Ⅲ段（过电流）配合。速断动作电流整定偏小会失去选择性（越级跳闸），偏大则保护范围缩短。它的**选择性靠定值保证**，而不是靠时限。\n小技巧：速断靠定值保证选择性，过流靠时限保证选择性。","src":""},{"id":"k-backup_prot","cat":"考点精讲","title":"后备保护","content":"后备保护是主保护拒动或断路器失灵时的第二道防线。**近后备**由本元件另一套保护实现（同一设备双重化配置）；**远后备**由相邻元件的保护实现（如变压器的过流保护兼作低压侧线路的远后备），动作时间逐级加长。后备保护的灵敏度必须满足规程要求，否则起不到后备作用。","src":""},{"id":"k-resistor","cat":"考点精讲","title":"导体的电阻","content":"导体电阻 R = ρL/S：与材料电阻率成正比、与长度成正比、与截面积成反比。金属是**正温度系数**——温度升高电阻增大；碳和电解液是负温度系数。所以短路时导体温度升高、电阻变大，但短路电流主要由回路阻抗决定，变化不大。","src":""},{"id":"k-time_relay","cat":"考点精讲","title":"时间继电器与保护配合","content":"时间继电器用来获得**动作延时**，是阶梯式保护实现选择性的关键：离电源越近的保护，动作时限越长，相邻两级之间留一个**时间级差（通常 0.3~0.5s）**，这样故障时总是离故障点最近（时限最短）的保护先跳闸，把停电范围限制在最小。中间继电器则用于**增加触点数量、扩大控制范围**或作为出口元件。\n小技巧：选择性靠时限阶梯：越靠电源，时限越长。","src":""},{"id":"k-dir_element","cat":"考点精讲","title":"方向元件","content":"方向元件（功率方向继电器）**判故障功率的流向**，只有当短路功率从母线流向线路（正方向）时才允许保护动作。它用于**双电源供电、环网或单电源双侧电源**的系统：没有方向元件时，反方向故障也会让本侧保护误动。方向元件有\"死区\"（近处三相短路时电压为零，无法判别方向），所以常配记忆回路或电压死区补偿。","src":""},{"id":"k-selector","cat":"考点精讲","title":"选相元件","content":"选相元件用来**判断故障发生在哪一相（或哪两相、三相）**，从而只跳开故障相（分相跳闸），非故障相继续运行，提高供电可靠性、减小对系统的冲击。它是分相操作断路器和单相重合闸的前提。","src":""},{"id":"k-overhead_line","cat":"考点精讲","title":"架空输电线路","content":"架空线路由**导线、避雷线（地线）、杆塔、绝缘子、金具、接地装置和基础**组成。导线承担输送电能，多用钢芯铝绞线（铝导电、钢承力）；避雷线架在导线上方，把雷电流引入大地，保护导线不受直击雷；杆塔按受力分直线杆塔、耐张杆塔、转角杆塔、终端杆塔。","src":""},{"id":"k-primary_eq","cat":"考点精讲","title":"一次设备","content":"一次设备是直接参与电能生产、变换、输送和分配的设备，按功能分五类：**变换设备**（变压器、互感器）、**开关设备**（断路器、隔离开关、负荷开关、熔断器）、**载流导体**（母线、电缆、导线）、**补偿设备**（电容器、电抗器）、**保护设备**（避雷器、接地装置）。\n小技巧：互感器属于一次设备，但它把量传给二次设备。","src":""},{"id":"k-relay_class","cat":"考点精讲","title":"继电器的分类","content":"继电器按**动作原理**分电磁型、感应型、整流型、静态型（晶体管/集成电路）、微机型；按**反应的物理量**分电流继电器、电压继电器、功率方向继电器、阻抗继电器、时间继电器、中间继电器、信号继电器。**中间继电器**用于增加触点数目或容量、**信号继电器**用于指示哪套保护动作并掉牌，便于事后分析。","src":""},{"id":"k-freq","cat":"考点精讲","title":"频率与电能质量","content":"我国电力系统额定频率为 **50Hz**，允许偏差一般为 ±0.2Hz（中小系统 ±0.5Hz）。频率由系统有功功率平衡决定：有功不足频率下降，有功过剩频率上升。谐波主要来自非线性负荷（变频器、整流器），会使设备附加发热、电容器过流。","src":""}];
</script>

<script>
/* ================= 小工具 ================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 解析文本用 **加粗** 标记重点，先转义再替换，避免 XSS
const rich = s => esc(s).replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
// 用本地时区算日期：toISOString 是 UTC，东八区 0~8 点会算成「昨天」
const dkey = d => {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
};
const today = () => dkey(new Date());
const GOALS = [20, 30, 50, 100];
const FONTS = [{ k: 's', n: '小' }, { k: 'm', n: '标准' }, { k: 'l', n: '大' }];
const THEMES = [{ k: 'auto', n: '跟随系统' }, { k: 'light', n: '浅色' }, { k: 'dark', n: '深色' }];
// 答题节奏：答完之后要不要自动进入下一题
const ADV_OPTS = [
  { k: 'right', t: '答对才跳过', s: '答对约 1 秒后自动进下一题；答错停在原地看解析' },
  { k: 'any', t: '答完就跳过', s: '不管对错，答完约 0.7 秒直接进下一题；答错会记进错题本' },
  { k: 'manual', t: '不跳过', s: '答完停在原地看解析，点「下一题」才走' },
];
const ADV_NAME = { right: '答对才跳过', any: '答完就跳过', manual: '不跳过' };
const APP_VER = '2.13';

function toast(msg, ms = 1600) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('on'), ms);
}

/* ================= 存储：优先 IndexedDB，不可用就退到 localStorage =================
   浏览器隐私模式、file:// 直接打开等场景 IndexedDB 会被禁，这时用 localStorage；
   localStorage 也写不进去就退到纯内存（刷新会丢，但至少能用）。 */
const DB = (() => {
  let mode = 'mem';      // idb | ls | mem
  let dbp = null;
  const P = 'eb_';
  const mem = new Map();

  function openIDB() {
    return new Promise((res, rej) => {
      let done = false;
      const timer = setTimeout(() => { if (!done) { done = true; rej(new Error('idb timeout')); } }, 700);
      let rq;
      try { rq = indexedDB.open('exambuddy', 1); } catch (e) { clearTimeout(timer); return rej(e); }
      rq.onupgradeneeded = () => { try { rq.result.createObjectStore('kv', { keyPath: 'k' }); } catch (e) {} };
      rq.onsuccess = () => { if (done) return; done = true; clearTimeout(timer); res(rq.result); };
      rq.onerror = () => { if (done) return; done = true; clearTimeout(timer); rej(rq.error || new Error('idb error')); };
      rq.onblocked = () => { if (done) return; done = true; clearTimeout(timer); rej(new Error('idb blocked')); };
    });
  }

  async function init() {
    try { dbp = await openIDB(); mode = 'idb'; return mode; } catch (e) {}
    try {
      const k = P + '__t';
      localStorage.setItem(k, '1'); localStorage.removeItem(k);
      mode = 'ls';
    } catch (e) { mode = 'mem'; }
    return mode;
  }

  function tx(mode2) {
    return dbp.transaction('kv', mode2).objectStore('kv');
  }

  return {
    init,
    get mode() { return mode; },
    async get(k, def) {
      if (mode === 'idb') {
        try {
          const st = tx('readonly');
          return await new Promise(res => {
            const r = st.get(k);
            r.onsuccess = () => res(r.result ? r.result.v : def);
            r.onerror = () => res(def);
          });
        } catch (e) { return def; }
      }
      if (mode === 'ls') {
        const raw = localStorage.getItem(P + k);
        if (raw == null) return def;
        try { return JSON.parse(raw); } catch (e) { return def; }
      }
      return mem.has(k) ? mem.get(k) : def;
    },
    async set(k, v) {
      if (mode === 'idb') {
        try {
          const st = tx('readwrite');
          await new Promise((res, rej) => {
            const r = st.put({ k, v });
            r.onsuccess = () => res(); r.onerror = () => rej(r.error);
          });
          return;
        } catch (e) {
          // 中途坏了就整体降级，别让数据静默丢掉
          mode = 'ls';
        }
      }
      if (mode === 'ls') {
        try { localStorage.setItem(P + k, JSON.stringify(v)); return; }
        catch (e) { mode = 'mem'; }
      }
      mem.set(k, v);
    }
  };
})();

/* ================= 解析：Markdown / 文本 → 题目 ================= */
const RE = {
  opt: /^\s*([A-Ha-h])[\.、．\)]\s*(.*)$/,
  ans: /(?:答案|正确答案|answer)\s*[:：]?\s*(.*)$/i,
  exp: /(?:解析|解释|答疑|答案详解|考点)\s*[:：]?\s*(.*)$/,
  cat: /^\s*#+\s*(?:分类|类别|科目|章节|类型)\s*[:：]?\s*(.*)$/,
  num: /^\s*(?:\d+[\.\、]|[一二三四五六七八九十]+[\.\、]|Q\s*\d*[\.\、:]?)\s*(.*)$/
};
const LETTERS = 'ABCDEFGH';
const JUDGE_OK = ['对', '正确', '√', 'T', 'true', 'True', '是'];
const JUDGE_NO = ['错', '错误', '×', 'F', 'false', 'False', '否'];

function md5_12(str) {

  function gg(a, b, c, d, x, s, t) { return cmn((b & d) | (c & ~d), a, b, x, s, t); }
  function hh(a, b, c, d, x, s, t) { return cmn(b ^ c ^ d, a, b, x, s, t); }
  function ii(a, b, c, d, x, s, t) { return cmn(c ^ (b | ~d), a, b, x, s, t); }
  function blk(s) {

      else if (c < 2048) bytes.push(192 | (c >> 6), 128 | (c & 63));
      else bytes.push(224 | (c >> 12), 128 | ((c >> 6) & 63), 128 | (c & 63));
    }
    return bytes;

    let [oa, ob, oc, od] = [a, b, c, d];
    a = ff(a, b, c, d, w[0], 7, -680876936); d = ff(d, a, b, c, w[1], 12, -389564586);
    c = ff(c, d, a, b, w[2], 17, 606105819); b = ff(b, c, d, a, w[3], 22, -1044525330);
    a = ff(a, b, c, d, w[4], 7, -176418897); d = ff(d, a, b, c, w[5], 12, 1200080426);
    c = ff(c, d, a, b, w[6], 17, -1473231341); b = ff(b, c, d, a, w[7], 22, -45705983);
    a = ff(a, b, c, d, w[8], 7, 1770035416); d = ff(d, a, b, c, w[9], 12, -1958414417);
    c = ff(c, d, a, b, w[10], 17, -42063); b = ff(b, c, d, a, w[11], 22, -1990404162);
    a = ff(a, b, c, d, w[12], 7, 1804603682); d = ff(d, a, b, c, w[13], 12, -40341101);
    c = ff(c, d, a, b, w[14], 17, -1502002290); b = ff(b, c, d, a, w[15], 22, 1236535329);
    a = gg(a, b, c, d, w[1], 5, -165796510); d = gg(d, a, b, c, w[6], 9, -1069501632);
    c = gg(c, d, a, b, w[11], 14, 643717713); b = gg(b, c, d, a, w[0], 20, -373897302);
    a = gg(a, b, c, d, w[5], 5, -701558691); d = gg(d, a, b, c, w[10], 9, 38016083);
    c = gg(c, d, a, b, w[15], 14, -660478335); b = gg(b, c, d, a, w[4], 20, -405537848);
    a = gg(a, b, c, d, w[9], 5, 568446438); d = gg(d, a, b, c, w[14], 9, -1019803690);
    c = gg(c, d, a, b, w[3], 14, -187363961); b = gg(b, c, d, a, w[8], 20, 1163531501);
    a = gg(a, b, c, d, w[13], 5, -1444681467); d = gg(d, a, b, c, w[2], 9, -51403784);
    c = gg(c, d, a, b, w[7], 14, 1735328473); b = gg(b, c, d, a, w[12], 20, -1926607734);
    a = hh(a, b, c, d, w[5], 4, -378558); d = hh(d, a, b, c, w[8], 11, -2022574463);
    c = hh(c, d, a, b, w[11], 16, 1839030562); b = hh(b, c, d, a, w[14], 23, -35309556);
    a = hh(a, b, c, d, w[1], 4, -1530992060); d = hh(d, a, b, c, w[4], 11, 1272893353);
    c = hh(c, d, a, b, w[7], 16, -155497632); b = hh(b, c, d, a, w[10], 23, -1094730640);
    a = hh(a, b, c, d, w[13], 4, 681279174); d = hh(d, a, b, c, w[0], 11, -358537222);
    c = hh(c, d, a, b, w[3], 16, -722521979); b = hh(b, c, d, a, w[6], 23, 76029189);
