":"对","B":"错"},"answer":"错","explanation":"规程要求抗干扰继电器启动功率>5W、动作电压在55%~70%Un范围，但额定直流下动作时间为10ms~35ms（要求不小于一定值以避免干扰误动），并非“小于5ms”。故说法错误。","bank":"电气基础"},{"id":"47f2f14cfb5c","type":"judge","category":"电气基础","stem":"对于600MW级及以上发电机组，应装设双重化的电气量保护。()","options":{"A":"对","B":"错"},"answer":"对","explanation":"大型发电机组（600MW及以上）按反措要求电气量保护双重化配置，提高可靠性，正确。","bank":"电气基础"},{"id":"50d2e946dce4","type":"judge","category":"电气基础","stem":"变压器保护各侧电流互感器变比，不宜使平衡系数大于10。()","options":{"A":"对","B":"错"},"answer":"对","explanation":"为减小计算误差并保证差动平衡精度，各侧TA变比选取应使平衡系数不宜过大（不宜大于10），说法正确。","bank":"电气基础"},{"id":"7d8f357156e4","type":"judge","category":"电气基础","stem":"变压器后备保护跳母联、分段应启动失灵。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"变压器后备保护动作跳母联、分段断路器属近后备，一般不要求启动失灵；失灵启动主要针对线路/母线故障断路器拒动。故说法错误。","bank":"电气基础"},{"id":"c411e2efcdea","type":"judge","category":"电气基础","stem":"2Mbit/s数字接口装置与通信设备采用750同轴电缆平衡方式连接。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"2Mbit/s数字接口应采用75Ω同轴电缆不平衡方式（而非750、亦非平衡方式）与通信设备连接。题目数值与方式均错，故错误。","bank":"电气基础"},{"id":"4b8940e49f40","type":"judge","category":"电气基础","stem":"新的“六统一”原则包括功能配置统一的原则、端子排布置统一的原则、屏柜压板统一的原则、装置软件界面统一的原则。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"“六统一”包括功能配置统一、回路设计统一、端子排布置统一、接口标准统一、屏柜压板统一、装置软件界面统一共六项；题目仅列四项且遗漏“回路设计统一”和“接口标准统一”，故错误。","bank":"电气基础"},{"id":"25939e3c6c6f","type":"judge","category":"电气基础","stem":"线路保护发送端的远方跳闸和远传信号经10ms(不含消抖时间)延时确认后，发送信号给接收端。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"规程规定发送端远方跳闸和远传信号经5ms（不含消抖时间）延时确认后发送，而非10ms。故错误。","bank":"电气基础"},{"id":"8a7014149d24","type":"judge","category":"电气基础","stem":"线路远方跳闸保护的就地判据可采用零、负序电流，零、负序电压，低电流，低电压，分相低有功等实现。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"远方跳闸就地判别元件一般采用零/负序电流、零/负序电压、低电压、分相低有功等判据，通常不采用“低电流”作为就地判据（低电流判据可靠性差）。故说法错误。","bank":"电气基础"},{"id":"789fcfbe04e8","type":"judge","category":"电气基础","stem":"线路一变压器组和线路一发变组的线路和主设备电气量保护均应启动断路器失灵保护。当本侧断路器无法切除故障时，应采取启动远方跳闸等后备措施加以解决。()","options":{"A":"对","B":"错"},"answer":"对","explanation":"对于线路—变压器组等接线，其电气量保护应启动失灵；本侧断路器不能切除故障时，应借助远方跳闸等后备措施，符合规程，正确。","bank":"电气基础"},{"id":"b494828d0273","type":"judge","category":"电气基础","stem":"母差保护与失灵保护共用出口回路时，闭锁元件的灵敏系数应按失灵保护的要求整定。()","options":{"A":"对","B":"错"},"answer":"对","explanation":"共用出口时闭锁（复合电压闭锁）灵敏度应满足更严格的失灵保护要求，按失灵保护整定，说法正确。","bank":"电气基础"},{"id":"e037b60952b7","type":"judge","category":"电气基础","stem":"双母线接线变电站的母差保护、断路器失灵保护，除跳母联、分段的支路外，应经复合电压闭锁。()","options":{"A":"对","B":"错"},"answer":"对","explanation":"为防止误动，母差和失灵保护出口（除跳母联、分段外）应经复合电压闭锁，符合反措要求，正确。","bank":"电气基础"},{"id":"bf1644d9f011","type":"judge","category":"电气基础","stem":"断路器应使用断路器本体的三相不一致保护，宜采用断路器本体的防止断路器跳跃功能。()","options":{"A":"对","B":"错"},"answer":"对","explanation":"三相不一致保护宜由断路器本体机构实现，防跳功能亦宜采用本体机构防跳，提高可靠性，正确。","bank":"电气基础"},{"id":"f03a011985f3","type":"judge","category":"电气基础","stem":"线路、变压器、发变组和母联断路器三相不一致保护不要求启动失灵保护。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"三相不一致保护动作跳开本断路器后，若故障持续应启动失灵保护以隔离故障；规程要求相关三相不一致保护应启动失灵。故说法错误。","bank":"电气基础"},{"id":"d4a2476f3adf","type":"judge","category":"电气基础","stem":"要求断路器失灵保护的相电流判别元件动作时间和返回时间均不应大于10ms。","options":{"A":"对","B":"错"},"answer":"错","explanation":"规程要求失灵保护的相电流判别元件动作时间和返回时间均不应大于20ms（而非10ms）。故错误。","bank":"电气基础"},{"id":"a2e0e1649c6e","type":"judge","category":"电气基础","stem":"根据相关规定，所有110kV母联都可配置保护、测控一体化装置。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"110kV母联是否配置保护、测控一体化装置应按具体设计原则与接线确定，并非“所有”都强制配置；该绝对化表述错误。","bank":"电气基础"},{"id":"ff12db3d3263","type":"judge","category":"电气基础","stem":"当保护采用双重化配置时，其电压切换箱(回路)隔离开关辅助触点应采用双位置输入方式，单套配置保护的电压切换箱(回路)隔离开关辅助触点应采用单位置输入方式。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"反措15.1.5规定：双重化配置时电压切换箱隔离开关辅助触点应采用单位置输入方式，单套配置时采用双位置输入方式。题目将二者正好说反，故错误。","bank":"电气基础"},{"id":"a675c2a4562b","type":"judge","category":"电气基础","stem":"断路器失灵保护中用于判断断路器主触头状态的电流判别元件应保证其动作和返回的快速性，动作和返回时间均不宜大于20ms,其返回系数也不宜低于0.9。()","options":{"A":"对","B":"错"},"answer":"对","explanation":"失灵电流判别元件需快速动作与返回（均不宜>20ms）以正确识别拒动并防止误动，且返回系数不宜低于0.9，说法正确。","bank":"电气基础"},{"id":"4df2e7c673cc","type":"judge","category":"电气基础","stem":"主设备非电量保护应防水、防振、防油渗漏、密封性好。气体继电器至保护柜的电缆不得有中间转接环节。()","options":{"A":"对","B":"错"},"answer":"对","explanation":"非电量保护（瓦斯等）要求防水防振防油渗漏、密封良好，且气体继电器到保护柜电缆直连、不得有中间转接，保证可靠性，正确。","bank":"电气基础"},{"id":"03a5f519a8fd","type":"judge","category":"电气基础","stem":"配置双重化的过电压及远方跳闸保护，远方跳闸保护应采用“一取一”经就地判别方式。()","options":{"A":"对","B":"错"},"answer":"对","explanation":"双重化配置下，远方跳闸保护采用“一取一”经就地判别方式，任一通道判别动作即可出口，兼顾可靠性与速动性，正确。","bank":"电气基础"},{"id":"a7c5f9e632cf","type":"judge","category":"电气基础","stem":"装设电容器低压保护的目的是在电容器发生故障时将其从电网上切除。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"电容器低电压保护用于在母线电压过低时退出电容器，避免其重新合闸于低压/故障或改善电压恢复；电容器内部故障由熔断器、过流、差压等保护切除。故说法错误。","bank":"电气基础"},{"id":"ccbc61bd1618","type":"judge","category":"电气基础","stem":"负序电压和零序电压是由于不对称短路而产生的，其值在保护安装处最大。","options":{"A":"对","B":"错"},"answer":"错","explanation":"不对称短路（单相/两相接地等）确实产生负序、零序电压，但其数值在故障点最大、随距离增加而衰减，并非“在保护安装处最大”。故错误。","bank":"电气基础"},{"id":"368b76fd4b5d","type":"judge","category":"电气基础","stem":"负序、零序分量和突变量保护都能保护各种故障。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"负序、零序分量只反映不对称及接地故障（三相对称短路时无负序、零序），突变量保护也有其适用边界，并非三者都能保护所有类型故障。故错误。","bank":"电气基础"},{"id":"8e5cfb0a477e","type":"judge","category":"电气基础","stem":"微机型保护的交流及直流电源来线，应先经抗干扰处理，然后才进入保护屏内。()","options":{"A":"对","B":"错"},"answer":"对","explanation":"为抑制干扰，微机保护交流/直流电源引入保护屏前应经抗干扰措施（滤波器、防雷、抗干扰器件等），说法正确。","bank":"电气基础"},{"id":"7cde4ee04ca4","type":"judge","category":"电气基础","stem":"在用逐次逼近式原理的模数转换器(A/D)的数据采集系统中有专门的低通滤波器滤除输入信号中的高频分量的满足采样定理。用电压—频率控制器(VFC)的数据采集系统中由于用某段时间内的脉冲个数来进行保护计算的这种做法本身含有滤波的功能，所以不必再加另外的滤波器。()","options":{"A":"对","B":"错"},"answer":"对","explanation":"逐次逼近式A/D需外加低通抗混叠滤波器满足采样定理；VFC型采集以一段时间脉冲计数作计算，计数过程本身具积分滤波作用，可不另加滤波器，说法正确。","bank":"电气基础"},{"id":"ddd9eb51f289","type":"judge","category":"电气基础","stem":"微机保护在软件上有滤波功能，因此可以不要模拟滤波器。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。微机保护虽有数字滤波（软件滤波），但不能取代模拟滤波器。前置模拟低通滤波器的作用是抗混叠，防止高于采样频率一半的高频分量在采样时发生频率混叠，这是数字滤波无法弥补的，因此模拟滤波器仍须保留。","bank":"电气基础"},{"id":"64dc17975611","type":"judge","category":"电气基础","stem":"微机线路保护每周波采样12点，现负荷潮流为有功功率P=86.6MW、无功功率Q=50Mvar,微机保护打印出电压、电流的采样值，在微机保护工作正确的前提下，UA比Is由正到负过零点超前4个采样点。(","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。每周波采样12点，每点对应30°电角度。负荷P=86.6MW、Q=50Mvar，功率因数角φ=arctan(50/86.6)=30°，即电流滞后电压30°，相当于滞后1个采样点。故UA由正到负过零点应超前Ia过零点1个采样点，而非4个（120°）。","bank":"电气基础"},{"id":"e94cf8b01c44","type":"judge","category":"电气基础","stem":"直流系统中保护电气的选择性配合原则应符合下列要求，熔断器装设在直流断路器上一级时，熔断器额定电流应为直流断路器额定电流1.5倍及以上。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。直流电源系统保护电器选择性配合规定：熔断器装设在直流断路器上一级（电源侧）时，熔断器额定电流应为直流断路器额定电流的2倍及以上，而非1.5倍。1.5倍不能保证上下级选择性配合。","bank":"电气基础"},{"id":"b548f8e5f5ce","type":"judge","category":"电气基础","stem":"控制屏、保护屏上的端子排，正、负电源之间及电源与跳(合)闸引出端子之间应适当隔开。()","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。为防正、负电源短接造成直流接地或保护误动，以及电源与跳（合）闸端子短接造成误跳/误合，反措要求端子排上正、负电源之间及电源与跳合闸引出端子之间应适当隔开（如设置空端子）。","bank":"电气基础"},{"id":"f404364bd69e","type":"judge","category":"电气基础","stem":"微机保护中，构成零序方向的零序电压，可以取电压互感器二次三相电压自产，它与零序电压取自电压互感器开口三角相比，其优点是电压互感器二次断线后，方向元件不需要退出运行。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。自产3U0由三相电压求和得到，TV二次单相断线时会出现不平衡电压，可能使零序方向元件误动，断线后方向元件反而需退出。而开口三角（外加）3U0不受单相断线影响。故题目中'断线后不需退出'的说法正好相反。","bank":"电气基础"},{"id":"4ef4776d5541","type":"judge","category":"电气基础","stem":"用于保护交流电压自动切换的中间继电器在不停相应保护的情况下，不得对运行中的隔离开关辅助触点进行维修工作。()","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。用于交流电压自动切换的中间继电器若不停电维修运行中的隔离开关辅助触点，可能造成电压切换回路异常、保护失压或误动，且有触电及误动风险，反措规定不得进行。","bank":"电气基础"},{"id":"75d081a9fe7d","type":"judge","category":"电气基础","stem":"逆变电源装置运行维护时可只测量额定电压下的各级输出电压、纹波数值。()","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。逆变电源（微机保护电源）运行维护主要考核额定工况，定期检验时可只测量额定电压下的各级输出电压和纹波数值，以满足精度与平稳性要求。","bank":"电气基础"},{"id":"556a763fb659","type":"judge","category":"电气基础","stem":"为简化电压切换回路，提高保护运行可靠性，双母接线形式变压器间隔宜装设三相电压互感器。()","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。双母线接线变压器间隔装设三相电压互感器，可提供自产零序电压并简化电压切换回路，避免单相TV切换不可靠导致的保护问题，有利于提高运行可靠性。","bank":"电气基础"},{"id":"017f1d956fa2","type":"judge","category":"电气基础","stem":"P级电流互感器的暂态特性欠佳，在外部短路时会产生较大的差流。为此，特性呈分段式的比率制动式差动继电器拾高了制动系数的取值。同理，继电器的最小动作电流定值也该相应拾高。()","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。外部短路时P级TA暂态饱和产生差流，比率制动式差动继电器需抬高制动系数取值以防止误动，这是正确的；但最小动作电流（启动电流）定值不应相应抬高，否则会降低内部故障灵敏度，故题目后半句错误。","bank":"电气基础"},{"id":"05831d2a160a","type":"judge","category":"电气基础","stem":"P级是一般保护用电流互感器，其误差只考虑稳态特性，不涉及暂态问题，也不计剩磁影响。()","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。P级（保护级）电流互感器按稳态对称短路电流下的复合误差分级（如5P、10P），其误差只考虑稳态特性，不规定暂态误差，也不计剩磁影响。","bank":"电气基础"},{"id":"9447b2060cbf","type":"judge","category":"电气基础","stem":"对于保护用电流互感器，当被保护线路发生短路故障时，铁芯中的磁感应强度是减小的。","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。线路短路故障时一次电流大幅增大，TA铁芯磁通（磁感应强度）随之增大，易致铁芯饱和，磁感应强度是增大而非减小。","bank":"电气基础"},{"id":"a30b815e7efa","type":"judge","category":"电气基础","stem":"对于线路的相间保护的最后一段的动作灵敏性，必须限制在可靠地躲开线路正常运行功率和实际可能的最大事故后过负荷功率的范围内。","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。相间保护最后一段（如过电流保护）须可靠躲过线路正常最大负荷电流和实际可能的最大事故后过负荷电流，以免在正常或过负荷时误动，这是灵敏度与可靠性的折中要求。","bank":"电气基础"},{"id":"04b446bc7382","type":"judge","category":"电气基础","stem":"可能出现过负荷的电缆线路或电缆与架空混合线路，应装设过负荷保护，保护宜带时限动作于信号，不可动作于跳闸。","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。过负荷保护一般宜带时限动作于信号，但在无人值班或必要时也可动作于跳闸（如电缆过负荷可能损坏），并非'不可动作于跳闸'，题目表述过于绝对。","bank":"电气基础"},{"id":"23b6b4616144","type":"judge","category":"电气基础","stem":"纵联零序方向保护本身也有选相功能，只要通道允许也可以选相跳闸。","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。纵联零序方向保护反映零序方向，本身不具备选相功能（零序为接地故障总量，不区分故障相），不能选相跳闸，需另配选相元件。","bank":"电气基础"},{"id":"6433a0a2e751","type":"judge","category":"电气基础","stem":"零序电流保护灵敏I段在重合在永久故障时将瞬时跳闸。","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。零序灵敏I段按躲过非全相运行（单相重合闸过程）时的零序电流整定，在非全相期间被闭锁。重合于永久故障时处于非全相状态，灵敏I段不动作，不会瞬时跳闸，由不灵敏I段等动作。","bank":"电气基础"},{"id":"d4105400e294","type":"judge","category":"电气基础","stem":"当重合于本线路故障，或在非全相运行期间健全相又发生故障时，此时允许相邻元件的保护失去选择性。","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。重合于本线路故障或非全相运行期间健全相再故障属特殊情况，保护仍应尽量保证选择性，不允许相邻元件失去选择性，否则会扩大停电范围。","bank":"电气基础"},{"id":"3ef106adfb21","type":"judge","category":"电气基础","stem":"光纤纵差保护的时钟主从方式与选用的通道方式无关。","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。光纤纵差保护的时钟方式（主从同步/采样同步）与所选通道方式（专用光纤、复用通道、64k或2M等）有关，并非无关。","bank":"电气基础"},{"id":"53a8595e75d9","type":"judge","category":"电气基础","stem":"为保证允许式纵联保护能够正确动作，要求收信侧的通信设备在收到允许信号时，须将其展宽至100～200ms。","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。允许式纵联保护收信侧对允许信号需展宽以防通道瞬断导致保护返回，但展宽时间一般很短（数毫秒至数十毫秒），100～200ms过长会影响保护快速性，并非必须如此长。","bank":"电气基础"},{"id":"711a925d5eb1","type":"judge","category":"电气基础","stem":"纵联保护不仅作为本线路的全线速动保护，还可作为相邻线路的后备保护。","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。纵联保护仅作为本线路的全线速动主保护，其保护范围即本线路，不能作相邻线路的后备保护（相邻线路后备由其他保护承担）。","bank":"电气基础"},{"id":"2e35a0a90134","type":"judge","category":"电气基础","stem":"工频变化量保护只在乎电流(或电压)值的变化量的绝对值，它不在乎电流(或电压)值是由小变大，还是由大变小。","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。工频变化量保护具有方向性，其方向元件需判别故障分量的方向（叠加故障附加网络），并非只取变化量绝对值、不在乎由小变大还是由大变小。","bank":"电气基础"},{"id":"2a8acdec8a0a","type":"judge","category":"电气基础","stem":"过渡电阻对距离继电器工作的影响，视条件可能失去方向性，也可能使保护区缩短，还可能发生超越及拒动。","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。过渡电阻（电弧、接地电阻）使测量阻抗变化，可能导致距离继电器失去方向性、保护区缩短，也可能因测量阻抗减小而发生超越误动或因阻抗增大而拒动。","bank":"电气基础"},{"id":"b65e15fc0f29","type":"judge","category":"电气基础","stem":"突变量构成的保护，不仅可构成快速主保护，也可构成阶段式后备保护。","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。突变量（Δ）保护只在故障瞬间有输出，故障稳态后突变量消失，不能构成带延时的阶段式后备保护，仅可构成快速主保护。","bank":"电气基础"},{"id":"40d05624c6a5","type":"judge","category":"电气基础","stem":"有时零序电流保护要设置两个I段，即灵敏I段和不灵敏I段。灵敏I段按躲过非全相运行情况整定，不灵敏I段按躲过线路末端故障整定。","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。零序电流两个I段中，灵敏I段按躲线路末端（或下级）故障整定以保证灵敏度，不灵敏I段按躲非全相运行（单相重合闸过程）时的零序电流整定，题目将两者整定原则说反了。","bank":"电气基础"},{"id":"916ba8cea970","type":"judge","category":"电气基础","stem":"一般来说母线的出线越多，零序电流的分支系数越小，零序电流保护配合越困难。","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。母线出线越多，零序网络分支越多，分支系数受运行方式影响越大、变化范围越宽，使零序电流保护与相邻线路配合整定越困难。","bank":"电气基础"},{"id":"6d6c408d1f46","type":"judge","category":"电气基础","stem":"零序电流保护，能反映各种不对称短路，但不反映三相对称短路。","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。两相短路（不接地）不产生零序电流，零序电流保护不能反映；'能反映各种不对称短路'不成立（两相短路亦为不对称短路但无零序）。它主要反映单相接地和两相接地短路。","bank":"电气基础"},{"id":"880a94c06515","type":"judge","category":"电气基础","stem":"母线保护的整定值一经确定，就不需要再调整。","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。母线保护整定值需随运行方式、接线变化、TA变比调整等定期或在改造后复核调整，并非一经确定就永不调整。","bank":"电气基础"},{"id":"39470ea5edef","type":"judge","category":"电气基础","stem":"母线保护的启动元件主要用于区分正常运行和故障状态。","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。启动元件（如大差启动、过流启动）用于判别系统是否发生故障，区分正常与故障状态，并据此开放保护逻辑。","bank":"电气基础"},{"id":"7449bb09f7d1","type":"judge","category":"电气基础","stem":"母线保护的灵敏度越高越好。","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。灵敏度过高会降低保护选择性、抗干扰能力和安全性，可能导致误动，应在灵敏度与选择性、可靠性之间折中，并非越高越好。","bank":"电气基础"},{"id":"f977e895ce2a","type":"judge","category":"电气基础","stem":"母线保护的快速动作特性会增加断路器的开断难度。","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。母线保护快速切除故障可缩短故障持续时间，减轻设备损伤并降低对断路器开断能力的考验，反而有利于断路器开断，不会增加开断难度。","bank":"电气基础"},{"id":"80859068eb34","type":"judge","category":"电气基础","stem":"基建新站必须确保监控软件使用当前最新版本，而保护程序要经省区确认后方可升级","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。基建新站监控软件应使用最新版本以保证功能；保护程序关系安全运行，其升级须经相应省区/调度确认批准后方可进行，确保版本受控。","bank":"电气基础"},{"id":"3fd10b8cfa86","type":"judge","category":"电气基础","stem":"电度表是专门用来测量设备功率的装置。","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。电度表（电能表）测量的是电能（有功/无功电量，单位kWh），不是瞬时功率；测量功率的是功率表（瓦特表）。","bank":"电气基础"},{"id":"1c56d959b26e","type":"judge","category":"电气基础","stem":"母线保护的动作信号可以不记录和保存。","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。母线保护动作信号须记录保存（事件记录、故障录波）以便事故分析，不可不记录。","bank":"电气基础"},{"id":"30c8c59e5e7a","type":"judge","category":"电气基础","stem":"母线保护的动作速度越快，对电力系统越有利。","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。在可靠前提下，快速切除母线故障可限制故障范围、维持系统稳定、减轻设备损伤，动作越快对系统越有利。","bank":"电气基础"},{"id":"92dc7b9ad0a9","type":"judge","category":"电气基础","stem":"母线保护的动作时间越短，对电力设备的冲击越小。","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。动作时间越短，短路电流作用时间越短，对电力设备的电动力和发热冲击越小。","bank":"电气基础"},{"id":"4998cf6880cc","type":"judge","category":"电气基础","stem":"母线保护的动作时间与故障类型无关。","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。母线保护动作时间/逻辑可能因故障类型而不同（如转换性故障、死区故障、失灵联跳等），并非与故障类型无关。","bank":"电气基础"},{"id":"36dc17867337","type":"judge","category":"电气基础","stem":"母线保护的动作行为只与故障电流大小有关。","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。母线保护动作还与故障类型、TA极性、电压闭锁条件、运行方式、TA饱和等多种因素有关，并非只与故障电流大小有关。","bank":"电气基础"},{"id":"b26bb8c76ad8","type":"judge","category":"电气基础","stem":"母线保护的电流互感器变比不一致时，不影响保护的正常工作。","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。各支路TA变比不一致时，母差保护需按变比折算到同一基准（电流平衡），若未正确设置将影响差动电流计算，导致误动或拒动。","bank":"电气基础"},{"id":"77e0c3867d59","type":"judge","category":"电气基础","stem":"母线保护的出口继电器动作后，直接跳开所有连接在母线上的断路器。","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。母差保护出口按故障母线选择，只跳开故障母线（或相关间隔）的连接断路器，并非直接跳开所有连接在母线上的断路器。","bank":"电气基础"},{"id":"10a2cfe570e8","type":"judge","category":"电气基础","stem":"母线保护不需要与调度自动化系统进行通信。","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。母线保护需上送动作信号、告警、录波等信息至调度自动化/故障信息系统，以便监控和事故处理，需要通信。","bank":"电气基础"},{"id":"e425071af62f","type":"judge","category":"电气基础","stem":"母线保护中，复合电压闭锁元件通常由低电压、负序电压和零序电压元件构成。","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。复合电压闭锁元件通常由低电压（三相电压降低）、负序电压（不对称故障）和零序电压（接地故障）元件构成，任一满足即开放。","bank":"电气基础"},{"id":"64ec8843ef58","type":"judge","category":"电气基础","stem":"母线充电保护的电流定值应按躲过母线正常运行时的最大负荷电流整定。","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。母线充电保护用于充电过程中切除母线故障，充电时母线基本无负荷，其定值按对母线故障有足够灵敏度整定，并非按躲过正常运行最大负荷电流整定。","bank":"电气基础"},{"id":"3237c98667d3","type":"judge","category":"电气基础","stem":"母线保护中，TA断线检测功能通常通过比较各支路电流的幅值和相位来实现。","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。母差TA断线检测一般通过比较各支路电流矢量和不平衡、幅值与相位异常来判别，正常时大差电流近似为零，断线时产生不平衡。","bank":"电气基础"},{"id":"a3e3b984a10f","type":"judge","category":"电气基础","stem":"断路器失灵保护是母线保护的后备保护，其动作时间应大于故障线路保护的动作时间。","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。失灵保护在故障元件保护动作而断路器拒动时动作，其动作时间应大于故障线路保护动作时间并加上断路器跳闸时间，以保证选择性。","bank":"电气基础"},{"id":"ec4a94d43f83","type":"judge","category":"电气基础","stem":"当母线发生金属性短路故障时，母线保护的电压闭锁元件一定会开放。","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。复合电压闭锁常采用'低电压元件动作且（负序或零序电压元件动作）'的逻辑。三相金属性短路时无负序、零序电压，仅低电压元件动作，若闭锁逻辑为'低电压与负序/零序相与'则不开放；且受TV异常等影响，并非一定开放。","bank":"电气基础"},{"id":"b7dc874c23e0","type":"judge","category":"电气基础","stem":"母线保护中，大差电流是指所有连接元件电流的矢量和，小差电流是指某一母线所有连接元件电流的矢量和。","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。双母线母差保护中，大差（总差）为除母联/分段外各支路电流相量和，用于判别区内/区外；小差为某一条母线（含母联）所连元件电流相量和，用于判别故障母线。","bank":"电气基础"},{"id":"61aac83b28ba","type":"judge","category":"电气基础","stem":"母线保护的主要作用是快速切除母线故障，保障电力系统稳定运行。","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。母线保护（母差）的核心作用是快速切除母线短路故障，限制故障范围、维持电力系统稳定运行。","bank":"电气基础"},{"id":"12f12c8512f7","type":"judge","category":"电气基础","stem":"为防御变压器过励磁应装设负序过电流保护。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。过励磁由电压与频率比值（U/f）升高引起，应装设过励磁（U/f）保护；负序过电流保护反映不对称故障，不能防御过励磁。","bank":"电气基础"},{"id":"a6754be646a2","type":"judge","category":"电气基础","stem":"变压器采用比率制动式差动继电器主要是为了躲励磁涌流和提高灵敏度。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。比率制动式差动继电器的主要目的是在外部故障TA饱和时提供制动防止误动并兼顾内部故障灵敏度；躲励磁涌流主要靠二次谐波制动、间断角鉴别等，并非比率制动的目的。","bank":"电气基础"},{"id":"935f6117c6fc","type":"judge","category":"电气基础","stem":"励磁涌流对于零差保护来说应该是一种穿越性电流，如果中性点TA极性错误，合闸那一侧产生的零序励磁涌流和中性点零序励磁涌流大小应该相等，方向相同。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。励磁涌流在零差保护（中性点TA与套管TA构成纵差）中为穿越性电流，因涌流由中性点流入、高压侧流出，两侧零序涌流大小相等、方向相同（对零差回路为同方向穿越）；若中性点TA极性错误则产生不平衡差流。","bank":"电气基础"},{"id":"95076575af82","type":"judge","category":"电气基础","stem":"防止励磁涌流的方法可采用具有速饱和铁芯的差动继电器。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。具有速饱和铁芯的差动继电器（如BCH型）利用涌流中大量非周期分量使铁芯速饱和、传变能力下降来躲过励磁涌流。","bank":"电气基础"},{"id":"5aac36045138","type":"judge","category":"电气基础","stem":"带负荷调压的油浸式变压器的调压装置，亦应装设瓦斯保护。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。带负荷调压（有载分接开关）油浸式变压器的调压装置故障会产生气体，反措要求该装置应装设瓦斯（气体）保护。","bank":"电气基础"},{"id":"db869438fd85","type":"judge","category":"电气基础","stem":"变压器投产时，要进行5次冲击合闸，冲击时不应投入变压器的差动、瓦斯保护。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。变压器冲击合闸正是检验差动、瓦斯保护能否正确反应励磁涌流和接地故障，冲击时差动和瓦斯保护必须投入，以便发现异常，'不应投入'说法错误。","bank":"电气基础"},{"id":"379147464db4","type":"judge","category":"电气基础","stem":"保护安装处的零序电压，等于故障点的零序电压减去故障点至保护安装处的零序电压降。因此，保护安装处距故障点越近，零序电压越高。","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。零序网络为单电源辐射网络，保护安装处零序电压=故障点零序电压−线路零序压降，距故障点越近压降越小，故零序电压越高。","bank":"电气基础"},{"id":"9326a7ff0288","type":"judge","category":"电气基础","stem":"线路保护第Ⅱ段动作时间应大于断路器拒动时的全部故障切除时间。","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。线路保护第Ⅱ段（限时电流速断/距离Ⅱ段）须与下一级保护配合，其动作时间应大于相邻元件保护动作时间加断路器跳闸时间（即下一级故障切除时间），以保证选择性。","bank":"电气基础"},{"id":"9ac914480f92","type":"judge","category":"电气基础","stem":"突变量保护中专门设有最简单的合闸于故障保护，这样做是基于认为手(重)合时只会发生内部故障。","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。突变量保护中设简单的合闸于故障保护，是基于合闸（手合/重合）时发生的故障均视为内部故障的假设，不考虑合闸瞬间恰发生外部故障。","bank":"电气基础"},{"id":"51bf6a161550","type":"judge","category":"电气基础","stem":"为保证迅速而有选择性的切除故障，常常将电流速断、限时电流速断和零序电流保护组合在一起，构成阶段式电流保护。","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。阶段式电流保护由电流速断（Ⅰ段）、限时电流速断（Ⅱ段）、定时限过电流（Ⅲ段）构成；零序电流保护是接地故障专用保护，不属于相间阶段式电流保护的三个段。","bank":"电气基础"},{"id":"b99b1324bd54","type":"judge","category":"电气基础","stem":"如果在相邻线路上发生短路时，既有助增电流又有外汲电流，在计算距离Ⅱ、Ⅲ段的定值时助增系数应取最小的助增系数，也就是应取助增电流最小，外汲电流最大的运行方式来计算助增系数。具体的讲，保护背后的电源应取最大运行方式，助增电源应取最小运行方式，外汲电流应取最大的运行方式。","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。距离Ⅱ、Ⅲ段与相邻线路配合时，为保证最不利方式下不误动，助增系数取最小值（即助增电流最小、外汲电流最大），具体为背后电源最大运行方式、助增电源最小运行方式、外汲电流最大运行方式。","bank":"电气基础"},{"id":"939a8ea8cd51","type":"judge","category":"电气基础","stem":"穿越性的负荷电流总是差动继电器的制动电流这一点对于工频变化量差动继电器来说是不成立的。","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。常规比率差动中穿越性负荷电流提供制动；但工频变化量差动基于故障分量，正常负荷电流无变化量（Δ≈0），不构成制动电流，故该说法对其不成立。","bank":"电气基础"},{"id":"386d58cc7ad3","type":"judge","category":"电气基础","stem":"瞬时电流速断保护可以保护线路的全长。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。瞬时电流速断（Ⅰ段）按躲本线路末端最大短路电流整定，只能保护线路首端一部分，不能保护全长（末端存在保护死区）。","bank":"电气基础"},{"id":"78fdba4d9fdf","type":"judge","category":"电气基础","stem":"限时电流速断保护仅靠动作时限即可保证选择性。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。限时电流速断（Ⅱ段）不仅靠动作时限，还需与相邻线路Ⅰ段配合整定其动作电流，以兼顾选择性和灵敏度，不能仅靠时限保证选择性。","bank":"电气基础"},{"id":"e0e3c33bb2fe","type":"judge","category":"电气基础","stem":"三段式电流保护中，定时限过电流保护的动作电流最大。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。三段式电流保护中动作电流最大的是电流速断Ⅰ段（按躲末端短路整定），定时限过电流Ⅲ段按躲最大负荷电流整定，动作电流最小，'最大'说法错误。","bank":"电气基础"},{"id":"bc2662d084d4","type":"judge","category":"电气基础","stem":"变电站中将交流一次侧高电压转换成二次电压，供给控制、测量、保护等二次设备使用的电气设备是电流互感器。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。将一次高电压转为二次电压供给二次设备的是电压互感器（PT/TV）；电流互感器（CT/TA）是将大电流转为小电流，题目张冠李戴。","bank":"电气基础"},{"id":"987c40c2ef4f","type":"judge","category":"电气基础","stem":"微机保护的自检功能可以自动检测硬件故障。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。微机保护通过软件自检（RAM、ROM、A/D、定值、开出回路等）可自动检测硬件故障并报警。","bank":"电气基础"},{"id":"9ba2ccdf27c7","type":"judge","category":"电气基础","stem":"后备保护的动作时间一定比主保护长。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。后备保护（近后备/远后备）动作时间按阶梯配合，必须大于主保护动作时间以保证选择性，故一定比主保护长。","bank":"电气基础"},{"id":"78df2040fd27","type":"judge","category":"电气基础","stem":"过负荷保护通常延时动作于信号。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。过负荷是允许短时运行的不正常运行状态，过负荷保护一般延时动作于信号告警，不立即跳闸（严重情况除外）。","bank":"电气基础"},{"id":"334988ffec86","type":"judge","category":"电气基础","stem":"方向过电流保护在正方向故障时动作，反方向故障时不动作。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。方向过电流保护带功率方向元件，仅当故障功率方向为正方向（指向被保护线路）时动作，反方向故障被方向元件闭锁而不动作。","bank":"电气基础"},{"id":"eb4ae7e6c847","type":"judge","category":"电气基础","stem":"变压器过励磁保护反应电压与频率的比值（U/f）增大。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。变压器过励磁由铁芯磁通密度B∝U/f增大引起，过励磁保护监测U/f比值越限定值而动作。","bank":"电气基础"},{"id":"71a691e312da","type":"judge","category":"电气基础","stem":"高频保护采用“故障时发信”方式，正常时无信号。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。闭锁式高频保护常采用'故障发信'方式，正常时不发信，故障时启动发信闭锁，故正常无信号。","bank":"电气基础"},{"id":"db638fe96e32","type":"judge","category":"电气基础","stem":"后备保护只能是时间后备，不能是灵敏度后备。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。后备保护既可以是时间后备（增加动作时限），也可以是灵敏度后备（本保护灵敏度不足时由其他保护作远后备），并非只能是时间后备。","bank":"电气基础"},{"id":"8b9aa47dde62","type":"judge","category":"电气基础","stem":"母线保护的差动电流是各支路电流的相量和。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。母差电流为各连接元件电流相量和（ΣI），区内故障时近似等于故障电流，区外故障时近似为零。","bank":"电气基础"},{"id":"a4ea0e02ed89","type":"judge","category":"电气基础","stem":"变压器中性点间隙保护的零序电压定值通常整定为180V。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。主变中性点间隙零序过电压保护（取自开口三角3U0，二次额定300V系统）定值一般整定为180V（二次值）、动作时间0.5s，是工程标准整定经验值。","bank":"电气基础"},{"id":"bf4f6c11fbb6","type":"judge","category":"电气基础","stem":"线路零序电流保护最末段定值应按躲过断路器开断电流整定。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。线路零序电流保护最末段（Ⅳ段）按与相邻线路配合、躲不平衡及保证灵敏度整定，并非按躲断路器开断电流整定。","bank":"电气基础"},{"id":"0a07e8d85a0d","type":"judge","category":"电气基础","stem":"双母线母差保护的大差元件用于判别故障母线。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。双母线母差保护中，大差元件用于判别区内/区外故障，小差元件才用于判别故障在哪一条母线，题目说大差判别故障母线错误。","bank":"电气基础"},{"id":"8ce004250129","type":"judge","category":"电气基础","stem":"变压器过激磁保护的启动值与系统频率成反比。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。过励磁保护监测U/f，在电压不变时频率越低U/f越大越易启动；整定按U/f越限，启动特性与系统频率成反比关系。","bank":"电气基础"},{"id":"4f58edfb5c51","type":"judge","category":"电气基础","stem":"母线充电保护在充电完成后应自动退出。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。母线充电保护是临时投入的保护，充电（合闸）完成后应自动或手动退出，避免正常运行时误动。","bank":"电气基础"},{"id":"e849216d5a09","type":"judge","category":"电气基础","stem":"断路器失灵保护的电流判别元件应躲过正常负荷电流。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。失灵保护电流判别元件应按保证对故障有足够灵敏度整定（如本线路末端故障灵敏系数≥1.3），并非以'躲过正常负荷电流'为原则，否则可能拒绝动作。","bank":"电气基础"},{"id":"484ba9e5d49e","type":"judge","category":"电气基础","stem":"母线保护的电压闭锁元件应闭锁总启动回路。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。电压闭锁元件应闭锁保护的跳闸出口回路（或差动逻辑），而非闭锁总启动回路；若闭锁启动回路则保护无法启动故障判别。","bank":"电气基础"},{"id":"cc63fbdbf1e1","type":"judge","category":"电气基础","stem":"对于装有专用母线保护的母线，还应有满足灵敏系数要求的线路或变压器的保护实现对母线的后备保护。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。即便装有专用母差保护，仍须由线路或变压器保护作为母线的远后备（满足灵敏系数要求），以防母差拒动。","bank":"电气基础"},{"id":"a458e103c67b","type":"judge","category":"电气基础","stem":"保护用的电流互感器安装位置的选择，既要考虑消除保护死区，也要尽可能考虑电流互感器本身故障所产生的后果（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。保护用TA安装位置需兼顾减小保护死区（如靠近断路器布置）和TA本体故障的影响（装在母线侧或线路侧对保护范围影响不同）。","bank":"电气基础"},{"id":"0da3f2d7bbdc","type":"judge","category":"电气基础","stem":"变压器保护中零序电流方向元件采用-110°灵敏角，如要求方向元件指向母线，则3U0与3I0应同极性接入（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。变压器零序方向元件采用-110°灵敏角时，若要求方向指向母线，3U0与3I0应按反极性（异极性）接入，而非同极性接入。","bank":"电气基础"},{"id":"3217713ff491","type":"judge","category":"电气基础","stem":"“合闸于故障保护”是基于以下认识而配备的附加简单保护。即合闸时发生的故障都是内部故障，不考虑合闸时刚好发生外部故障（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。合闸于故障保护（手合/重合闸后加速）基于合闸瞬间故障多为内部故障的假设，设简单突变量保护快速切除，不考虑合闸同时发生外部故障。","bank":"电气基础"},{"id":"a51640bbc636","type":"judge","category":"电气基础","stem":"母线充电保护是指母线故障的后备保护（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。母线充电保护是充电（合闸）过程中临时投入、用于切除充电时母线故障的保护，不是母线故障的后备保护（后备由失灵、相邻保护承担）。","bank":"电气基础"},{"id":"32ef3b0dbc2e","type":"judge","category":"电气基础","stem":"装于Y/Δ接线变压器高压侧的过电流保护，在低电压侧两相短路，采用三相三继电器的接线方式比两相两继电器的接线方式灵敏度高（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。Y/Δ变压器低压侧两相短路在高压侧反映为两相电流，三相三继电器（星形）接线能反应各类故障，比两相两继电器接线灵敏度更高（两相式对Y/Δ某些故障可能有一相不反应）。","bank":"电气基础"},{"id":"078e5f98900d","type":"judge","category":"电气基础","stem":"断路器失灵保护应直接使用断路器（隔离开关）的辅助接点，如使用辅助接点确有困难时，可采用辅助接点启动的双位置继电器（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。失灵保护判别断路器是否拒动应直接用断路器辅助触点确认跳闸状态；辅助触点不可靠时可经其启动的双位置继电器取得位置（防抖动）。","bank":"电气基础"},{"id":"6251b8f23051","type":"judge","category":"电气基础","stem":"电流互感器两相星形接线，只用来作为相间短路保护（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"正确。两相星形（V形）接线反映两相电流差，只能构成相间短路保护，不能可靠反映单相接地（无TA相在单相接地时灵敏度不足），故只用于相间短路保护。","bank":"电气基础"},{"id":"359d36b5680b","type":"judge","category":"电气基础","stem":"被保护线路上任一点发生AB两相金属性短路时，母线上的电压Uab等于零（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。AB两相金属性短路时，故障点处故障相电压为零，但母线处因线路压降故障相电压并不为零；线电压Uab在母线处一般不为零（只有短路点直接短路才为零）。","bank":"电气基础"},{"id":"8cad52320aae","type":"judge","category":"电气基础","stem":"当电力系统发生严重的低频事故时，为迅速使电网恢复正常，低频减负荷装置在达到动作值后，可以不经时限立即动作，快速切除负荷（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"错误。低频减负荷装置为防止频率暂态波动（冲击负荷等）误切负荷，各级均带一定动作时限（通常0.2～0.5s及以上按轮次延时），不应无时限立即动作。","bank":"电气基础"},{"id":"703ed04096ce","type":"judge","category":"电气基础","stem":"近后备保护是当主保护或断路器拒动时，由相邻电力设备或线路的保护来实现的后备保护（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"近后备保护是指当主保护拒动时，由本设备/线路的另一套保护（或断路器失灵保护）实现后备；由相邻电力设备或线路的保护来实现的后备称为“远后备”保护。题干把远后备的定义说成近后备，故错误。","bank":"电气基础"},{"id":"c1bc5095886a","type":"judge","category":"电气基础","stem":"同步相量测量装置（PMU）可提供全网同步的电压、电流相量数据","options":{"A":"对","B":"错"},"answer":"对","explanation":"同步相量测量装置（PMU）基于GPS等同步时钟对电压、电流同步采样，输出带统一时标的同步相量，可提供全网同步的电压、电流相量数据，用于广域监测分析。故正确。","bank":"电气基础"},{"id":"9c728f4a8d7a","type":"judge","category":"电气基础","stem":"低频减载装置的动作原则是按频率分级切除负荷，防止系统频率崩溃","options":{"A":"对","B":"错"},"answer":"对","explanation":"低频减载按频率下降分级（轮次）切除次要负荷，阻止频率进一步下降，防止系统频率崩溃。故正确。","bank":"电气基础"},{"id":"29d089d83668","type":"judge","category":"电气基础","stem":"瓦斯保护能反应变压器油箱内部的匝间短路和油面下降","options":{"A":"对","B":"错"},"answer":"对","explanation":"瓦斯保护反应变压器油箱内部故障，包括匝间短路、铁芯故障、油面下降等，是油箱内部故障的主保护。故正确。","bank":"电气基础"},{"id":"e8e2fe1649e8","type":"judge","category":"电气基础","stem":"对Y/△－11接线的变压器，当变压器△侧出口发生两相短路故障，Y侧保护的低电压元件接相间电压，该元件不能正确反映故障相间电压","options":{"A":"对","B":"错"},"answer":"对","explanation":"Y/△-11接线变压器△侧两相短路时，Y侧故障相间电压存在30°相移，若低电压元件接相间电压，则不能正确反映故障相别的相间电压，需采用相电压或特殊接线。故正确。","bank":"电气基础"},{"id":"084dd461f1e9","type":"judge","category":"电气基础","stem":"微机线路保护每周波采样12点，现负荷潮流为有功功率P=86.6MW、无功功率Q=50Mvar，微机保护打印出电压、电流的采样值，在微机保护工作正确的前提下，UA比IB由正到负过零点超前4个采样点","options":{"A":"对","B":"错"},"answer":"错","explanation":"P=86.6MW、Q=50Mvar，功率因数角φ=arctan(50/86.6)=30°，电流滞后电压30°。每周波采样12点，每点对应30°，则UA过零点应超前IB过零点1个采样点，而非4个。故错误。","bank":"电气基础"},{"id":"13a90d1cca90","type":"judge","category":"电气基础","stem":"微机保护的抗干扰能力比传统保护强","options":{"A":"对","B":"错"},"answer":"对","explanation":"微机保护采用数字滤波、算法处理和光电隔离等措施，抗干扰能力优于传统电磁型/晶体管型保护。故正确。","bank":"电气基础"},{"id":"b97385ac8a41","type":"judge","category":"电气基础","stem":"定时限过电流保护的动作时间与短路电流大小无关","options":{"A":"对","B":"错"},"answer":"对","explanation":"定时限过电流保护的动作时间固定，与短路电流大小无关（反时限保护才与时间有关）。故正确。","bank":"电气基础"},{"id":"5a174cc58b01","type":"judge","category":"电气基础","stem":"过电流保护的动作电流是按躲过最大短路电流来整定的","options":{"A":"对","B":"错"},"answer":"错","explanation":"过电流保护的动作电流按躲过最大负荷电流（并考虑返回系数）整定，而非躲过最大短路电流（躲最大短路电流是速断保护的整定原则）。故错误。","bank":"电气基础"},{"id":"e65c6e84de84","type":"fill","category":"电气基础","stem":"在标准化设计规范中对电缆直跳回路的要求是什么?","options":{},"answer":"对电缆直跳回路的要求如下：(1)对于可能导致多个断路器同时跳闸的直跳开入，应采取措施防止直跳开入的保护误动作。例如在开入回路中装设大功率抗干扰继电器，或者采取软件防误措施。(2)大功率抗干扰继电器的启动功率应大于5W,动作电压在额定直流电源电压的55%～70%范围内，额定直流电源电压下动作时间为10～35ms,应具有抗220V工频电压干扰的能力。(3)当传输距离较远时，可采用光纤传输跳闸信号。解析：出自Q/GDW1161—2014《线路保护及辅助装置标准化设计规范》4.3.3。","explanation":"出自 Q/GDW 1161—2014《线路保护及辅助装置标准化设计规范》4.3.3。要点：可能导致多个断路器同时跳闸的直跳开入须防误动（在开入回路装大功率抗干扰继电器或采取软件防误）；大功率抗干扰继电器启动功率应 > 5 W、动作电压在额定直流 55%～70% 范围、额定直流下动作时间 10～35 ms、具有抗 220 V 工频干扰能力；传输距离较远时可采用光纤传输跳闸信号。","bank":"电气基础"},{"id":"a97923df424e","type":"fill","category":"电气基础","stem":"国家电网有限公司的标准化设计规范简称信息规范“六统一”设计，“六统一”设计是指哪“六统一”?而信息规范指的是什么?","options":{},"answer":"“六统一”是指微机保护的功能配置、回路设计、端子排布置、接口标准、屏柜压板、定值报告6个方面统一。信息规范是指信息输出、操作菜单、面板灯的规范化。","explanation":"“六统一”指微机保护的功能配置、回路设计、端子排布置、接口标准、屏柜压板、定值报告六个方面统一。“信息规范”指信息输出、操作菜单、面板灯的规范化，便于不同厂家保护装置运维统一管理。","bank":"电气基础"},{"id":"8a1818788990","type":"fill","category":"电气基础","stem":"对于光纤及微波通道的检查项目有哪些?","options":{},"answer":"(1)对于光纤及微波通道可以采用自环的方式检查通道是否完好。光纤通道还可以通过下面两种方法检查通道是否完好：方法一，拔插待测光纤一端的通信端口，观察其对应另一端的通信接口信号灯是否正确熄灭和点亮;方法二，采用激光笔照亮待测光纤的一端而在另外一端检查是否点亮。(2)光纤尾纤检查及要求：光纤尾纤应星现自然弯曲(弯曲半径大于3cm),不应存在弯折的现象，不应承受任何外重，尾纤表皮应完好无损;尾纤接头应干净无异物，如有污染应立即清洁干净;尾纤接头连接应牢靠，不应有松动现象。(3)对于与光纤及微波通道相连的保护用附属接口设备应对其继电器输出触点、电源和接口设备的接地情况进行检查。(4)通信专业应对光纤及微波通道的误码率和传输时间进行检查，指标应满足GB/T14285—2006的要求。(5)对于利用专用光纤及微波通道传输保护信息的远方传输设备，应对其发信功率(电平)、收信灵敏度进行测试，并保证通道的裕度满足运行要求。","explanation":"检查项目：①可采用自环方式检查通道；光纤还可拔插端口观察对端信号灯、或用激光笔点亮测通断。②尾纤应自然弯曲（半径 > 3 cm）、无弯折、表皮完好、接头清洁牢靠。③检查附属接口设备的继电器触点、电源与接地。④通信专业测误码率与传输时间（满足 GB/T 14285—2006）。⑤测发信功率（电平）/收信灵敏度，保证通道裕度满足运行要求。","bank":"电气基础"},{"id":"399f2e392cce","type":"fill","category":"电气基础","stem":"《国家电网有限公司十八项电网重大反事故措施(2018年修订版)》中对开关场的变压器、断路器、隔离开关和电流电压互感器等设备至开关场端子箱之间的二次电缆，防止空间磁场对二次电缆的干扰有哪些措施?","options":{},"answer":"由一次设备(如变压器、断路器、隔离开关和电流、电压互感器等)直接引出的二次电缆的屏蔽层应使用截面积不小于4mm²多股铜质软导线仅在就地端子箱处一点接地，在一次设备的接线盒(箱)处不接地，二次电缆经金属管从一次设备的接线盒(箱)引至电缆沟，并将金属管的上端与一次设备的底座或金属外壳良好焊接，金属管另一端应在距一次设备3～5m之外与主接地网焊接。","explanation":"一次设备引出的二次电缆屏蔽层用截面积不小于 4 mm² 多股铜质软导线仅在就地端子箱处一点接地（一次侧接线盒处不接地）；电缆经金属管从一次接线盒引至电缆沟，金属管上端与一次设备底座/金属外壳良好焊接，另一端在距一次设备 3～5 m 外与主接地网焊接。如此可减小空间磁场在屏蔽层感生的大电流。","bank":"电气基础"},{"id":"8383c933c776","type":"fill","category":"电气基础","stem":"《国家电网有限公司十八项电网重大反事故措施(2018年修订版)》中，在开关场二次电缆沟道内铺设专用铜排(缆)的要求有哪些?在电缆沟铺设专用铜排(缆)的作用是什么?","options":{},"answer":"(1)应在开关场二次电缆沟道内沿二次电缆敷设截面积不小于100mm²的专用铜排(缆);专用铜排(缆)的一端在开关场的每个就地端子箱处与主地网相连，另一端在保护室的电缆沟道入口处与主地网相连，铜排不要求与电缆支架绝缘。(2)在电缆沟铺设专用铜排(缆)的作用是防止在变电站站内或附近发生接地故障时，由于站内主地网电位差而在二次电缆屏蔽层流过大电流，并将其烧坏。","explanation":"要求：沿开关场二次电缆沟敷设截面积不小于 100 mm² 的专用铜排（缆），一端在就地端子箱处、另一端在保护室电缆沟入口处分别与主地网相连，铜排不要求与电缆支架绝缘。作用：防止变电站内/附近发生接地故障时，因主地网电位差在二次电缆屏蔽层流过烧坏电缆的大电流。","bank":"电气基础"},{"id":"549511e42547","type":"fill","category":"电气基础","stem":"为什么屏蔽电缆的屏蔽层使用导电性能好的铜网?","options":{},"answer":"答：图5-25表示电磁干扰的原理。 Ig (a)千扰磁通 E电缆芯 R+jX 屏蔽层 (b)干扰屏蔽原理 图5-25电磁干扰示意图 在图5-25(a)中，干扰源导线中电流产生的磁通以虚线同心圆表示，这些磁通的一部分包围控制电缆芯和其屏蔽层(可近似认为包围这两者的磁通相等),称为干扰磁通。它在电缆芯和屏蔽层中，产生一电动势Eg,产生屏蔽层电流Is如图5-25(b)所示。电动势Es为 E=-L(dI/dt)=I₈Rg+jl₈X₈ 屏蔽层电流所产生的磁通包围着屏蔽层，也全部包围着电缆芯，这些磁通和外导线产生的干扰磁通方向相反，故称为反向磁通，在图中以实线同心圆表示。设屏蔽层对电缆芯的互感抗为Xm,则E=-jI₈Xm。 因屏蔽层将电缆心完全包围在内，故Xm=Xg。这样从上两式可看出，如果屏蔽层电阻R₈=0,则E₈=-E。但是屏蔽层不可能没有电阻，故干扰磁通在电缆中感应的电动势不能被抵消的部分则等于E₈+E=I₈×Rs,即与屏蔽层的电阻成正比。因此，要有效地消除电磁耦合的干扰，必须采用电阻系数小的材料如铜、铝等作成屏蔽层。","explanation":"干扰磁通在电缆芯与屏蔽层感生电动势 Eg，屏蔽层电流 Is 产生反向磁通抵消干扰。若屏蔽层电阻 Rs = 0 则完全抵消；实际 Rs≠0，未被抵消部分 ∝ Is × Rs。故屏蔽层电阻越小越好，铜的电阻系数小、导电性能好，能有效消除电磁耦合干扰，因此屏蔽层用铜网。","bank":"电气基础"},{"id":"c0697c0a2f2d","type":"fill","category":"电气基础","stem":"简述硬件电路对外引线的抗干扰基本措施","options":{},"answer":"答： (1)交流输入端子采用变换器隔离，一、二次线圈间有屏蔽层且屏蔽层可靠接地。 (2)开关量输入、输出端子采用光电耦合器隔离。 (3)直流电源采用逆变电源，高频变压器线圈问有屏蔽层。(4)机箱和屏蔽层可靠接地。","explanation":"硬件电路对外引线抗干扰基本措施：①交流输入端子采用变换器隔离，一、二次线圈间设屏蔽层且可靠接地；②开关量输入/输出端子采用光电耦合器隔离；③直流电源采用逆变电源，高频变压器线圈间设屏蔽层；④机箱和屏蔽层可靠接地。核心是电气隔离 + 屏蔽接地。","bank":"电气基础"},{"id":"21f5580956cc","type":"fill","category":"电气基础","stem":"为什么交直流回路不可以共用一条电缆?","options":{},"answer":"答： (1)交直流回路都是独立系统。直流回路是绝缘系统而交流回路是接地系统。若共用一条电缆，两者之间一旦发生短路就造成直流接地，同时影响了交、直流两个系统。 (2)平常也容易互相干扰，还有可能降低对直流回路的绝缘电阻。","explanation":"交、直流回路均为独立系统：直流为绝缘系统、交流为接地系统。若共用一条电缆，一旦发生短路即造成直流接地，同时影响交、直流两个系统；且平时互相干扰、降低直流回路绝缘电阻，危及保护可靠性。故交直流电缆须分开敷设。","bank":"电气基础"},{"id":"fb5085a2b739","type":"fill","category":"电气基础","stem":"何谓差模干扰、共模干扰?它们的主要危害是什么?","options":{},"answer":"答：简单地说，差模干扰是指影响输入信号的干扰，共模干扰是指外引线对地之间的干扰。差模干扰的主要危害是影响输入信号的大小，产生误差。共模干扰的主要危害是影响逻辑功能，甚至使程序走乱、损坏芯片。","explanation":"差模干扰是影响输入信号（线间）的干扰，主要危害是改变输入信号大小、产生测量误差；共模干扰是外引线对地之间的干扰（共模电压），经不平衡转化为差模后主要危害逻辑功能，甚至使程序走乱、损坏芯片。抗干扰设计须分别加以抑制。","bank":"电气基础"},{"id":"eef092e61080","type":"fill","category":"电气基础","stem":"为什么要测量跳合闸回路电压降，怎样测量及其合格标准?","options":{},"answer":"答：测量跳合闸回路电压降是为了使断路器在跳合闸时，跳、合闸线圈有足够的电压，保证可靠跳、合闸。跳合闸回路电压降测量方法如下： (1)测量前先将合闸熔断器取下。断路器在合闸位置时测量合闸线圈电压降，先将合闸回路接通(如有重合闸时应先将重合闸继电器中间元件按住),用高内阻直流电压表与合闸线圈两端并接，然后短接断路器的合闸辅助触点，合闸继电器动作，即可读出合闸辅助线圈的动作电压降。 (2)断路器在跳闸位置时测量跳闸线圈电压降，将保护跳闸回路接通，用高内阻直流电压表(万能表即可)并接在跳闸线圈两端，短接断路器的跳闸辅助触点使跳闸线圈动作，即可读出跳闸线圈电压降。跳闸、合闸线圈的电压降均不小于电源电压的90%才算合格。","explanation":"跳合闸线圈是短时带电设计，只有两端电压足够高才能可靠动作。测量时用高内阻直流电压表并接在线圈两端（高内阻避免分流、读数才准确），通过短接辅助触点使线圈通电，读出动作瞬间的电压降。合格判据是线圈上实际电压不低于电源电压的90%（即压降损失≤10%），否则在最低操作电压下可能拒动。记忆要点：测的是“线圈动作电压”而非电源电压，标准是≥90%Un。","bank":"电气基础"},{"id":"64137e56dd46","type":"fill","category":"电气基础","stem":"跳、合闸回路中的位置继电器应如何选择?","options":{},"answer":"答： (1)继电器线圈串入附加电阻后，继电器线圈上的电压Uk应不低于其动作电压Uop, 即Uk≥Uop≈0.7Un。 (2)当继电器线圈被短路或附加电阻被短路时，跳、合闸线圈上的电压应不足以使断路器动作，裕度不小于1.3。 (3)长期流过控制回路中的跳闸线圈和合闸线圈的电流Icq,应不致引起过热，即Icg≤0.15In。 为了不破坏这些继电器的工作条件，在直流操作回路中往往取其额定电压等于操作电源额定电压的一半，并根据这一条件选择附加电阻的参数。附加电阻的数值，按照保证在继电器上的电压等于其额定电压的条件确定。","explanation":"位置继电器（TWJ/HWJ）串附加电阻后接在跳合闸回路中，需同时满足三个条件：①可靠动作——线圈电压Uk≥动作电压Uop≈0.7Un；②防误动——当线圈或附加电阻被短路时，线圈上电压不足以使断路器误动，且留有≥1.3的裕度；③防过热——长期流过跳闸/合闸线圈的电流Icq≤0.15In。为兼顾以上条件，直流回路中常取继电器额定电压为操作电源电压的一半，并据此选附加电阻使线圈电压等于其额定电压。","bank":"电气基础"},{"id":"6dac330f1ba2","type":"fill","category":"电气基础","stem":"出口继电器作用于断路器跳(合)闸线圈时，其触点回路中串入的电流自保持线圈应满足哪些条件?","options":{},"answer":"答：断路器跳(合)闸线圈的出口触点控制回路，必须设有串联自保持的继电器回路，应满足以下条件：①跳(合)闸出口继电器的触点不断弧;②断路器可靠跳、合。只有单出口继电器的，可以在出口继电器跳(合)闸触点回路中串入电流自保持线圈，并满足如下条件： (1)自保持电流不大于额定跳(合)闸电流的一半左右，线圈压降小于5%额定值。 (2)出口继电器的电压启动线圈与电流自保持线圈的相互极性关系正确。 (3)电流与电压线圈间的耐压水平不低于交流1000V、1min的试验标准(出厂试验应为交流2000V、1min)。 (4)电流自保持线圈接在出口触点与断路器控制回路之间。 当有多个出口继电器可能同时跳闸时，宜由防止跳跃继电器实现上述任务。防跳继电器应为快速动作的继电器，其动作电流小于跳闸电流的一半，线圈压降小于10%额定值，并满上述(2)～(4)项的相应要求。","explanation":"电流自保持线圈是为保证出口触点断开前跳闸/合闸脉冲持续而设，条件围绕“自保可靠且不干扰主回路”展开：①自保持电流≤额定跳合闸电流的一半、线圈压降\u003c5%，避免过多分流影响线圈动作；②电压启动线圈与电流自保持线圈极性必须正确，否则不能自保或误动；③两线圈间耐压≥交流1000V·1min（出厂2000V·1min）；④电流线圈应接在出口触点与断路器控制回路之间。多个出口继电器同时跳闸时改由防跳继电器实现，其动作电流\u003c跳闸电流一半、压降\u003c10%。","bank":"电气基础"},{"id":"3ad50be3777f","type":"fill","category":"电气基础","stem":"在中间继电器等的直流回路中，为什么不推荐用电阻一电容组成的消弧电路?","options":{},"answer":"答：在动合触点上并接电阻—电容消弧回路，可能造成合直流时的被控制的中间继电器触点抖动，电容器短路还可能使中间继电器动作。在中间继电器线圈上并接电阻一电容消弧回路，则影响继电器的动作时间和返回时间。","explanation":"RC消弧回路在中间继电器直流回路中副作用明显：若在动合触点上并接RC，合闸瞬间电容相当于短路，可能引起被控中间继电器触点抖动，电容短路还可能使中间继电器误动作；若在线圈上并接RC，则会改变线圈充放电过程，影响继电器的动作时间和返回时间。因此中间继电器一般不推荐用RC消弧，而优先采用二极管（反向并联）等方案。","bank":"电气基础"},{"id":"a11331d005ab","type":"fill","category":"电气基础","stem":"直流中间继电器的消弧回路有哪几种?","options":{},"answer":"答： (1)对于110V、220V电压的中间继电器，可在其动作线圈上并入经电阻和反向二极管串联的回路，或并入经电阻和电容串联的回路(对动作时间无严格要求时)。 (2)对弱电回路的小型中间继电器，可在其线圈上并入一反向二极管。","explanation":"直流中间继电器常用消弧（吸收线圈断电反电动势）回路有两类：①对于110V、220V电压的中间继电器，可在动作线圈上并入“电阻+反向二极管串联”回路，或并入“电阻+电容串联”回路（仅在对动作时间无严格要求时）；②对弱电回路的小型中间继电器，可直接在线圈上并入一只反向二极管即可。反向二极管并联可泄放断电时的反向电动势且不增加正常功耗。","bank":"电气基础"},{"id":"45c9d7ac0a4b","type":"fill","category":"电气基础","stem":"CVT二次电压异常的原因是什么?","options":{},"answer":"答： (1)二次输出为零，可能是中压回路开路或短路，电容单元内部连接断开，或二次接线短路。 (2)二次输出电压高。可能是电容器C1有元件损坏，或电容单元低压端未接地。计算公式为U₁IU₂=1+C₂IC₁。 (3)二次输出电压低。可能是电容器C2有元件损坏，二次过负荷或连接接触不良或电磁单元故障。 (4)三相电压不平衡，开口三角有较高电压，设备有异常响声并发热，可能是阻尼回路不良引起自身谐振现象，应立即停止运行。 (5)二次电压波动，可能是二次连接松动，或分压器低压端子未接地或未接载波回路，如果是速饱和电抗型阻尼器，有可能是参数配合不当。 (6)N600两点接地、击穿保险击穿、开口三角短路等","explanation":"CVT（电容式电压互感器）二次电压异常可按现象定位：①二次为零——中压回路开路/短路、电容单元内部连接断、二次短路；②二次电压高——C1元件损坏或低压端未接地，按U₁/U₂=1+C₂/C₁判断；③二次电压低——C2损坏、二次过负荷、接触不良或电磁单元故障；④三相不平衡、开口三角高压且异响发热——阻尼回路不良引起自身谐振，须立即停运；⑤二次电压波动——连接松动、低压端未接地或未接载波、阻尼器参数不当；⑥N600两点接地、击穿保险击穿、开口三角短路等二次回路问题。","bank":"电气基础"},{"id":"6de79ce3bfec","type":"fill","category":"电气基础","stem":"为什么要限制电压互感器的二次负荷，电压互感器二次熔丝(或快分开关)应如何选择?","options":{},"answer":"答： (1)电压互感器的准确等级是相对一定的负荷定的，增加电压互感器的二次负荷，二次电压会降低，其测量误差增大。同时增加负荷会使电压互感器至控制室的二次电缆压降也相应增大。 (2)一般电压互感器的二次侧熔丝(快分开关)应按最大负荷电流的1.5倍选择。","explanation":"电压互感器准确级是在规定二次负荷下才成立的；负荷增大→二次电压降低→测量误差增大，同时PT到控制室的二次电缆压降也增大，影响计量与保护。因此须限制二次负荷。二次熔丝（或快分开关）按最大负荷电流的1.5倍选择，既能躲过正常最大负荷电流，又可在短路或过负荷时及时熔断/分断，保护PT。","bank":"电气基础"},{"id":"9960f8d4627a","type":"fill","category":"电气基础","stem":"电压互感器在运行中为什么要严防二次侧短路?","options":{},"answer":"答：电压互感器是一个内阻极小的电压源，正常运行时负载阻抗很大，相当于开路状态，二次侧仅有很小的负载电流。当二次短路时，负载阻抗为零，将产生很大的短路电流，会将电压互感器烧坏。","explanation":"电压互感器相当于内阻极小的电压源，正常运行时二次负载阻抗很大、近似开路，仅流过很小负载电流。一旦二次短路，负载阻抗变为零，二次电流剧增形成很大的短路电流，会迅速烧坏PT绕组。故PT运行中必须严防二次侧短路，二次一般装设专用快速熔断器（开口三角侧除外）。","bank":"电气基础"},{"id":"db9b0ce6ad35","type":"fill","category":"电气基础","stem":"电压互感器开口三角侧断线和短路，将有什么危害?是否装设熔断器?","options":{},"answer":"答： (1)断线和短路，将会使这些接入开口三角电压的保护在接地故障中拒动，用于绝缘监视的继电器不能正确反应一次接地问题;开口三角短路，还会使绕组在接地故障中过流而烧坏电压互感器。 (2)不能装设熔断器。因为正常运行时，电压互感器的零序电压回路无电压，不能监视熔断器是否断开，一旦熔丝熔断了，而系统发生接地故障，则保护拒动。","explanation":"PT开口三角正常无电压（仅接地时出现零序电压），其上接入绝缘监视和接地保护。若断线或短路：接地故障时这些保护将拒动、绝缘监视不能正确反映接地；开口三角短路还会使绕组在接地故障中过流而烧坏PT。因此不能装熔断器——正常运行时零序回路无电压，无法监视熔丝是否熔断，一旦熔丝悄悄断掉，系统真接地时保护就会拒动。","bank":"电气基础"},{"id":"c20f7d6e814c","type":"fill","category":"电气基础","stem":"为什么电流互感器多数安装于断路器的线路侧?","options":{},"answer":"答： (1)若电流互感器安装于断路器线路侧，断路器与电流互感器之间为线路保护的死区，母线保护的超出区;若电流互感器安装于断路器母线侧，断路器与电流互感器之间为母线保护的死区，线路保护的超出区。如果电流互感器安装于断路器线路侧，当断路器与电流互感器之间故障时，由母差保护瞬时动作跳开一条母线的断路器，同时线路对端主保护接远跳令跳开线路对端断路器，切除故障。虽然故障范围扩大，但对整个电网影响小。 (2)如果电流互感器安装于断路器母线侧，当断路器与电流互感器之间故障时，由线路主保护瞬时动作跳开该线路两侧断路器，但通过母线继续向故障点提供故障电流，而此故障点属母差保护区外故障，母差保护不能动作，只能靠上一级电源端(主变压器、其他电源线路)后备保护动作切除故障。因而故障扩大范围大，故障存留时间长，极易引起系统振荡，严重时酿成电网事故。","explanation":"CT装于断路器线路侧还是母线侧，决定故障“死区”归属。装线路侧时：断路器与CT之间属线路保护死区、母差超出区；该区间故障由母差跳开本母线、对端远跳切对侧，故障范围虽扩大但对全网影响小。若装母线侧：该区间故障线路保护跳两侧后，母线仍向故障点供流，而此点在母差区外不能动作，只能靠上级后备保护切除，故障存留时间长、易引发系统振荡甚至电网事故。故一般将CT装在线路侧以缩小对系统的冲击。","bank":"电气基础"},{"id":"0adb2edb49c9","type":"fill","category":"电气基础","stem":"电流互感器的二次负载阻抗如果超过了其允许的二次负载阻抗，为什么准确度就会下降?","options":{},"answer":"答：如果电流互感器二次负载阻抗增加得很多，超出了所允许的二次负载阻抗时，励磁电流的数值就会大大增加，而使铁芯进入饱和状态，在这种情况下，一次电流的很大一部分用来提供励磁电流，从而使互感器的误差大为增加，其准确度就随之下降了。","explanation":"电流互感器靠铁芯磁通传变一次电流，二次负载阻抗越大，为维持二次电流所需的励磁条件改变，励磁电流显著增加。当二次负载阻抗超过允许值时，励磁电流大增使铁芯进入饱和，一次电流中很大一部分用于励磁而不传变到二次侧，导致比值差与相位差急剧增大，准确度下降。记忆：负载↑→励磁电流↑→铁芯饱和→误差↑→准确度↓。","bank":"电气基础"},{"id":"eaa27eff9e8c","type":"fill","category":"电气基础","stem":"当母线出线发生近区故障电流互感器饱和时，其二次侧电流有哪些特点?","options":{},"answer":"答： (1)在故障发生瞬间，由于铁芯中的磁通不能跃变，电流互感器不能立即进入饱和区，而是存在一个时域为3～5ms的线性传递区。在线性传递区内，电流互感器二次电流与一次电流成正比。 (2)电流互感器饱和之后，在每个周期内一次电流过零点附近存在不饱和时段，在此时段内，电流互感器二次电流又与一次电流成正比。 (3)电流互感器饱和后其励磁阻抗大大减小，使其内阻大大降低，严重时内阻等于零。 (4)电流互感器饱和后，其二次电流偏于时间轴一侧，致使电流的正、负半波不对称，电流中含有很大的二次和三次谐波电流分量。","explanation":"近区故障CT严重饱和时二次侧电流有四个特征：①故障瞬间磁通不能跃变，存在3~5ms线性传递区，此区内二次电流与一次成正比；②饱和后每周期一次电流过零附近仍有不饱和时段，该时段二次与一次成正比；③饱和后励磁阻抗大减、内阻大大降低，严重时内阻≈0；④二次电流偏于时间轴一侧，正负半波不对称，含有很大的二次、三次谐波分量。这些特征正是饱和识别与抗饱和算法的依据。","bank":"电气基础"},{"id":"9f6c1b9fd848","type":"fill","category":"电气基础","stem":"请简述变电站某间隔投运时极性结果的判断标准。","options":{},"answer":"答： (1)测量的功率方向应与实时潮流的功率方向一致。 (2)电流互感器极性靠近母线侧为极性端情况下，用负荷电流测试极性时，若有功潮流流出母线，电流超前电压范围应为-90°~+90°,若有功潮流流进母线，电流超前电压范围应为90°~270°。 (3)电流互感器极性靠近母线侧为极性端情况下，用负荷电流测试极性时，若无功潮流流出母线，电流超前电压范围应为180°~360°,若无功潮流流进母线，电流超前电压范围应为0°~180°。","explanation":"间隔投运用负荷电流校核极性的标准：①实测功率方向须与实时潮流方向一致（这是总判据）；②以CT极性端靠母线侧为前提，用负荷电流测试：有功潮流流出母线时电流超前电压-90°~+90°，流进母线时90°~270°；③无功潮流流出母线时电流超前电压180°~360°，流进母线时0°~180°。实质是利用已知潮流方向反推CT与电压互感器接线极性是否正确。","bank":"电气基础"},{"id":"0a42d2adbc62","type":"fill","category":"电气基础","stem":"电压互感器和电流互感器在作用原理上有什么区别?","options":{},"answer":"答：主要区别是正常运行时工作状态很不相同，具体表现为： (1)电流互感器二次可以短路，但不得开路;电压互感器二次可以开路，但不得短路。 (2)相对于二次侧的负载来说，电压互感器的一次内阻较小以至可以忽略，可以认为电压互感器是一个电压源;而电流互感器的一次内阻很大，可以认为是一个内阻无穷大的电流源。 (3)电压互感器在正常工作时的磁通密度接近饱和值，故障时磁通密度下降;电流互感器正常工作时磁通密度很低，而短路时由于一次侧短路电流变得很大，使磁通密度大大增加，有时甚至远远超过饱和值。","explanation":"PT与CT虽都是互感器，工作机理相反：①安全使用上，CT二次可短路但严禁开路（开路产生危险高压），PT二次可开路但严禁短路（短路烧坏）；②源特性上，PT一次内阻很小可视为电压源，CT一次内阻很大可视为电流源；③磁通上，PT正常磁通密度接近饱和、故障时下降，CT正常磁通密度很低、短路时一次电流剧增使磁通大增甚至远超饱和。","bank":"电气基础"},{"id":"6be1feed616a","type":"fill","category":"电气基础","stem":"Y/△-11接线的变压器，相间功率方向继电器接﹣90°接线，其电流采用△侧IAB、IBA以及ICA电流，则如何采用Y侧的电压？","options":{},"answer":"A相功率继电器：IAB-UCY;B相功率继电器：IBA-UAY;C相功率继电器：ICA-UBY。","explanation":"Y/△-11接线的变压器采用-90°接线（即按相电压与相电流配合消除转角差）时，△侧取线电流IAB、IBA、ICA，对应Y侧应取非同名相的相间电压：A相功率继电器用IAB配UCY（C相电压），B相用IBA配UAY（A相电压），C相用ICA配UBY（B相电压）。记忆：△侧I_XY 对应 Y侧 U_ZY（Z为剩余相），以抵消Y/△接线带来的30°相位差。","bank":"电气基础"},{"id":"d2d55a03bef2","type":"fill","category":"电气基础","stem":"简述三相变压器空载合闸时励磁涌流的大小及波形特征与哪些因素有关。","options":{},"answer":"三相变压器空载合闸的励磁涌流大小和波形与下列因素有关：①系统电压大小和合闸出相角;②系统等值电抗大小;③铁芯剩磁、铁芯结构;④铁芯材质（饱和特性、磁滞环）;⑤合闸在高压或低压侧。","explanation":"三相变压器空载合闸励磁涌流的大小与波形取决于铁芯磁通可达到的饱和程度及衰减过程，相关因素有：①系统电压大小及合闸初相角（合闸角决定投入瞬间磁通初值）；②系统等值电抗（决定涌流衰减速度）；③铁芯剩磁大小与极性、铁芯结构；④铁芯材质（饱和特性、磁滞环）；⑤合闸在哪一侧（高/低压侧）。剩磁与投入磁通同向时涌流最大。","bank":"电气基础"},{"id":"7213bf3e1319","type":"fill","category":"电气基础","stem":"光纤通道可使用专用纤芯、2M复用两种方式，其中2M复用指什么？","options":{},"answer":"保护信号需通过保护通信单元形成标准的2M信号，然后利用现有的SDH光传输设备将2M信号传送到对端，光端机采用SDH技术，将2M电路装入相应的虚容器中后按照复用原则直接载入SDH帧中，到达对端站点后根据指针信息直接从SDH帧中提取2M电路。","explanation":"2M复用是指保护通信不独占光纤，而是把保护信息先经保护通信单元（接口设备）封装成标准的2.048Mbit/s（E1）信号，再利用站内现有SDH光传输设备，将2M电路装入相应虚容器（VC）按复用映射规则载入SDH帧传至对端；对端依据指针信息直接从SDH帧中解出2M电路交给保护。相较专用纤芯，复用方式节省光纤且便于网络化管理。","bank":"电气基础"},{"id":"e40b3346f9b2","type":"fill","category":"电气基础","stem":"通信通道配置中提到的路由独立指什么？","options":{},"answer":"指采用专用纤芯的通道的路由承载在与其他路由不同的光缆上，或采用2M复用的通道的路由承载在与其他路由不同的光传输设备上（且其光路承载在与其他路由不同光缆上）。","explanation":"通道“路由独立”是为保证两套主保护通道不共因失效：采用专用纤芯时，两条通道应承载在彼此不同的光缆上；采用2M复用时，两条通道应承载在彼此不同的光传输设备（SDH网元）上，且其光路也承载在彼此不同的光缆上。这样任一条光缆或一台传输设备故障，不会同时中断两套保护通道。","bank":"电气基础"},{"id":"62efb1de3a5a","type":"fill","category":"电气基础","stem":"对电压互感器断线闭锁的要求是什么？","options":{},"answer":"1）当电压互感器二次回路出现一相、两相或三相断线时断线闭锁都应将他们检测出来，并发告警信号并将距离保护闭锁。2）当一次系统发生短路时断线闭锁不能误动，以免将距离保护误闭锁。","explanation":"PT断线闭锁应同时满足“该闭锁时必闭锁、不该闭锁时不闭锁”：①无论二次回路发生一相、两相还是三相断线，都要检测出来，发告警并闭锁距离保护（防止失压后方向/距离元件误动）；②当一次系统真正发生短路（电压也下降）时，闭锁元件不能误动，以免把距离保护错误闭锁而拒动。两者须兼顾，不能只防误动或只防拒动。","bank":"电气基础"},{"id":"9b33d3fe3d70","type":"fill","category":"电气基础","stem":"反应工频变化量阻抗继电器有哪些缺点？","options":{},"answer":"1）工频变化量的电气量只存在于短路初始的一段时间内，所以它只能用于构成快速保护，因而还需要与反应稳态量的保护配合使用;2）在超高压远距离输电线路上，线路末端断路器因故跳开时，会造成工频变化量阻抗继电器的误动，需要采取措施防止;3）由于暂态电气量的影响，工频变化量阻抗继电器的离散性相对稍大一些。","explanation":"工频变化量阻抗继电器的不足：①变化量电气量只存在于短路初始暂态段，只能构成快速保护，必须再配反应稳态量的保护作为后续段；②在超高压远距离线路末端断路器因故跳开（开断）时，会产生变化量导致该继电器误动，需专门采取防误措施；③受暂态电气量影响，其动作离散性相对稍大。因此它多用于快速主保护段而非独立完整保护。","bank":"电气基础"},{"id":"49e02f1983f2","type":"fill","category":"电气基础","stem":"简述工频突变量方向元件的原理。","options":{},"answer":"突变量方向元件利用保护安装处电流、电压的故障分量的极性来判别故障方向，故障状态由负荷分量和故障分量两部分组成。正向故障时，故障分量电压UΔ与电流IΔ的极性相反，满足UΔ/IΔ=-Zs;反向故障时，UΔ与IΔ的极性相同，满足UΔ/IΔ=ZL+Zs1（式中：ZS——保护安装处到M侧电源的系统阻抗，Zs1——N侧电源的系统阻抗，ZL——线路阻抗），即正向故障和反向故障时故障分量的极性关系明确，据此实现故障方向判别。","explanation":"工频突变量方向元件用保护安装处的故障分量（Δ）判别方向：系统状态=负荷分量+故障分量。正向故障时，故障分量电压UΔ与电流IΔ极性相反，满足UΔ/IΔ=-Zs（Zs为背后系统阻抗）；反向故障时二者极性相同，满足UΔ/IΔ=ZL+Zs1（ZL为线路阻抗、Zs1为对侧系统阻抗）。正向与反向的故障分量极坐标关系截然相反，据此可靠判别故障方向，且不受负荷影响。","bank":"电气基础"},{"id":"7e9cf4d18fa5","type":"fill","category":"电气基础","stem":"关于零序电流补偿系数的两种表现形式是什么？二者之间的转换公式是什么？","options":{},"answer":"零序电流补偿系数有两种表示形式：第一种是由电阻和电抗组成的分别补偿式，KR=(R0-R1)/(3R1)、KX=(X0-X1)/(3X1)，KR和KX都为实数，它按电阻分量和电抗分量在阻抗平面上分别对测量阻抗进行补偿，多应用于四边形特性继电器。第二种是阻抗型K=(Z0-Z1)/(3Z1)补偿形式，它在阻抗平面上对测量阻抗按补偿系数的模值和角度进行补偿，是一个复数，可以用指数表示，也可以用实部和虚部表示，阻抗型补偿系数多应用于圆特性继电器。两者之间的转换公式如下推导：由于R0=(1+3KR)Z1cosφ，X0=(1+3KX)Z1sinφ，得到如下表达式：K=(Z0-Z1)/(3Z1)=[(R0-R1)+j(X0-X1)]/(3Z1)=KRcosφ+jKXsinφ+j(KX-KR)sinφcosφ=KRcos2φ+jKXsin2φ+j[(KX-KR)sin2φ]/2。","explanation":"零序电流补偿系数两种形式：①电阻、电抗分别补偿式KR=(R0-R1)/(3R1)、KX=(X0-X1)/(3X1)，均为实数，按电阻、电抗分量分别在阻抗平面补偿，多用于四边形特性继电器；②阻抗型K=(Z0-Z1)/(3Z1)，为复数，按模值和角度补偿，多用于圆特性继电器。两者转换：由R0=(1+3KR)Z1cosφ、X0=(1+3KX)Z1sinφ可推得K=KRcos²φ+jKXsin²φ+j[(KX-KR)sin2φ]/2。","bank":"电气基础"},{"id":"e765bf8627eb","type":"fill","category":"电气基础","stem":"整定计算，一般考虑哪两种运方？并具体解释。","options":{},"answer":"最大运行方式和最小运行方式。1）最大运行方式：系统等值阻抗最小，通过保护的短路电流最大;2）最小运行方式：系统等值阻抗最大，通过保护的短路电流最小","explanation":"整定计算须校核两种极端运行方式：最大运行方式——系统等值阻抗最小，经保护处的短路电流最大，用于校验保护的灵敏度和选择性的最不利上限；最小运行方式——系统等值阻抗最大，短路电流最小，用于校验保护能否可靠动作（灵敏度下限）。两种方式是保护定值整定与校验的基本边界条件。","bank":"电气基础"},{"id":"35efdc57ecc6","type":"fill","category":"电气基础","stem":"试从电力系统短路故障的基本现象出发，分析其主要危害及影响。","options":{},"answer":"短路电流大，产生很大的力效应，使设备变形破损，产生很大的热效应，使设备烧坏熔化等。短路时的电压低，负荷无法正常工作。","explanation":"短路故障的基本现象是回路阻抗骤降、电流剧增、故障点及附近电压大幅跌落。主要危害：①巨大短路电流产生强烈电动力（力效应），使设备变形、损坏；②大电流产生大量热量（热效应），使设备过热、烧熔甚至起火；③故障点电压显著降低，使该区域负荷无法正常工作，并可能波及系统稳定。","bank":"电气基础"},{"id":"4b0e876d36d8","type":"fill","category":"电气基础","stem":"影响阻抗继电器正确测量的因素有哪些？","options":{},"answer":"1）故障点的过渡电阻;2）保护安装处与故障点之间的助增电流和汲出电流;3）测量互感器的误差;4）电力系统振荡;5）电压二次回路断线;6）被保护线路的串补电容。","explanation":"影响阻抗继电器正确测量（测量阻抗失真）的因素主要有：①故障点过渡电阻；②保护安装处与故障点之间的助增电流（使测量阻抗偏大）和汲出电流（使测量阻抗偏小）；③测量用电流、电压互感器的误差；④电力系统振荡；⑤电压二次回路断线；⑥被保护线路上的串联补偿电容。实际整定与选型须针对这些因素留足裕度或采取补偿措施。","bank":"电气基础"},{"id":"e194ec4698d6","type":"fill","category":"电气基础","stem":"怎样用单相电压整定负序电压继电器的动作电压？","options":{},"answer":"对负序电压继电器的A与BC端子间施加单相电压并缓慢升压，模拟相间短路。记下继电器的动作电压Uop。从短路电流理论可知，Uop/√3即为负序电压继电器的动作电压(相)，该值应与整定值(负序相电压)相等。","explanation":"负序电压继电器动作电压（负序相电压）可用单相电压整定：在继电器A端子与BC端子间施加单相电压并缓慢升压，模拟相间短路，记动作电压Uop。根据对称分量与短路理论，施加的单相电压中负序分量占1/√3，故负序相电压动作值=Uop/√3，应与整定的负序相电压相等。此法无需三相电源即可校验。","bank":"电气基础"},{"id":"bd55843cea77","type":"fill","category":"电气基础","stem":"线路断线特点是什么？","options":{},"answer":"系统发生断相故障时（一相或两相断线）造成不对称运行，在此种情况下，系统为非全相运行，除故障部分都是平衡的。断线后有以下特点：1）一相断线时，非故障相电流在一般情况下较断相前的负荷电流有所增加。2）一相断线后，系统出现负序电流和零序电流，正序电流较断相前小一些，因此一相断线后，系统输出功率要降低。3）两相断线后，必须立即断开两侧断路器。","explanation":"线路断线（非全相运行）属纵向不对称故障，特点：①一相断线时非故障相电流一般比断相前负荷电流增大；②一相断线后出现负序、零序电流，正序电流比断相前小，故系统输出功率降低；③两相断线属严重故障，必须立即断开两侧断路器。记忆：断线→不对称→负序/零序出现、功率下降；两相断线须速断。","bank":"电气基础"},{"id":"783c0fa99759","type":"fill","category":"电气基础","stem":"造成电流互感器测量误差的原因是什么？","options":{},"answer":"测量误差就是电流互感器的二次输出与其归算到二次侧的一次输入量的大小不相等、幅角不相同所造成的差值。因此测量误差分为数值（变比）误差和相位（角度）误差两种。产生测量误差的原因一是电流互感器本身造成的，二是运行和使用条件造成的。电流互感器本身造成的测量误差是由于电流互感器有励磁电流的存在，而励磁电流是输入电流的一部分，它不传变到二次侧，故形成了变比误差。励磁电流除了在铁芯中产生磁通外，还产生铁芯损耗，包括涡流损失和磁滞损失。励磁电流所流经的励磁支路是一个呈电感性的支路，励磁电流和折算到二次侧的一次输入量不同相位，这是造成角度误差的主要原因。","explanation":"CT测量误差是二次输出与折算到二次侧的一次输入在数值和相位上的偏差，分变比（数值）误差和角度（相位）误差。原因：①CT存在励磁电流，它是不传变到二次侧的一次电流分量，造成变比误差；②励磁支路呈电感性，励磁电流与折算一次量不同相位，加上铁芯损耗（涡流、磁滞），造成角度误差。即误差根源是“励磁电流不为零”且“励磁支路呈感性”。","bank":"电气基础"},{"id":"5dc4a2d91f58","type":"fill","category":"电气基础","stem":"提高电力系统稳定性的措施有哪些？","options":{},"answer":"1）减小线路电抗。可以采用增加并联运行输电线的回路数和复合导线等方法，以减小系统的总阻抗，改善系统稳定性及电压水平。2）线路上装设串联电容。在线路上装设串联电容，可有效地减小线路电抗，比增加多回线路要经济，但技术较复杂。3）装设中间补偿设备。在线路中间装设同步调相机或电容器，能有效地保持变电所母线电压及提高系统稳定性。近年发展的静止补偿器，可以快速地调整和供给系统无功功率，是提高系统稳定性的重要手段。4）采用直流输电。由于直流电源不存在相位问题，所以用直流远距离输电，就不存在由发电机间相角确定的功率极限问题，不受系统稳定的限制。","explanation":"提高电力系统稳定性的措施围绕“减小电抗、支撑电压、快速调压”：①减小线路电抗（增加并联回路数、采用分裂导线/扩径导线）；②线路串联电容补偿，减小线路等效电抗，经济有效；③装设中间补偿设备（同步调相机、电容器、静止补偿器SVC/STATCOM）维持电压并提供无功；④采用直流输电，因直流无相位问题，不受发电机功角极限限制。","bank":"电气基础"},{"id":"85d0da812513","type":"fill","category":"电气基础","stem":"正序电压用作极化电压的好处是什么？","options":{},"answer":"1)故障后各相正序电压的相位始终保持故障前的相位不变，与故障类型无关。作为工作电压要与它来比相的，起着参考标准的极化电压正需要这种相位始终不变的特性。2)除了三相短路以外，幅值一律不会降到零，意味着无死区。3)构成的元件性能好。例如方向元件的极化电压改用正序电压后，其选相性能大大改善。而未用正序电压时，为了消灭多数故障形式下的电压死区，方向元件要用90°接线。结果是与故障相方向元件动作的同时，健全相也往往动作，即选相性能差。改用正序电压后，健全相则不会动作。","explanation":"以正序电压作为方向/距离元件的极化电压优点：①故障后各相正序电压相位保持故障前相位不变，与故障类型无关，适合作比相参考；②除三相短路外幅值不降到零，故无电压死区（三相短路可用记忆量解决）；③元件性能好，如方向元件改用正序电压后选相能力大为改善——健全相不会误动，而用90°接线时健全相往往也动作。","bank":"电气基础"},{"id":"1c1422658ce8","type":"fill","category":"电气基础","stem":"简述变电站间隔投运时判断极性结果的标准。","options":{},"answer":"1）测量的功率方向应与实时潮流的功率方向一致。2）电流互感器极性靠近母线侧为极性端情况下，用负荷电流测试极性时，若有功潮流流出母线，电流超前电压范围应为?90°～+90°;若有功潮流流进母线，电流超前电压范围应为90°～270°。3）电流互感器极性靠近母线侧为极性端情况下，用负荷电流测试极性时，若无功潮流流出母线，电流超前电压范围应为180°～360°，若无功潮流流进母线，电流超前电压范围应为0°～180°。","explanation":"间隔投运极性判断标准与题580一致：①实测功率方向须与实时潮流方向一致；②CT极性端靠母线侧时，用负荷电流测试：有功流出母线电流超前电压-90°~+90°、流进母线90°~270°；③无功流出母线电流超前电压180°~360°、流进母线0°~180°。据此可验证CT与PT接线极性是否与设计一致。","bank":"电气基础"},{"id":"82dcf2aaf703","type":"fill","category":"电气基础","stem":"简述“直流输电”与“交流输电”的主要区别及直流输电的适用场景。","options":{},"answer":"1）区别：直流无相位差，适合长距离大容量传输;交流存在电感电容效应，适合短距离互联;2）适用场景：跨海电缆、超高压远距离输电（特高压直流）;异步电网互联（如三峡外送）","explanation":"区别：直流输电无相位差、无同步问题，适合长距离大容量输电；交流输电存在线路电感电容效应、受功角稳定限制，适合中短距离互联。直流适用场景：跨海/长距离电缆输电（交流电缆电容电流大不适用）、超/特高压远距离输电（如特高压直流）、异步电网互联（如三峡外送，避免两大电网失步）。","bank":"电气基础"},{"id":"d792ddbc3679","type":"fill","category":"电气基础","stem":"什么是“电力系统的频率特性”？有功功率缺额为何会导致频率下降？","options":{},"answer":"1）频率特性：负荷/发电机功率随频率变化的关系（负荷频率特性、发电机频率特性）;2）频率下降原因：发电机输出功率＜负荷需求，转子转速下降;频率调节使负荷功率随频率降低而减少，形成新平衡","explanation":"频率特性指系统负荷功率和发电机有功出力随频率变化的关系（负荷频率特性、发电机频率特性）。有功功率缺额时：发电机电磁功率输出小于负荷需求，转子因功率不平衡减速、转速下降，系统频率随之下降；同时负荷频率特性使负荷功率随频率降低而减少，最终在较低频率建立新平衡。故频率由有功平衡决定，需通过调速与一次/二次调频恢复。","bank":"电气基础"},{"id":"fc25f2c431be","type":"fill","category":"电气基础","stem":"变压器的“短路电压百分比”表示什么意义？对并列运行有何要求？","options":{},"answer":"1）意义：短路时额定电流对应的电压降百分比，反映漏阻抗大小;2）并列要求：短路电压百分比差值≤10%，避免负荷分配不均;变比、接线组别一致","explanation":"短路电压百分比（Uk%）是变压器额定电流下短路试验的电压降占额定电压的百分比，反映其漏阻抗大小（漏抗越大Uk%越大）。并列运行要求：①短路电压百分比差值≤10%，否则负荷按阻抗分配不均、小Uk%变压器易过载；②变比相同；③接线组别相同（否则环流）。 Uk%相近是并列分配均匀的关键。","bank":"电气基础"},{"id":"5bd96251a62a","type":"fill","category":"电气基础","stem":"同步发电机的“功角”是什么？功角大小与系统稳定性有何关系？","options":{},"answer":"1）功角：发电机空载电动势与端电压的相位差，反映电磁功率与机械功率的平衡;2）关系：功角越小，静态稳定储备越大;功角超过临界值（如90°），可能引发失步振荡","explanation":"功角δ是同步发电机空载电动势E_q与端电压U之间的相位差，反映发电机电磁功率与机械功率的平衡状态（P∝sinδ）。关系：δ越小，离静态稳定极限越远、稳定储备越大；当δ超过临界值（理论为90°，实际留裕度）时，继续增加输入功率会使功角失稳、机组失步振荡。故功角是静态稳定的核心判据。","bank":"电气基础"},{"id":"38fed7206350","type":"fill","category":"电气基础","stem":"输电线路为什么要采用分裂导线？分裂导线对线路参数有何影响？","options":{},"answer":"1）采用目的：减少电晕损耗，降低对通信干扰;增加导线等效半径，减小线路电抗;2）参数影响：电抗减小，输送能力提升;电容增大，线路充电功率增加","explanation":"采用分裂导线目的：①增大导线等效半径，降低导线表面场强以减小电晕损耗和对通信的干扰；②等效半径增大使线路电抗减小、提高输送能力。对参数的影响：电抗减小（输送能力提升），电容增大（线路充电功率增加）。超/特高压线路普遍采用分裂导线以改善电气性能。","bank":"电气基础"},{"id":"f26b67de6704","type":"fill","category":"电气基础","stem":"保证和提高电力系统的静态稳定性的主要措施有哪些？","options":{},"answer":"1）减少元件电抗（发电机/变压器低电抗、分裂导线）;2）提高系统电压水平;3）改善电网结构;4）串联电容器补偿;5）自动调节装置;6）直流输电","explanation":"提高静态稳定性的措施：①减小元件电抗（发电机/变压器采用低电抗、线路用分裂导线）；②提高并维持系统电压水平；③改善电网结构（加强网架、增加联络）；④串联电容补偿；⑤采用自动调节励磁等自动装置；⑥采用直流输电（不受功角极限限制）。核心是“降电抗、撑电压、强网架”。","bank":"电气基础"},{"id":"80c2072b3d95","type":"fill","category":"电气基础","stem":"电力系统电压与频率特性的区别是什么？","options":{},"answer":"1）频率特性：取决于负荷和发电机频率特性，由有功平衡决定，与网络结构关系小，同一系统频率相同，可集中调整;2）电压特性：与各区有功、无功平衡及网络结构关系大，各节点电压不同，需分区调整","explanation":"频率特性与电压特性的本质区别：频率由全系统有功功率平衡决定，与网络结构关系不大，同一互联系统频率处处相同，可集中统一调整；电压则由各地区有功、无功功率平衡及网络结构（阻抗、分布）决定，各节点电压不同，且与无功关系密切，需分区、分层就地调整。简记：频率看有功、全网一致；电压看无功、分区各异。","bank":"电气基础"},{"id":"05f26c2171bd","type":"fill","category":"电气基础","stem":"何谓励磁涌流？产生的原因是什么？","options":{},"answer":"1）励磁涌流：变压器全电压充电时绕组产生的暂态电流;2）产生原因：变压器投入前铁芯有剩余磁通，若与投入时工作电压产生的磁通方向相同，总磁通远超饱和磁通，引发极大涌流（峰值为额定电流6-8倍）;涌流含直流和高次谐波，随时间衰减（大容量变压器5-10秒，小容量0.2秒）","explanation":"励磁涌流是变压器空载（或外部故障切除后）全电压合闸时，绕组中出现的暂态励磁电流。产生原因：合闸前铁芯若有剩磁，且与投入电压产生的磁通方向相同，总磁通远超铁芯饱和磁通，励磁电流剧增，峰值可达额定电流6~8倍；涌流含大量直流分量和奇次谐波（尤以二次谐波为主），随时间衰减（大容量约5~10s，小容量约0.2s）。二次谐波制动即据此鉴别涌流与故障电流。","bank":"电气基础"},{"id":"482804533b7b","type":"fill","category":"电气基础","stem":"在线路故障的情况下，正序功率方向是由母线指向线路，为什么零序功率方向是由线路指向母线？","options":{},"answer":"故障线路上，正序电流由母线流向故障点;而零序电压在故障点最高，零序电流由故障点流向母线，故零序功率方向与正序相反，由线路指向母线","explanation":"线路正方向故障时，系统电源经母线向故障点供给正序电流，故正序功率方向由母线指向线路。而零序网络中，故障点零序电压最高，零序电流由故障点经线路流向两端母线（电源侧中性点），即零序功率方向由线路指向母线。因此正序与零序功率方向相反，这一特征是零序方向保护判别故障线路的依据。","bank":"电气基础"},{"id":"dde5421cebe4","type":"fill","category":"电气基础","stem":"超、特高压线路的并联电抗器的主要用途是什么？","options":{},"answer":"1）补偿容性无功;2）降低线路工频过电压;3）中性点小电抗降低潜供电流，提高重合闸成功率;4）消除同步电机带空载长线路的自励磁现象","explanation":"超、特高压线路并联电抗器主要用途：①补偿线路电容产生的容性无功，防止轻载时电压过高；②降低线路工频过电压（特别是空载/甩负荷）；③中性点串小电抗可限制潜供电流，提高单相重合闸成功率；④消除同步电机带空载长线路时的自励磁（发电机自励磁）现象。即“补容性无功、降过电压、限潜供、防自励磁”。","bank":"电气基础"},{"id":"ab1c175a8817","type":"fill","category":"电气基础","stem":"短路电流超标如何限制？","options":{},"answer":"1）限制三相短路电流：增加正序阻抗（改变接线方式、母线分裂运行、高阻抗变压器、限流电抗器）;2）限制单相短路电流：除上述方法外，增加零序阻抗（减少中性点接地数目、中性点经小电抗接地、限制自耦变压器使用）","explanation":"限制短路电流超标：①限制三相短路电流——增大正序阻抗，如改变接线方式、母线分列运行、采用高阻抗变压器、加装限流电抗器；②限制单相短路电流——在上述基础上再增大零序阻抗，如减少变压器中性点接地数量、中性点经小电抗接地、限制自耦变压器使用。核心是“增阻抗、降短路电流”。","bank":"电气基础"},{"id":"09eb8bf7d92e","type":"fill","category":"电气基础","stem":"简述采样、采样周期、采样频率、采样定理、采样中断的概念","options":{},"answer":"1）采样：CPU通过模数转换器获取模拟量（电压、电流）的过程;2）采样周期：相邻两次采样的时间间隔（△T）;3）采样频率：单位时间采样次数（f_S=1/△T）;4）采样定理：f_S＞2f_max（f_max为被采样信号最高频率），避免频率混叠;5）采样中断：设置定时中断，中断触发时启动A/D转换并读取结果","explanation":"采样：CPU通过A/D转换器周期性获取电压、电流等模拟量的过程；采样周期：相邻两次采样的时间间隔ΔT；采样频率：单位时间采样次数f_S=1/ΔT；采样定理：为无失真恢复原信号须f_S>2f_max（f_max为信号最高频率），否则发生频率混叠；采样中断：由定时器产生周期性中断，在中断服务程序中启动A/D转换并读取结果，保证采样等间隔。","bank":"电气基础"},{"id":"e8f35b31bc38","type":"fill","category":"电气基础","stem":"试分析各种不同类型短路时，电压各序分量的变化规律","options":{},"answer":"1）三相短路：故障点正序、负序、零序电压均为零;2）母线上正序电压下降幅度：三相短路＞两相接地短路＞两相短路＞单相接地短路;3）不对称短路：正序电压越靠近故障点越小，负序、零序电压越靠近故障点越大","explanation":"不同短路时电压序分量规律：①三相短路（对称）故障点正序、负序、零序电压均为零；②母线上正序电压下降幅度排序：三相短路>两相接地短路>两相短路>单相接地短路；③不对称短路时，正序电压越靠近故障点越小，负序、零序电压越靠近故障点越大（故障点处负序、零序电压最高）。这是序分量保护与电压监视的理论基础。","bank":"电气基础"},{"id":"530dc25d54cb","type":"fill","category":"电气基础","stem":"什么是正序等效定则？写出不同短路故障类型附加阻抗的表达式","options":{},"answer":"1）正序等效定则：不对称短路时，故障支路正序电流等于故障点加附加阻抗△Z后三相短路的电流;2）附加阻抗：①三相短路（K(3)）：△Z=0;②两相短路（K(2)）：△Z=Z?Σ;③单相接地短路（K(1)）：△Z=Z?Σ+Z?Σ;④两相接地短路（K(1,1)）：△Z=Z?Σ//Z?Σ","explanation":"正序等效定则：在短路点串入附加阻抗ΔZ后，用三相短路的计算方法求得的正序电流，即等于该不对称短路时故障支路的实际正序电流。各故障附加阻抗（Z2Σ、Z0Σ为系统负序、零序综合阻抗）：三相短路K(3) ΔZ=0；两相短路K(2) ΔZ=Z2Σ；单相接地K(1) ΔZ=Z2Σ+Z0Σ；两相接地K(1,1) ΔZ=Z2Σ∥Z0Σ。它是简化不对称短路计算的核心定理。","bank":"电气基础"},{"id":"dbdccc10b3fe","type":"fill","category":"电气基础","stem":"什么叫电压降落、电压损耗、电压偏移？","options":{},"answer":"1）电压降落：线路始末两端电压的相量差（??-??），为相量;2）电压损耗：线路始末两端电压的数值差（U?-U?），常用百分值表示（(U?-U?)/U_N×100%）;3）电压偏移：线路始端或末端电压与额定电压的数值差（U?-U_N或U?-U_N），常用百分值表示","explanation":"三者区别：电压降落——线路首末端电压的相量差（Ú₁-Ú₂），是相量，含幅值与相位；电压损耗——首末端电压的数值差（U₁-U₂），常用百分值(U₁-U₂)/U_N×100%表示，是标量；电压偏移——线路首端或末端电压与额定电压的数值差（U₁-U_N或U₂-U_N），也用百分值表示，用以衡量供电质量。简记：降落是相量差、损耗是首尾数值差、偏移是相对UN的数值差。","bank":"电气基础"},{"id":"496547393192","type":"fill","category":"电气基础","stem":"输电线路故障如何划分？故障种类有哪些？","options":{},"answer":"1）划分：一处故障为简单故障，两处及以上同时故障为复故障;2）故障种类：简单故障含6种——短路故障（单相接地、两相短路、两相短路接地、三相短路，横向故障）、断线故障（断一相、断二相）;其中三相短路为对称故障，其余为不对称故障","explanation":"输电线路故障按处数划分：一处故障为简单故障，两处及以上同时发生为复故障。简单故障含6种：短路故障（横向）——单相接地、两相短路、两相短路接地、三相短路（仅三相短路为对称故障，余为不对称）；断线故障（纵向）——断一相、断两相。不对称故障须用序分量分析。","bank":"电气基础"},{"id":"1a689236fb6c","type":"fill","category":"电气基础","stem":"电力系统在什么情况下运行将出现零序电流？试举出五种例子","options":{},"answer":"电力系统在三相不对称运行状况下将出现零序电流，例如：1)电力变压器三相运行参数不同;2)电力系统中有接地故障;3)单相重合闸过程中的两相运行;4)三相重合闸和手动合闸时断路器三相不同期投入;5)空载投人变压器时三相的励磁涌流不相等","explanation":"电力系统出现零序电流的前提是三相不对称（零序网络连通）。五种例子：①变压器三相运行参数不同（如三相励磁特性不一致）；②系统中发生接地故障；③单相重合闸过程中的两相运行；④三相重合闸或手动合闸时断路器三相不同期投入；⑤空载投入变压器时三相励磁涌流不相等。凡破坏三相对称且构成零序回路者均会产生零序电流。","bank":"电气基础"},{"id":"84983c90d6e0","type":"multiple","category":"电气基础","stem":"变压器的断路器失灵时，最终应跳开()断路器","options":{"A":"失灵断路器相邻的全部断路器","B":"本变压器连接其他电源侧的断路器","C":"变压器所在母线上连接线路的对侧站断路器"},"answer":"AB","explanation":"失灵保护动作后应断开与故障相关的全部相关断路器。A正确：跳开失灵断路器相邻的全部断路器以隔离故障；B正确：应跳开本变压器连接的其他电源侧断路器，防止故障电源继续供电；C错误：母线连接线路的对侧站断路器一般由远方跳闸保护处理，非失灵保护直接跳开对象。","bank":"电气基础"},{"id":"0e9ce958b987","type":"multiple","category":"电气基础","stem":"不对称短路中，有零序电流的是()","options":{"A":"两相短路","B":"两相接地短路","C":"单相接地短路","D":"两相接地短路"},"answer":"BC","explanation":"只有接地性不对称短路才出现零序电流。A错误：两相短路(不接地)无零序电流；B正确：两相接地短路有零序分量；C正确：单相接地短路有零序分量；D与B重复，亦为两相接地短路。","bank":"电气基础"},{"id":"505c238e1d47","type":"multiple","category":"电气基础","stem":"电力系统发生两相金属性短路故障，正序、负序电流间的正确关系（不计负荷电流）是（）","options":{"A":"当各元件正、负序阻抗相等时，系统各分支正、负序电流相等","B":"因系统中发电机的正、负序阻抗不等，所以系统各分支正、负序电流不等","C":"计及发电机正、负序阻抗不等后，故障支路正、负序电流仍然是相等的"},"answer":"ABC","explanation":"两相金属性短路(不计负荷电流)时故障点满足I1=-I2。A正确：若各元件正、负序阻抗相等，则各分支正、负序电流相等；B正确：发电机正、负序阻抗不等，使各分支正、负序电流不等；C正确：在故障支路(故障点)由边界条件决定的I1=-I2关系恒成立，与系统正负序阻抗是否相等无关。","bank":"电气基础"},{"id":"43f8613ad2e1","type":"multiple","category":"电气基础","stem":"突变量方向元件有（）特点","options":{"A":"不受系统振荡的影响","B":"不受过渡电阻的影响","C":"不受串联补偿电容的影响","D":"动作速度快"},"answer":"ABCD","explanation":"突变量方向元件基于故障分量(Δ量)构成。A正确：故障分量不含负荷与振荡分量，不受系统振荡影响；B正确：基于突变量，受过渡电阻影响小；C正确：不受串联补偿电容影响；D正确：突变量元件动作速度快。","bank":"电气基础"},{"id":"04b14878b25e","type":"multiple","category":"电气基础","stem":"关于造成电流互感器测量误差的原因，下面说法正确的有()","options":{"A":"产生测量误差的原因一是电流互感器本身造成的，二是运行和使用条件造成的","B":"电流互感器本身造成的测量误差是由于电流互感器有励磁电流的存在，而励磁电流是输入电流的一部分，它不传变到二次测，故形成了变比误差","C":"励磁电流所流经的励磁支路是一个呈电容性的支路，励磁电流和折算到二次侧的一次输入量不同相位，这是造成角度误差的主要原因","D":"运行和使用中造成的测量误差过大是电流互感器铁芯饱和和二次负载过大所致"},"answer":"ABD","explanation":"CT测量误差来源分设备自身与运行使用两类。A正确：误差原因一是CT本身、二是运行使用条件；B正确：励磁电流不传变到二次侧，造成变比误差；C错误：励磁支路呈电感性而非电容性，角度误差源于励磁支路呈感性；D正确：铁芯饱和与二次负载过大是运行使用中的主要误差原因。","bank":"电气基础"},{"id":"ff4a1f3c1a91","type":"multiple","category":"电气基础","stem":"直流回路不能与交流回路共用一根电缆，主要需考虑()因素","options":{"A":"直流系统和交流系统为两个相互独立的系统","B":"直流为不接地系统，交流为接地系统","C":"电缆芯绝缘损坏时，交流串入直流，可能引起保护误动","D":"交直流系统互串引起的直流接地很难检查及处理"},"answer":"ABCD","explanation":"交、直流回路性质不同，不得共缆。A正确：二者为相互独立的系统；B正确：直流多为不接地系统、交流为接地系统；C正确：绝缘损坏时交流串入直流可引起保护误动；D正确：交直流互串导致的直流接地难以查找处理。","bank":"电气基础"},{"id":"2a67000e814b","type":"multiple","category":"电气基础","stem":"关于电磁式电流互感器饱和的特点一下说法正确的是()","options":{"A":"电流互感器二次电流波形发生畸变，含有大量谐波电流","B":"电流互感器最快要在短路发生2ms后才开始饱和","C":"每一周波总有一段时间一、二次电流是线性传变的","D":"如果稳态短路电流情况下电流互感器的变比误差(幅值误差)小于10%，则短路暂态过程中受非周期分量的影响，其误差往往小于10%"},"answer":"ABC","explanation":"电磁式CT饱和特征。A正确：饱和后二次电流波形畸变并含大量谐波；B正确：受非周期分量累积影响，最快约在短路发生后2ms才开始饱和；C正确：每周波仍有一段时间一、二次电流线性传变；D错误：暂态中非周期分量使误差往往更大，常超过10%，并非小于10%。","bank":"电气基础"},{"id":"4fc2cc9fd21c","type":"multiple","category":"电气基础","stem":"（）宜采用TPY类电流互感器互感器在短路暂态过程中误差不应超过规定值","options":{"A":"330kV及以上电压等级线路保护","B":"330kV及以上电压等级变压器的差动保护","C":"1000kV特高压变压器用中性点调压补偿变压器差动保护","D":"容量在300MW及以上的发变组差动保护","E":"220kV电压等级的变压器的差动保护"},"answer":"ABCD","explanation":"TPY级CT具有规定暂态特性，用于暂态误差要求严格的保护。A、B、C、D均为规定应采用的场合(330kV及以上线路/变压器差动、1000kV特高压变压器中性点调压补偿差动、300MW及以上发变组差动)；E(220kV变压器差动)未列入强制采用范围，故不选。","bank":"电气基础"},{"id":"60204a6b7c29","type":"multiple","category":"电气基础","stem":"断路器控制回路应能接收（）等命令信号","options":{"A":"保护分相跳闸(对具有分相操动机构的断路器)","B":"三相跳闸","C":"重合闸","D":"手动分合闸"},"answer":"ABCD","explanation":"断路器控制回路需能接收各类操作命令。A、B、C、D分别对应的保护分相跳闸(分相操动机构)、三相跳闸、重合闸、手动分合闸均为控制回路应接收的命令信号。","bank":"电气基础"},{"id":"a2d5fb6ba814","type":"multiple","category":"电气基础","stem":"为防止断路器操动机构同时收到跳、合闸命令时反复跳、合，各电压等级的断路器，应装设防跳跃回路，在分闸命令、合闸命令同时存在时，防跳跃回路应使之保持在跳闸位置但对于（），在分闸命令、合闸命令同时存在时，防跳跃回路应使之保持在合闸位置","options":{"A":"线路串联补偿装置旁路开关以及直流输电系统中的旁通开关","B":"中性母线开关","C":"站内接地开关","D":"大地回线转换开关和金属回线转换开关"},"answer":"ABCD","explanation":"防跳跃回路一般使断路器保持在跳闸位置。但对A、B、C、D所列直流输电及串补系统中的特殊开关(旁路/旁通开关、中性母线开关、站内接地开关、大地/金属回线转换开关)，在分合闸命令同时存在时应保持在合闸位置，故四项均需特殊考虑。","bank":"电气基础"},{"id":"1be76774d2e7","type":"multiple","category":"电气基础","stem":"励磁合后继电器KKJ的回路()","options":{"A":"手合回路","B":"遥合回路","C":"重合回路","D":"所有合闸回路"},"answer":"AB","explanation":"KKJ(合后继电器)反映人工合闸后的状态。A正确：手合回路启动KKJ；B正确：遥合回路也启动KKJ；C错误：重合闸不启动KKJ(以区分手合与重合)；D错误：并非所有合闸回路都启动KKJ。","bank":"电气基础"},{"id":"626ebed1f893","type":"multiple","category":"电气基础","stem":"下列对于电流互感器多个负载接入顺序描述正确的是()","options":{"A":"一般仪表回路的顺序是电流表、功率表、电度表、记录型仪表、变送器或监控系统","B":"在保护次级中，尽量将不同的设备单独接入一组次级，特别是母差等重要保护","C":"保护次级需要串接的，应先主保护再后备保护，先不出口跳闸的设备，再出口跳闸的设备","D":"保护次级需要串接的，应先主保护再后备保护，先出口跳闸的设备，再不出口跳闸的设备"},"answer":"ABD","explanation":"CT二次负载接入顺序。A正确：仪表回路按电流表、功率表、电度表等顺序；B正确：保护用次级尽量单独接入一组次级，母差等重要保护尤应独立；C错误：串接时先主保护再后备、应先出口跳闸设备再不出口设备；D正确：表述正确，故C不选、D选。","bank":"电气基础"},{"id":"9952c943f48c","type":"multiple","category":"电气基础","stem":"按照《国家电网有限公司十八项电网重大反事故措施(2018年修订版)》,站用交流电源系统的()应纳入定值管理。","options":{"A":"进线断路器","B":"分段断路器","C":"备自投装置","D":"脱扣装置"},"answer":"ABCD","explanation":"按十八项反措，站用交流电源系统的进线断路器、分段断路器、备自投装置、脱扣装置均应纳入定值管理，四项均正确。","bank":"电气基础"},{"id":"ebc39d4f7954","type":"multiple","category":"电气基础","stem":"根据反措要求，()设备需要为扩建设备预留相关接口及通道，避免扩建时改造增加运行设备风险。","options":{"A":"交换机","B":"网络报文分析仪、故障录波器","C":"线路保护","D":"母线保护","E":"公用测控装置","F":"电压合并单元"},"answer":"ABDEF","explanation":"反措要求交换机、网络报文分析仪/故障录波器、线路保护、母线保护、公用测控装置等应为扩建设备预留接口及通道。A~E均正确（注：题面答案写作ABDEF，但选项仅A~E，实际应为ABCDE全选）。","bank":"电气基础"},{"id":"20bc3fc723a9","type":"multiple","category":"电气基础","stem":"电缆芯线截面的选择应符合下列哪些要求()。","options":{"A":"电压回路：当全部继电保护和安全自动装置动作时(考虑到电网发展，电压互感器的负荷最大时),电压互感器到继电保护和安全自动装置屏的电缆压降不应超过额定电压的5%","B":"电压回路：当全部继电保护和安全自动装置动作时(考虑到电网发展，电压互感器的负荷最大时),电压互感器到继电保护和安全自动装置屏的电缆压降不应超过额定电压的3%","C":"操作回路：在最大负荷下，电源引出端到断路器分、合闸线圈的电压降，不应超过额定电压的12%","D":"操作回路：在最大负荷下，电源引出端到断路器分、合闸线圈的电压降，不应超过额定电压的10%"},"answer":"BD","explanation":"电缆截面选择要求。A错误：电压回路压降不应超过额定电压的3%而非5%；B正确：电压回路压降不超过3%；C错误：操作回路压降不超过10%而非12%；D正确：操作回路压降不超过10%。","bank":"电气基础"},{"id":"8f98443c442f","type":"multiple","category":"电气基础","stem":"电缆及导线的布线应符合下列哪些要求()。","options":{"A":"交流和直流回路不应合用同一根电缆","B":"强电和弱电回路不应合用一根电缆","C":"保护用电缆与电力电缆不应同层敷设","D":"交流电流和交流电压不应合用同一根电缆"},"answer":"ABCD","explanation":"电缆布线反措要求。A正确：交、直流回路不合用一缆；B正确：强、弱电回路不合用一缆；C正确：保护电缆与电力电缆不同层敷设；D正确：交流电流与交流电压回路不合用一缆。","bank":"电气基础"},{"id":"485cf0bba119","type":"multiple","category":"电气基础","stem":"下列关于全相振荡的说法()是错误的。","options":{"A":"振荡时系统各点电压和电流的有效值随δ的变化一直在做往复性的摆动，但变化速度相对较慢 而短路时，在短路初瞬电压、电流是突变的，变化量较大，但短路稳态时电压、电流的有效值基本不变","B":"振荡时阻抗继电器的测量阻抗随δ的变化，幅值在变化，但相位基本不变，而短路稳态时阻抗继电器测量阻抗在幅值和相位上基本不变","C":"振荡时只会出现正序分量电流、电压，不会出现负序分量电流、电压，而发生接地短路时只会出现零序分量电压、电流不会出现正序和负序分量电压电流","D":"振荡时只会出现正序分量电流、电压，不会出现负序分量电流、电压，而发生接地短路时不会出现正序分量电压电流"},"answer":"BCD","explanation":"全相振荡与短路的区别。A表述正确(振荡量缓变、短路量突变)，故非错误项；B错误：振荡时测量阻抗相位随δ变化而非基本不变；C错误：接地短路仍存在正序、负序分量；D错误：接地短路也存在正序分量。故错误项为B、C、D。","bank":"电气基础"},{"id":"8f3136b2aa09","type":"multiple","category":"电气基础","stem":"提高静态稳定的措施有()。","options":{"A":"减小发电机到系统的联系总阻抗","B":"提高送电侧和受电测的运行电压","C":"提高发电机的有功功率","D":"发电机自动调节励磁"},"answer":"ABD","explanation":"提高静态稳定措施。A正确：减小联系总阻抗可提高静稳；B正确：提高送、受端电压可提高静稳极限；C错误：提高发电机有功会使功角增大、降低稳定裕度；D正确：发电机自动调节励磁(强励)可提高静稳。","bank":"电气基础"},{"id":"a6441cec9a85","type":"multiple","category":"电气基础","stem":"电力系统振荡与短路的区别是()。","options":{"A":"振荡时系统各点电流和电压值均作往复运动，而短路时电流和电压值是突变的","B":"振荡时系统电流和电压值是突变的，而短路时电流和电压值均作往复运动","C":"振荡时系统各电流和电压之间的相位角是随功角的变化而变化，而短路时电流和电压之间的相位角是基本不变的","D":"振荡时电流和电压之间的相位角是基本不变的，而短路时各电流和电压之间的相位角是随功角的变化而变化"},"answer":"AC","explanation":"振荡与短路区别。A正确：振荡时各点电流电压往复摆动、短路时突变；B错误：与A相反；C正确：振荡时相位角随功角变化、短路时基本不变；D错误：与C相反。","bank":"电气基础"},{"id":"5c3939dccda7","type":"multiple","category":"电气基础","stem":"非全相运行时，负序电流与负序电压、零序电流与零序电压之间的相位关系，下列说法正确的是()。","options":{"A":"电压互感器装于母线上时，受端的负序、零序电流超前于负序、零序电压的相位角为序阻抗角","B":"电压互感器装于线路上时，受端的负序、零序电流滞后于负序、零序电压的相位角为序阻抗角","C":"电压互感器装于母线上时，送端的负序、零序电流超前于负序、零序电压的相位角为序阻抗角","D":"电压互感器装于线路上时，送端的负序、零序电流滞后于负序、零序电压的相位角为序阻抗角"},"answer":"CD","explanation":"非全相运行(纵向故障)序分量相位关系取决于PT装设位置与功率方向。按题面答案，C、D(均为送端情况：PT装母线时送端电流超前电压序阻抗角、PT装线路时送端电流滞后电压序阻抗角)正确，A、B(受端情况)不选。","bank":"电气基础"},{"id":"a7266be743a0","type":"multiple","category":"电气基础","stem":"下面()的大小与故障点发生的位置有关。","options":{"A":"大电流接地系统中发生单相接地故障时故障相电流","B":"双电源间联络线发生单相接地故障时潜供电流中的横向电流分量","C":"双电源间联络线发生单相接地故障时潜供电流中的纵向电流分量","D":"小电流接地系统中发生单相接地故障时故障相电流"},"answer":"AC","explanation":"A正确：大电流接地系统单相接地故障相电流与故障点位置(等值零序阻抗)有关；B错误：潜供电流横向分量由相间电容电压决定，与故障点位置无关；C正确：潜供电流纵向分量与3I0有关，而3I0随故障点位置变化；D错误：小电流接地系统单相接地时故障相电流主要为全网电容电流，与故障点位置关系不大。","bank":"电气基础"},{"id":"002b3675b282","type":"multiple","category":"电气基础","stem":"发生非对称性故障时，系统上任一点的负序电压与正序电压可能的关系为()。","options":{"A":"负序电压大于正序电压","B":"负序电压等于正序电压","C":"负序电压小于正序电压","D":"不能确定"},"answer":"BC","explanation":"非对称故障时，任一点负序电压U2不大于正序电压U1：在故障点U2=U1(正序等效定则)，在系统中性点U2=0，其余各处0\u003cU2\u003cU1。故U2可能等于或小于U1，B、C正确；不会大于U1，A错；D不确定不成立。","bank":"电气基础"},{"id":"2ffc54d9ecb3","type":"multiple","category":"电气基础","stem":"在正序回路中，下列说法正确的是()。","options":{"A":"电源点正序电压最高","B":"保护安装处正序电压最低","C":"故障点处正序电压最低","D":"故障点处正序电压最高"},"answer":"AC","explanation":"正序网络中。A正确：电源点正序电压最高(等于电源电势)；B错误：保护安装处并非最低；C正确：故障点正序电压最低(金属性故障时趋近于0)；D错误。","bank":"电气基础"},{"id":"b3b372bfabec","type":"multiple","category":"电气基础","stem":"以下关于有零序互感的平行双回线与同杆并架双回线的主要差别描述正确的是()。","options B(BC两相断线)特殊相为A，均不选。","bank":"电气基础"},{"id":"b63acfd3b84c","type":"multiple","category":"电气基础","stem":"关于负序、零序分量和工频变化量这三类分量下列说法正确的是()。","options":{"A":"正常运行时，三者均为零，仅在故障时出现","B":"三者均可以实现延时的后备保护","C":"零负序分量只要不对称故障存在，他们就存在","D":"零负序分量构成的保护可以实现快速保护"},"answer":"AD","explanation":"A正确：稳态对称运行时三者均为零，仅在故障/不对称时出现；B错误：工频变化量保护为快速保护，不作延时后备；C错误：负序、零序分量在不对称故障及非全相、不平衡负荷下均存在，且工频变化量在任何电气量突变时即出现，表述不准确；D正确：零、负序分量构成的保护可实现快速保护。","bank":"电气基础"},{"id":"4a84ef46a9ca","type":"multiple","category":"电气基础","stem":"正弦交流量的三要素是()。","options":{"A":"频率","B":"幅值","C":"平均值","D":"初相位"},"answer":"ABD","explanation":"正弦交流量三要素为频率、幅值(最大值)、初相位，平均值为派生量而非要素，故选A、B、D。","bank":"电气基础"},{"id":"923ee3fd80ae","type":"multiple","category":"电气基础","stem":"超高压输电线路及变电站，采用分裂导线与采用相同截面的单根导线相比较，下列项目中()项是正确的。","options":{"A":"分裂导线通流容量大些","B":"分裂导线较易发生电晕，电晕损耗大些","C":"分裂导线对地电容大些","D":"分裂导线结构复杂些"},"answer":"ACD","explanation":"分裂导线与同截面单根导线相比。A正确：等效半径增大、通流能力更大；B错误：分裂导线降低表面场强、更不易电晕；C正确：对地电容增大；D正确：结构更复杂。故选A、C、D。","bank":"电气基础"},{"id":"b4e0ee312324","type":"multiple","category":"电气基础","stem":"长线的分布电容影响线路两侧电流的()。","options":{"A":"大小","B":"相位","C":"频率","D":"方向"},"answer":"AB","explanation":"分布电容使线路成为均匀分布参数，影响两侧电流的大小与相位；不改变频率，正常时也不改变方向，故选A、B。","bank":"电气基础"},{"id":"f905f83327c2","type":"multiple","category":"电气基础","stem":"在变电站某一点的暂态电磁干扰有()。","options":{"A":"传导","B":"辐射","C":"耦合","D":"差模"},"answer":"AB","explanation":"变电站暂态电磁干扰的传播途径主要为传导与辐射两种方式，故选A、B。","bank":"电气基础"},{"id":"51bf8d6de9d3","type":"multiple","category":"电气基础","stem":"线路串联补偿电容主要与()有关。","options":{"A":"分布电容","B":"线路和系统电感","C":"并联电抗器"},"answer":"BC","explanation":"串联补偿电容用于补偿线路感抗，其设置主要与线路及系统电感、以及并联电抗器配合有关，故选B、C。","bank":"电气基础"},{"id":"7172c577d3d7","type":"multiple","category":"电气基础","stem":"高压远距离输电线路的分布电容对短路电流的暂态过程产生很大的影响。在线路发生短路故障后，短路电流中的暂态分量的性质是()。","options":{"A":"高频分量","B":"低频分量","C":"工频分量","D":"直流分量"},"answer":"AD","explanation":"长线分布电容使短路暂态过程出现高频分量(电容放电振荡)和直流(非周期)分量，工频分量为稳态分量，故选A、D。","bank":"电气基础"},{"id":"01d75211ef7c","type":"multiple","category":"电气基础","stem":"某线路发生短路故障 answer":"ABCDE","explanation":"电网中出现零序电流的情形：变压器三相参数不同、系统有接地故障、单相重合闸两相运行、三相重合闸/手动合闸三相不同期、空投变压器三相励磁涌流不等，五项均正确。","bank":"电气基础"},{"id":"da87bf5874ff","type":"multiple","category":"电气基础","stem":"变压器在()时会造成工作磁通密度的增加，导致变压器的铁芯饱和。","options":{"A":"电压升高","B":"过负荷","C":"频率下降","D":"频率上升"},"answer":"AC","explanation":"变压器工作磁通密度B∝U/f。电压升高或频率下降均使U/f升高、磁通密度增加导致饱和，过负荷不影响磁通密度、频率上升降低磁通，故选A、C。","bank":"电气基础"},{"id":"0180a3bf549e","type":"multiple","category":"电气基础","stem":"在超高压电网中的电压互感器，可视为一个变压器，就零序电压来说，下面说法正确的是（）。","options":{"A":"超高压电网中发生单相接地时，一次电网中有零序电压，所以电压互感器二次星形侧出现零序电压","B":"电压互感器二次星形侧发生单相接地时，该侧出现零序电压，因电压互感器相当于一个变压器，所以一次电网中也有零序电压","C":"电压互感器二次星形侧发生单相接地时，该侧无零序电压，所以一次电网中也无零序电压","D":"电压互感器二次星形侧发生单相接地时，该侧有零序电压，而一次电网中没有零序电压"},"answer":"AD","explanation":"A正确：一次网单相接地时一次有零序电压，PT二次星形侧感应出零序电压；B错误：PT不能将二次接地故障的零序反向传递到高压一次网；C错误：二次星形侧单相接地该侧有零序电压；D正确：二次星形侧单相接地时该侧有零序电压而一次电网中并无零序电压。故选A、D。","bank":"电气基础"},{"id":"73a671a0bc23","type":"multiple","category":"电气基础","stem":"下列状态属于电力变压器的异常工作状态，不属于故障状态的有（）。","options":{"A":"过负荷","B":"绕组的匝间短路","C":"油面降低","D":"重瓦斯动作"},"answer":"AC","explanation":"异常运行状态(非故障)：过负荷、油面降低；绕组匝间短路与重瓦斯动作均属内部故障，故选A、C。","bank":"电气基础"},{"id":"ec3f94500fc9","type":"multiple","category":"电气基础","stem":"关于变压器和应涌流的说法正确的是（）。","options":{"A":"和应涌流是逐渐增大后衰减的，而合闸涌流是第一周波就达到最大","B":"出现和应涌流时，两台变压器的相互作用使得涌流的衰减过程较单个变压器合闸时要慢得多","C":"和应涌流是当电网中空投一台变压器时，在相邻的并联或级联运行变压器中产生的","D":"可以通过减小二次谐波制动比的方法来防止差动保护误动"},"answer":"ABCD","explanation":"和应涌流特征：逐渐增大后衰减(合闸涌流首周波最大)、衰减较单台慢、由空投一台在相邻并联/级联变压器中诱发、其二次谐波含量较低可通过调整二次谐波制动比等防止差动误动，四项均正确。","bank":"电气基础"},{"id":"30faeb80fe7c","type":"multiple","category":"电气基础","stem":"三相变压器空载合闸或外部短路故障切除时，会产生励磁涌流，关于励磁涌流的说法正确的是（）。","options":{"A":"励磁涌流总会在三相电流中出现","B":"励磁涌流至少在两相中出现","C":"励磁涌流的大小与变压器的铁芯结构有关，不同类型的铁芯其涌流大小不同","D":"励磁涌流与合闸初始相角有关"},"answer":"BCD","explanation":"励磁涌流至少在两相中出现(不会三相同时为零)、大小与铁芯结构有关、与合闸初始相角有关；并非总在三相中都出现，故A错，选B、C、D。","bank":"电气基础"},{"id":"c664b0fddd4a","type":"multiple","category":"电气基础","stem":"空投变压器时产生的励磁电流称作励磁涌流，励磁涌流的大小与()有关。","options":{"A":"合闸前变压器铁心中剩磁的大小","B":"变压器的容量","C":"变压器与电源之间的联系阻抗","D":"变压器的结构"},"answer":"ABCD","explanation":"空投变压器励磁涌流大小与合闸前铁芯剩磁、变压器容量、电源联系阻抗、变压器结构均有关，四项均正确。","bank":"电气基础"},{"id":"5ac869d664ec","type":"multiple","category":"电气基础","stem":"电压变化率是变压器的主要性能指标之一，其大小主要与()相关。","options":{"A":"变压器内部阻抗","B":"负载的大小","C":"负载的性质","D":"变压器空载电压"},"answer":"ABC","explanation":"电压变化率主要取决于变压器内部阻抗、负载大小及负载性质(功率因数)，空载电压为已知额定值而非变量，故选A、B、C。","bank":"电气基础"},{"id":"cab28d908460","type":"multiple","category":"电气基础","stem":"变压器的铭牌上一般标有额定容量、额定电压和()。","options":{"A":"额定电流","B":"额定温升","C":"阻抗电压","D":"空载损耗"},"answer":"ABC","explanation":"变压器铭牌一般标有额定容量、额定电压、额定电流、额定温升、阻抗电压等，故选A、B、C(空载损耗属试验数据)。","bank":"电气基础"},{"id":"ad81f28638eb","type":"multiple","category":"电气基础","stem":"变压器最基本构件是()。","options":{"A":"铁芯","B":"绕组","C":"储油柜","D":"调压装置"},"answer":"AB","explanation":"变压器最基本构件为铁芯与绕组，储油柜、调压装置为附属部件，故选A、B。","bank":"电气基础"},{"id":"c3a907d36464","type":"multiple","category":"电气基础","stem":"变压器铁芯在交变磁场中产生的磁滞损耗大小与()有关。","options":{"A":"磁场交变的频率","B":"铁芯的体积","C":"磁滞回线的面积","D":"铁芯的电阻率"},"answer":"ABC","explanation":"磁滞损耗与磁场交变频率、铁芯体积、磁滞回线面积成正比，电阻率影响的是涡流损耗，故选A、B、C。","bank":"电气基础"},{"id":"2681a429080b","type":"multiple","category":"电气基础","stem":"变压器在电力系统中的主要作用是（）。","options":{"A":"变换电压，以利于功率的传输","B":"变换电压，可以减少线路损耗","C":"变换电压，可以改善电能质量","D":"变换电压，扩大送电距离送电"},"answer":"ABD","explanation":"变压器主要作用：变换电压以利于功率传输、减少线路损耗、扩大送电距离；其并不直接改善电能质量(频率、谐波等)，故选A、B、D。","bank":"电气基础"},{"id":"ea3f9c1e2049","type":"multiple","category":"电气基础","stem":"电抗器在电力系统中的作用有()。","options":{"A":"补偿线路的感性短路电流","B":"并联在超高压电网长距离输电线路上可以补偿超高压输电线路的电容和吸收其无功功率","C":"补偿线路的容性充电电流，防止电网轻负荷时因容性功率过多而引起电压升高及其他症状","D":"限制系统电压升高和操作过电压的产生，保证线路的可靠运行"},"answer":"BCD","explanation":"并联电抗器作用：补偿长线电容、吸收无功、限制操作过电压、限制轻负荷时容性充电电流引起的电压升高；其不补偿(限制)感性短路电流，故选B、C、D。","bank":"电气基础"},{"id":"ad507b610fe5","type":"multiple","category":"电气基础","stem":"超特高压线路串联高抗的作用有()。","options":{"A":"降低工频电压升高","B":"降低操作过电压","C":"有利于单相重合闸","D":"避免发电机带空长线出现的自励过电压"},"answer":"ABCD","explanation":"超特高压线路装设高压电抗器可限制空载长线工频电压升高、降低操作过电压水平、减小潜供电流以利于单相重合闸，并防止发电机带空长线时发生自励磁过电压，故ABCD均正确。","bank":"电气基础"},{"id":"2d2db8eea8e5","type":"multiple","category":"电气基础","stem":"电压选相元件需要解决的问题()。","options":{"A":"提高长线末端故障灵敏度","B":"接地故障时用相电压元件，而相间故障时用相间元件","C":"受运行方式变化很大","D":"单相经高电阻接地的灵敏度不足"},"answer":"AB","explanation":"电压选相元件用于提高长线末端故障的选相灵敏度（A），并采用接地故障用相电压元件、相间故障用相间电压元件的选相原则（B）；C所述受运行方式影响大并非其要解决的问题，D所述高阻接地灵敏度不足恰是电压选相元件的局限（仍需配合其他判据），故CD不选。","bank":"电气基础"},{"id":"6fbe653f27df","type":"multiple","category":"电气基础","stem":"相电流差突变量元件，能准确对()进行选相。","options":{"A":"相间故障","B":"三相故障","C":"单相接地故障","D":"相间短路并接地"},"answer":"ABCD","explanation":"相电流差突变量元件对各种故障均有明显故障分量特征，可对相间故障、三相故障、单相接地故障及相间短路并接地准确选相，故ABCD均正确。","bank":"电气基础"},{"id":"9b3b2c1b2ab5","type":"multiple","category":"电气基础","stem":"方向元件采用IA、UBC、IB、UCA、IC、UAB的接线方式叫做90°接线，其主要优点有()。","options":{"A":"对各种两相短路都没有死区","B":"加入继电器的是非故障相的相间电压，其值很高","C":"选择正确合适的线路阻抗角，对线路上发生的各种故障，都能保证动作的方向性","D":"对出口处三相短路存在电压死区，解决的办法是采用记忆电压"},"answer":"ABCD","explanation":"90°接线以I_A、U_BC等相电流与非故障相相间电压配合，对各种两相短路无死区（A），所加非故障相电压值高（B），选合适线路阻抗角可保证方向性（C）；仅出口三相短路因电压为零存在死区，需用记忆电压解决（D），故ABCD均正确。","bank":"电气基础"},{"id":"22e1dfd62ec0","type":"multiple","category":"电气基础","stem":"磁通计算公式如下，在()条件更容易饱和。","options":{"A":"故障电流越大，越容易饱和","B":"二次负载越大，越容易饱和","C":"剩磁越大，更容易饱和","D":"一次系统时间常数越大，越容易饱和"},"answer":"ABCD","explanation":"电流互感器铁芯磁通与一次故障电流、二次负载（励磁阻抗）、剩磁及一次系统时间常数（决定非周期分量）均相关，故障电流越大、二次负载越大、剩磁越大、一次时间常数越大均越易使铁芯饱和，故ABCD均正确。","bank":"电气基础"},{"id":"bd4e7abb31ce","type":"multiple","category":"电气基础","stem":"光缆按芯型结构可分为()。","options":{"A":"充实型","B":"单芯型","C":"多芯型","D":"管束型"},"answer":"BC","explanation":"按缆芯结构，光缆分为单芯型和多芯型（层绞式等）两大类，故BC正确；充实型、管束型不是按芯型结构的标准分类。","bank":"电气基础"},{"id":"bf2ad4bc96b1","type":"multiple","category":"电气基础","stem":"光纤传输特性的两个基本因素是()。","options":{"A":"光纤色散","B":"光纤折射","C":"光纤衰减","D":"光纤损耗"},"answer":"AD","explanation":"光纤传输的两大基本特性是损耗（衰减）和色散，二者决定传输距离与带宽，故A色散、D损耗正确；折射、衰减（术语上以损耗为准）不当。","bank":"电气基础"},{"id":"02d6109e522a","type":"multiple","category":"电气基础","stem":"以下选项中可能引起光纤衰弱的原因是()。","options":{"A":"弯曲","B":"挤压","C":"杂质","D":"熔接工艺不良"},"answer":"ABCD","explanation":"弯曲（宏弯/微弯）、挤压、材料杂质以及熔接工艺不良均会增大光纤损耗，引起光纤衰减，故ABCD均正确。","bank":"电气基础"},{"id":"1d49046eff9b","type":"multiple","category":"电气基础","stem":"下面关于通道光纤的说法正确的是？()。","options":{"A":"双通道保护任一通道故障时，应能发告警信号，单通道故障时不得影响另一通道运行","B":"通道一和通道二双纤都交叉接线时，装置应通道告警，并闭锁差动保护","C":"通道一单纤交叉接线，通道二正常运行时，通道一不应影响通道二的正常运行，不应闭锁差动保护，但装置应及时发出通道告警","D":"内置光纤接口的保护装置和远方信号传输装置均应具有数字地址编码，两侧对地址编码进行校验，校验出错时告警并闭锁保护"},"answer":"ABD","explanation":"双通道保护任一通道故障应发告警且单通道故障不影响另一通道运行（A）；两通道双纤均交叉接线时装置应告警并闭锁差动（B）；内置光纤接口装置与远方传输装置均应有数字地址编码并校验，出错告警闭锁（D）；C中单纤交叉时通道一不应影响通道二且不应闭锁差动的说法不符合要求，故不选。","bank":"电气基础"},{"id":"16ea4646cdfc","type":"multiple","category":"电气基础","stem":"关于助增系数的说法错误的是？()。","options":{"A":"在辐射状电网中，助增系数的大小与短路点在相邻线路上的位置（Zk）无关，短路点可选在相邻线路上的任意点","B":"在整定距离Ⅱ、Ⅲ段时要将助增系数的影响考虑进去，保护的定值可以适当整大一些，这样可以防止在有助增电流时的保护范围不会缩的太多","C":"在相邻线路发生短路只有助增电流时，其运行方式应考虑保护背后电源为最小运行方式","D":"在相邻线路发生短路既有助增又有汲出电流时，计算距离Ⅱ、Ⅲ定值时应取最大助增系数"},"answer":"CD","explanation":"仅有助增电流时，为使保护在不利情况下满足选择性应考虑背后电源最大运行方式（助增最强）而非最小，故C错；既有助增又有汲出电流时，应按最不利情况取最小助增系数整定，而非最大，故D错；AB说法正确。","bank":"电气基础"},{"id":"a4eeb9af35cc","type":"multiple","category":"电气基础","stem":"电力系统在哪些情况下会出现零序电流？（）","options":{"A":"发生两相接地故障","B":"发生单相接地故障","C":"单相重合闸过程中的两相运行","D":"三相重合闸和手动合闸时断路器三相不同期合闸"},"answer":"ABCD","explanation":"不对称短路（单相接地、两相接地）与不对称运行（单相重合闸两相运行、三相/手动合闸三相不同期）均会产生零序分量，故ABCD均正确。","bank":"电气基础"},{"id":"de0d70b4b190","type":"multiple","category":"电气基础","stem":"一次设备运行中由于外力、（）等各种原因，导致发生短路、断线","options":{"A":"绝缘老化","B":"过电压、误操作","C":"自然灾害","D":"环境问题"},"answer":"ABC","explanation":"一次设备短路、断线常由外力、绝缘老化、过电压与误操作、自然灾害等引起，故ABC正确；环境问题并非题述所列典型诱因。","bank":"电气基础"},{"id":"3cb56efa8214","type":"multiple","category":"电气基础","stem":"根据不同的运行条件，可以将电力系统运行状态分为：（）","options":{"A":"正常状态","B":"不正常状态","C":"故障状态","D":"振荡状态"},"answer":"ABC","explanation":"按运行条件，电力系统运行状态分为正常状态、不正常状态和故障状态，故ABC正确；振荡属于不正常/故障的具体表现，不单列为一类基本状态。","bank":"电气基础"},{"id":"527ac7511372","type":"multiple","category":"电气基础","stem":"电力系统发生短路时的主要特征是（）","options":{"A":"电流增大","B":"电流减小","C":"电压升高","D":"电压降低"},"answer":"AD","explanation":"短路时回路阻抗骤减，电流增大、电压降低，故AD正确；BC与短路特征相反。","bank":"电气基础"},{"id":"2bc1eb1baedc","type":"multiple","category":"电气基础","stem":"定值单内容检查包括（）","options":{"A":"变压器联结组别","B":"额定容量","C":"各侧电压参数","D":"中性点运行方式"},"answer":"ABC","explanation":"定值单检查须核对变压器联结组别、额定容量及各侧电压参数等，故ABC正确；中性点运行方式属调度运行规定，不属定值单内容检查项。","bank":"电气基础"},{"id":"1affb5c91c31","type":"multiple","category":"电气基础","stem":"故障后短路电流导致设备发热乃至损坏，除此之外，短路的危害还有（）","options":{"A":"短路电流将在导体间产生很大的电动力，破坏导体、电气设备及其支架","B":"短路时系统电压大幅度下降，影响用户","C":"短路持续时间长，可能导致电力系统稳定破坏，造成大面积停电","D":"发生不对称短路时，产生的零序电流将对高压线路附近的通信线路产生干扰和影响"},"answer":"ABCD","explanation":"短路除热效应损坏设备外，还会产生巨大电动力破坏设备、使系统电压大幅下降影响用户、持续时间长可破坏稳定造成大面积停电、不对称短路的零序电流干扰通信线路，故ABCD均正确。","bank":"电气基础"},{"id":"8bcc9a0e9653","type":"multiple","category":"电气基础","stem":"对三相电力系统，常见的短路类型有（）","options":{"A":"单相接地","B":"两相接地","C":"两相短路","D":"三相短路"},"answer":"ABCD","explanation":"三相电力系统常见短路类型包括单相接地、两相接地、两相短路和三相短路，故ABCD均正确。","bank":"电气基础"},{"id":"44b7f3b95189","type":"multiple","category":"电气基础","stem":"与励磁涌流（一次值）特征有关的是（）","options":{"A":"系统电压","B":"合闸初相角","C":"TA传变特性","D":"变压器负荷"},"answer":"ABD","explanation":"励磁涌流（一次值）大小与系统电压、合闸初相角及变压器所带负荷（剩磁/磁通初值）有关，故ABD正确；TA传变特性影响的是二次电流波形，与一次涌流特征无关，故C不选。","bank":"电气基础"},{"id":"e831dca90fec","type":"multiple","category":"电气基础","stem":"突变量继电器的动作特点有（）","options":{"A":"能保护各种故障，不反应负荷和振荡","B":"一般作瞬时动作的保护，但也可做延时段后备保护","C":"两相稳定运行状态不会启动，再故障能灵敏动作","D":"振荡再三相故障，能可靠动作"},"answer":"AC","explanation":"突变量继电器反应故障分量，能保护各种故障且不反应负荷和振荡（A）；系统两相稳定运行时无突变量不启动，再发生故障可灵敏动作（C）；它一般用于快速段而非延时段后备（B错），振荡再三相故障时也不具备可靠动作保证（D错），故AC正确。","bank":"电气基础"},{"id":"df457edd3efb","type":"multiple","category":"电气基础","stem":"电力系统振荡时，电压要降低、电流要增大，与短路故障时相比，特点为（）","options":{"A":"振荡时电流增大与短路故障时电流增大相同，电流幅度值增大保持不变","B":"振荡时电压降低与短路故障时电压降低相同，电压幅值减小保持不变","C":"振荡时电流增大与短路故障时电流增大不同，前者幅值要变化，后者幅值不发生变化","D":"振荡时电流增大是缓慢的，与振荡周期大小有关，短路故障电流增大是突变的"},"answer":"CD","explanation":"振荡时电流增大与短路不同，前者幅值随振荡周期变化、后者基本不变（C）；振荡电流增大是缓慢的、与振荡周期有关，短路是突变的（D）；故AB错误、CD正确。","bank":"电气基础"},{"id":"38b9a1840250","type":"multiple","category":"电气基础","stem":"正常运行的电力系统，出现非全相运行，非全相运行线路上可能会误动的继电器是（）","options":{"A":"差动继电器","B":"阻抗继电器","C":"负序功率方向继电器（TV在母线侧）","D":"零序功率方向继电器（TV在母线侧）"},"answer":"CD","explanation":"非全相运行产生负序、零序分量，TV在母线侧时可感受到序电压，负序功率方向继电器和零序功率方向继电器可能误动（CD）；分相差动不反应非全相，阻抗继电器一般不误动，故AB不选。","bank":"电气基础"},{"id":"3ef82c78d076","type":"multiple","category":"电气基础","stem":"长线路的分布电容影响线路两侧电流的（）和（）","options":{"A":"方向","B":"相位","C":"不变","D":"大小"},"answer":"BD","explanation":"长线路分布电容使两侧电流的大小和相位均发生变化（电容电流影响幅值与相角），故BD正确。","bank":"电气基础"},{"id":"41060a3adcd6","type":"multiple","category":"电气基础","stem":"输电线路中某一侧的潮流是送有功，它的电压超前电流可能发生在（）","options":{"A":"0°～90°","B":"90°～180°","C":"270°～360°"},"answer":"AC","explanation":"送有功即P>0，要求cosφ>0，电压超前电流角φ∈(-90°,90°)，即0°～90°或270°～360°，故AC正确；90°～180°为吸收有功。","bank":"电气基础"},{"id":"10e5f0b60976","type":"multiple","category":"电气基础","stem":"在超高压系统中，提高系统稳定水平措施为（）","options":{"A":"电网结构已定，提高线路有功传输","B":"尽可能快速切除故障","C":"采用快速重合闸或采用单重","D":"串补电容适当配置稳控装置"},"answer":"BCD","explanation":"提高系统稳定水平应快速切除故障、采用快速重合闸或单相重合、串补电容并配置稳控装置（BCD）；单纯提高线路有功传输会降低稳定裕度，故A错。","bank":"电气基础"},{"id":"087db051a1a8","type":"multiple","category":"电气基础","stem":"高电压、长线路用暂态型电流互感器是因为（）","options":{"A":"运行电压高","B":"高电压、长线路保护动作时间相对短，确保其在暂态过程中正确动作","C":"短路电流幅值大","D":"短路过渡过程中非周期分量大，衰减时间常数大"},"answer":"BCD","explanation":"高电压长线路保护动作时间短，需TA在暂态过程中正确传变；其短路电流大、非周期分量大且衰减时间常数大，故用暂态型TA（BCD）；运行电压高并非直接原因（A错）。","bank":"电气基础"},{"id":"5d0955eebe20","type":"multiple","category":"电气基础","stem":"关于互感器的描述正确的有（）","options":{"A":"电流互感器二次侧严禁开路","B":"电压互感器二次侧严禁短路","C":"互感器二次侧必须一点接地","D":"电流互感器可用于测量和保护"},"answer":"ABCD","explanation":"电流互感器二次侧严禁开路、电压互感器二次侧严禁短路、互感器二次必须一点接地、电流互感器可用于测量与保护，故ABCD均正确。","bank":"电气基础"},{"id":"ec3d67365d6e","type":"multiple","category":"电气基础","stem":"电动汽车充电对电网的影响有（）","options":{"A":"负荷峰谷差增大","B":"谐波增加","C":"电压波动","D":"短路电流减小"},"answer":"ABC","explanation":"电动汽车充电具有集中性、电力电子特征，会增大负荷峰谷差、增加谐波、引起电压波动，故ABC正确；不会使系统短路电流减小，故D错。","bank":"电气基础"},{"id":"17c3f9ae6df1","type":"multiple","category":"电气基础","stem":"微电网的运行模式包括（）","options":{"A":"并网运行","B":"孤岛运行","C":"混合运行","D":"谐振运行"},"answer":"AB","explanation":"微电网主要有并网运行和孤岛运行两种模式，故AB正确。","bank":"电气基础"},{"id":"62fcfc639fa1","type":"multiple","category":"电气基础","stem":"储能系统在电网中的应用场景有（）","options":{"A":"调峰调频","B":"改善电能质量","C":"备用电源","D":"限制短路电流"},"answer":"ABC","explanation":"储能在电网中可用于调峰调频、改善电能质量、作为备用电源，故ABC正确；限制短路电流不是其主要应用场景，故D不选。","bank":"电气基础"},{"id":"7d509313ff8d","type":"multiple","category":"电气基础","stem":"可再生能源并网对电网的影响包括（）","options":{"A":"电压波动","B":"频率稳定性挑战","C":"短路电流增大","D":"谐波污染"},"answer":"ABCD","explanation":"可再生能源（风电、光伏等）出力波动会引起电压波动、给频率稳定带来挑战、经逆变器可能增加短路电流、并引入谐波污染，故ABCD均正确。","bank":"电气基础"},{"id":"1e5c241ce1f5","type":"multiple","category":"电气基础","stem":"电力系统短路电流计算的假设条件包括（）","options":{"A":"系统阻抗恒定","B":"电源电动势恒定","C":"忽略电容电流","D":"考虑负荷电流"},"answer":"ABC","explanation":"短路电流实用计算通常假设系统阻抗恒定、电源电动势恒定、忽略电容电流，故ABC正确；一般忽略负荷电流，故D错。","bank":"电气基础"},{"id":"8854ebdebed1","type":"multiple","category":"电气基础","stem":"输电线路防雷措施包括（）","options":{"A":"架设避雷线","B":"安装避雷器","C":"降低杆塔接地电阻","D":"采用分裂导线"},"answer":"ABC","explanation":"输电线路防雷主要采用架设避雷线、安装避雷器、降低杆塔接地电阻，故ABC正确；分裂导线主要为提高输送能力、减小电晕，非主要防雷措施，故D不选。","bank":"电气基础"},{"id":"509a0dc805f9","type":"multiple","category":"电气基础","stem":"零序功率方向继电器的正确接线需考虑（）","options":{"A":"电压互感器极性","B":"电流互感器极性","C":"灵敏角设置","D":"系统振荡影响"},"answer":"ABC","explanation":"零序功率方向继电器正确接线须考虑TV极性、TA极性与灵敏角设置，故ABC正确；系统振荡时不产生零序分量，其不受影响，故D不选。","bank":"电气基础"},{"id":"951dd66a9d98","type":"multiple","category":"电气基础","stem":"线路发生两相短路时，故障点的（）","options":{"A":"正序电流等于负序电流","B":"零序电流为零","C":"正序电压等于负序电压","D":"零序电压升高"},"answer":"ABC","explanation":"两相短路为不对称短路（无接地），故障点正序电流等于负序电流、零序电流为零、正序电压等于负序电压，故ABC正确；无零序，故D错。","bank":"电气基础"},{"id":"76ae0cb42b40","type":"multiple","category":"电气基础","stem":"特高压输电的优势包括（）","options":{"A":"输送容量大","B":"线路损耗低","C":"走廊利用率高","D":"技术成熟成本低"},"answer":"ABC","explanation":"特高压输电具有输送容量大、线路损耗低、走廊利用率高的优势，故ABC正确；其技术难度大、造价高，并非技术成熟成本低，故D错。","bank":"电气基础"},{"id":"913249aea635","type":"multiple","category":"电气基础","stem":"变压器短路
