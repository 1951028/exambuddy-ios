<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1c6b52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="考试宝宝">
<title>考试宝宝 · 电气基础</title>
<style>
:root{
  --primary:#1c6b52; --primary-dk:#134b3a; --primary-bg:#e6f1ec;
  --primary-tx:#1c6b52;   /* 强调文字：深色主题下换成亮绿，保证对比度 */
  --solid:#1c6b52;        /* 顶栏 / 主按钮的实心底色 */
  --on-solid:#ffffff;     /* 实心底上的文字 */
  --on-accent:#ffffff;    /* 对/错圆形标记里的字母 */
  --ok:#16a34a; --ok-bg:#e8f6ec; --err:#dc2626; --err-bg:#fdecec;
  --text:#22272e; --text2:#556070; --muted:#8b95a3;
  --line:#e4e8ee; --line2:#eaeef3; --bg:#f2f4f7; --card:#fff;
  --card2:#fbfcfd;        /* 选项、输入框等次级底 */
  --panel:#f7f9fb;        /* 解析框 */
  --panel2:#f2f4f7;       /* 答题卡未答格、按下态 */
  --ring:#c2c9d4;         /* 选项字母圆圈描边 */
  --star:#e0a008;
  --shadow:0 1px 3px rgba(24,39,60,.05);
  --shadow2:0 1px 2px rgba(24,39,60,.04);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --tabbar-h: 56px;
  /* 字号三档：只影响「题干 / 选项 / 解析」这三块真正要盯着看的内容 */
  --fs-stem: 17px; --fs-opt: 16px; --fs-exp: 15px; --fs-kv: 14.5px;
}
/* 深色主题：整套颜色换成暗底浅字，晚上刷题不刺眼 */
body.dark{
  --primary:#2a9d74; --primary-dk:#8fe3bd; --primary-bg:#16332a;
  --primary-tx:#5ad3a2; --solid:#1d6f54; --on-solid:#eafff6; --on-accent:#06231a;
  --ok:#2fc08a; --ok-bg:#123026; --err:#f87171; --err-bg:#3a1e1e;
  --text:#e8edf2; --text2:#b6c0cc; --muted:#8593a3;
  --line:#2b333d; --line2:#2b333d; --bg:#11151a; --card:#1a2028;
  --card2:#202832; --panel:#1d242c; --panel2:#232c36; --ring:#4a5563;
  --star:#f5c451;
  --shadow:0 1px 3px rgba(0,0,0,.35); --shadow2:0 1px 2px rgba(0,0,0,.3);
}
body.fs-s{ --fs-stem:15.5px; --fs-opt:14.5px; --fs-exp:13.5px; --fs-kv:13px; }
body.fs-l{ --fs-stem:19.5px; --fs-opt:18px; --fs-exp:17px; --fs-kv:16px; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); font-size:16px; line-height:1.55;
  display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden;
}
button{font-family:inherit; font-size:16px; border:0; background:none; color:inherit; cursor:pointer;}

/* ---------- 顶栏 ---------- */
header{
  flex:0 0 auto; display:flex; align-items:center; gap:8px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
  background:var(--solid); color:var(--on-solid);
}
header .ttl{font-size:17px; font-weight:600; letter-spacing:.5px;}
header .sub{font-size:12px; opacity:.82; margin-left:auto; text-align:right;}

/* ---------- 内容区 ---------- */
main{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; padding:12px 12px 18px;}
body.in-quiz main{padding-bottom:82px;}   /* 给固定底栏让位 */
.view{display:none;}
.view.on{display:block;}

/* ---------- 底部 tab ---------- */
.tabbar{
  flex:0 0 auto; display:flex; background:var(--card); border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);
}
.tabbar button{
  flex:1; padding:9px 0 8px; font-size:11.5px; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; gap:3px;
}
.tabbar button .ic{font-size:19px; line-height:1;}
.tabbar button.on{color:var(--primary-tx); font-weight:600;}

/* ---------- 通用卡片 ---------- */
.card{background:var(--card); border-radius:14px; padding:14px; margin-bottom:10px;
  box-shadow:var(--shadow);}
.muted{color:var(--muted); font-size:13px;}
.row{display:flex; align-items:center; gap:8px;}

/* ---------- chips ---------- */
.chips{display:flex; gap:8px; overflow-x:auto; padding:2px 0 8px; -webkit-overflow-scrolling:touch;}
.chips::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto; padding:7px 13px; border-radius:999px; font-size:13.5px;
  background:var(--card); color:var(--text2); border:1px solid var(--line); white-space:nowrap;
}
.chip.on{background:var(--solid); color:var(--on-solid); border-color:var(--solid); font-weight:600;}

/* ---------- 题型专项 ---------- */
.qtgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px;}
.qtcard{
  text-align:left; padding:11px 10px 10px; border-radius:12px; border:1px solid var(--line);
  background:var(--card2); color:var(--text); display:flex; flex-direction:column; gap:4px;
  transition:transform .1s, border-color .15s;
}
.qtcard:active{transform:scale(.97);}
.qtcard.on{border-color:var(--primary); background:var(--primary-bg);}
.qtcard .qtico{font-size:16px; line-height:1; color:var(--primary-tx);}
.qtcard .qtname{font-size:14.5px; font-weight:700;}
.qtcard .qtnum{font-size:11.5px; color:var(--muted); line-height:1.4;}
.qtcard .tbar{display:block; height:5px; margin:3px 0 1px;}
.qtcard .qtmeta{font-size:11.5px; color:var(--muted); line-height:1.45;}
.qtcard .qtmeta b{color:var(--text2);}
.qtcard.thin{opacity:.5;}

/* ---------- 题干 ---------- */
/* v2.12：题型胶囊、进度条、收藏合并成一行，题干往上提一行的高度 */
.qmeta{display:flex; align-items:center; gap:10px; min-height:30px; margin-bottom:12px;}
.qtype{background:var(--primary-bg); color:var(--primary-dk); padding:3px 9px; border-radius:7px;
  font-size:12.5px; font-weight:600;}
/* 收藏：只留一颗星，点哪儿都能点到 34×30 的范围 */
.qfav{
  margin-left:auto; width:34px; height:30px; border-radius:9px; display:flex;
  align-items:center; justify-content:center; font-size:17px; line-height:1;
  color:var(--muted);
}
.qfav.on{color:var(--star); background:var(--primary-bg);}
.qfav:active{background:var(--panel2);}
/* v2.12：提示「点空白能直接看答案」——功能不写在脸上，一行小字点到为止 */
.peek-hint{font-size:11.5px; color:var(--muted); text-align:center; margin-top:10px;}
.stem{font-size:var(--fs-stem); font-weight:600; line-height:1.62; margin-bottom:14px; word-break:break-word;}

/* ---------- 选项 ---------- */
.opts{display:flex; flex-direction:column; gap:10px;}
.opt{
  display:flex; gap:11px; align-items:flex-start; width:100%; text-align:left;
  padding:13px 14px; border-radius:12px; background:var(--card2);
  border:1.5px solid var(--line); font-size:var(--fs-opt); line-height:1.5; color:var(--text);
  transition:background .12s, border-color .12s;
}
.opt:active{background:var(--panel2);}
.opt .k{
  flex:0 0 24px; height:24px; border-radius:50%; border:1.8px solid var(--ring);
  display:flex; align-items:center; justify-content:center; font-size:12.5px;
  color:var(--text2); font-weight:600; margin-top:1px;
}
.opt .tx{flex:1; word-break:break-word;}
.opt.sel{border-color:var(--primary); background:var(--primary-bg);}
.opt.sel .k{background:var(--solid); border-color:var(--solid); color:var(--on-solid);}
.opt.right{border-color:var(--ok); background:var(--ok-bg);}
.opt.right .k{background:var(--ok); border-color:var(--ok); color:var(--on-accent);}
.opt.wrong{border-color:var(--err); background:var(--err-bg);}
.opt.wrong .k{background:var(--err); border-color:var(--err); color:var(--on-accent);}

/* ---------- 解析 ---------- */
.exp{margin-top:14px; border-radius:12px; padding:13px 14px; background:var(--panel);
  border:1px solid var(--line2); font-size:var(--fs-exp); line-height:1.72;}
.exp .head{font-weight:700; margin-bottom:8px; font-size:15px;}
.exp .head.ok{color:var(--ok);}
.exp .head.no{color:var(--err);}
.exp .head.blank{color:var(--text2);}
.exp .kv{font-size:var(--fs-kv); color:var(--text2); margin-bottom:6px;}
.exp .kv b{color:var(--text);}
.exp .body{color:var(--text2); white-space:pre-wrap; word-break:break-word;}

/* ---------- v2.0：搜索框（以前是浏览器默认样式，又小又难看） ---------- */
.kwbox{position:relative; margin:2px 0 4px;}
.kwbox input{
  width:100%; padding:11px 40px 11px 36px; border-radius:11px; border:1px solid var(--line);
  background:var(--card2); color:var(--text); font-size:14.5px; font-family:inherit; outline:none;
}
.kwbox input::placeholder{color:var(--muted);}
.kwbox input:focus{border-color:var(--primary); background:var(--card);}
.kwbox .ic{position:absolute; left:11px; top:50%; transform:translateY(-50%);
  font-size:13.5px; color:var(--muted); pointer-events:none;}
.kwbox .clr{position:absolute; right:5px; top:50%; transform:translateY(-50%);
  width:30px; height:30px; border-radius:50%; display:none; align-items:center;
  justify-content:center; color:var(--muted); font-size:14px;}
.kwbox.has .clr{display:flex;}
.kwbox .clr:active{background:var(--panel2);}
.kwhint{font-size:12.5px; color:var(--err); margin:6px 4px 10px; display:none;}
.kwhint.on{display:block;}

/* ---------- v2.0：题卡顶部进度 / 简答自评 / 背题模式 ---------- */
.qprog{flex:1 1 auto; min-width:40px; height:4px; border-radius:999px; background:var(--panel2); overflow:hidden; margin:0;}
.qprog i{display:block; height:100%; border-radius:999px; background:var(--primary); transition:width .25s;}
.qtype.recite{background:var(--panel2); color:var(--star);}
.exp .head.wait{color:var(--primary-dk);}
.selfjudge{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);}
.selfjudge .sjtip,.exp .sjtip{font-size:12.5px; color:var(--muted); line-height:1.6; margin-bottom:9px;}
.selfjudge .sjbar{display:flex; gap:8px;}
.selfjudge .btn{flex:1; padding:11px 6px; font-size:14.5px;}
.selfjudge .yes{background:var(--ok); border-color:var(--ok); color:#fff;}
.selfjudge .no{background:var(--err-bg); border-color:var(--err); color:var(--err);}

/* ---------- v2.0：答题卡图例 / 退出本轮 ---------- */
.sheet .legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; font-size:11.5px; color:var(--muted);}
.sheet .legend span{display:flex; align-items:center; gap:5px;}
.sheet .legend i{width:12px; height:12px; border-radius:4px; display:block; border:1px solid transparent;}
.sheet .legend .l-ok{background:var(--ok-bg); border-color:var(--ok);}
.sheet .legend .l-no{background:var(--err-bg); border-color:var(--err);}
.sheet .legend .l-peek{background:var(--panel2); border-color:var(--line);}
.sheet .legend .l-ans{background:var(--primary-bg); border-color:var(--primary);}
.sheet .exit{margin-top:12px; padding:11px; border-radius:11px; border:1px solid var(--line);
  color:var(--err); font-size:14.5px; font-weight:600; text-align:center;}

/* ---------- v2.0：首页备份提醒 ---------- */
.tipbar{display:flex; gap:7px; align-items:flex-start; padding:10px 12px; border-radius:11px;
  background:var(--panel); border:1px dashed var(--line); font-size:12.5px;
  color:var(--text2); line-height:1.62; margin-bottom:10px;}
.tipbar .tx{flex:1; min-width:0;}
.tipbar .go{flex:0 0 auto; color:var(--primary-tx); font-weight:600; font-size:12.5px; padding:0 2px;}
.tipbar .x{flex:0 0 auto; color:var(--muted); font-size:14px; padding:0 0 0 4px; line-height:1.2;}

/* 题干和解析允许长按复制（记笔记/发给同学都用得上） */
.stem,.exp .body,.exp .kv,.note .nb{user-select:text; -webkit-user-select:text;}

/* ---------- 练习底部条 ---------- */
.pbar{
  position:fixed; left:0; right:0; z-index:20;
  bottom:calc(var(--tabbar-h) + var(--safe-b));
  padding:9px 12px; display:flex; gap:7px;
  background:var(--card); border-top:1px solid var(--line);
  box-shadow:0 -2px 10px rgba(24,39,60,.05);
}
.btn{
  flex:1; padding:13px 8px; border-radius:12px; background:var(--card); border:1px solid var(--line);
  font-size:15px; font-weight:600; color:var(--text2); text-align:center;
}
.btn:disabled{opacity:.45;}
.btn.primary{background:var(--solid); border-color:var(--solid); color:var(--on-solid);}
.btn.mini{flex:0 0 auto; padding:13px 14px;}
/* v2.5：底栏里的次要操作统一小一号，只让主按钮占满剩下的宽度。
   以前一排大按钮（上一题/跳过/提交），四个看着一样重，反而不知道点哪个 */
.pbar .btn{flex:0 0 auto; min-width:66px; padding:12px 12px; font-size:14px; border-radius:11px;
  white-space:nowrap;}
.pbar .btn.primary{flex:1 1 auto; padding:12px 10px; font-size:15px; font-weight:700;}
.pbar .btn.warn{color:var(--err);}
.pbar.tight .btn{padding:12px 9px; font-size:13.5px;}
.pbar.tight .btn.primary{font-size:14.5px;}

/* ---------- 答题卡 ---------- */
.sheet-mask{position:fixed; inset:0; background:rgba(20,28,38,.42); display:none; z-index:50;}
.sheet-mask.on{display:block;}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:51; background:var(--card);
  border-radius:18px 18px 0 0; padding:16px 14px calc(16px + var(--safe-b));
  max-height:70vh; display:none; flex-direction:column;
}
.sheet.on{display:flex;}
.sheet h3{margin:0 0 4px; font-size:16px;}

/* v2.7：应用内确认框。WebView 里 window.confirm 在部分机型上直接返回 false，
   退出这一轮这种关键动作不能赌它，所以自己弹一个 */
.sheet.ask{max-height:none;}
#askSheet .askmsg{
  font-size:14px; line-height:1.65; color:var(--text2);
  white-space:pre-line; margin:6px 2px 16px;
}
#askSheet .sbar{display:flex; gap:8px;}
#askSheet .sbar .btn{flex:1;}
#askSheet .sbar .btn.primary.danger{background:var(--err); border-color:var(--err);}
.sheet .grid{display:grid; grid-template-columns:repeat(6,1fr); gap:8px; overflow-y:auto; margin-top:10px;}
.cell{
  height:40px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  font-size:14px; background:var(--panel2); color:var(--text2); border:1px solid transparent;
}
.cell.ok{background:var(--ok-bg); color:var(--ok); font-weight:600;}
.cell.no{background:var(--err-bg); color:var(--err); font-weight:600;}
.cell.seen{background:var(--panel2); color:var(--text2); font-weight:600;}   /* 空着提交，看过解析 */
.cell.cur{background:var(--solid); color:var(--on-solid); font-weight:700;}
.cell.ans{background:var(--primary-bg); color:var(--primary-dk); font-weight:700; border-color:var(--line);}

/* ---------- 列表 ---------- */
.item{
  display:flex; gap:10px; align-items:center; padding:13px 14px; background:var(--card);
  border-radius:12px; margin-bottom:8px; box-shadow:var(--shadow2);
}
.item .grow{flex:1; min-width:0;}
.item .t{font-size:15px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.item .s{font-size:12.5px; color:var(--muted); margin-top:3px;}
.item .go{color:var(--muted); font-size:18px;}
.item.on{border:1.5px solid var(--primary);}

.stats-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.stat{background:var(--card); border-radius:14px; padding:14px;}
.stat .v{font-size:24px; font-weight:700; color:var(--primary-dk);}
.stat .l{font-size:12.5px; color:var(--muted); margin-top:2px;}

.empty{text-align:center; color:var(--muted); font-size:14px; padding:40px 20px;}
.empty .big{font-size:32px; margin-bottom:10px; opacity:.5;}

input.fill{
  width:100%; padding:13px 14px; border-radius:12px; border:1.5px solid var(--line);
  font-size:16px; font-family:inherit; background:var(--card2); outline:none;
}
input.fill:focus{border-color:var(--primary); background:var(--card);}

.toast{
  position:fixed; left:50%; bottom:88px; transform:translateX(-50%) translateY(10px);
  background:rgba(24,32,42,.9); color:#fff; padding:10px 18px; border-radius:10px;
  font-size:14px; opacity:0; transition:.22s; pointer-events:none; z-index:99; max-width:80vw;
}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0);}

/* ---------- 学习页：分段按钮 ---------- */
.seg{display:flex; gap:8px; margin-bottom:12px;}
.seg button{
  flex:1; padding:10px 8px; border-radius:11px; background:var(--card); border:1px solid var(--line);
  font-size:14.5px; font-weight:600; color:var(--text2);
}
.seg button.on{background:var(--solid); border-color:var(--solid); color:var(--on-solid);}

/* ---------- 闪卡 ---------- */
.flash{
  position:relative; background:var(--card); border-radius:16px; padding:20px 18px; min-height:300px;
  display:flex; flex-direction:column; box-shadow:var(--shadow);
  touch-action:pan-y; transition:transform .16s ease-out, opacity .16s ease-out, box-shadow .16s;
  will-change:transform;
  /* 上面留出倾斜的余量：拖到底时卡片顶角会往上摆，留够了才不会压住分栏按钮 */
  margin-top:26px;
  /* 绕中心转：卡片高矮不一（翻面后解析可能很长），
     转轴偏下会让高卡片的顶角甩出去一大截 */
  transform-origin:50% 50%;
  -webkit-user-select:none; user-select:none;
}
/* 拖动中把卡片「拎起来」：阴影散开、光标变抓 */
.flash.dragging{ transition:none; cursor:grabbing;
  box-shadow:0 18px 34px rgba(24,39,60,.20), 0 2px 6px rgba(24,39,60,.10); }
body.dark .flash.dragging{ box-shadow:0 20px 40px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.35); }
/* 划到底的方向标：过阈值一半才慢慢显出来，越靠近越清楚 */
.flash .stamp{
  position:absolute; top:13px; z-index:3; pointer-events:none; white-space:nowrap;
  font-size:12.5px; font-weight:700; line-height:1.3; padding:4px 11px; border-radius:999px;
  border:1.5px solid currentColor; background:var(--card);
  opacity:0; transform:scale(.86); transition:opacity .1s linear, transform .1s linear;
}
.flash .stamp.l{left:13px; color:var(--muted);}
.flash .stamp.r{right:13px; color:var(--primary-tx);}
.flash.dragging .stamp.l, .flash.dragging .stamp.r{transition:none;}
/* 换卡入场：新卡从上一张飞走的那一侧斜着飘进来，动作接得上 */
.flash.slide-in-next{ animation:fcInNext .26s cubic-bezier(.2,.75,.3,1) both; }
.flash.slide-in-prev{ animation:fcInPrev .26s cubic-bezier(.2,.75,.3,1) both; }
@keyframes fcInNext{
  from{ opacity:0; transform:translateX(36px) rotate(3.4deg) scale(.97); }
  to{ opacity:1; transform:none; }
}
@keyframes fcInPrev{
  from{ opacity:0; transform:translateX(-36px) rotate(-3.4deg) scale(.97); }
  to{ opacity:1; transform:none; }
}
.flash .hint{
  position:absolute; right:14px; top:14px; font-size:11.5px; color:var(--primary-tx);
  background:var(--primary-bg); padding:3px 9px; border-radius:999px;
  transition:opacity .12s linear;
}
.flash.dragging .hint{opacity:0;}
@media (prefers-reduced-motion:reduce){
  .flash{transition:transform .18s linear, opacity .18s linear;}
  .flash.dragging{transition:none;}
  .flash.slide-in-next, .flash.slide-in-prev{animation:none;}
}
.flash .fh{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); margin-bottom:12px;}
.flash .fs{font-size:18px; font-weight:600; line-height:1.62; word-break:break-word; margin-bottom:14px;}
.flash .fo{font-size:15px; color:var(--text2); line-height:1.7; display:flex; gap:8px; margin-bottom:7px;}
.flash .fo .k{flex:0 0 18px; font-weight:700; color:var(--text);}
.flash .fb{margin-top:auto; padding-top:16px; font-size:13px; color:var(--muted); text-align:center;}
.flash .ans{margin-top:14px; padding-top:14px; border-top:1px dashed var(--line);}
.flash .ans .kv{font-size:15px; color:var(--text2); margin-bottom:8px;}
.flash .ans .kv b{color:var(--primary-dk); font-size:15.5px;}
.flash .ans .body{font-size:14.5px; color:var(--text2); line-height:1.72; white-space:pre-wrap; word-break:break-word;}

/* v2.11：闪卡卡片放大——抽卡时铺满顶栏到底栏之间整块可视区，
   卡片变高变大，点翻面、看题都不再缩在上面一小块。
   只在「闪卡进行中」给 #v-study 挂 flashfill：开始页 / 看完页 / 考点速记保持原样。
   注意必须连 .on 一起写，否则 display:flex 会盖过 .view{display:none}，页面藏不住。 */
#v-study.flashfill.on{display:flex; flex-direction:column; min-height:100%;}
#v-study.flashfill.on #studyBox{display:flex; flex-direction:column; flex:1 1 auto;}
#v-study.flashfill.on .flash{flex:1 1 auto; min-height:0;}
/* 卡片大了，正文字号也跟着提一档，远看更清楚 */
#v-study.flashfill.on .flash .fs{font-size:19.5px;}
#v-study.flashfill.on .flash .fo{font-size:16px; line-height:1.9;}
#v-study.flashfill.on .flash .ans .body{font-size:15.5px;}

/* ---------- 考点速记 ---------- */
.point{background:var(--card); border-radius:12px; padding:13px 14px; margin-bottom:8px; position:relative;}
.point .pt{font-size:15px; font-weight:600; line-height:1.5; padding-right:44px; word-break:break-word;}
.point .pc{font-size:12px; color:var(--muted); margin:4px 0 8px;}
.point .pb{font-size:14.5px; color:var(--text2); white-space:pre-wrap; line-height:1.72;
  word-break:break-word; transition:filter .16s;}
.point.blind .pb{filter:blur(5px); user-select:none; -webkit-user-select:none;}
.point .del{position:absolute; right:10px; top:10px; font-size:12px; color:var(--muted); padding:2px 6px;}
.point .reveal{font-size:12px; color:var(--primary-tx); margin-top:6px;}

/* ---------- 考试 ---------- */
.timer{
  font-size:13px; font-weight:700; color:var(--primary-dk); background:var(--primary-bg);
  padding:2px 9px; border-radius:999px; margin-left:auto;
}
.timer.urgent{background:var(--err-bg); color:var(--err);}
.score{font-size:40px; font-weight:800; color:var(--primary-dk); line-height:1.1;}
body.in-quiz #bankChips, body.in-quiz #catChips{display:none;}
body.dark .pbar{box-shadow:0 -2px 10px rgba(0,0,0,.4);}
body.dark .sheet-mask,body.dark .page-mask{background:rgba(0,0,0,.55);}
body.dark .toast{background:rgba(52,62,74,.96);}

/* ---------- 设置页（全屏覆盖，从顶栏齿轮或练习页进入） ---------- */
header .hbtn{
  flex:0 0 auto; width:34px; height:34px; margin-left:2px; border-radius:10px;
  display:flex; align-items:center; justify-content:center; font-size:17px;
  color:var(--on-solid); opacity:.92;
}
header .hbtn:active{background:rgba(255,255,255,.16);}
/* v2.4：顶栏常驻「退出本轮」——以前只有点开答题卡才找得到这个按钮 */
header .hbtn.quit{
  display:none; width:auto; height:28px; padding:0 12px; border-radius:999px;
  background:rgba(255,255,255,.95); color:var(--solid); font-size:13px; font-weight:700;
  letter-spacing:.3px; white-space:nowrap; opacity:1; cursor:pointer;
}
header .hbtn.quit:active{background:#fff; transform:scale(.96);}
header .hbtn.quit.warn{background:#fff; color:var(--err);}
body.in-quiz header .hbtn.quit{display:flex;}
.page-mask{position:fixed; inset:0; z-index:40; background:rgba(20,28,38,.42);
  opacity:0; pointer-events:none; transition:opacity .2s;}
.page-mask.on{opacity:1; pointer-events:auto;}
.page{
  position:fixed; inset:0; z-index:41; background:var(--bg); display:flex; flex-direction:column;
  transform:translateY(100%); transition:transform .26s cubic-bezier(.22,.8,.3,1); visibility:hidden;
}
.page.on{transform:none; visibility:visible;}
.page-hd{
  flex:0 0 auto; display:flex; align-items:center;
  padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;
  background:var(--solid); color:var(--on-solid);
}
.page-hd .back{flex:0 0 78px; text-align:left; padding:7px 6px; font-size:15px; color:var(--on-solid);}
.page-hd .pt{flex:1; text-align:center; font-size:16.5px; font-weight:600;}
.page-hd .rt{flex:0 0 78px; padding:7px 6px;}
.page-bd{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 12px calc(26px + var(--safe-b));}

.grp{font-size:12.5px; color:var(--muted); margin:16px 6px 8px; letter-spacing:.3px;}
.grp.first{margin-top:0;}
.set{background:var(--card); border-radius:14px; overflow:hidden; box-shadow:var(--shadow);}
.set .line{display:flex; align-items:center; gap:12px; padding:14px; border-bottom:1px solid var(--line);}
.set .line:last-child{border-bottom:0;}
.set .line .info{flex:1; min-width:0;}
.set .line .nm{font-size:15px; font-weight:600;}
.set .line .ds{font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.55;}
.set .line .vl{font-size:13.5px; color:var(--text2); flex:0 0 auto;}
.set .line.tap:active{background:var(--panel2);}
.set .pad{padding:14px;}

.sw{flex:0 0 auto; width:48px; height:28px; border-radius:999px; background:var(--ring);
  position:relative; transition:background .18s;}
.sw.on{background:var(--primary);}
.sw i{position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%;
  background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.2); transition:transform .18s;}
.sw.on i{transform:translateX(20px);}

.rad{display:flex; gap:11px; align-items:flex-start; width:100%; text-align:left;
  padding:14px; border-bottom:1px solid var(--line);}
.rad:last-child{border-bottom:0;}
.rad .dot{flex:0 0 21px; height:21px; border-radius:50%; border:1.8px solid var(--ring);
  margin-top:1px; display:flex; align-items:center; justify-content:center; transition:.15s;}
.rad.on{background:var(--primary-bg);}
.rad.on .dot{border-color:var(--primary); background:var(--primary);}
.rad.on .dot::after{content:''; width:8px; height:8px; border-radius:50%; background:var(--on-solid);}
.rad .rt{display:block; font-size:15px; font-weight:600; line-height:1.4;}
.rad .rs{display:block; font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.55;}

/* ---------- 数据小图表：最近 7 天 / 考试趋势 ---------- */
.chart{display:flex; align-items:flex-end; gap:7px; height:96px; margin-top:10px;}
.chart .col{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:4px; height:100%; min-width:0;}
.chart .col .bv{font-size:10.5px; color:var(--muted); line-height:1;}
.chart .col .bar{width:100%; max-width:22px; border-radius:5px 5px 2px 2px; background:var(--primary); min-height:3px;}
.chart .col.zero .bar{background:var(--line);}
.chart .col.today .bar{background:var(--primary-tx);}
.chart .col .bl{font-size:10.5px; color:var(--muted); line-height:1;}
.chart .col.today .bl{color:var(--primary-tx); font-weight:600;}

/* 薄弱分类条 */
.wk{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line);}
.wk:last-child{border-bottom:0;}
.wk .nm{flex:0 0 92px; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.wk .track{flex:1; height:7px; border-radius:4px; background:var(--panel2); overflow:hidden;}
.wk .fill{height:100%; border-radius:4px; background:var(--ok);}
.wk .fill.mid{background:var(--star);}
.wk .fill.low{background:var(--err);}
.wk .pc{flex:0 0 70px; text-align:right; font-size:12px; color:var(--muted); white-space:nowrap;}

/* 题库完成度：单独一个类，别和「薄弱分类」的 .wk 混在一起 */
.dbar{display:flex; align-items:center; gap:8px; padding:0 0 8px;}
.dbar .nm{flex:0 0 86px; font-size:13.5px;}
.dbar .track{flex:1; height:7px; border-radius:4px; background:var(--panel2); overflow:hidden;}
.dbar .track i{display:block; height:100%; border-radius:4px; background:var(--primary);}
.dbar .pc{flex:0 0 58px; text-align:right; font-size:12px; color:var(--muted);}

/* 考试记录 */
.exrow{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
.exrow:last-child{border-bottom:0;}
.exrow .sc{flex:0 0 44px; font-size:17px; font-weight:700;}
.exrow .sc.ok{color:var(--ok);}
.exrow .sc.no{color:var(--err);}
.exrow .mid{flex:1; min-width:0;}
.exrow .mid .a{font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block;}
.exrow .mid .b{font-size:11.5px; color:var(--muted); display:block;}
.exrow .go{flex:0 0 auto; font-size:12px; color:var(--primary-tx); padding:4px 2px;}

/* ---------- 今日任务 / 记忆复习 ---------- */
.taskcard .tline{display:flex; align-items:center; gap:8px; margin-top:9px; font-size:14px;}
.taskcard .tline .nm{flex:0 0 66px; color:var(--muted); font-size:12.5px;}
.taskcard .tline .vv{flex:1; min-width:0; font-weight:600;}
.taskcard .tline .vv b{color:var(--primary-dk);}
.tbar{height:6px; border-radius:999px; background:var(--panel2); overflow:hidden; margin:10px 0 2px;}
.tbar i{display:block; height:100%; border-radius:999px; background:var(--primary); transition:width .3s;}
.tbar.warn i{background:var(--err);}
.duetag{display:inline-block; font-size:11.5px; font-weight:600; padding:1px 7px; border-radius:999px;
  background:var(--primary-bg); color:var(--primary-dk);}
.duetag.soon{background:var(--panel2); color:var(--muted); font-weight:400;}
.note{margin-top:10px; padding:9px 12px; border-radius:10px; background:var(--card2);
  border:1px dashed var(--line);}
.note .nh{font-size:11.5px; color:var(--muted); margin-bottom:3px;}
.note .nb{font-size:13.5px; line-height:1.65; white-space:pre-wrap; word-break:break-word;}
/* v2.5：卡片底部的两个小动作——左「已掌握」右「记笔记」，都压成小字，不再抢题干 */
.nrow{display:flex; align-items:center; gap:2px; margin-top:10px;}
.nrow .nbtn{font-size:12.5px; color:var(--muted); padding:6px 8px; border-radius:8px;}
.nrow .nbtn.ok{color:var(--ok); margin-right:auto;}
.nrow .nbtn:active{background:var(--panel2);}
#noteSheet textarea{width:100%; min-height:128px; resize:vertical; border:1px solid var(--line);
  border-radius:10px; padding:11px 12px; font-size:15px; line-height:1.6; font-family:inherit;
  background:var(--card2); color:var(--text); outline:none;}
#noteSheet textarea:focus{border-color:var(--primary);}
#noteSheet .sbar{display:flex; gap:8px; margin-top:10px;}
input[type="date"]{border:1px solid var(--line); border-radius:9px; padding:8px 9px; font-size:14px;
  font-family:inherit; background:var(--card2); color:var(--text); max-width:148px; outline:none;}
input[type="date"]:focus{border-color:var(--primary);}

</style>
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<header>
  <div class="ttl">考试宝宝</div>
  <div class="sub" id="hdrSub"></div>
  <button class="hbtn quit" id="btnQuitTop" aria-label="退出这一轮" title="退出这一轮（进度会保留）">退出</button>
  <button class="hbtn" id="btnGear" aria-label="设置" title="设置">⚙</button>
</header>

<main>
  <!-- ================= 练习 ================= -->
  <section class="view on" id="v-practice">
    <div class="chips" id="bankChips"></div>
    <div class="chips" id="catChips"></div>
    <div id="practiceBox"></div>
  </section>

  <!-- ================= 题库 ================= -->
  <section class="view" id="v-bank">
    <div class="row" style="margin-bottom:10px;">
      <button class="btn primary" id="btnImport" style="flex:1;">导入题库文件</button>
      <button class="btn mini" id="btnRefreshBank">刷新</button>
    </div>
    <div class="muted" style="margin:2px 4px 10px;">支持 .json / .md / .txt 格式的题库文件</div>
    <div id="bankList"></div>

    <div class="card" style="margin-top:14px;">
      <div style="font-size:15px;font-weight:700;margin-bottom:6px;">备份练习数据</div>
      <div class="muted" style="margin-bottom:10px;">
        错题、收藏、已做进度只存在这台手机里，连不上网也能用。
        换手机前建议导出一份备份，之后在新手机上从这里导入。
      </div>
      <button class="btn" id="btnExportData" style="width:100%;">导出备份（.json）</button>
      <button class="btn" id="btnImportData" style="width:100%;margin-top:8px;">导入备份（.json）</button>
    </div>
  </section>

  <!-- ================= 学习：闪卡 / 考点 ================= -->
  <section class="view" id="v-study">
    <div class="seg" id="studySeg">
      <button data-seg="flash" class="on">试题闪卡</button>
      <button data-seg="point">考点速记</button>
    </div>
    <div id="studyBox"></div>
  </section>

  <!-- ================= 错题 ================= -->
  <section class="view" id="v-wrong">
    <div class="row" style="margin-bottom:12px;gap:8px;">
      <button class="btn" id="tabWrong" style="flex:1;">错题本 <span id="wrongNum"></span></button>
      <button class="btn" id="tabFav" style="flex:1;">收藏夹 <span id="favNum"></span></button>
    </div>
    <div id="reviewBox"></div>
    <div class="chips" id="wrongFilters"></div>
    <button class="btn primary" id="btnPracticeWrong" style="width:100%;margin-bottom:12px;">专练错题</button>
    <div id="wrongList"></div>
  </section>

  <!-- ================= 统计 ================= -->
  <section class="view" id="v-stats">
    <div id="statsBox"></div>
  </section>
</main>

<nav class="tabbar">
  <button data-tab="practice" class="on"><span class="ic">✎</span>练习</button>
  <button data-tab="bank"><span class="ic">▤</span>题库</button>
  <button data-tab="study"><span class="ic">✦</span>学习</button>
  <button data-tab="wrong"><span class="ic">✗</span>错题</button>
  <button data-tab="stats"><span class="ic">▥</span>统计</button>
</nav>

<div class="page-mask" id="setMask"></div>
<section class="page" id="setPage" aria-hidden="true">
  <div class="page-hd">
    <button class="back" id="setBack">‹ 返回</button>
    <div class="pt">设置</div>
    <div class="rt"></div>
  </div>
  <div class="page-bd" id="setBox"></div>
</section>

<div class="sheet-mask" id="mask"></div>
<div class="sheet" id="sheet">
  <h3>答题卡 <span class="muted" id="sheetStat" style="font-size:13px;font-weight:400;"></span></h3>
  <div class="grid" id="sheetGrid"></div>
  <div class="legend" id="sheetLegend"></div>
  <button class="exit" id="btnQuit" style="display:none;">退出本轮（进度会保留）</button>
</div>

<div class="sheet-mask" id="noteMask"></div>
<div class="sheet" id="noteSheet">
  <h3 style="font-size:15px;">我的笔记 <span class="muted" id="noteTitle" style="font-size:12.5px;font-weight:400;"></span></h3>
  <div class="muted" style="font-size:12.5px;margin:4px 0 10px;">
    只存在这台手机里。记口诀、记为什么错、记老师强调的点都行，下次再做到这题会一起显示。
  </div>
  <textarea id="noteTa" placeholder="比如：这题记「先断电再验电」，别和上一章的「先接地」搞混"></textarea>
  <div class="sbar">
    <button class="btn" id="noteCancel">取消</button>
    <button class="btn primary" id="noteSave">保存笔记</button>
  </div>
</div>
<div class="sheet-mask" id="askMask"></div>
<div class="sheet ask" id="askSheet" role="dialog" aria-modal="true" aria-labelledby="askTitle">
  <h3 id="askTitle">确认</h3>
  <div class="askmsg" id="askMsg"></div>
  <div class="sbar">
    <button class="btn" id="askNo">取消</button>
    <button class="btn primary" id="askYes">确定</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<input type="file" id="fileInput" accept=".json,.md,.txt" multiple style="display:none">
<input type="file" id="restoreInput" accept=".json,application/json" style="display:none">

<script>
/* ================= 内置题库（构建时注入） ================= */
const BUILTIN = [{"id":"1901e1836394","type":"fill","category":"电气基础","stem":"对断路器控制回路有哪些基本要求？","options":{},"answer":"1、应有对控制电源的监视回路； 2、应经常监视断路器跳闸、合闸回路的完好性； 3、应有防止断路器跳跃的电气闭锁装置； 4、跳闸、合闸命令应保持足够长的时间，并当跳闸或合闸完成后，命令脉冲能自动解除； 5、对于断路器的合闸、跳闸状态，应有明显的位置信号； 6、断路器的操作动力消失或不足时，应闭锁动作，并发信号。","explanation":"断路器控制回路须满足可靠性与安全性：①设控制电源及跳、合闸回路监视回路，及时发现断线/失电；②装设防跳（电气闭锁）装置，防止合闸于故障时断路器连续跳合（跳跃）；③跳闸/合闸命令脉冲应保足够宽度使断路器可靠动作，动作完成后自动解除，避免命令粘连；④用位置信号（红灯/绿灯或分合指示）明确显示断路器状态；⑤操作动力（弹簧/液压/气压）消失或不足时闭锁动作并发信，防止带病误操作。","bank":"电气基础"},{"id":"a436f68db853","type":"fill","category":"电气基础","stem":"某设备装有电流保护，电流互感器的变比是200/5，整定值是4A，如果整定值不变，将电流互感器变比改为300/5，应将整定改为几安培？","options":{},"answer":"原整定值的一次电流为：4×200/5=160(A)；改变电流互感器后的整定值应为：Idy=160/(300/5)=2.67(A)","explanation":"电流保护按一次侧电流整定。原一次整定电流 Idz1 = 二次侧整定值 × 变比 = 4 × (200/5) = 160 A。更改 CT 变比后，为保持相同的一次动作电流不变，二次侧新整定值 = 160 / (300/5) = 160 / 60 ≈ 2.67 A。核心记忆：一次电流整定值固定，二次侧整定值随 CT 变比成反变化。","bank":"电气基础"},{"id":"71beadbca91d","type":"fill","category":"电气基础","stem":"什么是继电保护装置？","options":{},"answer":"1、所谓继电保护装置，就是能反应电力系统中各电气设备发生的故障或不正常工作状态，并作用于断路器跳闸或发出警报信号的自动装置。","explanation":"继电保护装置是电力系统的自动装置，其基本任务有两点：①故障时，快速、有选择地反应电气设备故障并作用于断路器跳闸，隔离故障；②设备处不正常（异常）工作状态时发出告警信号。其“继电”本质是利用电流、电压等电气量变化检测故障并自动执行控制。","bank":"电气基础"},{"id":"1f4ee652a3d5","type":"judge","category":"电气基础","stem":"电抗器可以限制短路电流，提高电力系统的稳定性。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"电抗器串联在电路中可增大短路回路阻抗，从而限制短路电流大小，减轻对电气设备的冲击并改善系统电压稳定性，故说法正确。","bank":"电气基础"},{"id":"625d26a54984","type":"judge","category":"电气基础","stem":"数字电路中，“与非”门可以通过“与”门和“非”门组合实现。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"与非门（NAND）的逻辑是“先与后非”，因此用一个与门后接一个非门即可构成与非门，说法正确。","bank":"电气基础"},{"id":"755c9e476533","type":"judge","category":"电气基础","stem":"继电保护人员输入定值时应停用整套微机保护装置。()","options":{"A":"对","B":"错"},"answer":"对","explanation":"为防止输入/修改定值过程中装置误动或数据异常，按保安规定在输入定值时通常应停用整套微机保护装置（或退出跳闸出口），说法正确。","bank":"电气基础"},{"id":"a854bb2b5b75","type":"judge","category":"电气基础","stem":"电力系统中，短路电流的大小与电源容量成正比。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"短路电流的周期分量近似等于系统等效电动势除以短路总阻抗；电源容量越大，系统等值内阻抗越小，短路电流越大，故二者成正比，说法正确。","bank":"电气基础"},{"id":"3266d62c3bfc","type":"judge","category":"电气基础","stem":"电感元件在交流电路中，频率越高，其感抗越小。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"感抗XL=2πfL，与频率f成正比。频率越高，感抗越大而非越小。正确说法应为“频率越高，感抗越大”。","bank":"电气基础"},{"id":"0c6e494708c7","type":"judge","category":"电气基础","stem":"电力系统中，无功功率不足会导致电压升高。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"无功不足时系统电压会下降，无功缺额越大电压越低，严重时发生电压崩溃。正确说法应为“无功功率不足会导致电压降低”。","bank":"电气基础"},{"id":"540c66922ace","type":"judge","category":"电气基础","stem":"变压器不仅能改变交流电压，还能改变直流电压。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"变压器基于电磁感应原理，只能改变交流电压；直流下磁通不变、副边不产生感应电动势，不能变压。正确说法为“变压器只能改变交流电压，不能改变直流电压”。","bank":"电气基础"},{"id":"13e222d95904","type":"judge","category":"电气基础","stem":"时间常数反映的是电容或电感充放电时间的快慢。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"RC电路时间常数τ=RC，RL电路τ=L/R，均表征一阶电路充放电达到稳态快慢的物理量，说法正确。","bank":"电气基础"},{"id":"ee45493536f1","type":"judge","category":"电气基础","stem":"两点之间的电压就是这两点的电位之差。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"电压（电位差）的定义即电路中两点电位的差值，Uab=Va−Vb，说法正确。","bank":"电气基础"},{"id":"630ce30b70b9","type":"judge","category":"电气基础","stem":"欧姆定律指出,在一个闭合电路中,当导体温度不变时,通过导体的电流与加在导体两端的电压成反比,与其电阻成正比（）。","options":{"A":"对","B":"错"},"answer":"错","explanation":"欧姆定律I=U/R，电流与电压成正比、与电阻成反比。题目说“与电压成反比、与电阻成正比”正好相反。正确说法应为“电流与电压成正比，与电阻成反比”。","bank":"电气基础"},{"id":"eed0d92aaa94","type":"judge","category":"电气基础","stem":"电力系统的电压等级越高，输电效率越高。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"在输送相同功率时，电压越高则电流越小，线路损耗（I²R）和电压降越小，输电效率越高，说法正确。","bank":"电气基础"},{"id":"4746a3c70649","type":"judge","category":"电气基础","stem":"电力系统中，中性点不接地系统发生单相接地故障时，可继续运行一段时间。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"中性点不接地系统单相接地时三相线电压仍对称，故障电流仅为电容电流，允许带故障短时（一般2小时）运行，说法正确。","bank":"电气基础"},{"id":"67af4219854b","type":"judge","category":"电气基础","stem":"只要电源是正弦的，电路中的各部分电流及电压也是正弦的()。","options":{"A":"对","B":"错"},"answer":"错","explanation":"若电路含非线性元件（如铁芯电感、整流器件）或发生铁磁谐振，即使电源为正弦，电流/电压也会出现非正弦（含谐波）。正确说法为“线性正弦稳态电路中各部分才是正弦”。","bank":"电气基础"},{"id":"2f6d50743425","type":"judge","category":"电气基础","stem":"零序电流只有在系统发生接地故障时才会出现。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"零序电流由三相不平衡（零序分量）产生；在正常运行和对称故障时三相对称无零序，仅在接地故障（单相/两相接地）时出现，说法正确。","bank":"电气基础"},{"id":"fadf1d5fca7a","type":"judge","category":"电气基础","stem":"隔离开关是指承担接通和断开电流任务,将电路与电源隔开（）。","options":{"A":"对","B":"错"},"answer":"错","explanation":"隔离开关（刀闸）没有灭弧能力，不能用于接通或断开负荷电流/短路电流，仅作隔离电源、形成明显断开点用。正确说法：接通和断开电流由断路器承担，隔离开关只起隔离作用。","bank":"电气基础"},{"id":"bc38e2e70057","type":"judge","category":"电气基础","stem":"几个电阻并联时，其中一个电阻加大则等效电阻将减小。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"并联等效电阻R=1/(1/R1+…)，任一支路电阻增大，其倒数减小，总等效电阻增大。题目说“减小”错误，正确应为“等效电阻将增大”。","bank":"电气基础"},{"id":"747f7a89b55b","type":"judge","category":"电气基础","stem":"电力系统中，负荷的功率因数越高越好。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"功率因数越高，无功占用越少，线路和设备损耗越小、利用率越高，故一般认为越高越好（工程中通常提高到规定值如0.9~0.95即可）。","bank":"电气基础"},{"id":"4dabdc228a4d","type":"judge","category":"电气基础","stem":"一个周期内电流的平均值为零的变动电流称为交流电流。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"交流电的特征是大小和方向随时间周期性变化，一个周期内的平均值为零（直流平均值为非零常数），符合交流电定义，正确。","bank":"电气基础"},{"id":"3aaece304ff5","type":"multiple","category":"电气基础","stem":"电容器保护一般配置()。","options":{"A":"相间过流保护","B":"过压保护","C":"欠压保护","D":"不平衡保护"},"answer":"ABCD","explanation":"A.相间过流保护——正确，用于防御电容器组外部短路及内部相间故障。B.过压保护——正确，系统电压升高会危及电容器绝缘与寿命，需配置。C.欠压保护——正确，失压时电容器可能带残压重合闸产生过电流冲击，需欠压闭锁。D.不平衡保护——正确，电容器内部元件故障（如熔丝熔断）会产生不平衡电压/电流，需配置。故ABCD全选。","bank":"电气基础"},{"id":"6a055208167e","type":"multiple","category":"电气基础","stem":"下列()情况，禁止动火。","options":{"A":"压力容器或管道未泄压前","B":"存放易燃易爆物品的容器未清洗干净前或未进行有效置换前","C":"风力达5级以上的露天作业","D":"喷漆现场"},"answer":"ABCD","explanation":"A.压力容器或管道未泄压前——正确，带压动火易爆炸，严禁动火。B.存放易燃易爆物品的容器未清洗或未有效置换前——正确，残留可燃物遇火爆炸，禁止动火。C.风力达5级以上露天作业——正确，动火作业规定5级及以上风力露天禁止。D.喷漆现场——正确，漆雾易燃易爆，禁止动火。故ABCD全选。","bank":"电气基础"},{"id":"06f9c8b43acd","type":"multiple","category":"电气基础","stem":"二次回路安装接线图包括屏面布置图、屏背面接线图和()几个组成部分。","options":{"A":"屏面布置图","B":"屏背面接线图","C":"端子排图","D":"展开图"},"answer":"ABC","explanation":"A.屏面布置图——正确，是安装接线图的组成部分。B.屏背面接线图——正确，是安装接线图的组成部分。C.端子排图——正确，安装接线图还包括端子排图。D.展开图——错误，展开图属于原理图，不属于安装接线图。故选ABC。","bank":"电气基础"},{"id":"baa0880efc99","type":"multiple","category":"电气基础","stem":"微机保护的硬件构成有()等。","options":{"A":"中央处理器","B":"存储器","C":"模拟量输入接口","D":"人机对话"},"answer":"ABCD","explanation":"A.中央处理器（CPU）——正确，是微机保护运算控制核心。B.存储器——正确，用于存储程序与数据。C.模拟量输入接口——正确，用于采集TA/TV的模拟量。D.人机对话——正确，包括键盘、显示、通信等人与装置交互部分。故ABCD全选。","bank":"电气基础"},{"id":"56993fa2f540","type":"multiple","category":"电气基础","stem":"电力变压器应装设如下继电保护：()等。","options":{"A":"纵差保护","B":"瓦斯保护","C":"过流保护","D":"过励磁保护"},"answer":"ABCD","explanation":"A.纵差保护——正确，变压器主保护，防御内部相间、接地故障。B.瓦斯保护——正确，油浸式变压器主保护，防御油内故障。C.过流保护——正确，作为相间短路后备保护。D.过励磁保护——正确，大容量变压器为防止铁芯饱和应装设。故ABCD全选。","bank":"电气基础"},{"id":"a6624e19e8e5","type":"multiple","category":"电气基础","stem":"变压器油的作用主要有()。","options":{"A":"绝缘","B":"冷却","C":"密封","D":"防潮"},"answer":"AB","explanation":"A.绝缘——正确，变压器油具有良好绝缘性能。B.冷却——正确，油循环带走热量起散热冷却作用。C.密封——错误，密封不是变压器油的作用。D.防潮——错误，防潮并非油的主要作用（主要靠密封结构）。故选AB。","bank":"电气基础"},{"id":"9b575e67780f","type":"multiple","category":"电气基础","stem":"变压器定值单内容检查包括()。","options":{"A":"变压器联结组别","B":"额定容量","C":"各侧电压参数","D":"各侧TA变比系数"},"answer":"ABCD","explanation":"A.变压器联结组别——正确，影响差动保护接线与转角，须核对。B.额定容量——正确，是定值计算的基础参数。C.各侧电压参数——正确，影响定值与转角计算。D.各侧TA变比系数——正确，影响差流折算。故ABCD全选。","bank":"电气基础"},{"id":"c265653e507e","type":"multiple","category":"电气基础","stem":"下列()是常用的光纤接口。","options":{"A":"LC","B":"PC","C":"SC","D":"ST"},"answer":"ACD","explanation":"A.LC——正确，是常用的小型光纤连接接口。B.PC——错误，PC是光纤端面抛光方式（物理接触），并非接口类型。C.SC——正确，常用光纤接口。D.ST——正确，常用光纤接口。故选ACD。","bank":"电气基础"},{"id":"d19576c02935","type":"multiple","category":"电气基础","stem":"电力系统的潮流计算主要是计算（）。","options":{"A":"电压","B":"电流","C":"功率","D":"频率"},"answer":"ABC","explanation":"A.电压——正确，潮流计算求得各节点电压幅值与相角。B.电流——正确，可由支路阻抗求得支路电流。C.功率——正确，潮流计算的核心是计算各支路有功、无功功率分布。D.频率——错误，潮流计算在给定频率（通常50Hz）下进行，不计算频率（频率由有功平衡决定）。故选ABC。","bank":"电气基础"},{"id":"a9974500a29c","type":"multiple","category":"电气基础","stem":"母线保护主要包括()。","options":{"A":"差动保护","B":"失灵保护","C":"充电保护","D":"过流保护"},"answer":"ABC","explanation":"A.差动保护——正确，是母线故障的主保护。B.失灵保护——正确，断路器拒动时由母差启动失灵切除故障。C.充电保护——正确，母联（分段）充电时投入。D.过流保护——错误，过流一般不是母线保护的主要配置（母线保护以差动为主）。故选ABC。","bank":"电气基础"},{"id":"d20ebae12929","type":"multiple","category":"电气基础","stem":"变压器中性点的接地方式有()。","options":{"A":"中性点直接接地","B":"中性点不接地","C":"中性点经放电间隙接地","D":"中性点经消弧线圈接地"},"answer":"ABCD","explanation":"A.中性点直接接地——正确，常见接地方式之一。B.中性点不接地——正确，适用于部分配电网。C.中性点经放电间隙接地——正确，用于限制过电压。D.中性点经消弧线圈接地——正确，用于补偿电容电流。故ABCD全选。","bank":"电气基础"},{"id":"60281616acea","type":"multiple","category":"电气基础","stem":"识读电气接线图的步骤主要包括（）。","options":{"A":"分析清楚电气原理图中的主电路和辅助电路所含有的元器件，弄清楚各元器件的动作原理和作用","B":"弄清电气原理图和接线图中元器件的对应关系","C":"弄清电气接线图中接线导线的根数和所用导线的具体规格","D":"根据电气接线图中的线号弄清主电路和辅助电路的走向"},"answer":"ABCD","explanation":"A.分析原理图中主、辅电路元器件及动作原理——正确，是识图第一步。B.弄清原理图与接线图元器件对应关系——正确。C.弄清接线导线根数及规格——正确。D.根据线号弄清主、辅电路走向——正确。故ABCD全选。","bank":"电气基础"},{"id":"13c73a6c00d1","type":"multiple","category":"电气基础","stem":"以下关于KKJ继电器的描述正确的是（）。","options":{"A":"判断手跳的依据","B":"属于双线圈非磁保持继电器","C":"属于双线圈磁保持继电器","D":"可参与备投的动作逻辑"},"answer":"ACD","explanation":"A.判断手跳的依据——正确，KKJ反映手动跳/合位置。B.双线圈非磁保持继电器——错误，KKJ为磁保持。C.双线圈磁保持继电器——正确，KKJ采用双线圈磁保持结构。D.可参与备投动作逻辑——正确，KKJ状态用于备自投判别。故选ACD。","bank":"电气基础"},{"id":"ec65c8173a07","type":"single","category":"电气基础","stem":"下列做法不符合防静电要求规定的是（）。","options":{"A":"进入仿真场地要穿防静电衣服和鞋，且严禁快速奔跑","B":"插件的邮寄需置于防静电袋中","C":"拔插插件时，只需要手碰触屏体将身体静电放掉即可","D":"女同事长发的要盘起来，并佩戴防静电帽"},"answer":"C","explanation":"C不符合防静电要求。拔插插件不仅需要放掉人体静电，还应使用防静电腕带、接触接地金属等规范操作，“只需要手碰触屏体”不足以可靠泄放静电，且拔插瞬间人体仍可能带电损坏器件。A、B、D均为标准防静电措施。","bank":"电气基础"},{"id":"c8eb557c6eff","type":"single","category":"电气基础","stem":"以下哪种485通讯接线方法是符合工程规范要求的（）。","options":{"A":"蓝和蓝白接正，橙和橙白接负","B":"蓝接正，蓝白接负","C":"蓝接正，橙接负","D":"橙接正，蓝接负"},"answer":"B","explanation":"RS-485采用双绞线差分传输，工程中一般规定同一对双绞线中的蓝线（蓝）接A端（正/DATA+）、蓝白接B端（负/DATA-）。B符合“一对线对应一差分对”的规范；A把两对线混用，C、D跨线对连接，易引入共模干扰。","bank":"电气基础"},{"id":"b8a3a6a2120b","type":"single","category":"电气基础","stem":"继电保护装置、安全自动装置和自动化监控系统的二次回路变动时，应按()进行，无用的接线应隔离清楚，防止误拆或产生寄生回路。","options":{"A":"经审批后的图纸","B":"厂家设计图纸","C":"作业指导书要求","D":"工作负责人要求"},"answer":"A","explanation":"根据《继电保护和安全自动装置现场工作保安规定》等规程，二次回路变动必须按经审批后的图纸进行，无用接线应隔离清楚，防止误拆或产生寄生回路。厂家图纸未经审批不能直接作为施工依据，作业指导书和工作负责人要求也不能替代审批图纸。","bank":"电气基础"},{"id":"8421cd2950b9","type":"single","category":"电气基础","stem":"五环电阻的最后一环表示误差，表示倍率的是（）环？","options":{"A":"第一环","B":"第二环","C":"第三环","D":"第四环"},"answer":"D","explanation":"五环电阻（精密电阻）前三环为有效数字，第四环为倍率（乘数），第五环为允许偏差（误差）。故表示倍率的是第四环。","bank":"电气基础"},{"id":"ad5d350079b2","type":"single","category":"电气基础","stem":"电动势的方向是()。","options":{"A":"从负极指向正极","B":"从正极指向负极","C":"与电压方向相同","D":"与电压方向无关"},"answer":"A","explanation":"电动势反映电源内部非静电力移动电荷做功的能力，其方向规定为在电源内部由负极指向正极（即电位升高的方向）。电压方向由正极指向负极（电位降低），二者方向相反。","bank":"电气基础"},{"id":"c3a53f66529b","type":"single","category":"电气基础","stem":"纯电容元件在电路中()电能。","options":{"A":"储存","B":"分配","C":"消耗","D":"传变"},"answer":"A","explanation":"理想电容不消耗有功功率，它在电路中只是储存和释放电场能，平均功率为零。故应选“储存”。","bank":"电气基础"},{"id":"831d38743f38","type":"single","category":"电气基础","stem":"下列关于电流互感器与系统连接叙述正确的是()。","options":{"A":"一次绕组串联于被测电路，二次绕组与二次测量仪表的电压线圈串联","B":"一次绕组串联于被测电路，二次绕组与二次测量仪表的电压线圈并联","C":"一次绕组并联于被测电路，二次绕组与二次测量仪表的电压线圈串联","D":"一次绕组并联于被测电路，二次绕组与二次测量仪表的电压线圈并联"},"answer":"A","explanation":"电流互感器一次绕组应串联于被测电路（流过的电流等于被测电流），二次侧近似为电流源，应与测量仪表的电流线圈串联。A选项在连接方式（一次串联、二次串联）上正确，B、C、D在一次/二次的连接方式上均有误。","bank":"电气基础"},{"id":"48fa71a68439","type":"single","category":"电气基础","stem":"有一只内阻为0.5MΩ，量程为250V的直流电压表，当它的读数为100V时，流过电压表的电流是（）mA。","options":{"A":"0.2","B":"0.5","C":"2.5","D":"0.4"},"answer":"A","explanation":"电压表满偏电流 I=U/R=250V/0.5MΩ=0.5mA。读数为100V时电流为满偏的100/250=0.4倍，即0.5×0.4=0.2mA（或 I=100/0.5M=0.2mA）。选A。","bank":"电气基础"},{"id":"154ce7e204a2","type":"single","category":"电气基础","stem":"一个由20V的理想电压源和R=5的电阻构成的串联电路，可以用（）A电流源和5Ω电阻相（）联来等效。","options":{"A":"2、并","B":"2、串","C":"4、并","D":"4、串"},"answer":"C","explanation":"电压源Us=20V串联R=5Ω的戴维南等效，对应诺顿等效为电流源Is=Us/R=20/5=4A与R=5Ω并联。故为4A、并联。选C。","bank":"电气基础"},{"id":"09b27fe6469b","type":"single","category":"电气基础","stem":"一个“220V/100W”的灯泡，其额定电流约为（）A，电阻为（）Ω。","options":{"A":"2.2、484","B":"0.45、220","C":"2.2、220","D":"0.45、484"},"answer":"D","explanation":"由P=UI得 I=P/U=100/220≈0.45A；由P=U²/R得 R=U²/P=220²/100=484Ω。选D。","bank":"电气基础"},{"id":"3a1c100e25ce","type":"single","category":"电气基础","stem":"在不接地系统中,如发生单相接地故障时,其它相线对地电压会()。","options":{"A":"升高","B":"降低","C":"不变","D":"无规律"},"answer":"A","explanation":"中性点不接地系统发生单相接地时，中性点电位偏移至相电压，非故障相对地电压由相电压升高为线电压（√3倍），即升高。选A。","bank":"电气基础"},{"id":"5bdca1f829d5","type":"single","category":"电气基础","stem":"拉开闸刀时,如果出现电弧,应()。","options":{"A":"缓慢合上","B":"缓慢拉开","C":"迅速合上","D":"迅速拉开"},"answer":"D","explanation":"拉闸出现电弧时应迅速拉开，使电弧尽快被拉长、熄灭，避免电弧持续造成触头烧损或发展为相间短路。选D。","bank":"电气基础"},{"id":"562bdf75b613","type":"single","category":"电气基础","stem":"一般情况下220V工频电压作用下人体的电阻为()Ω。","options":{"A":"500至1000","B":"800至1600","C":"1000至2000","D":"无穷大"},"answer":"C","explanation":"在干燥环境及220V工频电压作用下，人体电阻通常按1000~2000Ω估算（安全规程计算摆脱电流、接触电压等常取此范围）。选C。","bank":"电气基础"},{"id":"bc2a98c82ba8","type":"single","category":"电气基础","stem":"下列电压互感器接线形式中不能测量相电压的接线形式为()。","options":{"A":"单相接线","B":"V/V接线","C":"三相五柱式接线","D":"三台单相式接线"},"answer":"B","explanation":"V/V接线（两台单相PT接成不完全星形）只能测量线电压，不能测量相电压；单相接线（测某相对地）、三相五柱式接线、三台单相式接线均可测相电压。选B。","bank":"电气基础"},{"id":"456d6c026cb9","type":"single","category":"电气基础","stem":"电压互感器一次绕组额定电压为10kV，二次绕组额定电压为100V，不考虑激磁损耗，电压互感器一、二次绕组的匝数比为()。","options":{"A":"100:1","B":"1:100","C":"10:1","D":"1:10"},"answer":"A","explanation":"电压互感器变比等于电压比，故匝数比 N1:N2=U1:U2=10000:100=100:1（一次匝数多、二次匝数少）。选A。","bank":"电气基础"},{"id":"59c65ca746ba","type":"single","category":"电气基础","stem":"在小电流接地系统中，某处发生单相接地时，母线电压互感器开口三角的电压为()。","options":{"A":"故障点距母线越近，电压越高","B":"故障点距母线越近，电压越低","C":"不管距离远近，基本上电压一样高","D":"不定"},"answer":"C","explanation":"小电流接地系统发生单相接地时，系统三相线电压仍对称，全系统（含故障点）开口三角均出现约100V额定零序电压，其大小取决于系统对地参数，与故障点距母线远近基本无关。选C。","bank":"电气基础"},{"id":"f5100b4d4e66","type":"single","category":"电气基础","stem":"在电网中，装设带有方向过流元件的过流保护是为了保证动作的()。","options":{"A":"选择性","B":"可靠性","C":"灵敏性","D":"快速性"},"answer":"A","explanation":"双电源或环网中，方向过流元件判别故障方向，使保护只对本侧方向的故障动作，避免反方向故障时误动，从而保证保护的选择性。选A。","bank":"电气基础"},{"id":"328f43d6aad5","type":"single","category":"电气基础","stem":"在工程竣工验收以后，能够全面真实地反映建设工程项目施工结果的图样，称为()。","options":{"A":"存档图纸","B":"竣工图","C":"内部资料","D":"施工图纸"},"answer":"B","explanation":"竣工图是工程竣工验收后，能够全面、真实反映建设工程施工结果的图样，是工程档案的重要组成部分。选B。","bank":"电气基础"},{"id":"7a30cb8d2103","type":"single","category":"电气基础","stem":"防止低压触电的措施错误的有()。","options":{"A":"必须使用装有漏电保护器的电源盘","B":"螺丝刀等工具金属裸露部分除刀口外包绝缘","C":"接拆电源时一人执行","D":"接拆电源必须在电源开关拉开的情况下进行"},"answer":"C","explanation":"接拆电源属近电作业，应两人进行（一人操作、一人监护），C说“一人执行”是错误的。A、B、D均为正确防触电措施。选C。","bank":"电气基础"},{"id":"09807cd31e47","type":"single","category":"电气基础","stem":"下列关于电力系统短路电流计算的说法，正确的是（）","options":{"A":"电力系统短路电流是指系统中发生短路故障时，短路点处的电流。","B":"短路电流的大小与短路故障的类型和位置有关。","C":"短路电流的计算对于选择合适的断路器和保护装置至关重要。","D":"短路电流的计算通常采用近似方法或数值计算方法。"},"answer":"A","explanation":"短路电流即电力系统中发生短路故障时短路点处的故障电流，A是其基本定义，表述最严谨。B、C、D所述亦为事实，但作为单选题以A的定义性表述为准。（注：本题B、C、D同样基本正确，属题干设计偏宽，按题面答案A解释。）","bank":"电气基础"},{"id":"18e48cb28af6","type":"single","category":"电气基础","stem":"交流电路中电流比电压滞后90°,该电路属于()电路。","options":{"A":"纯电阻","B":"纯电感","C":"纯电容","D":"组合"},"answer":"B","explanation":"纯电感电路中电流滞后电压90°；纯电容电路中电流超前电压90°。电流比电压滞后90°即为纯电感电路。选B。","bank":"电气基础"},{"id":"6b1fb5ce8db4","type":"single","category":"电气基础","stem":"串联电路中各电阻两端电压的关系是()。","options":{"A":"各电阻两端电压相等","B":"阻值越小两端电压越高","C":"阻值越大两端电压越高","D":"阻值和电压无关"},"answer":"C","explanation":"串联电路电流处处相等，由U=IR，电阻越大其两端电压越高（串联正比分压）。选C。","bank":"电气基础"},{"id":"94471a80f5bf","type":"single","category":"电气基础","stem":"为了防止事故,应由()参与预防工作和担当责任。","options":{"A":"人单位","B":"工人本身","C":"用人单位和工人本身","D":"不需要"},"answer":"C","explanation":"安全生产是用人单位和劳动者共同的责任，预防事故需要双方参与、共同担当。选C。","bank":"电气基础"},{"id":"b5ba03c9d045","type":"single","category":"电气基础","stem":"发电厂接于220kV双母线上有3台及以上变压器，则应()。","options":{"A":"一台变压器中性点直接接地","B":"每条母线有一台变压器中性点直接接地","C":"变压器均直接接地","D":"变压器均无需接地"},"answer":"B","explanation":"为避免操作过电压并限制零序网络，220kV双母线、接有3台及以上变压器时，通常规定每条（每台）母线至少一台变压器中性点直接接地，以保证接地故障时有可靠零序通路又不致多台并列。选B。","bank":"电气基础"},{"id":"9c4dfcd01302","type":"single","category":"电气基础","stem":"产生频率崩溃的原因为（）。","options":{"A":"有功功率严重不足","B":"无功功率严重不足","C":"系统受到小的干扰","D":"系统发生短路"},"answer":"A","explanation":"频率由有功功率平衡决定，当系统有功功率严重缺额、发电远小于负荷时，频率持续下降导致频率崩溃；无功不足导致的是电压崩溃。选A。","bank":"电气基础"},{"id":"553d5b29c95e","type":"single","category":"电气基础","stem":"钳形电流表的表头实际上是一个（）和电压表组成的。","options":{"A":"电压互感器","B":"电流互感器","C":"自耦变压器","D":"整流器"},"answer":"B","explanation":"钳形电流表由穿心式电流互感器（被测导线作一次绕组，钳口铁芯二次侧感应电流）和整流式磁电系表头（电压表）组成。选B。","bank":"电气基础"},{"id":"ee2752bdb6da","type":"single","category":"电气基础","stem":"自动准同步装置主要有合闸、调压、()、及电源四个部分组成。","options":{"A":"整流","B":"调速","C":"调频","D":"分闸"},"answer":"C","explanation":"自动准同期装置主要包括调频（使待并机频率接近系统）、调压（使电压接近）、合闸（在压差/频差/相位满足条件时发合闸脉冲）及电源四个部分。选C。","bank":"电气基础"},{"id":"c69caf983b95","type":"single","category":"电气基础","stem":"下列关于交流电路功率的说法，正确的是（）","options":{"A":"交流电路的功率是指电路在单位时间内所做的功。","B":"交流电路的功率因数是指电路中实际功率与视在功率的比值。","C":"交流电路的功率因数总是大于1。","D":"交流电路的功率因数可以通过增加电容或电感来提高。"},"answer":"B","explanation":"功率因数λ=P/S（有功功率/视在功率），取值在0~1之间，不可能大于1。提高功率因数应通过并联电容（补偿无功）实现，而非随意增加电感。A混淆了功率与功的概念，C、D错误，B正确。选B。","bank":"电气基础"},{"id":"34be8dc89d73","type":"single","category":"电气基础","stem":"交流电压表和电流表，其读值是交流电的（）。","options":{"A":"最大值","B":"有效值","C":"平均值","D":"瞬时值"},"answer":"B","explanation":"电工仪表（交流电压表、电流表）的读数一般为交流电的有效值（RMS）。选B。","bank":"电气基础"},{"id":"05eb83345339","type":"single","category":"电气基础","stem":"已知Ua=30.7∠0°，Ub=57.7∠-120°，Uc=57.7∠120°，则负序电压为（）。","options":{"A":"48.7∠180°","B":"48.7∠0°","C":"9∠180°","D":"9∠0°"},"answer":"C","explanation":"负序分量 U2=(1/3)(Ua+a²Ub+aUc)，a=1∠120°。代入：Ub·a²=57.7∠(-120+240)=57.7∠120°，Uc·a=57.7∠(120+120)=57.7∠240°；二者之和为57.7(cos120+cos240)+j57.7(sin120+sin240)=-57.7。再加Ua=30.7∠0°得总和=30.7-57.7=-27，故U2=-27/3=-9=9∠180°。选C。","bank":"电气基础"},{"id":"d825671f260e","type":"single","category":"电气基础","stem":"计量用电流互感器的准确度，通常采用()级的。","options":{"A":"0.2S","B":"0.5","C":"1","D":"3"},"answer":"A","explanation":"电能计量用电流互感器要求较高精度，通常采用0.2S（或0.2/0.5S）级。选A。","bank":"电气基础"},{"id":"16045522c455","type":"single","category":"电气基础","stem":"有一只内阻为200Ω，量程为1mA的毫安表，打算把它改制成量限为5A的电流表，应该并联（）Ω的分流电阻。","options":{"A":"0.25","B":"0.08","C":"0.04","D":"0.4"},"answer":"C","explanation":"表头满偏电压 U=Ig·Rg=0.001×200=0.2V。改装为5A，并联分流电阻Rs，当总电流5A时流过表头仍1mA，则流过Rs为5-0.001≈4.999A，Rs=U/Is=0.2/4.999≈0.04Ω。选C。","bank":"电气基础"},{"id":"7ed621e76fde","type":"single","category":"电气基础","stem":"三个阻值相等的电阻串联时的总电阻是并联时总电阻的()倍。","options":{"A":"3","B":"6","C":"9","D":"12"},"answer":"C","explanation":"设每电阻为R。串联总阻3R，并联总阻R/3，二者之比=3R/(R/3)=9倍。选C。","bank":"电气基础"},{"id":"e60bae42cf81","type":"single","category":"电气基础","stem":"任何操作现场作业中，都要严格执行()，这是开展标准化作业的前提与基础。","options":{"A":"两票三制","B":"三票两制","C":"规章制度","D":"上级要求"},"answer":"A","explanation":"“两票三制”（工作票、操作票；交接班制、巡回检查制、设备定期试验轮换制）是电力系统现场作业的基本制度，是开展标准化作业的前提与基础。选A。","bank":"电气基础"},{"id":"d764351a8fcd","type":"single","category":"电气基础","stem":"两个容量都为20μF的电容，若它们串联，等效电容为（）μF；若它们并联，等效电容为（）μF。","options":{"A":"10、40","B":"40、10","C":"40、20","D":"20、40"},"answer":"A","explanation":"两相等电容C串联：C串=C/2=10μF；并联：C并=2C=40μF。选A。","bank":"电气基础"},{"id":"fa2ba43cb7cd","type":"single","category":"电气基础","stem":"基尔霍夫电流定律的表达式为（）","options":{"A":"ΣI₁=ΣI₂","B":"ΣI₁=ΣI₂-I₃","C":"ΣI₁+ΣI₂=ΣI₃","D":"ΣI₁-ΣI₂=ΣI₃"},"answer":"A","explanation":"基尔霍夫电流定律（KCL）：任一节点电流的代数和等于零，即ΣI=0，也可表述为流入电流ΣI₁等于流出电流ΣI₂。选A。","bank":"电气基础"},{"id":"2cd5b3bbde50","type":"single","category":"电气基础","stem":"电路主要由（）、负载、导线和控制设备组成。","options":{"A":"电源","B":"电容","C":"电阻","D":"电感"},"answer":"A","explanation":"电路的基本组成包括电源、负载、连接导线和控制设备（开关等）。选A。","bank":"电气基础"},{"id":"a1e6faf41050","type":"single","category":"电气基础","stem":"感应电流的方向总是使感应电流的磁场阻碍引起感应电流的磁通的变化,这一定律称为()。","options":{"A":"法拉第定律","B":"楞次定律","C":"基尔霍夫定律","D":"库伦定律"},"answer":"B","explanation":"楞次定律指出：感应电流的方向总是使其产生的磁场阻碍引起感应电流的磁通量的变化。选B。","bank":"电气基础"},{"id":"95d75afa7cfd","type":"single","category":"电气基础","stem":"钳形电流表测量电流时,可以在()电路的情况下进行。","options":{"A":"断开","B":"短接","C":"不断开","D":"以上都行"},"answer":"C","explanation":"钳形电流表利用电流互感器原理，钳住导线即可测流，不需断开电路。选C。","bank":"电气基础"},{"id":"d9ca3626896c","type":"single","category":"电气基础","stem":"电感性负载并联电容器后,电压和电流之间的电角度会（）。","options":{"A":"增大","B":"减小","C":"不变","D":"无规律"},"answer":"B","explanation":"感性负载电流滞后电压，并联电容后电容电流超前电压，对无功进行补偿，使总电流与电压的相位差（功率因数角）减小。选B。","bank":"电气基础"},{"id":"620289608f2e","type":"single","category":"电气基础","stem":"当电压为5V时,导体的电阻值为5欧,那么当电阻两端电压为2V时,导体的电阻值为()欧。","options":{"A":"10","B":"5","C":"2","D":"1"},"answer":"B","explanation":"导体电阻是导体本身的属性，由材料、长度、截面积和温度决定，与所加电压无关，故仍为5Ω。选B。","bank":"电气基础"},{"id":"dba00fcf5e60","type":"single","category":"电气基础","stem":"劳动者对用人单位管理人员违章指挥、强令冒险作业,有权()。","options":{"A":"停止作业","B":"提出批评","C":"拒绝执行","D":"继续作业"},"answer":"C","explanation":"《安全生产法》规定，从业人员对管理人员违章指挥、强令冒险作业有权拒绝执行。选C。","bank":"电气基础"},{"id":"59d7e6c50f3c","type":"single","category":"电气基础","stem":"安培定则也叫()。","options":{"A":"左手定则","B":"右手定则","C":"左手螺旋定则","D":"右手螺旋定则"},"answer":"D","explanation":"安培定则用于判定电流产生磁场的方向，又称右手螺旋定则。选D。","bank":"电气基础"},{"id":"23c230bbff99","type":"single","category":"电气基础","stem":"分相操作的断路器拒动考虑的原则是()。","options":{"A":"单相拒动","B":"两相拒动","C":"三相拒动","D":"都要考虑"},"answer":"A","explanation":"分相操作断路器在继电保护整定与失灵等考虑时，通常按“单相拒动”（即单相断路器拒跳）作为原则进行考核。选A。","bank":"电气基础"},{"id":"e0898498787d","type":"fill","category":"电气基础","stem":"按负荷电流整定的保护，需要考虑各种运行方式变化时出现的最大负荷电流，一般应考虑哪几项运行变化？","options":{},"answer":"(1)备用电源自投装置动作引起的负荷增加。(2)并联运行线路的减少，负荷转移。(3)对于双侧电源的线路，当一侧电源突然切除，引起另一侧负荷增加。","explanation":"按负荷电流整定的保护（如过电流保护）须躲过最大负荷电流，因此要考虑使负荷增大的运行方式变化：①备用电源自投(BZT)动作引起负荷增加（如失压母线负荷转移）；②并联运行线路减少，负荷转移到其余线路；③双侧电源线路一侧电源突然切除，引起另一侧负荷增加。此外还应考虑负荷自起动电流。","bank":"电气基础"},{"id":"db7258f11f32","type":"fill","category":"电气基础","stem":"何谓双母线接线断路器失灵保护？失灵保护的动作时间应如何考虑？","options":{},"answer":"保护动作断路器拒动，切同母线元件;大于跳闸+返回时间+裕度","explanation":"双母线接线中，当某元件保护动作但其断路器拒动时，失灵保护切除该拒动断路器所在母线上的所有元件，防止故障扩大。其动作时间应大于故障元件断路器跳闸时间 + 保护返回时间 + 时间裕度，以躲过断路器正常跳闸及保护返回过程、避免误动，同时尽快动作以限制故障持续时间。","bank":"电气基础"},{"id":"fb691259596b","type":"fill","category":"电气基础","stem":"为何要设置母联死区保护？","options":{},"answer":"故障在母联CT与断路器之间，常规保护误动/拒动","explanation":"母联死区指母联断路器与母联 CT 之间的区域。常规母差保护以 CT 为界划分大差/小差，当故障落在死区（CT 与断路器之间）时，小差可能误判为区外，造成应动保护拒动或误判，故需设母联死区保护：母差动作且母联断路器已跳开但故障仍未消除时，经延时切除相关母线。","bank":"电气基础"},{"id":"92d14b0f7e66","type":"fill","category":"电气基础","stem":"母差保护停用时的影响及如何处理？","options":{},"answer":"3/2接线退母线，双母线缩短停用时间、投母联过流","explanation":"母差保护是母线故障的主保护，停用后母线故障失去快速保护，只能依靠对侧线路/变压器后备保护远跳切除，切除时间长、影响范围大。处理：3/2 接线可退出故障母线；双母线接线应尽量缩短停用时间，必要时投入母联（分段）过流保护作为临时后备保护。","bank":"电气基础"},{"id":"9b7978b415b5","type":"fill","category":"电气基础","stem":"在国产微机型母差保护中，如何防止区外故障时TA饱和造成的误动？","options":{},"answer":"同步识别法、谐波制动法、线性传变区鉴别法","explanation":"区外故障时近区 TA 可能饱和产生差流，使母差误动。国产微机母差常用防饱和措施：①同步识别法（比较各支路电流相位/波形是否同步）；②谐波制动法（饱和时含大量高次谐波，谐波比超阈值即制动）；③线性传变区鉴别法（利用饱和前的线性传变区判定区内/外故障）。","bank":"电气基础"},{"id":"2a87db672851","type":"fill","category":"电气基础","stem":"有哪些措施可以保证母联（分段）断路器停运时母差保护的工作灵敏度，现在微机型母差保护中一般采用哪种措施？并以什么作为开入量？","options":{},"answer":"解除大差元件、降低大差制动系数;降低制动系数;母联辅助触点","explanation":"母联（分段）停运时双母线实际合为单母线，大差元件制动电流增大、灵敏度下降。措施：解除大差元件或降低大差制动系数以提高灵敏度。微机母差一般以母联（分段）断路器的辅助触点作为开入量，识别母联状态并自动调整差动逻辑。","bank":"电气基础"},{"id":"3103f6832952","type":"fill","category":"电气基础","stem":"差动元件的动作特性是比率制动特性曲线，其作用是什么？","options":{},"answer":"区外故障躲不平衡电流，区内故障保灵敏度","explanation":"比率制动特性：制动电流（外部穿越电流）越大，动作门槛越高。其作用是：①区外故障时躲过 TA 不平衡电流，防止误动；②区内故障时制动量小，保证足够灵敏度使保护动作。即兼顾选择性与灵敏度的统一。","bank":"电气基础"},{"id":"862b47f8eb9b","type":"fill","category":"电气基础","stem":"《国家电网有限公司十八项电网重大反事故措施(2018年修订版)》对保护二次电压切换有些什么反措要求?","options":{},"answer":"(1)当保护采用双重化配置时，其电压切换箱(回路)隔离开关辅助触点应采用单位置输入方式。(2)单套配置保护的电压切换箱(回路)隔离开关辅助触点应采用双位置输入方式。(3)电压切换直流电源与对应保护装置直流电源取自同一段直流母线且共用直流空气开关。","explanation":"依据十八项反措，电压切换箱隔离开关辅助触点输入方式按保护配置区分：①双重化配置采用单位置输入（每套独立、互不影响，且可防止正、反母隔离开关辅助触点同时闭合时二次反充电）；②单套配置采用双位置输入（提高切换可靠性，防触点接触不良致电压失去、保护退出）；③电压切换直流电源与对应保护直流电源取自同段母线且共用直流空开，保证电源一致性。","bank":"电气基础"},{"id":"90b36d6acee7","type":"fill","category":"电气基础","stem":"《国家电网有限公司十八项电网重大反事故措施(2018年修订版)》要求保护电压切换箱隔离开关辅助触点应采用什么输入方式?请解释原因。","options":{},"answer":"(1)当保护采用双重化配置时，其电压切换箱(回路)隔离开关辅助触点应采用单位置输入方式。原因：双重化配置的保护配置独立的操作箱，一套电压切换故障不影响另一套保护运行，且可防止正负母隔离开关辅助触点同时闭合时可能出现的二次反充电。(2)单套配置保护的电压切换箱(回路)隔离开关辅助触点应采用双位置输入方式。单套配置用双位置考虑电压切换的可靠性，防止辅助结点接触不良导致交流电压失去后保护退出影响设备运行。","explanation":"同 86 题，重点在原因：双重化用单位置——两套独立操作箱，一套切换故障不影响另一套，并防止双母隔离开关辅助触点同时闭合造成二次反充电；单套用双位置（常开+常闭）——因单套无冗余，双位置可提高电压切换可靠性，防止辅助触点接触不良使交流电压失去、保护退出影响运行。","bank":"电气基础"},{"id":"b2f97b7d6995","type":"fill","category":"电气基础","stem":"用于保护交流电压自动切换的中间继电器应满足哪些要求?","options":{},"answer":"答： (1)在断电时应保证可靠失磁复归，触点容量应保证在电压回路故障通过短路电流时不粘连。 (2)分别控制两组母线电压的切换继电器同时动作，应发出信号。 (3)应保证控制正电源的触点较控制交流电压回路的触点迟闭合、早断开，并保证有足继够压力。 (4)在不停相应保护的情况下，不得对运行中的隔离开关辅助触点进行维修工作。 (5)电压回路零相应接地，且不应通过切换继电器触点切换。","explanation":"用于保护交流电压自动切换的中间继电器须满足：①断电可靠失磁复归，触点容量足以在电压回路短路通过短路电流时不粘连；②两组母线切换继电器同时动作应发信（防反充电）；③控制正电源触点较交流电压触点迟闭合、早断开（先切电压后断电源，防止电源经触点向 PT 反充电），并保证足够压力；④运行中不得维修隔离开关辅助触点；⑤电压回路零相应直接接地，不通过切换继电器触点切换。","bank":"电气基础"},{"id":"58057ea4b68c","type":"fill","category":"电气基础","stem":"保护采用线路电压互感器时应注意的问题及解决方法是什么?","options":{},"answer":"答：在线路合闸于故障时，在合闸前后电压互感器都无电压输出，阻抗继电器的极化电压的记忆回路将失去作用。为此在合闸时应使阻抗继电器的特性改变为无方向性(在阻抗平面上特性圆包围原点)。 在线路两相运行时断开相电压很小(由健全相通过静电和电磁耦合产生的),但有零序电流存在，导致断开相的接地距离继电器可能持续动作。所以每相距离继电器都应配有该相的电流元件，必须有电流(定值很小，不会影响距离元件的灵敏度)存在，该相距离元件的动作才是有效的。 在故障相单相跳闸进入两相运行时故障相上储存的能量，包括该相并联电抗器中的电磁能，在短路消失后不会立即释放完毕，而会在线路电感、分布电容和电抗器的电感间振荡以至逐渐衰减，其振荡频率接近50Hz,衰减时间常数相当长。所以两相运行的保护最好不反映断开相的电压。","explanation":"线路 PT 在线路停运或合闸于故障时可能无电压输出，影响距离保护极化电压记忆。措施：①合闸于故障使极化电压记忆失效，此时将阻抗继电器改为无方向性（阻抗平面特性圆包围原点）；②两相运行时断开相电压由健全相耦合产生且伴随零序电流，断相接地距离可能误动，故每相距离元件配该相电流元件（有流才允许动作）；③两相运行时故障相储能（含并联电抗器电磁能）在电感、分布电容与电抗器间振荡衰减很慢（近 50 Hz、衰减长），故两相运行保护最好不反映断开相电压。","bank":"电气基础"},{"id":"2c8b0dc905da","type":"fill","category":"电气基础","stem":"对接入母线保护的电流互感器有何要求?","options":{},"answer":"答：母线保护应接在专用电流互感器二次回路中，且要求在该回路中不接入其他设备的保护装置或测量表计。电流互感器的测量精度要高，暂态特性及抗饱和能力强。母线电流互感器在电气上的安装位置，应尽量靠近线路或变压器一侧，使母线保护与线路保护或变压器保护有重叠保护区。","explanation":"母差保护 CT 应接在专用二次回路，不接入其他保护或测量表计（避免负载变化影响差流）。要求：测量精度高、暂态特性好、抗饱和能力强。安装位置应尽量靠近线路或变压器侧，使母差保护与线路/变压器保护存在重叠保护区，避免死区。","bank":"电气基础"},{"id":"a00cb4e3ffaa","type":"fill","category":"电气基础","stem":"什么情况下变压器应装设瓦斯保护？","options":{},"answer":"0.8MVA及以上油浸式变压器和0.4MVA及以上车间内油浸式变压器，均应装设瓦斯保护;当壳内故障产生轻微瓦斯或油面下降时，应瞬时动作发信号;当产生大量瓦斯时，应动作于断开变压器各侧断路器。带负荷调压的油浸式变压器的调压装置，亦应装设瓦斯保护。","explanation":"规程规定：0.8 MVA 及以上油浸式变压器、0.4 MVA 及以上车间内油浸式变压器均应装瓦斯保护。作用：壳内轻微瓦斯或油面下降时瞬时发信；产生大量瓦斯时动作断开变压器各侧断路器。带负荷调压油浸变的调压装置亦应装瓦斯保护。瓦斯保护反应油箱内部故障（匝间短路、铁芯过热、油流涌动等）。","bank":"电气基础"},{"id":"41a03e25aa79","type":"fill","category":"电气基础","stem":"为什么变压器纵差保护能反应绕组匝间短路？而发电机纵差保护不能反应匝间短路？","options":{},"answer":"变压器某侧绕组匝间短路时，该绕组的匝间短路部分可视为出现了一个新的短路绕组，使差流变大，当达到整定值时差动就会动作。由于变压器有磁耦合关系且有每相不少于两个绕组，匝间短路时∑I≠0，而发电机没有磁耦合关系且每相只有一个绕组，绕组匝间短路时∑I＝0，没有差流，保护不动作。","explanation":"变压器每相不少于两个绕组且有磁耦合，一侧绕组匝间短路相当于出现一个新的短路绕组，使该侧电流 ΣI≠0 产生差流，故纵差可动。发电机每相仅一个绕组、无磁耦合，匝间短路时机端与中性点侧电流完全相等，ΣI＝0、无差流，故纵差不动（需专用匝间保护或横差保护）。","bank":"电气基础"},{"id":"d77f13a75f1a","type":"fill","category":"电气基础","stem":"怎样理解变压器非电气量保护和电气量保护的出口继电器要分开设置？","options":{},"answer":"变压器的电气量保护依靠电气量作故障特征，在动作后一旦故障被切除，均能很快返回，而非电气量保护如瓦斯保护、温度保护等则是依靠变压器内部的气体或变压器的温升作为故障的特征量，一旦动作后返回很慢，通常需要人为释放气体后或温度下降后，才能可靠返回。如果变压器的非电气量保护与电气量保护共用同一出口继电器，且均启动失灵保护，则失灵保护存在误动的风险。为此反措要求将变压器非电气量保护和电气量保护的出口继电器要分开设置，慢速返回的非电气量保护不启动失灵保护。","explanation":"电气量保护动作后故障切除即快速返回；非电气量（瓦斯、温度）保护以气体/温升为特征，动作后返回很慢（需人为放气或温度下降）。若两者共用出口继电器且均启动失灵保护，则非电气量动作后慢返回期间失灵保护可能误动。故反措要求分开设置出口继电器，慢速返回的非电气量不启动失灵保护。","bank":"电气基础"},{"id":"904e8217cc57","type":"fill","category":"电气基础","stem":"变压器间隙保护由间隙电流保护和间隙电压保护组成，那么间隙电流保护和间隙电压保护是启动同一个时间继电器吗？为什么？","options":{},"answer":"是启动同一个时间继电器，因为当出现单相故障时，变压器中性点偏移，当电压达到定值，间隙电压保护启动，当经过一段时间后，可能放电间隙击穿，间隙电流保护动作，而间隙电压返回，如果间隙电流与间隙电压采用不同的时间继电器，则间隙保护将重新开始计时，此时间将可能大于一次设备所能承受接地的时间，而使一次设备损坏。","explanation":"是，共用同一时间继电器。单相接地时中性点偏移，间隙电压保护先启动（电压达定值）；延时后间隙可能击穿，间隙电流保护动作而电压保护返回。若两者用不同时间继电器，电流保护启动将重新计时，总延时可能超过一次设备耐受接地时间而损坏设备；共用可在电压启动后保持计时，确保及时跳闸。","bank":"电气基础"},{"id":"0e595bd555fa","type":"fill","category":"电气基础","stem":"相对于反映相间短路的纵差保护来说，变压器零差保护有什么优缺点？","options":{},"answer":"(1)零差保护的不平衡电流与空载合闸的励磁涌流、调压分接头的调整无关，因此，其最小动作电流小于纵差保护的最小动作电流，灵敏度较高。(2)零差保护所用电流互感器变比完全一致，与变压器变比无关。(3)零差保护与变压器任一侧断线的非全相运行方式无关。(4)由于零差保护反映的是零序电流有名值，因而当其用于自耦变压器时，在高压侧接地故障时，灵敏度较低。(5)由于组成零差保护的互感器多，其汲出电流（互感器励磁电流）较大，使灵敏度降低。","explanation":"零差（零序差动）反映各侧零序电流差。优点：①不平衡电流与励磁涌流、分接头调整无关，最小动作电流小、灵敏度高；②所用 CT 变比完全一致，与变压器变比无关；③与任一侧断线的非全相运行方式无关。缺点：④自耦变高压侧接地故障时灵敏度较低（反映零序有名值）；⑤组成保护 CT 多，励磁电流（汲出电流）大，使灵敏度降低。","bank":"电气基础"},{"id":"a36a4b92969b","type":"fill","category":"电气基础","stem":"谐波制动的变压器保护为什么要设置差动速断元件？","options":{},"answer":"设置差动速断元件的主要原因是：为防止在较高的短路电流水平时，由于电流互感器饱和产生高次谐波量增加，产生极大的制动量而使差动保护拒动，因此设置差动速断元件，当短路电流达到4~10倍额定电流时，速断元件不经谐波闭锁快速动作出口。","explanation":"谐波制动（二次谐波制动涌流）在区外严重短路、TA 深度饱和时，电流含高次谐波剧增，产生极大制动量可能使差动保护拒动。故设差动速断元件：当短路电流达到 4~10 倍额定电流时，不经谐波闭锁直接快速出口，保证严重故障下可靠动作。","bank":"电气基础"},{"id":"b1fba0616f93","type":"fill","category":"电气基础","stem":"发电机纵差与变压器纵差保护最本质的区别是什么？变压器纵差保护为什么能反应绕组匝间短路？","options":{},"answer":"发电机纵差保护范围仅包含定子绕组电路，满足正常运行和外部短路时的电路电流的关系。变压器纵差保护范围包含诸绕组的电路并受它们的磁路影响。变压器纵差保护比发电机纵差保护增加了空载合闸时防励磁涌流下误动的部分。变压器某侧绕组匝间短路时，该绕组的匝间短路部分视为出现了一个新的短路绕组，故变压器纵差保护可以动作。而发电机定子绕组匝间短路时，机端和中性点侧电流完全相等，所以发电机纵差保护不反应其匝间短路。","explanation":"本质区别：发电机纵差仅包含定子绕组电路，满足正常运行/外部短路的电路电流关系；变压器纵差包含诸绕组电路并受磁路影响（有磁耦合），且需增设防空载合闸励磁涌流误动部分。匝间短路反应：变压器一侧绕组匝间短路出现新短路绕组致 ΣI≠0，纵差可动；发电机定子匝间短路机端与中性点电流完全相等无差流，纵差不动。","bank":"电气基础"},{"id":"d939b338d278","type":"fill","category":"电气基础","stem":"“双装置/双接口、三路由”典型方式是什么？","options":{},"answer":"双装置分别配置两个独立通信接口，共配置三条通信路由，其中两条路由分别对应两套装置的主接口，一条路由作为备用路由，实现通道冗余，保障通信可靠性。","explanation":"典型通道冗余方式：两套独立保护装置分别配置两个独立通信接口，共三条通信路由——两条分别对应两套装置的主接口，一条作为备用路由。实现通道冗余，任一装置或路由故障仍能通信，保障通信可靠性。","bank":"电气基础"},{"id":"db7329ad032d","type":"fill","category":"电气基础","stem":"电流增量启动元件有何优点？","options":{},"answer":"1)躲振荡能力强;2)灵敏度高;3)非全相运行中一般不会误动。","explanation":"电流增量（ΔI）启动元件反应电流变化量。优点：①躲振荡能力强（振荡为电流缓慢变化，增量小）；②灵敏度高（反映电流突变）；③非全相运行中负荷电流缓慢变化，一般不会误动。常用于方向比较、距离等保护的启动。","bank":"电气基础"},{"id":"f2be061f9d10","type":"fill","category":"电气基础","stem":"远跳保护的就地判据由哪些？","options":{},"answer":"远方跳闸就地判据有电流变化量、零负序电流、零负序电压、低电流、低功率因数、低有功功率等。","explanation":"远方跳闸（远跳）收到对侧跳闸命令后，须经就地判据确认本侧确有故障方可动作，防止误跳。就地判据包括：电流变化量、零序/负序电流、零序/负序电压、低电流、低功率因数、低有功功率等，任一满足即允许跳闸。","bank":"电气基础"},{"id":"fdfc77744c31","type":"fill","category":"电气基础","stem":"微机保护中为什么不采用从PT开口三角处获取方式而采用自产3U0方式参与零序方向元件计算？","options":{},"answer":"零序电压的获取方法有如下两种：1）自产3U0方式，这是一种在软件中获取3U0的方法。微机保护将采样得到的三相电压值在软件中相加得到3U0值，这种3U0值的获取方法称作自产3U0方式。2)从PT开口三角处获取，TV开口三角处输出的电压就是3U0电压。因为在开口三角处将TV的第三个线圈的三相绕组首尾相连后开口处输出的电压就是三相电压之和，这就是3U0电压。在线路保护中3U?电压主要用在零序方向继电器中。在高压(220kV及以上)系统里，各元件的阻抗角都在80°左右。因此正方向短路时，3U0电压滞后3I0电流的角度为-100°。在中压(110kV)系统中各元件的阻抗角大约在70°左右。因此正方向短路时，3U0电压滞后3I0电流的角度约为-110°。在感应型、整流型和晶体管型保护中，零序方向继电器的最大灵敏角都做成70°的。也就是加在继电器中的电压超前于电流70°时继电器动作最灵敏。为了在正方向短路时让这种零序方向继电器动作最灵敏，所以从TV开口三角处来的3U?电压要反相接入继电器。因为正方向短路时-3U0电压超前3I0电流的角度约为70°。但是将3U0电压反相接人继电器往往造成由于接线的错误，在发生短路时零序方向继电器的拒动或误动。而这种错误的接线在正常运行时由于零序电压很小还不易发现，另外3I0回路的断线在正常运行时也不易发现。基于上述原因，目前在微机零序方向继电器的计算中已舍弃了从PT开口三角处获取零序电压的方法而只用自产3U0获取零序电压。","explanation":"微机保护在软件中将三相电压相加得 3U0（自产方式），优于从 PT 开口三角取 3U0。原因：开口三角 3U0 需反相接入以适配零序方向继电器最大灵敏角（约 70°），接线易错且在正常时零序电压很小不易发现，且 3I0 回路断线也不易察觉；自产 3U0 由软件计算，避免接线错误与断线隐患，提高可靠性。","bank":"电气基础"},{"id":"5cec8170fae0","type":"fill","category":"电气基础","stem":"在微机保护中零序电流的获取方法是什么？一般应用在哪些场合？","options":{},"answer":"零序电流有两种：1）零序电流滤过器方式，也称外接3I0方式;2）自产3I0方式。目前在微机保护的运算中一般用自产3I0方式得到的零序电流值进行运算，而在自检中利用两种方式得到的3I0值作比较来检测数据采集系统是否正常。值得注意的是，若外接3I0回路接线不正确，在有些保护厂家的原理中会闭锁相关保护装置，有可能导致拒动。","explanation":"零序电流获取有两种：①零序电流滤过器（外接 3I0，由三相 CT 构成）；②自产 3I0（软件三相电流相加）。微机保护运算一般用自产 3I0；自检中利用两种方式 3I0 比较来检测数据采集系统是否正常。注意：若外接 3I0 回路接线不正确，部分厂家保护会闭锁相关装置，可能导致拒动。","bank":"电气基础"},{"id":"2b798f3eb14a","type":"fill","category":"电气基础","stem":"影响流过保护的零序电流大小的因素有哪些？","options":{},"answer":"1）零序电流大小与接地故障的类型有关;2）零序电流大小非但与零序阻抗有关而且与正、负序阻抗都有关;3）零序电流大小与保护背后系统和对端系统的中性点接地的变压器多少密切相关;4）零序电流大小与短路点的远近有关;5）在双回线路或环网中，在求零序电流的分配系数时要考虑另一回线路或环网中的其他线路的分流作用，在求短路电流和分支系数时还要考虑双回线路或环网中别的线路的线间互感造成的影响。尤其是同杆并架的线路或环网中相邻线路有部分架在同一杆塔上的情况。","explanation":"零序电流大小与：①接地故障类型（单相/两相接地）有关；②不仅与零序阻抗有关，还与正、负序阻抗均有关；③与保护背后与对端系统中性点接地变压器多少密切相关（决定零序网络与分配）；④与短路点远近有关；⑤双回线或环网中须考虑另一回线/其他线路的分流作用及线间互感影响（尤其同杆并架、部分共塔情况），求解分支系数时不可忽略。","bank":"电气基础"},{"id":"fe50b5dbe3a1","type":"fill","category":"电气基础","stem":"要构成多段式的保护必需要具备哪两个条件？","options":{},"answer":"首先，它要能区分正常运行和短路故障两种运行状态。在正常运行时保护不能动作，在短路时保护能够动作。其次，它要能区分短路点的远近，以便在近处短路时以较短的延时切除故障而在远处短路时以较长的延时切除故障以满足选择性的要求。","explanation":"构成多段式保护须具备两条件：①能区分正常运行与短路故障两种状态（正常不动作、短路能动作）；②能区分短路点远近（近处短路短延时切除、远处短路长延时切除，满足选择性）。由此分 I/II/III 段配合，兼顾速动性与选择性。","bank":"电气基础"},{"id":"0511e9ed820b","type":"fill","category":"电气基础","stem":"为什么反应输电线路一端电气量变化的保护都要做成多段式的保护？","options":{},"answer":"因为反应输电线路一端电气量变化的保护无法区分本线路末端短路和相邻线路始端的短路，为了在相邻线路始端短路不越级跳闸，其瞬时动作的I段只能保护本线路的一部分，本线路末端短路只能靠其他段带延时切除故障。所以反应输电线路一端电气量变化的保护都要做成多段式的保护。","explanation":"仅反应线路一端电气量的保护无法区分本线路末端短路与相邻线路始端短路（两端电气量相同）。为在相邻线路始端短路时不越级跳闸，其瞬时 I 段只能保护本线路一部分，本线路末端短路只能靠带延时的 II/III 段切除。故此类保护必须做成多段式以保证选择性。","bank":"电气基础"},{"id":"adc3043ad8e4","type":"fill","category":"电气基础","stem":"变压器新安装或大修后，投入运行发现：轻瓦斯继电器动作频繁，试分析动作原因，和怎样处理？","options":{},"answer":"1）动作原因：投运前未将空气排除，变压器运行后温度上升，内部贮存的空气逐渐上升，空气压力造成轻瓦斯动作;2）处理方法：收集气体并化验，密切观察变压器运行状态（温度、电流、电压、音响），若化验和观察无异常，排除气体后继续运行","explanation":"投运后轻瓦斯频繁动作，多因投运前未排尽空气，变压器运行升温后内部贮存的空气逐渐析出上浮，气体压力使轻瓦斯动作。处理：收集气体并化验，密切观察温度、电流、电压、音响；若化验与观察均无异常，排尽气体后继续运行；若气体可燃或异常应停运检查。","bank":"电气基础"},{"id":"e85b0833b5d6","type":"fill","category":"电气基础","stem":"应根据哪些条件确定线路相间短路电流保护最大和最小短路电流？","options":{},"answer":"1）最大短路电流：最大系统远方，三相短路;2）最小短路电流：最小系统远方，两相短路","explanation":"整定用短路电流：最大短路电流取最大运行方式（系统最强）、线路远方三相短路，用于校验速断保护范围；最小短路电流取最小运行方式（系统最弱）、两相短路，用于校验保护末端灵敏度（保证足够灵敏系数）。","bank":"电气基础"},{"id":"04b7d9a607e8","type":"fill","category":"电气基础","stem":"过电流保护的整定值为什么要考虑继电器的返回系数？而电流速断保护则不需要考虑？","options":{},"answer":"过电流保护的动作电流是按躲过最大负荷电流整定的。在外部短路时，电流继电器可能起动，但在外部故障切除后电流降到最大负荷电流，必须可靠返回，否则会出现误跳闸。考虑返回系数的目的，就是保证在上述情况下，保护能可靠返回。电流速断保护的动作值，是按避开本线路末端短路的最大短路电流整定的，其整定值远大于最大负荷电流，故不存在最大负荷电流下不返回的问题。再者，瞬时电流速断保护一旦起动立即跳闸，根本不存在中途返回问题，故电流速断保护不考虑返回系数","explanation":"过电流保护按躲最大负荷电流整定，外部短路后故障切除电流降至负荷电流，继电器须可靠返回否则误跳，故需考虑返回系数 Kf（返回电流/动作电流 \u003c 1）以保证返回。电流速断按躲本线路末端最大短路电流整定，定值远大于最大负荷电流，不存在负荷电流下不返回问题；且速断一启动即跳闸、无中途返回，故不考虑返回系数。","bank":"电气基础"},{"id":"d2366366066b","type":"fill","category":"电气基础","stem":"简述母差保护与断路器失灵保护的配合关系？","options":{},"answer":"母差保护动作跳开故障母线断路器，若断路器拒动，失灵保护经电流判别和电压闭锁后，跳开该断路器所在母线上的所有断路器;母差保护为直接跳闸保护，失灵保护为后备增强保护，两者共同确保母线故障快速切除","explanation":"母差保护是母线主保护，故障即跳开故障母线断路器；若断路器拒动，失灵保护经电流判别与电压闭锁后跳开该拒动断路器所在母线全部断路器，作为母差拒动时的增强后备。两者配合确保母线故障无论断路器是否可靠跳闸都能快速隔离。","bank":"电气基础"},{"id":"2c5d9e994d1c","type":"fill","category":"电气基础","stem":"变压器中性点间隙保护的动作原理是什么？","options":{},"answer":"当系统发生接地故障且中性点不接地时，间隙击穿，间隙过流保护动作;若间隙未击穿，零序电压升高至整定值时，零序电压保护动作;两者接点并联出口，确保中性点绝缘安全","explanation":"间隙保护用于中性点不接地或经间隙接地的变压器。系统接地故障使中性点偏移：若间隙击穿，间隙过流保护动作；若间隙未击穿、零序电压升至定值，零序电压保护动作。两者接点并联出口，任一动作即跳闸，确保中性点绝缘与设备安全。","bank":"电气基础"},{"id":"347710567bd7","type":"fill","category":"电气基础","stem":"断路器失灵保护的电压闭锁元件为何采用复合电压？","options":{},"answer":"复合电压包含低电压、负序电压和零序电压，可有效区分故障和正常运行;防止失灵保护在系统振荡或非全相运行时误动，提高安全性","explanation":"失灵保护电压闭锁采用复合电压（低电压 + 负序电压 + 零序电压），可全面反映各种不对称及对称故障下的电压异常，有效区分真实故障与系统振荡、非全相运行、TV 断线等情况，防止失灵保护在这些非故障状态下误动，提高安全性。","bank":"电气基础"},{"id":"01308253f3e8","type":"fill","category":"电气基础","stem":"断路器失灵保护中电流控制元件的整定原则是什么？","options":{},"answer":"应保证对线路末端或变压器低压侧单相接地故障时有足够灵敏度，灵敏系数大于1.3，并尽可能躲过正常运行负荷电流。","explanation":"失灵保护电流控制元件（失灵启动电流）整定原则：对线路末端或变压器低压侧单相接地故障有足够灵敏度（灵敏系数 > 1.3），同时尽可能躲过正常运行最大负荷电流，防止正常负荷下误启动失灵。","bank":"电气基础"},{"id":"7617ac314061","type":"fill","category":"电气基础","stem":"微机保护硬件系统通常包括那几个部分？","options":{},"answer":"1）数据处理单元，及微机主系统;2）数据采集单元，即模拟量输入系统;3）数字量输入/输出接口，即开关量输入输出系统;4）通信接口。","explanation":"微机保护硬件系统通常包括：①数据处理单元（微机主系统，CPU 运算）；②数据采集单元（模拟量输入系统，含 TV/TA 变换与 A/D 转换）；③数字量输入/输出接口（开关量输入输出系统）；④通信接口（与上位机/其他装置通信）。（部分教材将电源单列，见 118 题）","bank":"电气基础"},{"id":"275ac83296d5","type":"fill","category":"电气基础","stem":"备自投使用的断路器位置开入应该使用断路器辅助接点还是保护的TWJ或HWJ输出的接点？","options":{},"answer":"断路器辅助接点。因为TWJ或HWJ接点不能完全反应开关的分合闸状态，会受到压力闭锁或控制回路断线的影响。如果使用TWJ或HWJ开入会使备自投逻辑功能受到影响。","explanation":"应使用断路器辅助接点（机构真实位置），而非保护 TWJ/HWJ。因 TWJ/HWJ 受压力闭锁、控制回路断线影响，不能完全反映开关实际分合状态；以其作备自投开入会使逻辑误判、影响自投正确性。","bank":"电气基础"},{"id":"57c5e6e0f27b","type":"fill","category":"电气基础","stem":"请举出三种区内故障因TA饱和有可能拒动的保护例子，并说明各采取哪些措施来防止拒动？","options":{},"answer":"1）二次谐波制动的变压器差动保护：变压器区内故障时TA饱和，二次电流中出现二次谐波，对差动保护制动，使差动保护拒动。措施：设差动电流速断保护，抢在TA饱和前动作;减小TA二次负载阻抗;采用二次额定电流为1A的TA。2）电流型母线差动保护：因饱和TA汲出差动回路电流，可能拒动。措施：用ΔU捕获故障时刻，若差动元件同时动作，表明TA饱和前判出内部故障，保护出口;若差动元件延迟动作，表明外部故障，TA饱和后差动元件动作，保护不出口。3）馈线电流保护：TA饱和二次电流变小，可能拒动。措施：减小TA二次负载阻抗;采用二次额定电流为1A的TA;采用一次额定电流大的TA;无法实现时由上一级保护动作切除故障。","explanation":"①二次谐波制动的变压器差动：区内故障 TA 饱和产生二次谐波制动致拒动——设差动速断抢在饱和前动作、减小 TA 二次负载、采用 1 A 额定 TA。②电流型母差：饱和 TA 汲出差流致拒动——用 ΔU 捕获故障时刻，饱和前判内部故障即出口。③馈线电流保护：TA 饱和二次电流变小致拒动——减小二次负载、用 1 A TA、用大一次额定电流 TA，无法实现时由上一级保护切除。","bank":"电气基础"},{"id":"fe87a91921ca","type":"fill","category":"电气基础","stem":"微机保护启动元件有什么作用？有哪些常用的启动元件？","options":{},"answer":"1）作用：早期启动后才进入故障计算模块，节约计算能力;提高保护可靠性（启动元件与测量元件均动作才出口）;查找故障时标;2）常用启动元件：相电流启动元件、相电流突变量及相电流差突变量启动元件、零序电流启动元件、负序电流启动元件、差电流启动元件（稳态差流、工频变化量差流）、电压工频变化量启动元件等","explanation":"启动元件作用：①早期启动后才进入故障计算模块，节约算力；②与测量元件均动作才出口，提高可靠性；③记录故障时刻便于查找。常用启动元件：相电流、相电流突变量及相电流差突变量、零序电流、负序电流、差电流（稳态差流/工频变化量差流）、电压工频变化量启动等。","bank":"电气基础"},{"id":"04df445da6a9","type":"fill","category":"电气基础","stem":"开关量输出电路的作用是什么？开关量输入回路的作用是什么？简述微机保护中光电耦合器的作用","options":{},"answer":"1）开关量输出电路：将动作信号、命令等转换为触点量输出;2）开关量输入回路：将信号、触点等信息转换为保护可接受的数字量;3）光电耦合器作用：实现开关量信号隔离，使输入与输出电气上完全隔离（尤其地电位隔离），有效抑制共模干扰","explanation":"开关量输出电路：将保护动作信号/命令转换为触点量输出（跳闸、信号、遥控）。开关量输入回路：将外部信号/触点转换为保护可接受的数字量。光电耦合器作用：实现开关量信号电气隔离（尤其地电位隔离），使输入与输出电气上完全隔离，有效抑制共模干扰。","bank":"电气基础"},{"id":"d1aecd86a0f4","type":"fill","category":"电气基础","stem":"微机型保护硬件系统通常包括哪几个部分？","options":{},"answer":"1）数据采集单元（模拟量输入系统）;2）数据处理单元（微机主系统）;3）输入/输出接口（开关量输入输出系统）;4）通信接口;5）电源","explanation":"微机型保护硬件系统通常包括：①数据采集单元（模拟量输入系统）；②数据处理单元（微机主系统）；③输入/输出接口（开关量输入输出系统）；④通信接口；⑤电源（逆变电源，提供稳定隔离直流）。与 113 题相比，此版本将电源单独列出为五部分。","bank":"电气基础"},{"id":"0f2c24e8d4d3","type":"multiple","category":"电气基础","stem":"导致过电流保护灵敏度不足的可能原因（）","options":{"A":"系统最小运行方式","B":"长线路末端故障","C":"高过渡电阻短路","D":"保护定值过高"},"answer":"ABCD","explanation":"A.系统最小运行方式——正确，最小方式下短路电流最小，灵敏度最低。B.长线路末端故障——正确，末端短路电流小。C.高过渡电阻短路——正确，过渡电阻限制短路电流。D.保护定值过高——正确，定值大将降低灵敏度。故ABCD全选。","bank":"电气基础"},{"id":"cd48e1fed6b3","type":"multiple","category":"电气基础","stem":"（）保护各支路的电流互感器，应优先选用准确限值系数和额定拐点电压较高的电流互感器","options":{"A":"母线差动","B":"变压器差动","C":"发电机变压器组差动","D":"线路差动"},"answer":"ABC","explanation":"A.母线差动——正确，母线故障电流大、区外故障TA易深度饱和，宜用高准确限值系数与拐点电压CT。B.变压器差动——正确，差流不平衡大、饱和严重。C.发电机变压器组差动——正确，故障电流大、饱和严重。D.线路差动——错误，线路光纤差动对CT饱和要求相对较低，不在本条优先之列。故选ABC。","bank":"电气基础"},{"id":"6812dcdba87d","type":"multiple","category":"电气基础","stem":"保护用控制电缆敷设路径，宜避开高压母线及高频暂态电流的入地点，如()等设备","options":{"A":"避雷器和避雷针的接地点","B":"并联电容器","C":"电容式电压互感器","D":"结合电容及电容式套管"},"answer":"ABCD","explanation":"A.避雷器和避雷针接地点——正确，是高频暂态电流入地点。B.并联电容器——正确，投切产生高频暂态。C.电容式电压互感器——正确，是暂态入地点。D.结合电容及电容式套管——正确，亦是高频暂态源。故ABCD全选。","bank":"电气基础"},{"id":"55dc570ef214","type":"multiple","category":"电气基础","stem":"装有串联补偿电容的线路及其相邻线路，应考虑下述()特点对线路保护的影响。","options":{"A":"故障电流、电压反向","B":"串联电容保护间隙击穿","C":"电压互感器装设位置(在电容器的母线侧或线路侧)","D":"串联补偿电容的安装位置","E":"补偿度的大小"},"answer":"ABCDE","explanation":"A.故障电流、电压反向——正确，串补使电气量相位反转。B.串联电容保护间隙击穿——正确，影响保护测量。C.电压互感器装设位置——正确，母线侧/线路侧影响电压量。D.串联补偿电容安装位置——正确，影响故障特征。E.补偿度大小——正确，补偿度改变线路参数。故ABCDE全选。","bank":"电气基础"},{"id":"70ffca8e9df0","type":"multiple","category":"电气基础","stem":"根据《变压器、高压并联电抗器和母线保护及辅助装置标准化设计规范》,母线、变压器保护的主要直跳回路包括()。","options":{"A":"3/2接线的边断路器失灵后通过母线保护出口回路跳闸的开入","B":"双母接线的母线故障变压器断路器失灵，通过变压器保护跳其他电源侧的开入","C":"变压器非电量保护的直跳开入","D":"3/2接线的边断路器失灵后通过变压器保护出口回路跳其他电源侧的开入"},"answer":"ABCD","explanation":"A.3/2接线边断路器失灵后经母差出口跳闸开入——正确。B.双母接线母线故障变压器断路器失灵经变压器保护跳其他电源侧开入——正确。C.变压器非电量保护直跳开入——正确。D.3/2接线边断路器失灵后经变压器保护出口跳其他电源侧开入——正确。故ABCD全选。","bank":"电气基础"},{"id":"1eb496ffb02c","type":"multiple","category":"电气基础","stem":"通信机房与保护小室分开设置，线路纵差保护用光电转换接口柜在通信机房安装，按照《国家电网有限公司十八项电网重大反事故措施(2018年修订版)》,以下说法正确的是()。","options":{"A":"光电转换接口柜和光通信设备(数字配线架)的接地铜排应与2M同轴电缆的屏蔽层可靠相连","B":"沿2M同轴电缆敷设截面积不小于100mm²的铜电缆","C":"光电转换接口柜和光通信设备的接地铜排应同点与主地网相连","D":"为保证传输信号的可靠性，2M同轴电缆不应接"},"answer":"ABC","explanation":"A.光电转换接口柜和光通信设备接地铜排与2M同轴电缆屏蔽层可靠相连——正确，保障等电位。B.沿2M同轴电缆敷设截面积不小于100mm²铜电缆——正确，反措规定。C.光电转换接口柜和光通信设备接地铜排同点与主地网相连——正确，单点可靠接地。D.2M同轴电缆不应接——错误，屏蔽层应可靠接地。故选ABC。","bank":"电气基础"},{"id":"4cef99244f4f","type":"multiple","category":"电气基础","stem":"某110kV变电站，站内所有保护采用A制造商的产品，按照反措要求，以下说法正确的是()。","options":{"A":"该站应配置故障录波器","B":"该站不应配置A制造商的故障录器","C":"该站可配置B制造商的故障录波器","D":"该站按需配置任意制造商的经国家电网专业检测合格的故障录波器"},"answer":"ABC","explanation":"A.该站应配置故障录波器——正确，重要变电站应配录波器。B.该站不应配置A制造商故障录波器——正确，反措要求录波器宜与保护不同厂家以防共因失效。C.该站可配置B制造商故障录波器——正确。D.可配置任意制造商经检测合格的录波器——错误，反措要求录波器应与主保护不同厂家。故选ABC。","bank":"电气基础"},{"id":"8eacd5f28764","type":"multiple","category":"电气基础","stem":"反措要求，长电缆驱动的重瓦斯出口中间继电器的特性应满足(),其中Ue为额定直流电源电压。","options":{"A":"动作电压在50%～70%Ue之间","B":"动作时间在10～35ms","C":"启动功率≥5W","D":"动作电压在55%～70%Ue之间","E":"动作功率≥2.5W","F":"返回电压≥40%Ue","G":"返回电压≥35%Ue"},"answer":"BCD","explanation":"A.动作电压50%～70%Ue——错误，与反措不符。B.动作时间10～35ms——正确。C.启动功率≥5W——正确，大启动功率防长电缆分布电容误动。D.动作电压55%～70%Ue——正确，反措规定。E.动作功率≥2.5W——错误，应为≥5W。故选BCD。","bank":"电气基础"},{"id":"2801e061d43a","type":"multiple","category":"电气基础","stem":"对于按照双重化原则配置保护的变电站，直流电源的分配也必须与双重化得原则相适应，下列说法正确的有()。","options":{"A":"断路器的控制回路电源与保护的工作电源必须取自不同的直流熔断器(或空气开关)","B":"双重化配置的保护装置，其工作电源应取自不同的直流母线段，相应的电压切换装置取自断路器控制电源","C":"如断路器具备两组跳闸线圈，每一组跳闸线圈的操作电源也应取自不同的直流母线段","D":"当一套保护装置需作用于多个断路器时，每个断路器的跳闸线圈必须由各自的直流熔断器(或空气开关)提供操作电源","E":"须保证保护装置的工作电源与其所作用的断路器跳闸线圈工作电源均取自同一组直流电源，绝不允许交叉，以防止失去一组直流电源时保护或断路器拒动"},"answer":"ACDE","explanation":"A.断路器控制回路电源与保护工作电源取不同熔断器——正确，避免相互影响。B.双重化保护工作电源取不同母线段、电压切换取断路器控制电源——错误，电压切换装置电源应与对应保护电源一致，而非取断路器控制电源。C.具备两组跳闸线圈时每组操作电源取不同母线段——正确。D.一套保护作用于多断路器时每断路器跳闸线圈由各自熔断器供电——正确。E.保护电源与所作用跳闸线圈电源同组、绝不交叉——正确。故选ACDE。","bank":"电气基础"},{"id":"40a633005cb0","type":"multiple","category":"电气基础","stem":"微机保护中采用的全周积分算法，正确的是()。","options":{"A":"有滤去高次谐波电流的作用，并且随采样点数的增大滤波作用也增大","B":"有一定抑制非周期分量的作用，但作用并不十分明显","C":"计算出的电压或电流值随采样频率的增高，幅度也相对增大"},"answer":"AC","explanation":"A.有滤去高次谐波的作用且随采样点数增大滤波作用增大——正确，全周积分（傅氏）对整数次谐波有良好的滤波效果。B.有一定抑制非周期分量的作用但不明显——错误，该算法不能有效滤除非周期分量，不应视为有效抑制。C.计算值随采样频率增高幅度相对增大——正确，未归一化的积分和随采样点数（频率）增加而增大。D为空选项。故选AC。","bank":"电气基础"},{"id":"d930f00f73d1","type":"multiple","category":"电气基础","stem":"微机保护中通常用来保存定值信息的存储器是()。","options":{"A":"FLASHROM","B":"EPROM","C":"E²PROM","D":"SRAMAC"},"answer":"AC","explanation":"A.FLASHROM——正确，可电擦写、断电保存，常用于定值存储。B.EPROM——错误，需紫外擦除、不便在线改写，一般不用于在线定值。C.E²PROM——正确，电可擦写，常用于保存定值。D.SRAMAC——错误，SRAM为易失存储器，掉电丢失，不能保存定值。故选AC。","bank":"电气基础"},{"id":"43e75d646550","type":"multiple","category":"电气基础","stem":"提高断路器失灵保护可靠性的常用措施有()。","options":{"A":"不使用非全相启动触点","B":"电流判别元件的动作时间和返回时间均应小于20ms","C":"直跳回路增加大功率启动继电器","D":"对于双母线接线，断路器失灵保护复合电压闭锁元件有1s的延时返回时间"},"answer":"ABCD","explanation":"A.不使用非全相启动触点——正确，避免误启动。B.电流判别元件动作和返回时间均小于20ms——正确，保证快速可靠。C.直跳回路增加大功率启动继电器——正确，抗干扰防误动。D.双母线接线失灵保护复合电压闭锁元件有1s延时返回——正确，防误动。故ABCD全选。","bank":"电气基础"},{"id":"a69be7e18694","type":"multiple","category":"电气基础","stem":"()保护应适应常规互感器和电子式互感器混合使用的情况","options":{"A":"变压器中性点零序过流保护","B":"线路纵联保护","C":"母线差动保护","D":"变压器差动保护"},"answer":"BCD","explanation":"A.变压器中性点零序过流保护——错误，该保护不依赖采样合并，不在本条适应范围内。B.线路纵联保护——正确，应适应混合互感器。C.母线差动保护——正确。D.变压器差动保护——正确。故选BCD。","bank":"电气基础"},{"id":"030694392531","type":"multiple","category":"电气基础","stem":"下列()可以启动断路器失灵保护。","options":{"A":"光纤差动保护","B":"变压器非电量保护","C":"变压器过负荷保护","D":"线路距离三段保护"},"answer":"AD","explanation":"A.光纤差动保护——正确，可启动失灵。B.变压器非电量保护——错误，非电量保护不应启动失灵保护。C.变压器过负荷保护——错误，过负荷不启动失灵。D.线路距离三段保护——正确，可作为启动失灵的保护。故选AD。","bank":"电气基础"},{"id":"3705fdf135ca","type":"multiple","category":"电气基础","stem":"对分相断路器，保护单相出口动作时，()情况应一致，其他两相不应动作。","options":{"A":"保护选相","B":"出口压板","C":"操作箱指示","D":"断路器实际动作情况"},"answer":"ABCD","explanation":"A.保护选相——正确，单相故障时选相应一致。B.出口压板——正确。C.操作箱指示——正确。D.断路器实际动作情况——正确，其他两相不应动作。故ABCD全选。","bank":"电气基础"},{"id":"41678394b063","type":"multiple","category":"电气基础","stem":"远方跳闸保护的就地判据一般采用","options":{"A":"零序电流","B":"负序电流","C":"电流变化量","D":"低电流"},"answer":"ABCD","explanation":"A.零序电流——正确，常用就地判据。B.负序电流——正确。C.电流变化量——正确。D.低电流——正确，低电流（功率倒向、线路空载等）也可作判据。故ABCD全选。","bank":"电气基础"},{"id":"0b32c06e51e5","type":"multiple","category":"电气基础","stem":"光纤纵联保护中远方跳闸的作用是","options":{"A":"当本侧断路器和电流互感器之间故障，母差保护正确跳开本侧断路器，但故障并未切除，此时依靠远方跳闸回路，使对侧断路器加速跳闸","B":"当母线故障，母差保护正确动作，但本侧断路器失灵拒动，依靠远方跳闸回路，使对侧断路器加速跳闸","C":"当线路故障，线路保护依靠远方跳闸回路，使对侧断路器加速跳闸","D":"当线路故障，线路保护拒动时依靠远方跳闸回路，使对侧断路器跳闸以切除故障"},"answer":"AB","explanation":"A.本侧断路器与CT间故障、母差跳开本侧但故障未切除，靠远方跳闸使对侧加速跳闸——正确，即断路器与CT间死区。B.母线故障母差动作但本侧断路器失灵拒动，靠远方跳闸使对侧加速跳闸——正确。C.线路故障靠远方跳闸使对侧加速跳闸——错误，线路故障由纵联保护自身处理。D.线路故障保护拒动靠远方跳闸切除——错误。故选AB。","bank":"电气基础"},{"id":"e4d325992e9e","type":"multiple","category":"电气基础","stem":"随着保护及断路器动作速度提升以及直流换相失败所带来的快速功率倒向问题，采用纵联方向的线路保护可能发生功率倒向误动作，有效防范措施包括","options":{"A":"反方向元件动作速度快于正方向元件","B":"反方向元件动作速度慢于正方向元件","C":"退出快速工频变化量阻抗保护","D":"延长功率倒向判别时间"},"answer":"AC","explanation":"A.反方向元件动作速度快于正方向元件——正确，倒向瞬间先判反方向可闭锁防误动。B.反方向元件慢于正方向元件——错误。C.退出快速工频变化量阻抗保护——正确，该保护在功率倒向时易误动。D.延长功率倒向判别时间——错误。故选AC。","bank":"电气基础"},{"id":"bfc30f0214db","type":"multiple","category":"电气基础","stem":"对于同杆并架双回线，为避免跨线异名相故障造成双回线跳闸，可采用()保护方式。","options":{"A":"分相电流差动保护","B":"分相跳闸逻辑的纵联保护","C":"高频距离、高频零序保护","D":"高频方向保护"},"answer":"AB","explanation":"A.分相电流差动保护——正确，能区分跨线故障。B.分相跳闸逻辑的纵联保护——正确，仅跳故障相避免双回线误跳。C.高频距离、高频零序保护——错误，跨线异名相故障时可能误跳双回线。D.高频方向保护——错误。故选AB。","bank":"电气基础"},{"id":"0ce2c88865fb","type":"multiple","category":"电气基础","stem":"提高母线保护可靠动作的措施有（）。","options":{"A":"各绕组差动TA二次回路只能有一个接地点","B":"定期检查差动TA二次回路电缆对地绝缘","C":"保证与其他保护之间的回路正确","D":"运行中中阻抗母差保护TA二次之间不能短接"},"answer":"ABCD","explanation":"A.各绕组差动TA二次回路只能有一个接地点——正确，防地环流。B.定期检查差动TA二次回路电缆对地绝缘——正确。C.保证与其他保护之间回路正确——正确。D.运行中中阻抗母差保护TA二次之间不能短接——正确，防误动。故ABCD全选。","bank":"电气基础"},{"id":"5fc156011508","type":"multiple","category":"电气基础","stem":"母线保护出现什么情况时，应立即退出（）。","options":{"A":"差动回路二次差电流告警时","B":"差回路出现TA断线信号时","C":"其它影响保护装置安全运行的情况发生时或母线保护不正常运行时","D":"PT断线时"},"answer":"ABC","explanation":"A.差动回路二次差电流告警时——正确，应立即退出。B.差回路出现TA断线信号时——正确。C.其他影响安全运行或母差不正常时——正确。D.PT断线时——错误，PT断线一般闭锁相关电压元件，不要求立即退出母差。故选ABC。","bank":"电气基础"},{"id":"fc8265fb477e","type":"multiple","category":"电气基础","stem":"母差保护在母线分裂运行时的跳闸出口的条件是（）。","options":{"A":"闭锁开放元件动作","B":"仅要大差差流达到动作值","C":"仅要小差差流达到动作值","D":"大差小差差流均达到动作值"},"answer":"AD","explanation":"A.闭锁开放元件动作——正确，分裂运行选择性条件。B.仅大差差流达到动作值——错误。C.仅小差差流达到动作值——错误。D.大差小差差流均达到动作值——正确，分裂运行时需大差、小差同时满足。故选AD。","bank":"电气基础"},{"id":"e00bfc9795
