61","type":"multiple","category":"电气基础","stem":"完全电流差动母线保护中差动继电器的动作电流按()条件计算。","options":{"A":"躲过外部短路最大短路电流","B":"躲过外部短路时最大不平衡电流","C":"躲过母线各连接元件负荷电流之和","D":"躲过母线各连接元件中最大负荷电流"},"answer":"BD","explanation":"A.躲过外部短路最大短路电流——错误。B.躲过外部短路时最大不平衡电流——正确，完全电流差动按躲区外最大不平衡电流整定。C.躲过各元件负荷电流之和——错误。D.躲过各连接元件中最大负荷电流——正确。故选BD。","bank":"电气基础"},{"id":"2164dd72aaa0","type":"multiple","category":"电气基础","stem":"母联电流相位比较式母线保护，在（）情况下不能正确动作。","options":{"A":"母联断路器断开","B":"在母联断路器和母联电流互感器之间发生短路","C":"母线短路"},"answer":"AB","explanation":"A.母联断路器断开——正确（属不能正确动作的情况），母联断开则无母联电流，相位比较失效。B.母联断路器与母联CT之间短路——正确，属死区，相位比较式不能正确动作。C.母线短路——错误，母线故障时该保护能正确动作。故选AB。","bank":"电气基础"},{"id":"a0e889c55af8","type":"multiple","category":"电气基础","stem":"（）应启动母联（分段）失灵保护。","options":{"A":"母差保护","B":"主变保护","C":"线路保护","D":"独立于母线保护的母联（分段）充电过流保护"},"answer":"AD","explanation":"A.母差保护——正确，可启动母联（分段）失灵。B.主变保护——错误，主变保护一般启动失灵保护而非母联失灵。C.线路保护——错误。D.独立于母线保护的母联（分段）充电过流保护——正确。故选AD。","bank":"电气基础"},{"id":"a7bc1cad5813","type":"multiple","category":"电气基础","stem":"母联开关位置接点接入母差保护，作用是（）。","options":{"A":"母联开关合于母线故障问题","B":"母差保护死区问题","C":"母线分裂运行时的选择性问题","D":"母线并联运行时的选择性问题"},"answer":"ABCD","explanation":"A.母联合于母线故障问题——正确。B.母差保护死区问题——正确。C.母线分裂运行时的选择性问题——正确。D.母线并联运行时的选择性问题——正确。故ABCD全选。","bank":"电气基础"},{"id":"278580bc6e25","type":"multiple","category":"电气基础","stem":"母联失灵保护可由（）启动，也可由外部保护启动。","options":{"A":"充电保护","B":"过流保护","C":"失灵保护","D":"差动保护"},"answer":"ABCD","explanation":"A.充电保护——正确，可启动母联失灵。B.过流保护——正确。C.失灵保护——正确。D.差动保护——正确，母差动作可启动母联失灵。故ABCD全选。","bank":"电气基础"},{"id":"2c8074c4a2ea","type":"multiple","category":"电气基础","stem":"下列（）情况下，应装设专用母线保护。","options":{"A":"110kV单母线，重要发电厂或110kV以上重要变电所的35～66kV母线，按ll0kV线路和220kV线路要求：ll0kV线路采用远后备方式、220kV线路采用近后备方式，需要快速切除母线上的故障时","B":"对220～500kV母线，应装设能快速有选择地切除故障的母线保护。对1个半断路器接线，每组母线宜装设两套母线保护","C":"须快速而有选择地切除一段或一组母线上的故障，以保证发电厂及电力网安全运行和重要负荷的可靠供电时","D":"当线路断路器不允许切除线路电抗器前的短路时"},"answer":"ABCD","explanation":"A.110kV单母线等重要母线需快速切除故障时——正确。B.220～500kV母线应装快速有选择切除故障的保护，1个半断路器每组母线宜装两套——正确。C.须快速有选择切除一段或一组母线故障时——正确。D.线路断路器不允许切除线路电抗器前短路时——正确。故ABCD全选。","bank":"电气基础"},{"id":"236f5e2cf7ec","type":"multiple","category":"电气基础","stem":"关于双母线接线的的断路器失灵保护的技术原则说法正确的是（）。","options":{"A":"失灵保护应与母差保护共用出口回路","B":"含母线故障变压器断路器失灵保护功能","C":"“启动失灵”、“解除失灵保护电压闭锁”开入异常时应告警","D":"为缩短失灵保护切除故障的时间，失灵保护宜同时跳母联（分段），延时跳其他断路器"},"answer":"ABC","explanation":"A.失灵保护应与母差保护共用出口回路——正确（标准化设计中失灵在母差装置内实现）。B.含母线故障变压器断路器失灵保护功能——正确。C.'启动失灵''解除失灵保护电压闭锁'开入异常应告警——正确。D.为缩短切除故障时间失灵保护宜同时跳母联（分段）、延时跳其他断路器——按答案不选；注：该说法本身符合'先跳母联、延时跳其余'的通用原则，疑应一并选入，建议核对原题。故选ABC。","bank":"电气基础"},{"id":"fa3ff3606337","type":"multiple","category":"电气基础","stem":"在双母线接线形式的变电站中，母差保护和失灵保护要采用电压闭锁元件的目的是（）。","options":{"A":"防止区外发生故障时，母线差动保护误动","B":"防止由于人员误碰造成母差或失灵保护误动出口，跳开多个元件","C":"防止母差或失灵保护元件损坏误动","D":"防止母差或失灵保护元件收到外部干扰误动"},"answer":"BCD","explanation":"A.防止区外发生故障时母差误动——按答案不选；注：区外故障时母线电压不降低，电压闭锁确能防止母差误动，该说法有一定正确性，建议核对原题。B.防止人员误碰造成误动跳多个元件——正确，主要目的之一。C.防止元件损坏误动——正确。D.防止外部干扰误动——正确。故选BCD。","bank":"电气基础"},{"id":"845e4df8e4df","type":"multiple","category":"电气基础","stem":"风电汇集变电站，母线保护应具有以下（）功能。","options":{"A":"差动保护","B":"TA断线判别","C":"抗TA饱和","D":"TV断线闭锁"},"answer":"ABCD","explanation":"A.差动保护——正确，母线保护主保护。B.TA断线判别——正确，应具备。C.抗TA饱和——正确，风电短路电流含直流分量大，需抗饱和。D.TV断线闭锁——正确，电压异常时应闭锁相关元件。故ABCD全选。","bank":"电气基础"},{"id":"5a4c01fdb19e","type":"multiple","category":"电气基础","stem":"母线保护技术原则（）。","options":{"A":"母联（分段）失灵保护、母联（分段）死区保护均不应经电压闭锁元件控制","B":"母联（分段）失灵保护、母联（分段）死区保护均应经电压闭锁元件控制","C":"母联（分段）死区保护确认母联跳闸位置的延时为150ms","D":"3/2断路器接线的母线保护应设置灵敏的、不需整定的电流元件并带50ms的固定延时，以提高边断路器失灵保护动作后经母线保护跳闸的可靠性"},"answer":"BCD","explanation":"A.母联（分段）失灵、死区保护不应经电压闭锁——错误。B.母联（分段）失灵、死区保护均应经电压闭锁——正确。C.死区保护确认母联跳闸位置延时150ms——正确。D.3/2接线母线保护设灵敏不需整定电流元件带50ms固定延时——正确。故选BCD。","bank":"电气基础"},{"id":"78cafe08dd75","type":"multiple","category":"电气基础","stem":"通常情况下，只有（）才起动母联失灵保护。","options":{"A":"母差保护","B":"母联充电保护","C":"死区保护","D":"过流保护"},"answer":"AB","explanation":"A.母差保护——正确，可启动母联失灵。B.母联充电保护——正确。C.死区保护——错误，不属常规启动母联失灵的源。D.过流保护——错误。故选AB。","bank":"电气基础"},{"id":"d417d8fce36a","type":"multiple","category":"电气基础","stem":"母差保护复合电压闭锁元件由（）组成。","options":{"A":"相低电压元件","B":"负序电压元件","C":"零序过电压元件","D":"TA饱和检测元件"},"answer":"ABCD","explanation":"A.相低电压元件——正确，复合电压闭锁组成之一。B.负序电压元件——正确。C.零序过电压元件——正确。D.TA饱和检测元件——按答案列入；注：严格讲复合电压闭锁由低电压、负序电压、零序过电压组成，TA饱和检测属差动辅助判据而非电压闭锁元件，建议核对原题。故选ABCD。","bank":"电气基础"},{"id":"e7be22bab182","type":"multiple","category":"电气基础","stem":"针对单侧电源双绕组变压器和三绕组变压器的相间短路后备保护，说法正确的是（）。","options":{"A":"相间短路后备保护宜装于各侧","B":"非电源侧保护带两段或三段时限，用第一时限断开本侧母联或分段断路器，缩小故障影响范围","C":"非电源侧保护用第二时限断开各侧断路器","D":"电源侧保护带一段时限，断开变压器各侧断路器"},"answer":"ABD","explanation":"A.相间短路后备保护宜装于各侧——正确。B.非电源侧带两段或三段时限，第一时限断开本侧母联或分段——正确。C.非电源侧用第二时限断开各侧断路器——错误，第二时限仅断开本侧，各侧断开由电源侧保护完成。D.电源侧带一段时限断开各侧断路器——正确。故选ABD。","bank":"电气基础"},{"id":"aee2d4715816","type":"multiple","category":"电气基础","stem":"“六统一”常规站变压器保护纵差差动速断无效判别条件是（）。","options":{"A":"主保护功能压板退出","B":"纵差差动保护控制字不投","C":"差动速断控制字不投","D":"装置故障"},"answer":"ABCD","explanation":"A.主保护功能压板退出——正确，差动速断随之无效。B.纵差差动保护控制字不投——正确。C.差动速断控制字不投——正确。D.装置故障——正确，装置异常时该功能退出。故ABCD全选。","bank":"电气基础"},{"id":"eedf69c6bdc6","type":"multiple","category":"电气基础","stem":"大型变压器过励磁时，变压器差动回路电流发生变化，下列说法正确的是（）。","options":{"A":"差动电流随过励磁程度的增大而非线性增大","B":"差动电流中没有非周期分量及偶次谐波","C":"差动电流中含有高次谐波，其中3次谐波较大","D":"5次谐波与基波的比值随着过励磁程度的增加而增大"},"answer":"ABD","explanation":"A.差动电流随过励磁程度增大而非线性增大——正确。B.差动电流中没有非周期分量及偶次谐波——正确，过励磁为对称波形，含奇次谐波、无偶次及非周期。C.含高次谐波其中3次谐波较大——错误，过励磁以5次谐波突出，非3次。D.5次谐波与基波比值随过励磁增加而增大——正确。故选ABD。","bank":"电气基础"},{"id":"74da01acf9b6","type":"multiple","category":"电气基础","stem":"某超高压降压变压器装设了过励磁保护，引起变压器过励磁的可能原因是（）。","options":{"A":"变压器低压侧外部短路故障切除时间过长","B":"变压器低压侧发生单相接地故障非故障相电压升高","C":"超高压电网电压升高","D":"超高压电网有功功率不足引起电网频率降低","E":"超高压电网电压升高，频率降低"},"answer":"CDE","explanation":"A.低压侧外部短路切除时间过长——错误，外部短路使电压降低，不会引起过励磁。B.低压侧单相接地非故障相电压升高——错误，接地故障一般不致过励磁。C.超高压电网电压升高——正确，U升高使U/f增大。D.超高压电网有功不足频率降低——正确，f降低使U/f增大。E.电压升高频率降低——正确。故选CDE。","bank":"电气基础"},{"id":"4d4c9566a458","type":"multiple","category":"电气基础","stem":"变压器过励磁保护主要为了防止（）导致的变压器铁芯饱和。","options":{"A":"电压降低","B":"电压升高","C":"频率降低","D":"频率升高"},"answer":"BC","explanation":"A.电压降低——错误，电压降低减轻铁芯饱和。B.电压升高——正确。C.频率降低——正确。D.频率升高——错误。过励磁由U/f增大引起。故选BC。","bank":"电气基础"},{"id":"d66385b652e1","type":"multiple","category":"电气基础","stem":"以下关于变压器保护说法正确的是（）。","options":{"A":"由自耦变压器高、中压及公共绕组三侧电流构成的差动保护无需采用防止励磁涌流的专门措施","B":"自耦变压器的零序电流保护接在变压器中性点套管TA上，设方向元件","C":"大容量的变压器，由于系统电压升高或频率降低，容易引起铁芯饱和，应装设过励磁保护","D":"变压器高中压侧的距离保护，通过各自的偏移部分对各自的母线起到后备保护的作用"},"answer":"ACD","explanation":"A.自耦变压器高、中压及公共绕组三侧电流构成差动无需专门防励磁涌流措施——正确，三侧电流均含涌流分量，差流中涌流相互抵消，无需特殊措施。B.自耦变压器零序电流保护接中性点套管TA设方向元件——错误，自耦变压器公共绕组零序电流不流经中性点，中性点TA不能正确反映，零序保护不能简单接中性点套管TA。C.大容量变压器电压升高或频率降低应装过励磁保护——正确。D.高中压侧距离保护通过偏移部分对各自母线起后备——正确。故选ACD。","bank":"电气基础"},{"id":"bdbef12351bb","type":"multiple","category":"电气基础","stem":"瓦斯保护的反事故措施要求是（）。","options":{"A":"将气体继电器的下浮筒改为挡板式，触点改为立式，以提高重瓦斯动作的可靠性","B":"为防止气体继电器因漏水短路，应在其端子和电缆引线端子箱上采取防雨措施","C":"触点采用两动合触点串联方式，以提高重瓦斯动作的可靠性","D":"气体继电器的引出线和电缆线应分别连接在电缆引线端子箱内的端子上"},"answer":"ABD","explanation":"A.下浮筒改挡板式、触点改立式提高重瓦斯可靠性——正确，反措要求。B.气体继电器端子及电缆引线端子箱采取防雨措施——正确，防漏水短路。C.触点采用两动合触点串联——错误，串联会降低可靠性（任一触点断开即不动作），应采用独立双触点而非串联。D.引出线与电缆线分别接端子箱端子——正确。故选ABD。","bank":"电气基础"},{"id":"8508b26f3683","type":"multiple","category":"电气基础","stem":"下列关于变压器差动速断保护描述，正确的有（）。","options":{"A":"是变压器纵差保护的辅助保护","B":"延时可整定，方便用户选择","C":"只反应差流的有效值，不受差流中的谐波及波形畸变的影响","D":"可选择是否经谐波制动"},"answer":"AC","explanation":"A.是纵差保护的辅助保护——正确。B.延时可整定——错误，差动速断为无延时瞬时动作。C.只反应差流有效值、不受谐波及波形畸变影响——正确。D.可选择是否经谐波制动——错误，差动速断不经谐波制动。故选AC。","bank":"电气基础"},{"id":"9abd22b76fc5","type":"multiple","category":"电气基础","stem":"纵差保护的电流取自变压器的（）。","options":{"A":"高压侧TA","B":"中压侧TA","C":"低压侧绕组TA","D":"低压侧外附TA"},"answer":"ABD","explanation":"A.高压侧TA——正确，差动用各侧TA。B.中压侧TA——正确。C.低压侧绕组TA——错误，角接绕组内部TA不接入差动回路。D.低压侧外附TA——正确，低压侧差流取外附TA。故选ABD。","bank":"电气基础"},{"id":"59413ebbee12","type":"multiple","category":"电气基础","stem":"变压器空载合闸或外部短路故障切除电压突然恢复时，会出现励磁涌流，对于YNd11接线变压器，差动回路的涌流特点是（）。","options":{"A":"涌流幅值大并不断衰减","B":"三相涌流中含有明显的非周期分量并不断衰减","C":"涌流中含有明显的3次谐波和其他奇次谐波","D":"涌流中含有明显的2次谐波和其他偶次谐波"},"answer":"AD","explanation":"A.涌流幅值大并不断衰减——正确。B.三相涌流含明显非周期分量并衰减——错误（不是该接线励磁涌流的典型特征表述）。C.含明显3次谐波和其他奇次谐波——错误。D.含明显2次谐波和其他偶次谐波——正确，2次谐波是励磁涌流典型特征。故选AD。","bank":"电气基础"},{"id":"0974da905a60","type":"multiple","category":"电气基础","stem":"以下哪种保护不会受到励磁涌流的影响（）。","options":{"A":"变压器分侧差动保护","B":"变压器比率差动保护","C":"变压器零序差动保护","D":"变压器过励磁保护"},"answer":"ACD","explanation":"A.变压器分侧差动保护——正确，分相差动无励磁涌流问题。B.比率差动保护——错误，受励磁涌流影响需谐波制动。C.零序差动保护——正确，不受励磁涌流影响。D.过励磁保护——正确，非差动保护不受影响。故选ACD。","bank":"电气基础"},{"id":"e738b77daa7f","type":"multiple","category":"电气基础","stem":"变压器相间短路的后备保护可采用()。","options":{"A":"过电流保护","B":"低电压起动的过电流保护","C":"复合电压起动的过电流保护","D":"过电流起动的电压保护"},"answer":"ABC","explanation":"A.过电流保护——正确。B.低电压起动的过电流保护——正确。C.复合电压起动的过电流保护——正确。D.过电流起动的电压保护——错误，无此标准名称。故选ABC。","bank":"电气基础"},{"id":"1cf0221b31dd","type":"multiple","category":"电气基础","stem":"对于线路保护分相跳闸开入和变压器、发变组、线路高抗三相跳闸开入，应采取()措施，防止由于开关量输入异常导致失灵保护误启动。","options":{"A":"分相跳闸触点开入后，经电流突变量或零序电流启动并展宽后启动失灵","B":"分相跳闸触点开入后，不经电流突变量或零序电流启动并展宽后启动失灵","C":"三相跳闸触点开入后，不经电流突变量或零序电流启动失灵","D":"三相跳闸触点开入后，经电流突变量或零序电流启动失灵"},"answer":"AC","explanation":"A.分相跳闸触点开入后经电流突变量或零序电流启动并展宽后启动失灵——正确，防开关量异常误启动。B.分相跳闸不经启动展宽——错误。C.三相跳闸触点开入后不经电流突变量或零序电流启动失灵——正确，三相跳闸（如母差、主变）来源可靠可不经过电流判据。D.三相跳闸经启动——错误。故选AC。","bank":"电气基础"},{"id":"759d782c7214","type":"multiple","category":"电气基础","stem":"双A/D采样的保护一般采取()方法保证采样的正确性、可靠性。","options":{"A":"一路用于保护启动，一路用于保护动作","B":"重采样","C":"两路数据对比","D":"插值法"},"answer":"AC","explanation":"A.一路用于保护启动、一路用于保护动作——正确，双AD常见分工。B.重采样——错误。C.两路数据对比——正确，校验一致性。D.插值法——错误。故选AC。","bank":"电气基础"},{"id":"8de3d864efcf","type":"multiple","category":"电气基础","stem":"对阶段式电流保护，以下说法正确的是()。","options":{"A":"速断是按照躲开本线路末端的最大短路电流来整定","B":"限时速断是按照躲开下级各相邻线路电流速断保护的最大动作范围来整定","C":"过电流保护按照躲开本元件最大负荷电流来整定","D":"阶段式电流保护是反应电流升高而动作的保护"},"answer":"ABCD","explanation":"A.速断按躲本线路末端最大短路电流整定——正确。B.限时速断按躲下级线路速断最大动作范围整定——正确。C.过电流按躲本元件最大负荷电流整定——正确。D.阶段式电流保护反应电流升高动作——正确。故ABCD全选。","bank":"电气基础"},{"id":"24222306df31","type":"multiple","category":"电气基础","stem":"为保证在转换性故障和保护纵续动作（对侧先跳闸）时的正确性，可采用()。","options":{"A":"增加故障前电流的记忆时间","B":"最大相制动延时返回","C":"第二次选相，电流需接近第一次选出故障相电流","D":"选出两相故障，固定不再选相"},"answer":"ABCD","explanation":"A.增加故障前电流记忆时间——正确。B.最大相制动延时返回——正确。C.第二次选相电流需接近第一次选出故障相电流——正确。D.选出两相故障固定不再选相——正确。故ABCD全选。","bank":"电气基础"},{"id":"fb2d94e48249","type":"multiple","category":"电气基础","stem":"电气化铁路牵引站、大型钢厂等供电线路的保护应具备防止（）导致保护不正确动作的措施。","options":{"A":"不对称分量","B":"电压跌落","C":"谐波分量","D":"冲击负荷"},"answer":"ACD","explanation":"A.不对称分量——正确，牵引站等产生负序等不对称分量。B.电压跌落——错误，不是主要需防的引起不正确动作因素。C.谐波分量——正确。D.冲击负荷——正确。故选ACD。","bank":"电气基础"},{"id":"0b82c2e97aac","type":"multiple","category":"电气基础","stem":"保护电流采样无效对光差线路保护的影响有()。","options":{"A":"闭锁距离保护","B":"闭锁差动保护","C":"闭锁零序电流保护","D":"闭锁TV断线过流"},"answer":"ABCD","explanation":"A.闭锁距离保护——正确，电流采样无效时闭锁。B.闭锁差动保护——正确。C.闭锁零序电流保护——正确。D.闭锁TV断线过流——正确，相关保护均被闭锁。故ABCD全选。","bank":"电气基础"},{"id":"e35b459bf795","type":"multiple","category":"电气基础","stem":"纵联方向保护中方向元件主要有()。","options":{"A":"零序功率方向元件","B":"负序功率方向元件","C":"能量积分方向元件","D":"突变量方向元件"},"answer":"ABCD","explanation":"A.零序功率方向元件——正确。B.负序功率方向元件——正确。C.能量积分方向元件——正确。D.突变量方向元件——正确。故ABCD全选。","bank":"电气基础"},{"id":"eef3fc2a40d9","type":"multiple","category":"电气基础","stem":"纵联保护的信号有()。","options":{"A":"闭锁信号","B":"允许信号","C":"跳闸信号","D":"微波信号"},"answer":"ABC","explanation":"A.闭锁信号——正确，纵联保护三类信号之一。B.允许信号——正确。C.跳闸信号——正确。D.微波信号——错误，微波是通道方式而非信号类型。故选ABC。","bank":"电气基础"},{"id":"752849df981d","type":"multiple","category":"电气基础","stem":"可作为输电线路全线速动保护的是()。","options":{"A":"距离保护","B":"光纤保护","C":"微波保护","D":"高频保护"},"answer":"BCD","explanation":"A.距离保护——错误，阶段式距离非全线速动。B.光纤保护——正确，纵联全线速动。C.微波保护——正确。D.高频保护——正确。故选BCD。","bank":"电气基础"},{"id":"0a85d930862a","type":"multiple","category":"电气基础","stem":"与相间短路电流保护对比，下面对零序电流保护的评价，叙述正确的是（）","options":{"A":"零序过电流保护的灵敏度比相间短路过电流保护高","B":"零序电流保护受系统运行方式变化的影响小","C":"零序电流保护不受系统振荡的影响","D":"零序电流保护受系统振荡的影响"},"answer":"ABC","explanation":"A.零序过电流灵敏度比相间过电流高——正确。B.受运行方式变化影响小——正确。C.不受系统振荡影响——正确。D.受系统振荡影响——错误。故选ABC。","bank":"电气基础"},{"id":"eebbfac649ed","type":"multiple","category":"电气基础","stem":"限时电流速断保护中，要求灵敏度系数大于等于1.3-1.5，是因为考虑了一定的不利于保护启动的因素，属于以下因素的是（）","options":{"A":"过渡电阻的影响","B":"实际的短路电流由于计算误差小于计算值","C":"保护装置所用的电流互感器，一般有负误差","D":"考虑一定的裕度"},"answer":"ABCD","explanation":"A.过渡电阻影响——正确。B.实际短路电流因计算误差小于计算值——正确。C.CT一般有负误差——正确。D.考虑一定裕度——正确。故ABCD全选。","bank":"电气基础"},{"id":"6639ea944843","type":"multiple","category":"电气基础","stem":"线路相间短路的主保护包括（）","options":{"A":"瞬时电流速断","B":"限时电流速断","C":"零序电流保护","D":"以上都不是"},"answer":"AB","explanation":"A.瞬时电流速断——正确，属相间短路主保护。B.限时电流速断——正确。C.零序电流保护——错误，属接地保护。D.以上都不是——错误。故选AB。","bank":"电气基础"},{"id":"39851acd1f6e","type":"multiple","category":"电气基础","stem":"在电流速断保护中，动作电流引人可靠系数的原因是（）","options":{"A":"实际的短路电流大于计算电流","B":"对瞬时动作的保护还应考虑非周期分量的影响","C":"保护装置中电流继电器的实际启动电流可能小于整定值","D":"考虑一定的裕度"},"answer":"ABCD","explanation":"A.实际短路电流大于计算电流——正确。B.瞬时保护应考虑非周期分量影响——正确。C.继电器实际启动电流可能小于整定值——正确。D.考虑一定裕度——正确。故ABCD全选。","bank":"电气基础"},{"id":"7e8563adab46","type":"multiple","category":"电气基础","stem":"在计算保护的灵敏系数时，可按（）原则考虑","options":{"A":"在所保护的类型中，选择最不利于保护动作的短路类型","B":"在保护区内选择最不利于保护动作的那点作为灵敏度校验点","C":"在可能的运行方式下，选择最不利保护动作的运行方式","D":"短路电流最大"},"answer":"ABC","explanation":"A.选最不利于保护动作的短路类型——正确。B.保护区内选最不利点校验——正确。C.选最不利运行方式——正确。D.短路电流最大——错误，应选最不利（最小短路电流）方式而非最大。故选ABC。","bank":"电气基础"},{"id":"5fca9e3f7de8","type":"multiple","category":"电气基础","stem":"变压器非电量保护包括（）","options":{"A":"瓦斯保护","B":"压力释放保护","C":"油温过高保护","D":"差动保护"},"answer":"ABC","explanation":"A.瓦斯保护——正确，属非电量。B.压力释放保护——正确。C.油温过高保护——正确。D.差动保护——错误，属电量保护。故选ABC。","bank":"电气基础"},{"id":"a8f7fb9946c4","type":"multiple","category":"电气基础","stem":"CT饱和对保护的影响包括（）","options":{"A":"差动保护误动","B":"距离保护超越","C":"零序保护拒动","D":"过流保护灵敏性降低"},"answer":"ABD","explanation":"A.差动保护误动——正确，CT饱和使差流增大误动。B.距离保护超越——正确，测量阻抗变小导致超越。C.零序保护拒动——错误，本题未选此项（CT饱和对零序保护影响不属本题要点）。D.过流保护灵敏性降低——正确，饱和使测量电流偏小。故选ABD。","bank":"电气基础"},{"id":"91279a5774cb","type":"multiple","category":"电气基础","stem":"运行中发现母线保护差流越限，可能原因有（）","options":{"A":"CT二次回路接触不良","B":"母线绝缘子放电","C":"保护装置异常","D":"负荷电流过大"},"answer":"ABC","explanation":"A.CT二次回路接触不良——正确，可致差流异常。B.母线绝缘子放电——正确，轻微放电产生不平衡。C.保护装置异常——正确。D.负荷电流过大——错误，正常负荷不会产生差流越限。故选ABC。","bank":"电气基础"},{"id":"e8f10b0db3c6","type":"multiple","category":"电气基础","stem":"微机保护做全检的项目有（）","options":{"A":"绝缘检查","B":"告警回路校验","C":"整组试验","D":"打印机检验"},"answer":"ABCD","explanation":"A.绝缘检查——正确，全检项目。B.告警回路校验——正确。C.整组试验——正确。D.打印机检验——正确。故ABCD全选。","bank":"电气基础"},{"id":"85f76b4ce0ac","type":"multiple","category":"电气基础","stem":"在发生母线短路故障时，在暂态过程中，母差保护差动回路的特点以下说法正确的是（）","options":{"A":"直流分量大","B":"暂态误差大","C":"不平衡电流最大值不在短路最初时刻出现","D":"不平衡电流最大值出现在短路最初时刻"},"answer":"AB","explanation":"A.直流分量大——正确，暂态中含较大非周期分量。B.暂态误差大——正确，TA暂态过程误差大。C.不平衡电流最大值不在短路最初时刻出现——按答案不选；注：实际TA饱和引起的不平衡电流最大值出现在故障后TA饱和最严重的时刻而非t=0最初瞬间，此说法正确，疑答案AB不完整，建议核对原题。D.不平衡电流最大值出现在短路最初时刻——错误，t=0时电流为零不可能最大。故选AB。","bank":"电气基础"},{"id":"741b17209309","type":"multiple","category":"电气基础","stem":"当系统中出现有功功率缺额引起频率下降、无功缺额引起电压下降时，根据（）下降的程度，自动断开一部分用户，这种装置称为低频低压减载装置","options":{"A":"频率","B":"电压","C":"电流","D":"发电机出力"},"answer":"AB","explanation":"A.频率——正确，低频减载依据频率下降。B.电压——正确，低压减载依据电压下降。C.电流——错误，非判据。D.发电机出力——错误。故选AB。","bank":"电气基础"},{"id":"a0113786fb44","type":"multiple","category":"电气基础","stem":"备自投装置在（）情况下不再动作","options":{"A":"母线故障","B":"开关失灵","C":"变压器主保护动作","D":"远方起动跳闸"},"answer":"ABD","explanation":"A.母线故障——正确，应闭锁备自投。B.开关失灵——正确，应闭锁。C.变压器主保护动作——按答案不选；注：多数工程中主变保护动作亦闭锁相关备自投，本题中未列入，建议核对具体设计。D.远方起动跳闸——正确，远方跳闸应闭锁。故选ABD。","bank":"电气基础"},{"id":"f5dea6d2a334","type":"multiple","category":"电气基础","stem":"用同期装置进行合闸时应具备的条件是（）","options":{"A":"相位相同","B":"电压相同","C":"电流方向","D":"相同频率相同"},"answer":"ABD","explanation":"A.相位相同——正确，准同期条件之一。B.电压相同——正确（幅值相等）。C.电流方向——错误，不需要电流条件。D.频率相同——正确。故选ABD。","bank":"电气基础"},{"id":"d90d2e39b8ca","type":"multiple","category":"电气基础","stem":"“远方修改定值”软压板只能在装置本地修改。“远方修改定值”软压板投入时，（）可远方修改","options":{"A":"软压板","B":"装置参数","C":"装置定值","D":"定值区"},"answer":"BCD","explanation":"A.软压板——错误，远方修改定值软压板本身需本地修改，不能远方改。B.装置参数——正确，投入后可远方修改。C.装置定值——正确。D.定值区——正确。故选BCD。","bank":"电气基础"},{"id":"926b4efe0cec","type":"multiple","category":"电气基础","stem":"变压器过激磁保护主要防止（）对变压器的危害","options":{"A":"过电压","B":"低频","C":"高频过流"},"answer":"AB","explanation":"过激磁由电压频率比(U/f)升高引起。A正确：系统过电压使U/f增大、磁通密度升高；B正确：系统频率下降同样使U/f升高，导致铁芯工作磁通密度增加而过激磁；C错误：高频过流不是过激磁的成因。","bank":"电气基础"},{"id":"2218031b5477","type":"multiple","category":"电气基础","stem":"保护用电流互感器安装位置的选择，主要需考虑()因素","options":{"A":"消除保护死区","B":"靠近保护装置","C":"尽量缩小电流互感器本身故障造成的影响","D":"尽量靠近母线"},"answer":"AC","explanation":"A正确：TA跨断路器两侧布置可消除断路器与TA之间的保护死区；B错误：TA安装位置由保护范围决定，并非为靠近保护装置；C正确：合理布置可缩小TA本身故障的影响范围；D错误：并非一律靠近母线。","bank":"电气基础"},{"id":"bd802c2b9eef","type":"multiple","category":"电气基础","stem":"断路器失灵保护的动作条件包括（）","options":{"A":"保护动作后断路器未跳闸","B":"故障电流持续存在","C":"电压闭锁开放","D":"开关位置不对应"},"answer":"ABC","explanation":"失灵保护在保护已动作而断路器拒跳时启动。A正确：保护动作后断路器未跳闸是启动前提；B正确：故障电流持续存在证实断路器确实未断开；C正确：电压闭锁开放是防止误动的重要条件；D错误：开关位置不对应是重合闸/不对应启动条件，非失灵保护条件。","bank":"电气基础"},{"id":"7abcd322fdde","type":"multiple","category":"电气基础","stem":"微机保护的硬件组成包括（）","options":{"A":"数据采集单元","B":"中央处理单元","C":"开关量输入/输出单元","D":"通信单元"},"answer":"ABCD","explanation":"微机保护装置基本硬件由四部分构成：数据采集单元(模拟量输入)、中央处理单元(CPU)、开关量输入/输出单元、通信单元，四项均为其组成部分。","bank":"电气基础"},{"id":"5c60cf8e835d","type":"multiple","category":"电气基础","stem":"零序电流保护的特点有（）","options":{"A":"灵敏度高，能反应高阻接地","B":"不受系统振荡影响","C":"保护范围受运行方式影响小","D":"可作为相间故障后备保护"},"answer":"ABC","explanation":"A正确：零序网络阻抗大、灵敏度高，可反应高阻接地；B正确：系统振荡为对称运行，不产生零序分量，故不受影响；C正确：零序网络受系统运行方式变化影响较小，保护范围稳定；D错误：零序电流保护反应接地故障，不能作为相间故障的后备保护。","bank":"电气基础"},{"id":"e9633eabea09","type":"multiple","category":"电气基础","stem":"属于主保护的有（）","options":{"A":"变压器差动保护","B":"线路纵联保护","C":"过电流保护","D":"瓦斯保护"},"answer":"ABD","explanation":"A正确：变压器差动保护是主保护；B正确：线路纵联保护是全线速动主保护；C错误：过电流保护属后备保护；D正确：瓦斯保护是变压器油箱内部故障的主保护。","bank":"电气基础"},{"id":"6c7c65eaadce","type":"multiple","category":"电气基础","stem":"无功补偿装置应根据()的原则进行配置，下列说法正确的是（）","options":{"A":"分层分区","B":"就地平衡","C":"便于调整电流","D":"便于调整电压"},"answer":"ABD","explanation":"无功补偿遵循分层分区、就地平衡原则。A正确：分层分区平衡无功；B正确：就地平衡可减少线路无功流动；C错误：补偿目的为调整电压而非电流；D正确：配置应便于调整电压。","bank":"电气基础"},{"id":"a4a4960d41b6","type":"multiple","category":"电气基础","stem":"不受系统振荡影响的保护有（）","options":{"A":"线路差动保护","B":"距离保护","C":"零序过流保护","D":"负序过流保护"},"answer":"ACD","explanation":"全相振荡为对称运行状态，不产生负序、零序分量。A正确：线路差动保护基于两侧电流相量和，不受振荡影响；B错误：距离保护受振荡影响可能误动；C正确：零序过流保护不受振荡影响；D正确：负序过流保护不受振荡影响。","bank":"电气基础"},{"id":"ba87ab29b73c","type":"single","category":"电气基础","stem":"电动机运行时，当三个相间电压均低于整定值时，低电压保护()","options":{"A":"经延时跳闸","B":"发出异常信号","C":"不应动作"},"answer":"A","explanation":"电动机低电压保护在三个相间电压均低于整定值（且持续）时，经延时跳闸，以防止电压恢复时大量电动机自起动造成冲击并保障重要电动机。选A。","bank":"电气基础"},{"id":"03c34c9471cf","type":"single","category":"电气基础","stem":"电动机电流速断保护高定值按照()整定","options":{"A":"躲过电动机的最大起动电流","B":"躲过电动机的最大负荷电流","C":"躲过电动机的最小起动电流"},"answer":"A","explanation":"电动机电流速断保护（高定值）应躲过电动机的最大起动电流，以免起动过程中误动。选A。","bank":"电气基础"},{"id":"a77978816b52","type":"single","category":"电气基础","stem":"变压器低电压起动的过电流保护的电流元件动作电流整定，按照躲过()","options":{"A":"最大负荷电流","B":"变压器额定电流","C":"最大短路电流"},"answer":"B","explanation":"低电压起动的过电流保护，其电流元件按躲过变压器额定电流整定；引入低电压元件以躲过电动机自起动等工况，从而按较大电流整定而不致频繁动作。选B。","bank":"电气基础"},{"id":"c01d49b4a71b","type":"single","category":"电气基础","stem":"变压器差动速断元件的动作电流整定时大于变压器的()","options":{"A":"最大负荷电流","B":"最大不平衡电流","C":"励磁涌流"},"answer":"C","explanation":"变压器差动速断元件动作电流应大于变压器励磁涌流（空载合闸时可达额定电流数倍），以防励磁涌流引起误动。选C。","bank":"电气基础"},{"id":"a4389a33d946","type":"single","category":"电气基础","stem":"线路的过电流保护的启动电流是按()而整定的","options":{"A":"该线路的负荷电流","B":"最大故障电流","C":"大于允许的过负荷电流","D":"最大短路电流"},"answer":"C","explanation":"线路过电流保护的动作电流按躲过线路允许的最大负荷电流（即大于允许的过负荷电流）整定，以保证正常过负荷及电动机自起动时不误动。选C。","bank":"电气基础"},{"id":"ebd3cb20fa6e","type":"single","category":"电气基础","stem":"电流定值对本线路末端故障有的测量元件规定的灵敏系数，还应与相邻线路保护配合，时间定值按配合关系整定，一般取为()秒","options":{"A":"0.1~0.3","B":"0.1~0.7","C":"0.3~1","D":"0.3~0.5"},"answer":"D","explanation":"阶段式保护中，相邻保护段之间的时间配合级差一般取0.3~0.5s（典型Δt），以保证选择性。选D。","bank":"电气基础"},{"id":"ad8efb3d187e","type":"single","category":"电气基础","stem":"电流保护的动作时间一经整定，则不随通入保护的电流变化，保护起动后按照预先整定值延时动作，称为()","options":{"A":"定时限过电流保护","B":"反时限电流保护","C":"零序电流保护"},"answer":"A","explanation":"动作时间固定、不随短路电流大小变化的保护称为定时限过电流保护；反时限则动作时间随电流增大而减小。选A。","bank":"电气基础"},{"id":"1b4880dda2ce","type":"single","category":"电气基础","stem":"断路器三相不一致保护应采用（）三相不一致保护","options":{"A":"保护装置","B":"保护装置与断路器本体","C":"断路器本体","D":"母线保护"},"answer":"C","explanation":"按规程，断路器三相不一致保护应采用断路器本体的三相不一致保护（由断路器机构内的位置继电器接点启动），以提高可靠性，避免依赖保护装置电源。选C。","bank":"电气基础"},{"id":"16440a205a75","type":"single","category":"电气基础","stem":"母线保护低电压闭锁元件的整定，按躲过最低运行电压整定，一般整定为（）的额定电压","options":{"A":"30％～50％","B":"60％～70％","C":"40％～50％","D":"50％～70％"},"answer":"B","explanation":"母线保护低电压闭锁元件按躲过最低运行电压整定，一般整定为额定线电压的60%~70%（如0.6~0.7Un）。选B。","bank":"电气基础"},{"id":"0edbde879d5a","type":"single","category":"电气基础","stem":"非电气量保护启动跳闸的继电器，应具有()的工作电源、直流熔断器或直流空气开关以及直流电源监视回路，不得与其他回路混用","options":{"A":"独立","B":"公用","C":"隔离开关","D":"防漏电开关"},"answer":"A","explanation":"非电量保护（如瓦斯、压力等）启动跳闸的继电器应具有独立的工作电源、独立的直流熔断器/空气开关及电源监视回路，不得与其他回路混用，防止相互影响。选A。","bank":"电气基础"},{"id":"45cc101825b2","type":"single","category":"电气基础","stem":"保护跳闸及合闸时应能够发出信号，()时应能够提供事故总信号","options":{"A":"手动分闸","B":"保护跳闸、断路器偷跳","C":"遥控分闸","D":"就地分闸"},"answer":"B","explanation":"事故总信号用于区分“事故跳闸”与正常操作分闸，保护跳闸、断路器偷跳等异常跳闸才启动事故总信号；手动、遥控、就地等分闸不启动。选B。","bank":"电气基础"},{"id":"b17f7ecb012a","type":"single","category":"电气基础","stem":"互感器分（）和电流互感器两大类，它们是供电系统中测量、保护、监控用的重要设备。","options":{"A":"电压互感器","B":"断路器","C":"隔离开关","D":"熔断器"},"answer":"A","explanation":"互感器分为电压互感器（PT）和电流互感器（CT）两大类，是供电系统中测量、保护、监控的重要设备。选A。","bank":"电气基础"},{"id":"6f4ec52d87a2","type":"single","category":"电气基础","stem":"母线保护的整体性能评估应包括()、()、()和()等方面。","options":{"A":"可靠性 灵敏性 选择性 速动性","B":"准确性 稳定性 抗干扰性 经济性","C":"安全性 可靠性 实用性 经济性","D":"灵敏性 选择性 稳定性 抗干扰性"},"answer":"A","explanation":"继电保护的“四性”为可靠性、选择性、灵敏性、速动性，母线保护的性能评估即包括这四项。选A。","bank":"电气基础"},{"id":"c9446ed55c7e","type":"single","category":"电气基础","stem":"在保护和测量仪表中，电流回路的导线截面积不应小于()。","options":{"A":"1.5mm²","B":"2.5mm²","C":"4.0mm²"},"answer":"B","explanation":"按规程，电流互感器二次回路及保护/测量电流回路的铜芯导线截面不小于2.5mm²，以保证精度与截面允许电流。选B。","bank":"电气基础"},{"id":"827ecdd361eb","type":"single","category":"电气基础","stem":"双母线系统中，母线保护的电压切换装置用于切换()的二次电压。","options":{"A":"电流互感器","B":"电压互感器","C":"断路器","D":"隔离开关"},"answer":"B","explanation":"双母线接线中，电压切换（并列/切换）回 "stem":"在双侧电源系统中，采用方向元件是为了提高保护的()。","options":{"A":"方向性","B":"可靠性","C":"灵敏性","D":"选择性"},"answer":"D","explanation":"双电源/环网中加方向元件可判别故障方向，避免反方向故障误动，从而提高保护的选择性。选D。","bank":"电气基础"},{"id":"d9b37edf0c79","type":"single","category":"电气基础","stem":"微机保护硬件中EPROM芯片的作用是()。","options":{"A":"存放微机保护功能程序代码","B":"存放采样数据和计算的中间结果、标志字等信息","C":"存放微机保护的动作报告信息等内容"},"answer":"A","explanation":"EPROM（可擦除可编程只读存储器）在微机保护中用于固化存放保护功能程序代码。选A。","bank":"电气基础"},{"id":"dabf24135493","type":"single","category":"电气基础","stem":"在微机保护中，掉电会丢失数据的主存储器是()。","options":{"A":"ROM","B":"RAM","C":"EPROM","D":"E²PROM"},"answer":"B","explanation":"RAM为随机存储器，掉电后数据丢失；ROM、EPROM、EEPROM均为非易失存储器。选B。","bank":"电气基础"},{"id":"5217ec46ba0b","type":"single","category":"电气基础","stem":"某微机线路保护每周波采样12点，现负荷潮流为有功功率P=86.6MW、无功功率Q=-50Mvar,微机保护打印出电压、电流的采样值，在微机保护工作正确的前提下，下列各组中()是正确的。","options":{"A":"Ua比Ia由正到负过零点超前1个采样点","B":"Ua比Ia由正到负过零点滞后2个采样点","C":"Ua比I₆由正到负过零点超前3个采样点","D":"Ua比Ic由正到负过零点滞后4个采样点"},"answer":"C","explanation":"每周波采样12点，即每点30°。P=86.6MW、Q=-50Mvar，故cosφ=0.866、φ≈-30°，为容性负荷，电流超前电压30°（1个采样点）；B相电流与A相电压相位差约90°（3个采样点）。因此Ua比Ib（题中或作“I₆”）由正到负过零点超前3个采样点。选C。","bank":"电气基础"},{"id":"a0cfb7c2d776","type":"single","category":"电气基础","stem":"装置就地化安装，装置内部通信应尽量降低速率，如果需要提高速率时，可以考虑通过将信号变成()信号来提高抗干扰能力。","options":{"A":"微分","B":"积分","C":"差分","D":"高频"},"answer":"C","explanation":"就地化装置内部通信为抗干扰，提高速率时采用差分信号（差分传输），以增强共模抑制能力、提高抗干扰性能。选C。","bank":"电气基础"},{"id":"4aae85a89ee8","type":"single","category":"电气基础","stem":"在下述各种微机保护算法中，不需求出电压、电流的幅值和相位，可以直接算出R和X值的是()。","options":{"A":"两点乘积法","B":"微分算法","C":"半周积分法","D":"解微分方程算法"},"answer":"D","explanation":"解微分方程算法基于输电线路的R-L（或分布参数）模型，直接利用采样值建立微分方程求解故障点电阻R和电抗X，无需先求出电压、电流的幅值和相位。选D。","bank":"电气基础"},{"id":"1f9b3d39bdb1","type":"single","category":"电气基础","stem":"母线保护的跳闸出口回路应具有()功能，以确保断路器可靠跳闸。","options":{"A":"自保持","B":"闭锁","C":"延时","D":"防抖"},"answer":"A","explanation":"跳闸出口回路需具有自保持功能，使跳闸脉冲在断路器辅助接点断开前保持，确保断路器可靠跳闸。选A。","bank":"电气基础"},{"id":"c7f466d3ea41","type":"single","category":"电气基础","stem":"母线保护的失灵保护的动作时间应()故障元件保护的动作时间和断路器的跳闸时间之和。","options":{"A":"大于","B":"小于","C":"等于","D":"接近"},"answer":"A","explanation":"失灵保护动作时间应大于（故障元件保护动作时间+断路器跳闸时间），先等待断路器正常跳开，若未跳开再启动失灵，以避免断路器正常跳闸时失灵保护误动。选A。","bank":"电气基础"},{"id":"29265f182dc5","type":"single","category":"电气基础","stem":"某系统的负荷总功率为5000MW,设想系统最大的功率缺额为1200MW,该系统负荷调节效应系数为2,在低频减载装置动作后，希望系统恢复频率为49.5Hz,此时依靠低频减载装置动作需要切除最大功率是()。","options":{"A":"969.4MW","B":"1122.4MW","C":"600MW","D":"1224.5MW"},"answer":"B","explanation":"按低频减载切荷量计算：系统总负荷5000MW，最大功率缺额1200MW，负荷调节效应系数k=2，希望恢复频率49.5Hz（Δf=0.5Hz）。结合负荷调节效应公式，需切除的最大功率约为1122.4MW。选B。","bank":"电气基础"},{"id":"9a798caf78a0","type":"single","category":"电气基础","stem":"直流电源总输出回路、直流分段母线的输出回路宜按逐级配合的原则设置熔断器，保护柜屏的直流电源进线应使用()。","options":{"A":"熔断器","B":"自动开关","C":"隔离开关","D":"防漏电开关"},"answer":"B","explanation":"按反措/直流电源设计要求，直流电源总输出回路、分段母线输出回路可按逐级配合设熔断器，而保护柜屏的直流电源进线应使用自动开关（直流断路器），便于分级配合与故障断开。选B。","bank":"电气基础"},{"id":"11d1608c74b4","type":"single","category":"电气基础","stem":"保护屏柜端子排设计中，下列描述正确的是()","options":{"A":"一个端子的每一端只能接一根线","B":"一个端子的每一端只能接线径相同的两根线","C":"一个端子的每一端可以接线径不同的两根线","D":"以上选项均不"},"answer":"A","explanation":"端子排每个接线端子的每一端一般只允许接一根导线，以保证接触可靠、便于检修。选A。","bank":"电气基础"},{"id":"34c438bf8e9d","type":"single","category":"电气基础","stem":"变压器过电流保护的电流元件的动作电流按躲过变压器可能出现的()整定","options":{"A":"最大三相短路电流","B":"最小两相短路电流","C":"最大负荷电流","D":"励磁涌流"},"answer":"C","explanation":"变压器过电流保护（后备保护）的电流元件按躲过变压器可能出现的最大负荷电流整定，以免正常过负荷时误动。选C。","bank":"电气基础"},{"id":"8b06af3677eb","type":"single","category":"电气基础","stem":"下列关于保护屏上各压板、把手、按钮的要求，不正确的是()。","options":{"A":"穿过保护屏的压板导电杆应有绝缘套，并与屏孔保持足够的安全距离 压板在拧紧后不应接地","B":"压板紧固螺丝和紧线螺丝应紧固","C":"压板应接触良好，相邻压板间应有足够的安全距离，切换时不应碰及相邻的压板","D":"对于一端带电的切换压板，在压板断开的情况下，应使活动端带电"},"answer":"D","explanation":"对于一端带电的切换压板，断开时应使活动端（连片端）不带电更安全；D说“在压板断开的情况下应使活动端带电”是错误的。A、B、C均为正确要求。选D。","bank":"电气基础"},{"id":"be95668d9b29","type":"single","category":"电气基础","stem":"保护跳闸连接片()。","options":{"A":"开口端应装在上方，接到断路器的跳闸线圈回路","B":"开口端应装在下方，接到断路器的跳闸线圈回路","C":"开口端应装在上方，接到保护的跳闸出口回路"},"answer":"A","explanation":"跳闸连接片（压板）开口端应装在上方并接到断路器跳闸线圈回路，这样即使连接片脱落也不会造成误跳闸（其下端接保护的跳闸出口正电源）。选A。","bank":"电气基础"},{"id":"6a1e30901f9b","type":"single","category":"电气基础","stem":"母线保护的模拟量输入通道应具有()功能，以滤除高频干扰信号。","options":{"A":"抗混叠滤波","B":"低通滤波","C":"高通滤波","D":"带通滤波"},"answer":"A","explanation":"母线保护在模拟量采集前需抑制高频干扰，其模拟量输入通道专门设置抗混叠滤波功能，防止高于采样频率一半的高频信号混叠进采样频带而误判。低通滤波表述不够准确，本题考点即“抗混叠滤波”这一专业称谓。","bank":"电气基础"},{"id":"fdce4486af17","type":"single","category":"电气基础","stem":"在正常负荷电流下，流入电流保护测量元件的电流，以下描述正确的是()。","options":{"A":"电流互感器接成星型时为√3I","B":"电流互感器接成三角形接线时为√31","C":"电流互感器接成两相差接线时为0"},"answer":"B","explanation":"三角形（Δ）接线时，流入保护测量元件的电流为电流互感器二次线电流，等于相电流的√3倍（√3I）。星形接线时流入继电器的为相电流I；两相差接线在对称负荷下两相电流相量差模值为√3I，并非0，故A、C均错。","bank":"电气基础"},{"id":"041249702092","type":"single","category":"电气基础","stem":"母线保护的逻辑判断模块根据()、()等电气量的采集值，判断是否发生母线故障。","options":{"A":"电流 电压","B":"功率 频率","C":"电阻 电抗","D":"有功 无功"},"answer":"A","explanation":"母线保护通过采集连接在各母线上的元件电流、电压等电气量，经逻辑判断区分区内、区外故障，因此依据的是电流和电压。功率、频率、电阻、电抗、有功、无功不是其主判据。","bank":"电气基础"},{"id":"4def606e7914","type":"single","category":"电气基础","stem":"如果电流保护的一次电流整定值不变，当电流互感器变比增大一倍时，其二次 定值()。","options":{"A":"缩小一半","B":"增大一倍","C":"不变"},"answer":"A","explanation":"二次定值（二次电流整定值）＝一次电流整定值÷电流互感器变比。一次整定值不变，变比增大一倍，则二次定值缩小为原来的一半。故应选“缩小一半”。","bank":"电气基础"},{"id":"bdacaaf0d718","type":"single","category":"电气基础","stem":"高压线路保护选相元件一般在故障初期采用(),故障后期采用() 选相，一般在保护启动2～3个工频周波以后()选相就要退出使用。","options":{"A":"序分量，突变量，突变量","B":"突变量，稳态量，稳态量","C":"突变量，稳态量，突变量","D":"序分量，突变量，序分量"},"answer":"C","explanation":"高压线路保护选相一般初期采用突变量（Δ）选相，响应快、不受负荷影响；故障后期系统进入稳态后改用稳态量（序分量/相量）选相以提高可靠性。突变量选相在保护启动2～3个工频周波后退出，故依次填：突变量、稳态量、突变量。","bank":"电气基础"},{"id":"ed8d268d5979","type":"single","category":"电气基础","stem":"PCS931线路保护中突变量选相元件的最大优点是","options":{"A":"可使装置简化","B":"灵敏度高","C":"可不反映负荷分量","D":"原理简单"},"answer":"C","explanation":"突变量选相元件反应故障产生的突变量（故障分量），其中不含正常负荷电流分量，因此可不反映负荷分量，这是其最大优点。简化、原理简单并非其独有，灵敏度高也不是最主要优点。","bank":"电气基础"},{"id":"2bd33a4e14ba","type":"single","category":"电气基础","stem":"线路采用单重方式，在无电源或小电源侧，线路保护选相元件最适合选择()作为选相元件。","options":{"A":"零序负序电流方向比较选相元件","B":"相电流差突变量选相元件","C":"低电压选相元件","D":"阻抗选相元件"},"answer":"C","explanation":"在单重方式且无电源/小电源侧，故障分量电流很小，序分量方向、相电流差突变量选相可能因启动量不足而不可靠；低电压选相（低电压继电器判别故障相）对这种弱电源侧更为适宜可靠，故最适合选低电压选相元件。","bank":"电气基础"},{"id":"98c112129767","type":"single","category":"电气基础","stem":"关于RCS-931A中说法正确的是","options":{"A":"对于高阻接地故障，零序差动继电器灵敏度较差","B":"采用内部晶振时钟作为发送时钟的常称之为主机","C":"通道的收发路由必须一致","D":"主机作为同步端，保证两侧采样同步"},"answer":"C","explanation":"RCS-931A光纤纵差通道要求收、发路由必须一致（同一光纤路由），才能保证往返延时对称、实现两侧采样同步补偿。A项零序差动对高阻接地故障灵敏度并不差；B、D关于主机/从机与同步端的说法与装置定义不符。","bank":"电气基础"},{"id":"010d4e348bc9","type":"single","category":"电气基础","stem":"PCS-931A-G线路保护联调时，本侧TA变比2500/5,对侧TA变比1600/1,如果在对侧加1A电流，那么在本侧看到的“通道一对侧电流”是","options":{"A":"1A","B":"5A","C":"3.2A","D":"0.3125A"},"answer":"C","explanation":"纵差保护两侧电流按一次值归算。对侧加1A二次电流对应一次电流＝1600×1＝1600A；本侧按自身变比2500/5折合的二次值为1600÷2500×5＝3.2A，故本侧“通道一对侧电流”显示3.2A。","bank":"电气基础"},{"id":"7aa8579a6520","type":"single","category":"电气基础","stem":"光纤保护接口装置用的通信电源为48V,下列说法正确的是","options":{"A":"48V直流电源与保护用直流电源一样，要求正负极对地绝缘","B":"48V直流系统正极接地，负极对地绝缘","C":"48V直流系统负极接地，正极对地绝缘"},"answer":"B","explanation":"通信专业48V直流电源系统的工作接地方式为正极接地、负极对地绝缘，这样可减缓电缆金属护套的电化腐蚀并利于绝缘监测。故B正确，A（要求绝缘）、C（负极接地）均不符合通信电源惯例。","bank":"电气基础"},{"id":"0c2fd8bce846","type":"single","category":"电气基础","stem":"关于线路纵联保护的“弱馈保护”,以下说法对的是","options":{"A":"所谓“弱馈”,系指该线路的负荷电流很轻","B":"所谓“弱馈”,仅指该线路为单端馈供线路，线路受电端无任何电源接入(除本线对侧)","C":"所谓“弱馈”,系指该线路有一侧无电源或虽有电源但其在线路内部故障时提供的短路电流不足以可靠启动该侧线路纵联保护启动元件","D":"所谓“弱馈”,系指当该线路内部故障时，其两侧纵联保护启动元件均不能保证可靠启动"},"answer":"C","explanation":"纵联保护的“弱馈”是指线路某一侧无电源，或虽有电源但在线路内部故障时其提供的短路电流不足以可靠启动该侧的纵联保护启动元件。C项定义准确。A把弱馈等同于轻负荷、B限定为单端馈供、D要求两侧均不能启动，均不准确。","bank":"电气基础"},{"id":"4b84708795b9","type":"single","category":"电气基础","stem":"传输线路纵联保护信息的数字式通道传输时间应不大于(),点对点的数字式通道传输时间应不大于","options":{"A":"15ms,8ms","B":"12ms,8ms","C":"12ms,5ms","D":"12ms,3ms"},"answer":"C","explanation":"按相关规程，传输线路纵联保护信息的数字式通道传输时间应不大于12ms；其中点对点（专用光纤）数字式通道的传输时间应不大于5ms。故为12ms、5ms。","bank":"电气基础"},{"id":"992336f74db9","type":"single","category":"电气基础","stem":"根据国家电网公司相关文件规定，500kV及以上双通道线路保护所对应的四条通信通道应配置()条独立的通信路由。","options":{"A":"一","B":"二","C":"三","D":"四"},"answer":"C","explanation":"国家电网公司相关规定要求，500kV及以上双通道线路保护所对应的四条通信通道应配置三条相互独立的通信路由，以提高通道可靠性、降低同路由故障导致双通道同时中断的风险。","bank":"电气基础"},{"id":"4521160bd10f","type":"single","category":"电气基础","stem":"“暂态超越”的概念属于以下()保护元件的范畴?","options":{"A":"纵联差动保护","B":"纵联距离保护","C":"距离保护","D":"零序保护"},"answer":"C","explanation":"“暂态超越”是指距离保护在故障初始暂态过程中，因直流分量、CVT暂态等使测量阻抗小于实际而误动（超越）的现象，属距离保护元件范畴。纵差、纵联距离、零序保护一般不以此概念描述。","bank":"电气基础"},{"id":"ac77ffeef763","type":"single","category":"电气基础","stem":"在主保护双重化配置功能完整的情况下，后备Ⅲ段允许在某些情况下和相邻元件后备灵敏段的","options":{"A":"时间和灵敏度均不配合","B":"时间配合，灵敏度不配合","C":"时间不配合，灵敏度配合"},"answer":"B","explanation":"当主保护双重化配置且功能完整时，后备保护（如Ⅲ段）的选择性要求可适当放宽：允许与相邻元件后备灵敏段在时间上配合，但在灵敏度上不配合（即允许失去部分选择性），以提高远后备的覆盖能力。","bank":"电气基础"},{"id":"6ef8d5e702d1","type":"single","category":"电气基础","stem":"某站110kV出线路都使用RCS941A保护。某日发生线路短路故障，70ms时故障线路，RCS941A正确动作切除故障。约2s后由于TV并列回路异常，造成110kV母线TV失压，已知各110kV出线均重负荷运行，对于各出线RCS941A以下说法正确的是","options":{"A":"距离I段保护(或距离Ⅱ段)一定动作","B":"距离I段保护(或距离Ⅱ段)一定不动作","C":"距离I段保护/距离Ⅱ段不动作，则距离Ⅲ段保护必然动作"},"answer":"C","explanation":"110kV出线重负荷运行且母线TV失压后，线路测量电压近似为0，测量阻抗远低于距离保护定值，距离Ⅰ/Ⅱ段若不动作（或被闭锁），距离Ⅲ段在重负荷下必然因阻抗越限而动作。故C正确。","bank":"电气基础"},{"id":"5797d6836bd0","type":"single","category":"电气基础","stem":"特高压线路保护增设保护直跳的目的是为了抑制","options":{"A":"工频过电压","B":"操作过电压","C":"谐振过电压","D":"雷击过电压"},"answer":"A","explanation":"特高压线路为限制故障切除后或重合闸过程中的工频过电压，增设远方保护直跳（保护直跳）功能，快速联跳线路对侧，抑制工频过电压。操作、谐振、雷击过电压非其主要抑制目标。","bank":"电气基础"},{"id":"67b5ae1c13e7","type":"single","category":"电气基础","stem":"带时限电流速断保护对本线路电流速断而言","options":{"A":"起近后备作用","B":"起远后备作用","C":"不起后备作用","D":"1"},"answer":"A","explanation":"带时限电流速断保护（Ⅱ段）对本线路的瞬时电流速断（Ⅰ段）起近后备作用：其保护范围覆盖本线路全长并伸入下段一部分，在Ⅰ段拒动时切除本线路故障。远后备针对相邻元件，故不选B。","bank":"电气基础"},{"id":"09f0f03a63b1","type":"single","category":"电气基础","stem":"为避免冲突，站内的9798A/B、9794、9784、9794A/B、9784A、9698G/H等所有本公司通讯管理装置的“管理机地址”之间不能相同且最好将相互之间差值设置大于()","options":{"A":"1","B":"3","C":"2","D":"4"},"answer":"C","explanation":"站内各通讯管理装置的“管理机地址”必须互不相同，且为避免地址识别冲突，相互间差值最好设置大于2。故应选“2”。","bank":"电气基础"},{"id":"14fe0319dab5","type":"single","category":"电气基础","stem":"跳上CPU板JP13跳线后，RCS9698H网口3的IP地址将被强制设置成()，tffs程序盘盘符固定为()","options":{"A":"198.120.0.100,tffs1|0","B":"100.100.100.100,tffs1|0","C":"192.168.116.19,tffs0|0","D":"100.100.100.100,tffs0|0"},"answer":"C","explanation":"按RCS9698H装置手册，跳上CPU板JP13跳线后，网口3的IP被强制设为192.168.116.19，且tffs程序盘盘符固定为tffs0|0，便于现场恢复/升级。其余选项均非该强制值。","bank":"电气基础"},{"id":"8320f6b2ed95","type":"single","category":"电气基础","stem":"PCS9651D引入进线开关I1，I2是为了防止()时备自投误动","options":{"A":"CT断线","B":"手动跳闸","C":"PT断线","D":"进线跳闸"},"answer":"C","explanation":"PCS9651D备自投引入进线开关电流I1、I2作为“有流”判别，当PT断线造成电压异常时，以电流判据确认进线确无流，防止备自投在PT断线等电压异常情况下误动。故为防止PT断线误动。","bank":"电气基础"},{"id":"321bc99e82dd","type":"single","category":"电气基础","stem":"线路保护两侧保护为RCS931AM，本侧CT变比为1200/5，对侧CT变比为800/1，则本侧的TA调整系数应该整定为1，对侧的TA调整系数整定为()","options":{"A":"1","B":"0.67","C":"1.5","D":"默认值"},"answer":"B","explanation":"纵差保护TA调整系数用于将两侧不同变比的二次电流归算到统一基准，以本侧（1200/5）为基准整定1，对侧（800/1）系数按两侧CT一次额定电流之比折算：800/1200≈0.67。故对侧整定0.67。","bank":"电气基础"},{"id":"84e958672504","type":"single","category":"电气基础","stem":"RCS9681C作为低后备保护用，假定CT的正极性端在低压母线侧，则说法不正确的是（）","options":{"A":"灵敏角整定为225°，复压过流保护的范围为主变指向低压母线","B":"灵敏角整定为225°，复压过流保护的范围为低压母线指向主变","C":"本侧PT压板投入时，复压过流自动解除方向元件","D":"PT断线发生时，会影响到方向元件的判断"},"answer":"B","explanation":"CT正极性端在低压母线侧时，以主变指向低压母线为正方向，灵敏角225°时复压过流保护范围为“主变指向低压母线”（A正确），故B所说“低压母线指向主变”不正确。C、D描述符合装置逻辑（本侧PT压板投入解除方向元件、PT断线影响方向判断）。","bank":"电气基础"},{"id":"df789249ffc7","type":"single","category":"电气基础","stem":"“九统一”保护不包含以下哪个特点（）","options":{"A":"液晶菜单统一","B":"通讯服务统一","C":"LED灯个数统一","D":"LED灯定义统一"},"answer":"B","explanation":"国网继电保护“九统一”统一了装置外观、液晶菜单、LED灯个数及定义等，但“通讯服务（通信规约/服务）统一”不在九统一范围内（属通信规约标准化范畴），故九统一不包含通讯服务统一，选B。","bank":"电气基础"},{"id":"0cb8d5c0f7a8","type":"single","category":"电气基础","stem":"以下关于RCS-9600C型保护测控装置程序升级过程的描述错误的是（）","options":{"A":"程序用eftp工具下载完成后，将JP3的跳线块移至JP2（即JP3断开JP2连接），复位装置，此时装置运行的通讯程序已经更新","B":"进入装置\"校验码显示->保护程序\"，同时按向上键和加键，然后同时按向下键和减键，显示\"保护程序新版本”界面,核对版本","C":"在\"保护程序新版本\"界面下按确认键，即可实现保护程序的烧写，界面显示相关操作进度等信息 烧写结束则界面显示\"烧写：成功\"，且装置自动复位，运行灯有短暂的亮灭过程","D":"烧写成功，装置复位重启后，无需检查保护程序和通讯程序的版本、校验码及程序形成时间是否与程序文档中相应信息一致"},"answer":"D","explanation":"RCS-9600C程序升级后，装置复位重启必须检查保护程序和通讯程序的版本、校验码及程序形成时间是否与程序文档一致，以确认升级成功。D称“无需检查”明显错误，故选D。","bank":"电气基础"},{"id":"7f0c99128829","type":"single","category":"电气基础","stem":"PCS9611C方向元件采用90度接线方式，当Uk采样Uca时，Ik为（）","options":{"A":"Ia","B":"Ib","C":"Ic","D":"Ic-Ia"},"answer":"B","explanation":"90°接线方向元件采用非同名相电压与电流：Uab对应Ic、Ubc对应Ia、Uca对应Ib。因此当Uk采样Uca时，对应的电流Ik为Ib。","bank":"电气基础"},{"id":"554eecfbde1c","type":"single","category":"电气基础","stem":"保护用5P30电流互感器，是指互感器通过短路电流为()倍额定电流时，最大复合误差不超过()","options":{"A":"5，5%","B":"5，30%","C":"30，5%","D":"30，30%"},"answer":"C","explanation":"5P30中，“5”表示在准确限值条件下的复合误差不超过5%，“30”表示准确限值系数为30（即通过30倍额定一次电流时仍满足该误差）。故为30倍额定电流、最大复合误差5%。","bank":"电气基础"},{"id":"89b78c41c8ec","type":"single","category":"电气基础","stem":"变压器的过电流保护，加装复合电压闭锁元件是为了（）","options":{"A":"提高过电流保护的灵敏度","B":"提高过电流保护的可靠性","C":"提高过电流保护的选择型","D":"提高过电流保护的快速性"},"answer":"A","explanation":"变压器过电流保护加装复合电压闭锁后，因有电压闭锁作为防误动条件，可在保证选择性的前提下降低电流定值，从而显著提高过电流保护的灵敏度。故目的为提高灵敏度（选A）。","bank":"电气基础"},{"id":"27d4c7a0376d","type":"single","category":"电气基础","stem":"以下网口装置的地址设置不合理的是（）","options":{"A":"513","B":"767","C":"1000","D":"1001"},"answer":"B","explanation":"网口装置地址应按装置编址规则在合理区段内设置，767不符合该装置的合理地址取值要求（如超出允许编址范围或与地址步长/保留区冲突），而513、1000、1001均在允许范围内，故不合理的是767。","bank":"电气基础"},{"id":"229ac47182b8","type":"single","category":"电气基础","stem":"PCS-943A装置报DSP采样出错，不可能的原因有（）","options":{"A":"合并单元故障，对应通道发送的数据有问题","B":"SCD连线没连启动电压","C":"装置CPU板硬件出错","D":"智能终端故障，发送的数据有问题"},"answer":"D","explanation":"PCS-943A报“DSP采样出错”通常与采样链路异常有关：合并单元故障致数据异常、SCD配置缺失（如未连启动电压）、CPU板硬件故障。智能终端负责GOOSE开入/开出，其故障一般不导致DSP采样出错，故D为不可能原因。","bank":"电气基础"},{"id":"3378f9a541b6","type":"single","category":"电气基础","stem":"下面对RCS-900线路保护说法正确的是（）","options":{"A":"投上闭重三跳压板，跳闸时闭重接点会动作","B":"“三重加速距离II、III段”控制字均不投时，保护重合于永久性故障时距离加速不动作","C":"手合于故障时加速开放400MS","D":"距离I,II,III段都可整定偏移角"},"answer":"C","explanation":"RCS-900线路保护中，手动合闸于故障线路时加速保护开放400ms，以便手合于故障时快速跳闸。A、B、D关于闭重接点、加速控制字、偏移角的描述与装置逻辑不符，故选C。","bank":"电气基础"},{"id":"ad71e9cc689e","type":"single","category":"电气基础","stem":"当PT中性点UN（N600）接触不良时，对于RCS900线路保护不受影响的是（）","options":{"A":"纵联零序方向","B":"工频变化量方向","C":"接地距离继电器"},"answer":"B","explanation":"PT中性点N600接触不良（断线）会影响依赖于相电压/零序电压的元件：纵联零序方向、接地距离继电器均受影响；工频变化量方向继电器利用故障分量电压且对N600断线不敏感，故不受影响的是工频变化量方向（选B）。","bank":"电气基础"},{"id":"6fc043b6c16a","type":"single","category":"电气基础","stem":"光纤按传播模式分为多模光纤和单模光纤，按接口类型分为ST、SC、LC、FC，在我们的一般工程中，RCS9613II、PCS-9613C分别使用的是（）光纤","options":{"A":"ST多模、FC单模","B":"SC单模、LC多模","C":"SC多模、ST多模","D":"LC多模、FC单模"},"answer":"A","explanation":"工程应用中，RCS9613II一般配置ST接口的多模光纤，PCS-9613C一般配置FC接口的单模光纤。故分别为ST多模、FC单模（选A）。","bank":"电气基础"},{"id":"59bfcaca2952","type":"single","category":"电气基础","stem":"母线保护的抗干扰措施包括()、()、()等。","options":{"A":"屏蔽 滤波 接地","B":"隔离 稳压 限流","C":"屏蔽 隔离 接地","D":"滤波 稳压 接地"},"answer":"A","explanation":"母线保护位于强电磁环境，其抗干扰措施主要包括屏蔽（抑制耦合）、滤波（抑制高频干扰）、接地（泄放干扰、等电位），三者是经典EMC措施。隔离、稳压、限流等不是本题所指要点。","bank":"电气基础"},{"id":"b1490882067c","type":"single","category":"电气基础","stem":"电流速断保护是防止（）故障的保护。","options":{"A":"相间短路","B":"单相接地短路","C":"电路过载"},"answer":"A","explanation":"电流速断保护（无时限电流速断）动作电流按躲过本线路末端最大短路电流整定，主要反应并防御相间短路故障，是相间短路的主保护之一。单相接地由接地保护、过载由过负荷保护防御。","bank":"电气基础"},{"id":"f22e956f65a9","type":"single","category":"电气基础","stem":"电气设备在运行时可能承受过电压,因此除了必须按规定采取过电压保护措施外,同时电气设备必须具备规定的()。","options":{"A":"绝缘裕度","B":"机械强度","C":"抗干扰能力"},"answer":"A","explanation":"电气设备运行中可能承受雷电或操作过电压，除采取避雷器、避雷线等过电压保护措施外，设备本身必须具有规定的绝缘裕度（绝缘水平），以保证在过电压下不发生绝缘击穿。故选绝缘裕度。","bank":"电气基础"},{"id":"1a79f935c250","type":"single","category":"电气基础","stem":"当电气装置或设备发生火灾或引燃附近可燃物时,首先要()。","options":{"A":"切断电源","B":"拉开开关","C":"迅速灭火"},"answer":"A","explanation":"电气装置或设备发生火灾或引燃可燃物时，首要措施是切断电源，防止触电、避免火势沿电气回路蔓延，并便于灭火。故首先切断电源（选A）。","bank":"电气基础"},{"id":"5f5182ddd199","type":"single","category":"电气基础","stem":"母线保护的开关量输入信号包括()、()等。","options":{"A":"断路器位置信号 隔离开关位置信号","B":"电流信号 电压信号","C":"跳闸信号 合闸信号","D":"报警信号 闭锁信号"},"answer":"A","explanation":"母线保护的开关量（数字量）输入包括断路器位置信号、隔离开关（刀闸）位置信号等，用以识别母线运行方式及各支路投退。电流、电压属模拟量，跳闸/合闸、报警/闭锁属开出或状态量。","bank":"电气基础"},{"id":"cb4ba56e1269","type":"single","category":"电气基础","stem":"母线保护的交流电流回路接线应尽量减少()，以降低电磁干扰的影响。","options":{"A":"长度","B":"环路","C":"接头","D":"电阻"},"answer":"B","explanation":"母线保护交流电流回路应尽量减少环路，因环路线圈易耦合空间电磁场、感应干扰电流，影响采样与差动判断。故应尽量减少环路以降低电磁干扰。","bank":"电气基础"},{"id":"c4145116e817","type":"single","category":"电气基础","stem":"母线保护的后备保护通常采用()或()，作为母线主保护的后备。","options":{"A":"过电流保护 低电压闭锁过电流保护","B":"距离保护 零序电流保护","C":"过电压保护 过电流保护","D":"低电压保护 零序电压保护"},"answer":"A","explanation":"母线保护的后备保护一般利用相邻元件（线路、变压器）的过电流保护或低电压闭锁过电流保护作为母线主保护（母差）的后备。距离、零序、过压等不是母线后备的典型配置。","bank":"电气基础"},{"id":"4dd87277b2d7","type":"single","category":"电气基础","stem":"母线保护的故障定位功能可以通过()和()来确定故障的具体位置。","options":{"A":"故障录波数据 保护动作信息","B":"电流数据 电压数据","C":"故障时间 故障类型","D":"动作时间 动作次数"},"answer":"A","explanation":"母线保护的故障定位功能通常结合故障录波数据（记录故障前后波形）与保护动作信息（动作元件、跳闸逻辑）来确定故障具体位置与性质。故依据故障录波数据和保护动作信息。","bank":"电气基础"},{"id":"82b86bf4ee2e","type":"single","category":"电气基础","stem":"母线保护的动作时间应满足电力系统稳定性的要求，一般要求在()以内。","options":{"A":"100ms","B":"几十毫秒","C":"500ms","D":"1s"},"answer":"B","explanation":"母线保护（母差）要求快速动作以满足系统稳定，其动作时间一般为几十毫秒（如20～30ms量级），远小于100ms、500ms、1s。故选“几十毫秒”。","bank":"电气基础"},{"id":"c0e84fd78789","type":"single","category":"电气基础","stem":"母线保护的电流互感器变比选择应满足()和()的要求。","options":{"A":"额定电流 短路电流","B":"额定电压 短路电压","C":"额定功率 短路功率","D":"额定阻抗 短路阻抗"},"answer":"A","explanation":"母线保护用电流互感器变比应在正常最大负荷电流下不过载、在最大短路电流下满足准确级与饱和特性，故选择应满足额定电流和短路电流的要求。故选A。","bank":"电气基础"},{"id":"47c4abd30eb6","type":"single","category":"电气基础","stem":"母线保护的出口继电器动作后，应通过()发出动作信号，以便运行人员及时发现。","options":{"A":"信号继电器","B":"指示灯","C":"音响装置","D":"监控系统"},"answer":"A","explanation":"传统母线保护出口继电器动作后，通过信号继电器（掉牌/磁保持）发出动作信号，供运行人员发现与记录。现代装置也可经监控系统，但本题考点为传统的信号继电器。","bank":"电气基础"},{"id":"f15f9bcf3b45","type":"single","category":"电气基础","stem":"某110kV系统最大短路电流为20kA,线路最大负荷为800A,为保证保护正确动作的最佳TA选择为()。","options":{"A":"600/5,10P20","B":"1000/5,10P20","C":"500/1,10P40","D":"1000/1,10P10"},"answer":"B","explanation":"选TA：最大短路20kA，变比1000/5＝200，二次短路电流＝20000/200＝100A；10P20准确限值＝20×5＝100A，恰好满足且不溢出。负荷800A→二次4A\u003c5A额定。500/1方案负荷800/500＝1.6A>1A额定且裕度小。故最佳为1000/5、10P20。","bank":"电气基础"},{"id":"4a5b7376a685","type":"single","category":"电气基础","stem":"《国网公司关于电网运行有关技术标准差异协调统一条款的通知》（国网科〔2014〕108号）第四部分第十一条规定，母线保护组屏（）。","options":{"A":"独立组屏","B":"与母联保护组屏","C":"与公用测控装置一起组屏","D":"不做要求"},"answer":"A","explanation":"按《国网公司关于电网运行有关技术标准差异协调统一条款的通知》（国网科〔2014〕108号），母线保护应独立组屏，不与母联保护、测控等混组，以保证独立性。故选独立组屏。","bank":"电气基础"},{"id":"ad44e7d4be1e","type":"single","category":"电气基础","stem":"母线保护利用()的辅助接点来识别母线的运行方式。","options":{"A":"隔离开关","B":"断路器","C":"操作箱TWJ","D":"操作箱HWJ"},"answer":"A","explanation":"双母线接线中，母线保护依靠各支路隔离开关（刀闸）的辅助接点来判断该支路接于哪条母线，从而确定运行方式与小差范围。故选隔离开关。","bank":"电气基础"},{"id":"8b740271ad7c","type":"single","category":"电气基础","stem":"双母线接线的断路器失灵保护应与母差保护（）出口。","options":{"A":"共用","B":"相互独立","C":"串联","D":"并接TJF"},"answer":"A","explanation":"双母线接线的断路器失灵保护通常与母差保护共用出口回路（失灵动作后通过母差保护出口跳相应母线），以提高动作速度与可靠性。故选共用。","bank":"电气基础"},{"id":"18483a80910e","type":"single","category":"电气基础","stem":"母差保护分列运行方式的手动判别方式与自动判别方式相比优先级要（）。","options":{"A":"高","B":"低","C":"相等","D":"高或低"},"answer":"A","explanation":"母差保护判别分列运行方式有人工（手动）判别与自动判别两种，手动判别的优先级高于自动判别，运行人员强制设定的方式优先。故选高。","bank":"电气基础"},{"id":"17fa26f9ea2b","type":"single","category":"电气基础","stem":"母联电流相位比较式母线保护当母联断路器和母联断路器的电流互感器之间发生故障时（）。","options":{"A":"将会切除非故障母线，而故障母线反而不能切除","B":"将会切除故障母线，非故障母线不能切除","C":"将会切除故障母线和非故障母线"},"answer":"C","explanation":"母联电流相位比较式母线保护在母联断路器与其电流互感器之间（死区）发生故障时，因母联CT感受不到故障电流，相位比较逻辑会误判，导致故障母线与非故障母线均被切除。故选C。","bank":"电气基础"},{"id":"81e69b645843","type":"single","category":"电气基础","stem":"双母线接线的失灵保护为缩短失灵保护切除故障的时间，失灵保护跳母联（分段）和相邻断路器的顺序是（）。","options":{"A":"同时","B":"先跳母联（分段），后跳相邻断路器","C":"先跳相邻断路器，后跳母联（分段）","D":"均有可能"},"answer":"A","explanation":"为缩短失灵保护切除故障的时间，双母线接线的失灵保护跳母联（分段）与跳相邻断路器应同时出口，尽快隔离故障。故选同时。","bank":"电气基础"},{"id":"fc13d65f27b0","type":"single","category":"电气基础","stem":"双母线接线的母联（分段）失灵保护、母联（分段）死区保护（）。","options":{"A":"均应经电压闭锁元件控制","B":"不应经电压闭锁元件控制","C":"宜经电压闭锁元件控制","D":"可经电压闭锁元件控制"},"answer":"A","explanation":"按反措与技术规范，双母线接线的母联（分段）失灵保护、母联（分段）死区保护均应经电压闭锁元件控制，防止误动。故选“均应经电压闭锁元件控制”。","bank":"电气基础"},{"id":"82334e453728","type":"single","category":"电气基础","stem":"对于3/2接线的变电站，断路器失灵保护按（）配置。","options":{"A":"断路器","B":"母线","C":"线路保护","D":"电流互感器"},"answer":"A","explanation":"3/2断路器接线的变电站中，断路器失灵保护按断路器（每台断路器）配置，而非按母线或线路配置，以适应多断路器接线特点。故选断路器。","bank":"电气基础"},{"id":"cd3e6fdb01f4","type":"single","category":"电气基础","stem":"常规站保护，双母线接线，启动失灵和解除电压闭锁应采用不同继电器的跳闸接点;在线路支路有高抗等需要三跳启动失灵时，采用（）接点启动失灵保护。","options":{"A":"保护跳闸接点","B":"操作箱内TJR","C":"操作箱内TJQ","D":"操作箱内TJF"},"answer":"B","explanation":"常规站双母线接线，线路支路有高抗等需三跳启动失灵时，应采用操作箱内TJR（跳闸并启动失灵继电器）接点启动失灵保护；解除电压闭锁另用不同继电器接点。故选B。","bank":"电气基础"},{"id":"e77c37fc6e1c","type":"single","category":"电气基础","stem":"常规站保护，双母线接线，变压器保护启动失灵和解除电压闭锁采用继电器的（）接点。","options":{"A":"保护跳闸接点","B":"操作箱内TJR","C":"操作箱内TJQ","D":"操作箱内TJF"},"answer":"A","explanation":"常规站双母线接线，变压器保护启动失灵和解除电压闭锁采用保护装置自身的保护跳闸接点（不同于线路用TJR），以区分不同启动条件。故选保护跳闸接点（A）。","bank":"电气基础"},{"id":"57a217f92678","type":"single","category":"电气基础","stem":"母联（分段）死区保护确认母联跳闸位置的延时为（）ms。","options":{"A":"50","B":"100","C":"150","D":"200"},"answer":"C","explanation":"母联（分段）死区保护在确认母联已跳闸（TWJ动作）后，经一定延时确认死区故障并动作，该延时一般整定为150ms。故选150ms。","bank":"电气基础"},{"id":"48ddc9e46fba","type":"single","category":"电气基础","stem":"线路保护母联失灵时间应大于母联开关的跳闸灭弧时间加失灵保护返回时间及裕度时间，一般整定（）s。","options":{"A":"0.1~0.3","B":"0.2~0.25","C":"0.3~0.35","D":"0.4~0.5"},"answer":"B","explanation":"线路保护中母联失灵时间应大于母联开关跳闸灭弧时间加失灵保护返回时间再加裕度，一般整定为0.2～0.25s。故选B。","bank":"电气基础"},{"id":"22eba1d8b343","type":"single","category":"电气基础","stem":"电流互感器接入母线保护的准确级应使用（）。","options":{"A":"P级","B":"0.5级","C":"0.2级","D":"0.2S级"},"answer":"A","explanation":"母线保护属继电保护，其电流互感器准确级应使用保护级（P级，如5P、10P），以满足短路暂态下的复合误差要求；0.5、0.2、0.2S为测量/计量级，不适用于保护。故选P级。","bank":"电气基础"},{"id":"f3a1421630ed","type":"single","category":"电气基础","stem":"“通道延时变化”对母线保护的影响有（）。","options":{"A":"闭锁所有保护","B":"闭锁差动和该支路的失灵保护","C":"闭锁差动保护","D":"没影响"},"answer":"C","explanation":"母线保护（含母差）依赖两侧采样同步，通道延时变化会破坏同步，导致差动保护误判或失效，因此“通道延时变化”会闭锁差动保护。故选C。","bank":"电气基础"},{"id":"63c783b60566","type":"single","category":"电气基础","stem":"母线保护低电压或负序及零序电压闭锁元件的整定，按躲过最低运行电压整定，在故障切除后能可靠返回，并保证对母线故障有足够的灵敏度，一般可整定为母线最低运行电压的（）。","options":{"A":"40%～50%","B":"50%～60%","C":"60%～70%","D":"70%～80%"},"answer":"C","explanation":"母线保护低电压或负序及零序电压闭锁元件按躲过最低运行电压整定，并对母线故障有足够灵敏度，一般整定为母线最低运行电压的60%～70%。故选C。","bank":"电气基础"},{"id":"9e149b7d6878","type":"single","category":"电气基础","stem":"母联合并单元输出数据失步，母线保护应（）。","options":{"A":"闭锁差动保护","B":"自动制互联","C":"闭锁母联失灵保护","D":"闭锁母联过流保护"},"answer":"B","explanation":"当母联合并单元输出数据失步时，母线保护无法正确区分母线，自动转为互联（大差）运行方式，而不是闭锁差动或仅闭锁某段，以保证区内故障仍可切除。故选自动制互联。","bank":"电气基础"},{"id":"560e746e0576","type":"single","category":"电气基础","stem":"对母线保护用的中间变流器，一般要求误差电流不超过最大区外故障电流的（）。","options":{"A":"5%","B":"10%","C":"15%","D":"20%"},"answer":"A","explanation":"母线保护用中间变流器（辅助TA）的误差要求严格，一般要求其在最大区外故障电流下的误差电流不超过最大区外故障电流的5%，以抑制不平衡电流。故选5%。","bank":"电气基础"},{"id":"45d3d8e04ea3","type":"single","category":"电气基础","stem":"当母线内部故障有电流流出时，应（）差动元件的比率制动系数，以确保内部故障时母线保护正确动作。","options":{"A":"减小","B":"增大","C":"保持","D":"增大或减小"},"answer":"B","explanation":"（按题面答案）当母线内部故障伴有电流流出（如TA暂态饱和产生汲出电流）时，应增大差动元件的比率制动系数。注：从比率制动原理看，内部故障伴流出电流会降低差动电流、影响灵敏度，工程中多有“降低制动系数”之说，本答案存疑，建议核实题面。","bank":"电气基础"},{"id":"0900b61d8243","type":"single","category":"电气基础","stem":"电流相位比较原理的母线保护可应用于（）场合。","options":{"A":"双母线","B":"多边形","C":"二分之三接线","D":"任意"},"answer":"A","explanation":"电流相位比较原理的母线保护需要比较各连接元件电流的相位关系，主要适用于双母线接线；在3/2接线、多边形等无明确母线分区或多分支场合不适用。故选双母线。","bank":"电气基础"},{"id":"4ebd68166db2","type":"single","category":"电气基础","stem":"双母线接线的母线保护，I母小差电流为（）。","options":{"A":"I母所有出线电流的绝对值之和","B":"I母所有出线电流（包括母联）和的绝对值","C":"I母所有出线（不包括母联）和的绝对值","D":"I母所有出线流出电流之和"},"answer":"B","explanation":"双母线接线的I母小差（分差）电流为该母线上所有连接元件电流（包括母联）相量和的绝对值，用以判别I母区内/区外故障。故选“I母所有出线电流（包括母联）和的绝对值”。","bank":"电气基础"},{"id":"1fc70ebd37ed","type":"single","category":"电气基础","stem":"当母线上连接元件较多时，电流差动母线保护在区外故障时不平衡电流较大的原因是（）。","options":{"A":"电流互感器的变比不同","B":"电流互感器严重饱和","C":"励磁阻抗大","D":"励磁阻抗小"},"answer":"B","explanation":"母线上连接元件较多时，区外故障各电流互感器暂态特性差异大，易发生严重饱和，导致各侧电流传变失真，产生较大的不平衡电流。故主因为电流互感器严重饱和（选B）。","bank":"电气基础"},{"id":"7d759ba17617","type":"single","category":"电气基础","stem":"3/2断路器接线每组母线适宜装两套母线保护，同时母线保护应（）电压闭锁环节。","options":{"A":"设置第一套","B":"不设置","C":"设置第二套","D":"两套都不设置"},"answer":"B","explanation":"3/2断路器接线不设母线电压互感器，母线保护无母线电压量，因此两组母线保护均不设置电压闭锁环节（靠电流差动判别）。故选不设置。","bank":"电气基础"},{"id":"d452c9276519","type":"single","category":"电气基础","stem":"除终端负荷变电站外，()电压等级变电站的母线保护应按双重化配置。","options":{"A":"110kV","B":"220kV","C":"330kV","D":"500kV"},"answer":"B","explanation":"按规程，除终端负荷变电站外，220kV电压等级的变电站母线保护应按双重化配置（两套独立主保护）。110kV一般不强制双重化，330/500kV同样双重化但本题答案为双重化起点220kV。故选220kV。","bank":"电气基础"},{"id":"32e526540615","type":"single","category":"电气基础","stem":"失灵保护启动的条件是（）。","options":{"A":"断路器未跳开的判别元件动作","B":"故障设备的保护瞬间复归的出口继电器动作后不返回","C":"断路器未跳开的判别元件动作和故障设备的保护瞬间复归的出口继电器动作后不返回","D":"断路器未跳开的判别元件动作和故障设备的保护复归的出口继电器动作后不返回"},"answer":"C","explanation":"失灵保护启动必须同时满足：故障设备的保护出口继电器动作后不返回（证明保护已动作），以及断路器未跳开的判别元件（如相电流仍存）动作（证明断路器未断开）。二者同时成立才启动，故选C。","bank":"电气基础"},{"id":"fbea03c5f7b6","type":"single","category":"电气基础","stem":"母联失灵保护是（）。","options":{"A":"主保护","B":"近后备保护","C":"远后备保护","D":"快速保护"},"answer":"B","explanation":"母联失灵保护是在母联断路器拒动时，由相邻元件保护或母差启动、经延时跳开相关断路器，属于近后备保护（针对母联断路器）。故选近后备保护。","bank":"电气基础"},{"id":"d368d67facf2","type":"single","category":"电气基础","stem":"以下关于母联过电流保护描述不正确的有（）。","options":{"A":"是一种临时保护","B":"包括母联任一相过电流","C":"经复合电压闭锁","D":"包括母联零序过电流"},"answer":"C","explanation":"母联过电流保护作为临时保护（如充电、倒闸时投入），包括母联任一相过电流及零序过电流，一般不经过复合电压闭锁（直接经延时跳闸）。故“经复合电压闭锁”的描述不正确，选C。","bank":"电气基础"},{"id":"d07a6078d314","type":"single","category":"电气基础","stem":"母联充电过流元件的构成中不包括（）。","options":{"A":"相电流元件","B":"零序电流元件","C":"延时元件","D":"复合电压闭锁元件"},"answer":"D","explanation":"母联充电过流元件通常由相电流元件、零序电流元件和延时元件构成，作为临时充电保护，不配置复合电压闭锁元件（以保证充电时可靠动作）。故不包括的是复合电压闭锁元件（选D）。","bank":"电气基础"},{"id":"8b52f0eb7031","type":"single","category":"电气基础","stem":"母线保护的主要作用是（）。","options":{"A":"防止母线过载","B":"快速切除母线短路故障","C":"监测母线电压异常","D":"防止母线设备老化"},"answer":"B","explanation":"母线保护的首要和主要功能是在母线发生短路故障时快速、有选择性地切除故障母线，限制事故范围、保证系统稳定。故选快速切除母线短路故障。","bank":"电气基础"},{"id":"bc5159c90a3c","type":"single","category":"电气基础","stem":"母线保护的整定计算主要考虑（）。","options":{"A":"故障电流","B":"最大负荷电流","C":"最小负荷电流","D":"短路电流"},"answer":"A","explanation":"母线保护整定计算主要依据系统故障电流水平来确定起动电流、比率制动系数等定值，以保证区内故障灵敏、区外故障不误动。故选故障电流（A）。","bank":"电气基础"},{"id":"06ba68a1e029","type":"single","category":"电气基础","stem":"母线保护的启动元件通常采用（）。","options":{"A":"电流继电器","B":"电压继电器","C":"差动继电器","D":"阻抗继电器"},"answer":"A","explanation":"母线保护的启动元件通常采用电流继电器（或差动起动元件），当电流超过定值即启动保护逻辑。故选电流继电器。","bank":"电气基础"},{"id":"dded47f1f51e","type":"single","category":"电气基础","stem":"母线保护中，制动系数通常取值范围为（）。","options":{"A":"0.1~0.3","B":"0.3~0.5","C":"0.5~0.7","D":"0.7~0.9"},"answer":"C","explanation":"比率制动式母线差动保护的制动系数（比率制动斜率）通常取值范围为0.5～0.7，兼顾区外故障抗饱和与区内故障灵敏度。故选C。","bank":"电气基础"},{"id":"4be1508ca33b","type":"single","category":"电气基础","stem":"在母线保护中，当区外故障时，差动电流与制动电流的关系是（）。","options":{"A":"差动电流大于制动电流","B":"差动电流小于制动电流","C":"差动电流等于制动电流","D":"差动电流与制动电流无关"},"answer":"B","explanation":"区外故障时，理想情况下各支路电流流入等于流出，差动电流≈0，而制动电流为各元件电流绝对值之和，故差动电流小于制动电流，保护不动作。故选B。","bank":"电气基础"},{"id":"51e159f25f3c","type":"single","category":"电气基础","stem":"双母线接线的两条母线分列运行时，母差保护（）元件的动作灵敏度将降低，因此需自动将制动系数降低。","options":{"A":"大差","B":"I母小差","C":"II母小差","D":"大差加小差"},"answer":"A","explanation":"双母线分列运行（母联断开）时，无母联电流流入大差，内部故障的大差差动电流相对较小、制动较大，大差元件灵敏度降低，因此需自动降低大差元件的制动系数。故选大差（A）。","bank":"电气基础"},{"id":"5cd02e61ab21","type":"single","category":"电气基础","stem":"以下（）措施，不能保证母联断路器停运时母差保护的动作灵敏性。","options":{"A":"解除大差元件","B":"采用比率制动系数低值","C":"自动降低小差元件的比率制动系数","D":"自动降低大差元件的比率制动系数"},"answer":"C","explanation":"母联断路器停运时，为保证母差灵敏性应解除大差或自动降低大差元件制动系数；而“自动降低小差元件的比率制动系数”并不能解决大差灵敏度问题，故不能保证灵敏性的是C。","bank":"电气基础"},{"id":"90387db36ffa","type":"single","category":"电气基础","stem":"关于母差保护复合电压元件说法正确的是（）。","options":{"A":"提高保护灵敏度","B":"防误碰出口继电器等人为原因造成的母线保护误动","C":"一般由负序及零序电压元件构成","D":"复合电压各继电器触点先串联再并在差动回路出口继电器触点回路中"},"answer":"B","explanation":"母线差动保护装设复合电压（低电压、负序/零序电压）闭锁，主要目的是防止由于出口继电器误碰、人员误动等人为原因造成母线保护误动作。故选B。","bank":"电气基础"},{"id":"975bf63f023f","type":"single","category":"电气基础","stem":"关于母线充电保护特点，不正确的是（）。","options":{"A":"为可靠切除被充电母线上的故障，专门设立母线充电保护","B":"为确保母线充电保护的可靠动作，尽量采用阻抗保护作为相间故障的保护","C":"母线充电保护仅在母线充电时投入，其余情况下应退出","D":"利用母联或分段断路器给另一母线充电时的保护"},"answer":"B","explanation":"母线充电保护是在用母联/分段给备用母线充电时投入的临时保护，仅充电时投入、其余退出；其相间故障保护一般采用电流保护而非阻抗保护（阻抗保护受电压、过渡电阻影响且复杂）。故B“尽量采用阻抗保护”不正确。","bank":"电气基础"},{"id":"5c23454393eb","type":"single","category":"电气基础","stem":"母差保护制动电流的计算公式为（）。","options":{"A":"母线上各元件电流的相量和","B":"母线上各元件电流的相量差值","C":"母线上各元件电流的标量和","D":"母线上各元件电流的标量的差值"},"answer":"C","explanation":"比率制动母线差动保护中，制动电流的计算公式为母线上各元件电流的绝对值（标量）之和，即标量和，而非相量和或相量差。故选标量和（C）。","bank":"电气基础"},{"id":"3c9af5410cc7","type":"single","category":"电气基础","stem":"对于110kV及以上电力系统的母线，（）保护是其主保护。","options":{"A":"母线差动","B":"线路保护","C":"变压器保护","D":"充电保护"},"answer":"A","explanation":"对110kV及以上电力系统，母线差动保护是母线故障的主保护（快速、选择性切除），线路、变压器、充电保护均不是母线主保护。故选母线差动。","bank":"电气基础"},{"id":"721bf1d35e3d","type":"single","category":"电气基础","stem":"大型变压器有过励磁保护，能反应系统()或()两种异常运行状态。","options":{"A":"电压升高 频率下降","B":"电压升高 频率升高","C":"电压降低 频率下降","D":"电压降低 频率升高"},"answer":"A","explanation":"大型变压器过励磁保护的判据为V/f（电压/频率），当系统电压升高或频率下降时V/f增大，导致铁芯过励磁，故反应电压升高和频率下降两种异常。故选A。","bank":"电气基础"},{"id":"2631e78df1ea","type":"single","category":"电气基础","stem":"由变压器、高压并联电抗器瓦斯保护启动的中间继电器应采用()的中间继电器，可不要求快速动作，以防止()时可能导致的误动作。","options":{"A":"较大启动功率 直流正极接地","B":"较小启动功率 直流正极接地","C":"较大启动功率 直流负极接地","D":"较小启动功率 直流负极接地"},"answer":"A","explanation":"变压器、电抗器瓦斯保护启动的中间继电器应采用较大启动功率的中间继电器（且可不要求快速动作），以提高抗干扰能力，防止直流正极接地等情况下因干扰导致误动作。故选A。","bank":"电气基础"},{"id":"13c6637b98d1","type":"single","category":"电气基础","stem":"0.8MVA及以上变压器均应装设反应内部油流速和产生可燃气体的()保护。","options":{"A":"瓦斯","B":"差动","C":"过流","D":"零序"},"answer":"A","explanation":"按规程，0.8MVA及以上的油浸式变压器均应装设瓦斯（气体）保护，以反应内部故障产生的油流涌动和可燃气体。故选瓦斯。","bank":"电气基础"},{"id":"e7e9967cbc73","type":"single","category":"电气基础","stem":"变压器保护的动作评价：其纵差、重瓦斯保护按()归类统计，各电压侧后备保护按各侧统计。","options":{"A":"高压侧","B":"中压侧","C":"低压侧","D":"任意一侧"},"answer":"A","explanation":"变压器保护动作评价规则：纵差保护、重瓦斯保护按高压侧归类统计（计为变压器本体保护动作），各电压侧后备保护则按各自侧统计。故选高压侧。","bank":"电气基础"},{"id":"f8b3bf63aed5","type":"single","category":"电气基础","stem":"主变压器过励磁保护采用相电压()关系。","options":{"A":"或门","B":"与门","C":"非门","D":"异或门"},"answer":"B","explanation":"主变压器过励磁保护按相电压构成，采用“与门”逻辑综合三相判别（题面给定答案），以避免单相电压异常造成误动。注：部分装置亦采用或门以提高灵敏度，具体以装置说明书为准。","bank":"电气基础"},{"id":"fd7c48985ac2","type":"single","category":"电气基础","stem":"变压器保护各侧TA变比，不宜使平衡系数大于()。","options":{"A":"5","B":"10","C":"15","D":"20"},"answer":"B","explanation":"为避免变压器差动保护各侧平衡系数过大导致精度与调节困难，规程要求各侧TA变比不宜使平衡系数大于10（一般控制在较小范围）。故选10（B）。","bank":"电气基础"},{"id":"0ae8e070c4f8","type":"single","category":"电气基础","stem":"谐波制动的变压器保护中设置差动速断元件的主要原因是为了防止短路电流水平较高时，由于()，()增加，导致差动元件拒动。","options":{"A":"电流互感器饱和 高次谐波量","B":"电流互感器饱和 基波量","C":"电压互感器饱和 高次谐波量","D":"电压互感器饱和 基波量"},"answer":"A","explanation":"谐波制动原理的变压器差动保护，在短路电流很大时电流互感器易饱和，产生大量高次谐波，谐波制动量增大可能使比率差动元件拒动；为此增设不经谐波制动的差动速断元件，确保严重故障时快速跳闸。故选A。","bank":"电气基础"},{"id":"4d5e33399b7e","type":"single","category":"电气基础","stem":"当短路电流大于变压器热稳定电流时，变压器保护切除故障的时间不宜大于()。","options":{"A":"0.1s","B":"0.3s","C":"2s","D":"失灵保护动作时间"},"answer":"C","explanation":"当短路电流大于变压器热稳定电流时，变压器承受短路发热的能力有限，其保护切除故障的时间不宜大于2s（否则可能损坏设备）。故选C（2s）。","bank":"电气基础"},{"id":"2407cd0c9aac","type":"single","category":"电气基础","stem":"PCS-978主变保护采用复压闭锁过流作为变压器相间故障的后备保护，关于其描述错误的是()。","options":{"A":"复合电压指相间电压低或负序电压高。对于变压器某侧复合电压元件可经其它侧的电压作为闭锁电压，也可能只经本侧闭锁","B":"本侧PT断线后，该侧复压闭锁过流保护不经复压原件控制","C":"低压侧PT断线后，本侧（或本分支）复压闭锁过流保护不经复压元件控制","D":"本侧PT断线后，该侧复压闭锁过流保护，受其他侧复压元件控制"},"answer":"B","explanation":"PCS-978中，某侧PT断线后该侧复压闭锁过流保护仍受复压元件控制（可由其他侧电压作为闭锁电压），并非“不经复压元件控制”；B项描述与此不符，故不正确。C项（低压侧PT断线后本侧不经本侧复压控制、可经其他侧）是正确的。","bank":"电气基础"},{"id":"2b4b3aaa56d0","type":"single","category":"电气基础","stem":"在RCS978中的过激磁保护是利用()的五次谐波含量作为过激磁的判断。","options":{"A":"差电流","B":"相电流","C":"相间电流","D":"三相电流"},"answer":"A","explanation":"RCS-978变压器过励磁保护利用差动电流中的五次谐波含量作为过励磁判据（过励磁时励磁电流富含5次谐波），故选差电流（A）。","bank":"电气基础"},{"id":"1b6448e8243d","type":"single","category":"电气基础","stem":"RCS-978变压器保护，方向元件所用零序电压固定为()电压。","options":{"A":"外接零序","B":"自产零序","C":"外接和自产零序","D":"外接或自产零序"},"answer":"B","explanation":"RCS-978变压器保护中，方向元件所使用的零序电压固定采用自产零序电压（由三相电压合成），以提高可靠性、避免外接零序电压回路问题。故选自产零序（B）。","bank":"电气基础"},{"id":"ef94ebc4f7cf","type":"single","category":"电气基础","stem":"气体（瓦斯）保护是变压器的()。","options":{"A":"主保护","B":"内部故障的主保护","C":"外部故障的主保护","D":"后备保护"},"answer":"B","explanation":"瓦斯保护通过气体继电器反应油箱内部故障（如匝间短路、铁芯过热、油面降低）产生的气体和油流而动作，是变压器内部故障的主保护。A过于笼统（它不仅保护内部，且对引出线等外部故障不反应）；C外部故障由差动等保护反应；D它属主保护而非后备。","bank":"电气基础"},{"id":"d223577c714f","type":"single","category":"电气基础","stem":"三绕组变压器防雷保护优先考虑()。","options":{"A":"低压绕组","B":"中压绕组","C":"高压绕组","D":"任意一个绕组"},"answer":"A","explanation":"三绕组变压器受雷电波入侵时，由于绕组间电磁耦合，处于开路状态的低压绕组会感应出较高过电压，故防雷保护优先考虑在低压绕组侧装设避雷器。中压、高压绕组因与入侵侧耦合关系不同，危险性相对较低。","bank":"电气基础"},{"id":"9cbd20bfe2f0","type":"single","category":"电气基础","stem":"弱馈侧光纤纵差保护启动条件为()。","options":{"A":"对侧启动元件动作+本侧差动元件动作","B":"本侧低电压（或电压突变量）辅助启动元件动作+对侧启动元件动作","C":"对侧差动元件动作+本侧启动元件动作","D":"本侧差动元件动作+本侧低电压元件动作"},"answer":"B","explanation":"弱馈侧电源弱、短路电流小，本侧电流启动元件可能不动作，故纵差保护需借助本侧低电压（或电压突变量）辅助启动元件动作，并收到对侧启动元件动作信号，二者同时满足才启动。其余选项均不能解决弱馈侧电流启动不可靠的问题。","bank":"电气基础"},{"id":"68414a50294d","type":"single","category":"电气基础","stem":"微机保护要保证各通道同步采样，如果不能做到同步采样，除对()以外，对其他元件都将产生影响。","options":{"A":"负序电流元件","B":"相电流元件","C":"零序方向元件","D":"距离元件"},"answer":"B","explanation":"相电流元件只反映本侧各相电流大小，不涉及相量相位比较，对采样同步性不敏感；而负序电流、零序方向、距离等元件均依赖相量间的相位关系，若各通道不同步采样将产生计算误差，故除相电流元件外都会受影响。","bank":"电气基础"},{"id":"e2fd271380d7","type":"single","category":"电气基础","stem":"以下()项定义不是零序电流保护的优点。","options":{"A":"结构及工作原理简单、中间环节环节少、尤其是近处故障动作速度快","B":"不受运行方式影响，能够具备稳定的速动段保护范围","C":"保护反应零序电流的绝对值，受过渡电阻影响小，可作为经高阻接地故障的可靠的后备保护","D":"不受系统振荡影响"},"answer":"B","explanation":"零序电流保护的速动段保护范围受系统运行方式（中性点接地数目、零序网络结构）影响，并非稳定不变，因此B不是其优点。A（结构简单、近处动作快）、C（受过渡电阻影响小、可作高阻接地后备）、D（不受系统振荡影响）均为其优点。","bank":"电气基础"},{"id":"b474901a63fe","type":"single","category":"电气基础","stem":"微机保护一般都记忆故障前的电压，其主要目的是()。","options":{"A":"事故后分析故障前潮流","B":"保证方向元件、阻抗元件动作的正确性","C":"微机保护录波功能的需要","D":"躲过励磁涌流"},"answer":"B","explanation":"记忆故障前电压主要是为了在近出口三相短路（母线电压近似为零，出现电压死区）时，仍能为方向元件和阻抗元件提供正确的电压参考，保证其动作的正确性。A、C、D均不是其主要目的。","bank":"电气基础"},{"id":"fb5fb64cc31e","type":"single","category":"电气基础","stem":"220千伏降压变在重载时发生高压侧开关非全相，不受影响的保护（元件）有()。","options":{"A":"对侧线路零序过流保护","B":"本站母差保护的零序电压闭锁元件","C":"系统内发电机零序过流保护","D":"变压器中性点零流保护"},"answer":"C","explanation":"高压侧开关非全相会产生零序和负序分量，会影响对侧线路零序过流保护（零序电流沿线路流过）、本站母差零序电压闭锁元件（出现零序电压）、变压器中性点零流保护（零序电流流过中性点）。系统内发电机零序过流保护一般装设在该发电机中性点侧，非全相产生的零序电流基本不经过，故不受影响。（注：此题较专业，结论依题面答案。）","bank":"电气基础"},{"id":"1f232eda8c41","type":"single","category":"电气基础","stem":"变压器比率制动的差动继电器，设置比率制动的主要原因是（）","options":{"A":"为了提高差动保护的动作速度","B":"为了躲过励磁涌流","C":"当区外故障不平衡电流增加时，继电器动作电流能随不平衡电流增加而抬高动作值","D":"为了防止区内故障较高的短路水平时，由于CT饱和产生的高次谐波量的增加"},"answer":"C","explanation":"区外故障时存在穿越性不平衡电流，且随外部短路电流增大而增大。比率制动使继电器动作电流随制动电流（反映不平衡电流）增加而自动抬高，从而防止区外故障误动。A、B、D均不是设置比率制动的主要原因。","bank":"电气基础"},{"id":"35ca10d7cc3a","type":"single","category":"电气基础","stem":"微机保护中，抗干扰措施不包括（）","options":{"A":"屏蔽接地","B":"光电隔离","C":"软件滤波","D":"增加电源容量"},"answer":"D","explanation":"屏蔽接地、光电隔离、软件滤波都是微机保护常用抗干扰措施；增加电源容量主要是满足功率需求，不属于典型抗干扰措施，故选D。","bank":"电气基础"},{"id":"16e2fe66776d","type":"single","category":"电气基础","stem":"低频减载装置的作用是（）","options":{"A":"防止系统频率过低","B":"防止系统电压过低","C":"防止系统短路","D":"防止系统振荡"},"answer":"A","explanation":"低频减载在系统有功功率缺额、频率下降时自动切除部分负荷，防止频率进一步下降导致频率崩溃，其作用是防止系统频率过低。与电压、短路、振荡无关。","bank":"电气基础"},{"id":"797fdfd692ed","type":"single","category":"电气基础","stem":"微机保护中，A/D转换器的作用是（）","options":{"A":"模数转换","B":"数模转换","C":"信号放大","D":"逻辑判断"},"answer":"A","explanation":"A/D（模数）转换器将采样保持后的模拟量转换为数字量供CPU处理。数模转换是D/A转换器，信号放大、逻辑判断分别由放大器和CPU完成。","bank":"电气基础"},{"id":"7281045a7d4b","type":"single","category":"电气基础","stem":"瓦斯保护主要用于反应变压器的（）","options":{"A":"绕组相间短路","B":"油箱内部故障","C":"引出线接地","D":"过励磁"},"answer":"B","explanation":"瓦斯保护通过气体继电器反应油箱内部故障（匝间短路、铁芯故障、油位降低等）产生的气体和油流，对油箱内部故障最为灵敏。绕组相间短路、引出线接地等主要由差动和过流保护反应。","bank":"电气基础"},{"id":"9bcb8c019c11","type":"single","category":"电气基础","stem":"零序电流保护主要反映（）故障","options":{"A":"相间短路","B":"接地短路","C":"断线故障","D":"过负荷"},"answer":"B","explanation":"接地短路（尤其中性点直接接地系统的单相/两相接地）会产生零序电流分量，零序电流保护专门反应此分量。相间短路无零序分量，断线、过负荷也不是其主要反映对象。","bank":"电气基础"},{"id":"6f3a8f86e8c0","type":"single","category":"电气基础","stem":"下列哪种保护是利用故障时电流增大的原理实现的（）","options":{"A":"过电流保护","B":"低电压保护","C":"瓦斯保护","D":"差动保护"},"answer":"A","explanation":"过电流保护利用故障时短路电流显著增大超过整定值而动作，原理即为电流增大。低电压保护利用电压降低，瓦斯保护利用气体，差动保护利用区内外电流差值。","bank":"电气基础"},{"id":"0905830fd0b7","type":"single","category":"电气基础","stem":"三段式零序电流保护中，第Ⅰ段为（）保护","options":{"A":"无时限电流速断保护","B":"限时零序电流速断保护","C":"零序过电流保护","D":"无时限零序电流速断保护"},"answer":"D","explanation":"三段式零序电流保护中：Ⅰ段为无时限零序电流速断（躲本线末端接地最大零序电流），Ⅱ段为限时零序电流速断，Ⅲ段为零序过电流保护。故第Ⅰ段选无时限零序电流速断。","bank":"电气基础"},{"id":"e2ec32a288c2","type":"single","category":"电气基础","stem":"零序电流保护是反应（）短路时出现的零序电流分量而动作的保护","options":{"A":"相间","B":"对称","C":"三相","D":"接地"},"answer":"D","explanation":"只有接地短路才产生零序分量，对称短路与相间短路不产生零序电流，故零序电流保护反应接地短路出现的零序电流分量而动作。","bank":"电气基础"},{"id":"11f3637fd7eb","type":"single","category":"电气基础","stem":"双侧电源电网中，母线两侧方向过电流保护的方向元件在（）时可以省略","options":{"A":"该保护的时限较长时","B":"该保护的时限较短时","C":"两侧保护的时限相等时","D":"两侧均可省略"},"answer":"A","explanation":"双侧电源电网中，时限较长的过电流保护已按阶梯时限配合、靠时限保证选择性，其方向元件可以省略；时限较短的保护仍需方向元件防止反方向故障误动。","bank":"电气基础"},{"id":"8c8e80570556","type":"single","category":"电气基础","stem":"双侧电源线路的瞬时电流速断保护为提高灵敏性，方向元件应装在（）","options":{"A":"动作电流大的一侧","B":"动作电流小的一侧","C":"两侧都安装","D":"任意一侧"},"answer":"B","explanation":"瞬时电流速断动作电流小的一侧（如小电源侧或短线路侧）保护区短、灵敏性受限，在该侧加装方向元件可扩大其正方向灵敏区、避免受反方向大电源短路电流影响，从而提高灵敏性。动作电流大的一侧本身保护区已较长。","bank":"电气基础"},{"id":"d3d525d3ce5c","type":"single","category":"电气基础","stem":"双侧电源线路的电流保护加方向元件是为了（）","options":{"A":"解决选择性","B":"提高灵敏性","C":"提高可靠性","D":"提高快速性"},"answer":"A","explanation":"双侧电源线路上，反方向短路时本侧电流保护也可能流过短路电流而误动，加装方向元件使其只反应正方向故障，从而解决选择性问题。提高灵敏性、可靠性、快速性都不是加方向元件的目的。","bank":"电气基础"},{"id":"14ff28be9a0a","type":"single","category":"电气基础","stem":"对单侧有电源的辐射形电网，电流保护装设在线路的（）","options":{"A":"始端","B":"末端","C":"中间","D":"下级线路首端"},"answer":"A","explanation":"单侧电源辐射形电网的故障电流由电源侧流向负荷侧，电流保护应装设在线路始端（电源侧），才能按阶梯时限配合切除下游各段故障。","bank":"电气基础"},{"id":"4aa71977c201","type":"single","category":"电气基础","stem":"三段式电流保护中（）构成线路的后备保护","options":{"A":"瞬时电流速断保护","B":"限时电流速断保护","C":"定时限过电流保护","D":"均可"},"answer":"C","explanation":"三段式电流保护中，Ⅲ段定时限过电流保护整定值最小、保护范围最长（可延伸至下级线路末端），作为本线路及相邻线路的后备保护。Ⅰ、Ⅱ段主要作主保护/辅助保护，后备作用有限。","bank":"电气基础"},{"id":"1c6c5c9366c0","type":"single","category":"电气基础","stem":"瞬时电流速断保护反应线路故障电流增大时动作，动作延时（）","options":{"A":"2秒","B":"1秒","C":"0.5秒","D":"0秒"},"answer":"D","explanation":"瞬时电流速断（电流Ⅰ段）按躲末端最大短路电流整定，无人为延时，动作时间仅取决于继电器固有动作时间，近似为0秒，即无时限动作。","bank":"电气基础"},{"id":"a77fa70b6a21","type":"single","category":"电气基础","stem":"定时限过电流保护远后备灵敏系数计算为（）","options":{"A":"最小运行方式本线路末端两相短路电流与动作电流之比","B":"最大运行方式本线路末端三相短路电流与动作电流之比","C":"最小运行方式下级线路末端两相短路电流与动作电流之比","D":"最大运行方式下级线路末端三相短路电流与动作电流之比"},"answer":"C","explanation":"远后备指本保护作为下级线路的后备，应在最不利条件下（最小运行方式、下级线路末端两相短路，电流最小）仍有足够灵敏，故灵敏系数取最小运行方式下级线路末端两相短路电流与动作电流之比，要求不小于1.2。","bank":"电气基础"},{"id":"ed734c733904","type":"single","category":"电气基础","stem":"本线路的限时电流速断保护与下级线路瞬时电流速断保护有重叠区，当在重叠区发生故障时由（）","options":{"A":"本线路的限时电流速断保护跳闸","B":"下级线路的瞬时电流速断保护跳闸","C":"均动作跳闸","D":"均不动作"},"answer":"B","explanation":"重叠区内故障，本线路Ⅱ段与下级线路Ⅰ段均会动作，但下级Ⅰ段为瞬时（无延时）先跳闸，本线路Ⅱ段带时限后跳，为保证选择性由下级瞬时速断保护跳闸。","bank":"电气基础"},{"id":"a116f45dff12","type":"single","category":"电气基础","stem":"当限时电流速断保护灵敏度不满足要求时，可考虑（）","options":{"A":"采用过电流保护","B":"与下一级电流速断保护配合","C":"与下一级过电流保护配合","D":"与下一级限时电流速断保护配合"},"answer":"D","explanation":"当限时电流速断（Ⅱ段）灵敏度不足时，可使其与下一级线路的限时电流速断（Ⅱ段）配合，延长保护范围、降低整定值，从而提高灵敏度（牺牲一定速动性）。","bank":"电气基础"},{"id":"f24ddf8f02bd","type":"single","category":"电气基础","stem":"定时限过电流保护的动作电流需要考虑返回系数，是为了（）","options":{"A":"提高保护的灵敏性","B":"外部故障切除后能够可靠返回","C":"解决选择性","D":"快速动作"},"answer":"B","explanation":"过电流保护动作后，外部故障切除时电流应下降并能可靠返回；由于返回电流小于动作电流（返回系数\u003c1），若不考虑返回系数，保护可能不返回而误动或造成越级跳闸，故需考虑返回系数以保证可靠返回。","bank":"电气基础"},{"id":"db080b0e9884","type":"single","category":"电气基础","stem":"电流速断保护的动作电流应大于（）","options":{"A":"被保护线路末端短路时的最大短路电流","B":"线路的最大负载电流","C":"相邻下一线路末端短路时的最大短路电流","D":"相邻下一线路末端短路时的最小短路电流"},"answer":"A","explanation":"为保证选择性，电流速断按躲过被保护线路末端（最大运行方式下）短路时的最大短路电流整定，使区外（末端及以外）故障时不动作。","bank":"电气基础"},{"id":"e5839700044d","type":"single","category":"电气基础","stem":"对于过电流保护，计算保护灵敏系数时，应用（）","options":{"A":"三相短路","B":"两相短路","C":"接地短路","D":"视具体情况而定"},"answer":"B","explanation":"计算过电流保护灵敏系数时，应按最不利情况（短路电流最小）校验，中性点非直接接地或一般电网中两相短路电流最小，故取两相短路校验。","bank":"电气基础"},{"id":"5f1fa53163c2","type":"single","category":"电气基础","stem":"线路保护一般装设两套，两套保护的作用是（）","options":{"A":"主保护","B":"一套为主保护，另一套为后备保护","C":"后备保护","D":"辅助保护"},"answer":"B","explanation":"线路一般配置两套保护：一套为主保护（如纵联/高频保护）快速切除全线故障，另一套为后备保护（如距离、零序保护）在主保护或断路器拒动时起作用，二者互为补充。","bank":"电气基础"},{"id":"7d0ba99d1564","type":"single","category":"电气基础","stem":"双母线接线变电站的母差保护和失灵保护（）复合电压闭锁","options":{"A":"均需","B":"均不需","C":"仅母差保护需","D":"仅失灵保护需"},"answer":"A","explanation":"为防止误接线、误碰或TA饱和等引起误动，双母线变电站的母差保护和失灵保护出口回路均经复合电压闭锁，二者都需要电压闭锁元件。","bank":"电气基础"},{"id":"7159d9d90b0e","type":"single","category":"电气基础","stem":"微机型保护的数据采集单元作用是（）","options":{"A":"模数转换","B":"逻辑判断","C":"出口跳闸","D":"通信传输"},"answer":"A","explanation":"微机保护的数据采集（模拟量输入）单元完成电压/电流信号的隔离、采样保持和A/D模数转换，将模拟量变为数字量供CPU运算。逻辑判断、出口跳闸由CPU及出口回路完成。","bank":"电气基础"},{"id":"be99e333012e","type":"single","category":"电气基础","stem":"断路器失灵保护的相电流判别元件动作时间应（）","options":{"A":"≤20ms","B":"≤50ms","C":"≤100ms","D":"≤200ms"},"answer":"A","explanation":"断路器失灵保护要求快速动作以隔离拒动断路器，其相电流判别元件动作时间应不大于20ms，以保证失灵保护有足够速动性。","bank":"电气基础"},{"id":"a2a143a8f24e","type":"single","category":"电气基础","stem":"双母线母差保护的小差元件用于判别（）","options":{"A":"区内故障","B":"故障母线","C":"区外故障","D":"电流互感器误差"},"answer":"B","explanation":"双母线母差保护中，小差（某一段母线上各支路电流之和）用于判别故障发生在哪一条母线上，以确定跳开故障段母线；大差用于判别区内/区外故障。","bank":"电气基础"},{"id":"004295bd6cb3","type":"single","category":"电气基础","stem":"双母线接线的母差保护电压闭锁环节应加在（）","options":{"A":"母差总出口回路","B":"母联出口回路","C":"各支路出口回路","D":"失灵保护回路"},"answer":"C","explanation":"电压闭锁环节应加在各支路（单元）出口回路，实现有选择性地闭锁，避免某段母线电压异常时误跳健全支路；若仅加在母差总出口，会误闭锁正常的跳闸逻辑。","bank":"电气基础"},{"id":"3145defb1c91","type":"single","category":"电气基础","stem":"变压器纵差保护（）反应轻微匝间故障，原因是（）","options":{"A":"能 灵敏度高","B":"不能 故障电流小","C":"能 基于磁平衡原理","D":"不能 受励磁涌流影响"},"answer":"B","explanation":"轻微匝间短路时，差流仅为故障匝与总匝差异形成的很小环流，低于纵差保护的整定值和灵敏度，因此纵差保护不能可靠反应轻微匝间故障，原因是故障电流小。","bank":"电气基础"},{"id":"f33428253566","type":"single","category":"电气基础","stem":"母线充电保护是（），作用于（）","options":{"A":"后备保护 跳闸","B":"临时保护 跳闸","C":"主保护 信号","D":"辅助保护 信号"},"answer":"B","explanation":"母线充电保护是仅在母线充电合闸时临时投入的保护，充电正常后立即退出，动作于跳闸，用于防止充电到故障母线。它属于临时保护而非主保护或后备。","bank":"电气基础"},{"id":"98767b5ab419","type":"single","category":"电气基础","stem":"三段式电流保护中，灵敏度最高的是（）","options":{"A":"Ⅲ段","B":"Ⅱ段","C":"Ⅰ段","D":"都一样"},"answer":"A","explanation":"三段式电流保护中，Ⅲ段（定时限过电流）整定值最小、保护范围最长（可延伸到下级线路），灵敏系数最高；Ⅰ段（速断）最不灵敏。","bank":"电气基础"},{"id":"b45723915fff","type":"single","category":"电气基础","stem":"断路器失灵保护是一种（）","options":{"A":"主保护","B":"近后备保护","C":"远后备保护"},"answer":"B","explanation":"断路器失灵保护在本应跳闸的断路器拒动时动作，切除该拒动断路器所在母线的其他支路，属于近后备保护（依赖于本变电站设备）。","bank":"电气基础"},{"id":"227d8b071ced","type":"single","category":"电气基础","stem":"下列保护中，属于后备保护的是()","options":{"A":"变压器差动保护","B":"瓦斯保护","C":"高频闭锁零序保护","D":"断路器失灵保护"},"answer":"D","explanation":"断路器失灵保护属近后备保护。变压器差动保护、瓦斯保护均为变压器主保护，高频闭锁零序保护一般作为全线速动的主保护，故只有D属后备保护。","bank":"电气基础"},{"id":"5721d75e80bc","type":"single","category":"电气基础","stem":"主保护或断路器拒动时，用来切除故障的保护是（）","options":{"A":"安全自动装置","B":"异常运行保护","C":"后备保护"},"answer":"C","explanation":"后备保护的定义即是：当主保护或断路器拒动时，用来切除故障的保护，分为近后备和远后备。","bank":"电气基础"},{"id":"065a7b5a728b","type":"single","category":"电气基础","stem":"在电流保护中加装低电压闭锁组件的目的是（）","options":{"A":"提高保护的可靠性","B":"提高保护的选择性","C":"提高保护的快速性","D":"提高保护的灵敏性"},"answer":"D","explanation":"电流保护中加装低电压闭锁后，正常负荷电流虽可能较大但电压不降低不动作，从而可把电流整定值降低，提高保护的灵敏性，同时防止过负荷误动。","bank":"电气基础"},{"id":"99e305f39061","type":"single","category":"电气基础","stem":"一般双母线母差保护选用什么作为区内故障的判别元件（）","options":{"A":"大差","B":"小差","C":"电压","D":"刀闸辅助接点"},"answer":"A","explanation":"双母线母差保护中，大差（除母联外所有支路电流代数和）用于判别故障是否在母线区内（区内差流不为零，区外近似为零），是区内故障的判别元件；小差用于判别故障在哪一段母线。","bank":"电气基础"},{"id":"6403dcbd1cc3","type":"single","category":"电气基础","stem":"为防止区外短路切除过程中因零序或负序功率倒向而造成误动作，线路保护方向元件从反向到正向动作带（）ms延时","options":{"A":"30","B":"40","C":"60","D":"120"},"answer":"C","explanation":"为防止区外短路切除瞬间因零序或负序功率倒向导致方向元件误动，规程规定方向元件从反方向转向正方向动作需带60ms延时（正向转反向一般不延时或短延时）。","bank":"电气基础"},{"id":"5d7fce05e785","type":"single","category":"电气基础","stem":"变压器的纵差保护（）","options":{"A":"能够反应变压器的所有故障","B":"只能反应变压器的相间故障和接地故障","C":"不能反应变压器的轻微匝间故障"},"answer":"C","explanation":"变压器纵差保护不能反应轻微匝间故障，因为轻微匝间短路产生的差流很小，低于差动保护的灵敏度和整定值，无法可靠动作。A、B均不准确。","bank":"电气基础"},{"id":"c4a07b9a2794","type":"single","category":"电气基础","stem":"需要设置复合电压闭锁的母差保护，所加电压闭锁环节应加在（）","options":{"A":"母差各出口回路","B":"母联出口","C":"母差总出口"},"answer":"A","explanation":"需要复合电压闭锁的母差保护，电压闭锁环节应加在各支路（单元）出口回路，以便有选择性地闭锁，避免误跳健全支路。","bank":"电气基础"},{"id":"78a9ec55db5a","type":"single","category":"电气基础","stem":"按躲负荷电流整定的线路过电流保护，在正常负荷电流下，由于电流互感器的极性接反而有可能误动的接线方式为：（）","options":{"A":"三相三继电器式完全星形接线","B":"两相两继电器式不完全星形接线","C":"两相三继电器式不完全星形接线","D":"单相单继电器式接线"},"answer":"C","explanation":"两相三继电器式（V形接法加第三只中性线继电器）接线中，第三只继电器电流为两相电流之和（即-Ic）；若某相TA极性接反，正常对称负荷下该继电器可能流过较大电流而误动。其他接线在对称负荷下一般不会误动。","bank":"电气基础"},{"id":"b84c5da5bcb7","type":"single","category":"电气基础","stem":"能切除线路区内任一点故障的主保护是（）","options":{"A":"工频突变量距离保护","B":"距离保护","C":"零序方向电流保护","D":"纵联保护"},"answer":"D","explanation":"纵联保护（高频/光纤差动）比较线路两端电气量，能无延时切除线路全线（区内任一点）故障，是唯一能保护全线任意点的主保护；工频突变量距离、距离、零序方向保护均存在死区或需分段配合。","bank":"电气基础"},{"id":"c213c6525719","type":"single","category":"电气基础","stem":"同步相量测量装置（PMU）的主要功能是（）","options":{"A":"测量电压电流相量","B":"提供实时同步数据","C":"监测系统稳定","D":"以上都是"},"answer":"D","explanation":"同步相量测量装置（PMU）基于GPS/北斗同步时钟测量电压、电流相量，提供带统一时标的实时同步数据，用于电力系统动态稳定监测与分析，A、B、C均正确，故选以上都不是以外的其他综合项（D）。","bank":"电气基础"},{"id":"d1b85f913c22","type":"single","category":"电气基础","stem":"当大气过电压使线路上所装设的避雷器放电时，电流速断保护（）。","options":{"A":"应同时动作","B":"不应动作","C":"以时间差动作","D":"视情况而定是否动作"},"answer":"B","explanation":"避雷器因大气过电压（雷击）放电时，工频短路电流并不大，电流速断保护按躲过正常短路电流整定不应动作，否则会误切线路。","bank":"电气基础"},{"id":"77db96750d74","type":"single","category":"电气基础","stem":"下列设备中，属于无功补偿装置的是（）","options":{"A":"并联电容器","B":"串联电抗器","C":"静止无功发生器（SVG）","D":"以上都是"},"answer":"D","explanation":"并联电容器提供容性无功，串联电抗器可补偿/抑制谐波并参与无功调节，SVG（静止无功发生器）是动态无功补偿装置，三者均属无功补偿装置。","bank":"电气基础"},{"id":"4b6cd672e700","type":"single","category":"电气基础","stem":"公用一组熔丝的每一套独立的（），必须从直流电源正、负专用端子配对供电，不允许各保护间正负直流电源混接。","options":{"A":"自动装置","B":"测控装置","C":"保护装置","D":"二次装置"},"answer":"C","explanation":"继电保护规程要求，公用一组熔丝的每一套独立保护装置，其直流电源必须从专用正、负端子配对供电，各套保护间正负直流电源不得混接，以防止寄生回路和误动。","bank":"电气基础"},{"id":"59ff69239b43","type":"single","category":"电气基础","stem":"变压器的瓦斯保护主要反应（）故障。","options":{"A":"绕组相间短路","B":"绕组接地短路","C":"油箱内部故障"},"answer":"C","explanation":"瓦斯保护通过气体继电器反应油箱内部故障（匝间短路、铁芯过热、油面降低等）产生的气体和油流，主要反应油箱内部故障，对内部故障灵敏。","bank":"电气基础"},{"id":"d210d413b5fe","type":"single","category":"电气基础","stem":"列哪种电器不能用于短路保护（）","options":{"A":"熔断器","B":"热继电器","C":"低压断路器","D":"过电流继电器"},"answer":"B","explanation":"热继电器基于双金属片热效应，动作较慢，用于电动机等设备的过载保护，不能对短路（需瞬时切断大电流）起保护作用；熔断器、低压断路器、过电流继电器均可用于短路保护。","bank":"电气基础"},{"id":"dec00591c0c5","type":"judge","category":"电气基础","stem":"零序电流保护的逐级配合是指零序电流保护各段的时间要严格配合。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"零序电流保护的逐级配合主要指各段定值（电流/灵敏度、保护范围）按阶梯配合，并非仅指时间严格配合；时间也配合但不是“逐级配合”的唯一含义。正确说法：零序保护配合主要是电流定值的逐级配合，时间按阶梯原则配合。","bank":"电气基础"},{"id":"2665a296f85a","type":"judge","category":"电气基础","stem":"当限时电流速断保护灵敏度不满足要求时，通常解决灵敏度不足的方法是限时电流速断保护的动作电流及动作时间与下级线路瞬时电流速断保护配合。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"限时电流速断（Ⅱ段）灵敏度不足时，通常应与下级线路限时电流速断（Ⅱ段）配合，而不仅是与下级瞬时速断（Ⅰ段）配合；或采用降低动作电流、拉长时限等方法。题目说法不准确，故错误。","bank":"电气基础"},{"id":"951e8ed76dc8","type":"judge","category":"电气基础","stem":"瓦斯保护装设于容量为1000KVA及以上的变压器。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"按规程，800kVA及以上的油浸式变压器应装设瓦斯保护（气体保护），并非1000kVA。题目把阈值说成1000kVA是错误的。","bank":"电气基础"},{"id":"df34b65bf315","type":"judge","category":"电气基础","stem":"在降压变电站中，当低压侧装有分段断路器时，允许利用变压器的后备保护以第一时段动作于分段断路器。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"为缩小故障停电范围，变压器后备保护可设两个时限：第一时限动作于跳开低压侧分段断路器，第二时限动作于跳变压器各侧。该做法符合规程，正确。","bank":"电气基础"},{"id":"faaba23e9c6b","type":"judge","category":"电气基础","stem":"变压器的方向过电流保护的动作方向应指向变压器。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"变压器方向过电流保护作为相邻元件（线路、母线）的远后备，其功率方向应指向被保护正方向（母线/线路侧）以判别区外故障。指向变压器本身是错误的，正确方向应指向变压器下游（出线/母线）侧。","bank":"电气基础"},{"id":"84681f30834c","type":"judge","category":"电气基础","stem":"电动机电流速断保护高定值按照躲过电动机的最大负荷电流整定。（）","options":{"A":"对","B":"错"},"answer":"错","explanation":"电动机电流速断保护高定值应按躲过区外故障（相邻设备短路）时电动机提供的最大反馈电流（或最大启动电流）整定，而非最大负荷电流。按负荷电流整定会导致保护范围不足，故错误。","bank":"电气基础"},{"id":"2546eeb37add","type":"judge","category":"电气基础","stem":"电动机电流速断保护低定值按照躲过外部故障切除后电动机的最大起动电流，以及外部三相短路故障时电动机向外提供的最大反馈电流整定。（）","options":{"A":"对","B":"错"},"answer":"对","explanation":"低定值作为速断保护的较低门槛，需躲过外部故障切除后电动机自起动的最大电流以及外部短路时电动机反馈的最大电流，避免区外故障误动，说法正确。","bank":"电气基础"},{"id":"c32dbe47033f","type":"judge","category":"电气基础","stem":"变压器过电流保护的电流元件的动作电流按躲过变压器可能出现的励磁涌流整定","options":{"A":"对","B":"错"},"answer":"错","explanation":"过电流保护的电流元件按躲过变压器的最大负荷电流整定；励磁涌流由差动保护的涌流判别（二次谐波制动等）闭锁，不由过流元件躲。故说法错误。","bank":"电气基础"},{"id":"f3ead004e979","type":"judge","category":"电气基础","stem":"变压器低电压起动的过电流保护的电压元件动作电压整定，按照躲过正常运行母线可能出现的最低工作电压","options":{"A":"对","B":"错"},"answer":"对","explanation":"低电压元件动作电压应低于正常运行时可能出现的最低工作电压，以保证正常时不起动、故障时（电压下降）才动作，整定原则正确。","bank":"电气基础"},{"id":"efb5b4b300d3","type":"judge","category":"电气基础","stem":"瞬时电流速断保护是通过对动作电流的合理整定来保证选择性的","options":{"A":"对","B":"错"},"answer":"对","explanation":"瞬时电流速断（Ⅰ段）按躲过本线路末端（或下级线路始端）最大短路电流整定，使保护范围不延伸到下级，从而靠电流定值保证选择性，说法正确。","bank":"电气基础"},{"id":"9d656c14eafc","type":"judge","category":"电气基础","stem":"变压器保护中，电气量和非电气量保护起动失灵保护，并具备解除失灵保护的复压闭锁功能","options":{"A":"对","B":"错"},"answer":"错","explanation":"只有电气量保护才起动失灵保护并解除复压闭锁；非电气量保护（如瓦斯、压力释放）动作慢、不反映电气量，不应起动失灵保护。故说法错误。","bank":"电气基础"},{"id":"4bb897925b00","type":"judge","category":"电气基础","stem":"母线保护差动电流宜按最大流变变比元件电流回路断线时由于最大负荷电流引起的差电流整定","options":{"A":"对","B":"错"},"answer":"错","explanation":"母线保护TA断线判别（差流）定值应按躲过正常运行及外部故障时的不平衡电流整定，并非按最大负荷电流引起的差电流整定。故说法错误。","bank":"电气基础"},{"id":"64656c8cf20f","type":"judge","category":"电气基础","stem":"正常设置全线速动保护的线路，对超短线路，距离Ⅱ段可以停用，但不得将该类线路全线速动保护停用","options":{"A":"对","B":"错"},"answer":"错","explanation":"规程对超短线路要求全线速动保护必须投入、不得停用；但距离Ⅱ段并非简单“可以停用”，超短线路因阻抗测量范围极小，相关后备保护应按具体配置要求处理，不能笼统地停用距离Ⅱ段。故该表述判为错误。（注：本题答案与常规理解有出入，建议核对原规程。）","bank":"电气基础"},{"id":"27b02055f465","type":"judge","category":"电气基础","stem":"母线保护中，母联断路器的合闸回路故障不影响母线保护的正常工作。","options":{"A":"对","B":"错"},"answer":"错","explanation":"母联断路器合闸回路故障会影响母线运行方式的切换与充电操作，进而使母线保护的运行方式识别（双母小差、互联逻辑）出错，影响正常工作。故说法错误。","bank":"电气基础"},{"id":"6e2bfeb4f52a","type":"judge","category":"电气基础","stem":"母线保护中，电压互感器二次侧回路的熔断器熔断不会影响保护的正常运行。","options":{"A":"对","B":"错"},"answer":"错","explanation":"TV二次熔断器熔断会使相应电压量消失，导致复合电压闭锁元件异常、电压回路断线，母线保护可能被误闭锁或失去电压判据，影响正常运行。故错误。","bank":"电气基础"},{"id":"68ae9cdfa00e","type":"judge","category":"电气基础","stem":"母线保护中，电压互感器二次侧电压异常不会影响保护的动作行为。","options":{"A":"对","B":"错"},"answer":"错","explanation":"TV二次电压异常（断线、失压）会影响复合电压闭锁元件及电压判据，母线保护可能误动或拒动，必然影响动作行为。故错误。","bank":"电气基础"},{"id":"1b82f59c06f9","type":"judge","category":"电气基础","stem":"母线保护中，电压闭锁元件可以提高保护的可靠性。","options":{"A":"对","B":"错"},"answer":"对","explanation":"复合电压闭锁（低电压、负序、零序电压）可防止由于电流回路异常、误碰等原因造成的母线保护误动，提高可靠性，说法正确。","bank":"电气基础"},{"id":"4f247580aa7d","type":"judge","category":"电气基础","stem":"母线保护中，电流互感器二次侧回路的连接方式不影响保护的性能。","options":{"A":"对","B":"错"},"answer":"错","explanation":"TA二次接线方式（星形/三角形、极性、变比）直接影响差动保护的电流矢量和与制动特性，错误接线会导致差流异常、保护误动或拒动。故错误。","bank":"电气基础"},{"id":"8664e2e15343","type":"judge","category":"电气基础","stem":"母线保护中，差动电流大于制动电流时，保护一定动作。","options":{"A":"对","B":"错"},"answer":"错","explanation":"比率制动式母线差动保护动作需满足差流大于启动定值且进入比率制动动作区（差流大于制动电流乘制动系数加拐点等条件），并非“差流>制动电流”就动作。故错误。","bank":"电气基础"},{"id":"28ea5ed54463","type":"judge","category":"电气基础","stem":"母线保护中，采用相位比较原理时，只需要比较电流的相位。","options":{"A":"对","B":"错"},"answer":"错","explanation":"相位比较式母差保护除比较各支路电流相位外，还需幅值或启动量等判据；仅靠相位比较不足以保证选择性（区外故障各支路电流同相但大小不等）。故错误。","bank":"电气基础"},{"id":"b21b9832c578","type":"judge","category":"电气基础","stem":"母线保护只能保护母线本体的故障。","options":{"A":"对","B":"错"},"answer":"错","explanation":"母线保护（母差）主要反应母线本体及相连电流互感器之间的故障，通过跳闸出口还可联跳相关元件，并非“只能”保护母线本体。故错误。","bank":"电气基础"},{"id":"c5cf9bf1550f","type":"judge","category":"电气基础","stem":"母线保护可以反映所有类型的母线故障。","options":{"A":"对","B":"错"},"answer":"错","explanation":"母线保护对大多数类型故障有效，但在某些特殊工况（TA饱和、电流回路断线、某些转换性故障）下可能存在死区或受限制，不能说“反映所有类型”。故错误。","bank":"电气基础"},{"id":"660fa97c3bc0","type":"judge","category":"电气基础","stem":"数字式母线保护比传统电磁式母线保护的可靠性更高。","options":{"A":"对","B":"错"},"answer":"对","explanation":"数字式母差保护具有自检、完善的闭锁逻辑、抗饱和算法和灵活通信，整体可靠性优于传统电磁型（电流相位比较、比率制动继电器），说法正确。","bank":"电气基础"},{"id":"de5aedf9f269","type":"judge","category":"电气基础","stem":"母线保护不需要与其他保护配合。","options":{"A":"对","B":"错"},"answer":"错","explanation":"母线保护需与线路保护、变压器保护、失灵保护、充电保护等配合（远方跳闸、失灵联跳、电压闭锁），以保证全站保护的选择性与可靠性。故错误。","bank":"电气基础"},{"id":"49666e519847","type":"judge","category":"电气基础","stem":"母联电流相位比较式母线保护是根据母联断路器中电流的相位来判断母线故障的。","options":{"A":"对","B":"错"},"answer":"对","explanation":"母联电流相位比较式母差利用母联电流相位判别故障所在母线（区内故障时母联电流相位与某母线电流相反），说法正确。","bank":"电气基础"},{"id":"4a355840d8b3","type":"judge","category":"电气基础","stem":"母线充电保护是为了防止母线充电时发生故障而设置的快速保护。","options":{"A":"对","B":"错"},"answer":"对","explanation":"充电保护在母线充电（用旁路/母联给空母线充电）时投入，作为临时快速保护切除充电过程中母线上的故障，说法正确。","bank":"电气基础"},{"id":"2146ae97b3d4","type":"judge","category":"电气基础","stem":"母线的正常运行方式改变不会影响母线保护的性能。","options":{"A":"对","B":"错"},"answer":"错","explanation":"母线运行方式（分段断路器分/合、倒闸操作、元件所在母线变化）会改变小差电流构成与电压切换，母线保护需随之自适应，否则性能受影响。故错误。","bank":"电气基础"},{"id":"ea0b7362c02c","type":"judge","category":"电气基础","stem":"母线保护的动作时间应大于相邻线路保护的动作时间。","options":{"A":"对","B":"错"},"answer":"错","explanation":"母线保护属主保护，应快速切除故障；其动作时间一般小于（不大于）相邻线路后备保护时间，以保证选择性，而非大于。故错误。","bank":"电气基础"},{"id":"31a0626b1d84","type":"judge","category":"电气基础","stem":"母线充电保护的电流互感器变比应与充电断路器的额定电流相匹配，避免采样误差过大。","options":{"A":"对","B":"错"},"answer":"对","explanation":"TA变比与断路器额定电流匹配可使正常运行及充电时电流采样在合理量程，减小测量误差、保证充电保护正确动作，说法正确。","bank":"电气基础"},{"id":"485873eb3e0c","type":"judge","category":"电气基础","stem":"母线保护中，复合电压闭锁元件的负序电压定值应大于正常运行时的最大负序电压背景值。","options":{"A":"对","B":"错"},"answer":"对","explanation":"负序电压定值须躲过系统正常运行及不对称负荷等产生的背景负序电压，避免误开放保护，整定原则正确。","bank":"电气基础"},{"id":"6fae5bb64d0e","type":"judge","category":"电气基础","stem":"单母线分段接线中，若分段断路器断开，母线保护应将两段母线视为独立母线分别计算小差电流。","options":{"A":"对","B":"错"},"answer":"对","explanation":"分段断路器断开后两段母线电气独立，母差保护应分别按各段母线构成小差，正确判别各自区内故障，说法正确。","bank":"电气基础"},{"id":"e33c7f36c5b3","type":"judge","category":"电气基础","stem":"母线保护的出口跳闸回路应采用“跳闸矩阵”设计，允许灵活配置各断路器的跳闸逻辑。","options":{"A":"对","B":"错"},"answer":"对","explanation":"跳闸矩阵可按运行方式灵活配置故障母线与各连接元件断路器的对应关系，提高适应性与可靠性，符合数字式母差设计，正确。","bank":"电气基础"},{"id":"85ad561d8cb0","type":"judge","category":"电气基础","stem":"母线保护的定值单中，“差动启动电流”定值应小于“比率制动拐点电流”定值。","options":{"A":"对","B":"错"},"answer":"对","explanation":"比率制动特性中，启动电流（最小动作差流）通常低于拐点电流：差流小于拐点时按启动定值动作，大于拐点后进入比率制动区，故此整定关系正确。","bank":"电气基础"},{"id":"a07619cb992e","type":"judge","category":"电气基础","stem":"双母线接线中，母线保护的电压切换继电器应采用电压型继电器，避免电流型继电器的功耗问题。","options":{"A":"对","B":"错"},"answer":"错","explanation":"电压切换回路采用单位置/双位置继电器（由隔离开关辅助接点控制），并非所谓“电压型继电器”，且应优先采用大功率抗干扰继电器；“采用电压型继电器避免电流型功耗”的说法不成立。故错误。","bank":"电气基础"},{"id":"3a3a036d450f","type":"judge","category":"电气基础","stem":"当母线保护检测到某支路电流为零且无对应刀闸断开信号时，可能判断为TA断线。","options":{"A":"对","B":"错"},"answer":"对","explanation":"若该支路在运行状态（刀闸未断开）却无电流，符合TA二次回路断线/开路特征，母差保护据此可判为TA断线并告警/闭锁，说法正确。","bank":"电气基础"},{"id":"9d4f2f661742","type":"judge","category":"电气基础","stem":"母线保护中，电压闭锁元件的低电压定值应低于母线正常运行时的最低工作电压。","options":{"A":"对","B":"错"},"answer":"对","explanation":"低电压元件动作值须低于正常最低工作电压，确保正常及过负荷时不误动，故障时电压下降才开放保护，整定正确。","bank":"电气基础"},{"id":"f71e8d51542f","type":"judge","category":"电气基础","stem":"母线充电保护的电流互感器应安装在充电断路器的电源侧，以正确检测母线故障电流。","options":{"A":"对","B":"错"},"answer":"对","explanation":"充电保护用TA应装于充电断路器电源侧（靠近母线侧），以正确获取母线充电过程中的故障电流，说法正确。","bank":"电气基础"},{"id":"749d1b2309b3","type":"judge","category":"电气基础","stem":"双母线接线中，母线保护的跳闸出口应同时跳开母联断路器和故障母线上的所有连接元件。","options":{"A":"对","B":"错"},"answer":"对","explanation":"双母接线母差动作时，应跳开故障母线上所有连接元件及母联（分段）断路器，隔离故障母线，说法正确。","bank":"电气基础"},{"id":"46c1aba588c6","type":"judge","category":"电气基础","stem":"当母线发生三相金属性短路故障时，母线保护的差流等于所有故障支路电流的矢量和。","options":{"A":"对","B":"错"},"answer":"错","explanation":"母差保护的差流是所有连接元件（含非故障支路）电流的矢量和；三相金属性短路时非故障支路电流也参与求和，差流并非仅“故障支路”电流之和。故错误。","bank":"电气基础"},{"id":"7c76bab5c25d","type":"judge","category":"电气基础","stem":"母线保护的失灵保护启动电流定值应大于故障线路的最大负荷电流，小于线路保护的动作电流。","options":{"A":"对","B":"错"},"answer":"对","explanation":"失灵启动电流应躲过最大负荷电流（避免正常时误启动）且小于线路保护动作电流（保证故障时有足够灵敏度），整定关系正确。","bank":"电气基础"},{"id":"1af3744ba644","type":"judge","category":"电气基础","stem":"母线充电保护的时间定值应整定为0秒，以确保瞬时切除母线故障。","options":{"A":"对","B":"错"},"answer":"对","explanation":"充电保护作为临时快速保护，时间定值通常整定为0秒（瞬时），以尽快切除充电过程中的母线故障，说法正确。","bank":"电气基础"},{"id":"e2f5c47685e8","type":"judge","category":"电气基础","stem":"双母线接线中，当母联断路器断开且两条母线独立运行时，母线保护应自动切换为单母线保护模式。","options":{"A":"对","B":"错"},"answer":"错","explanation":"母联断开、双母独立运行时，母差保护应仍按双母线（分段）逻辑、分别构成各母线小差，而非简化为单母线模式。故错误。","bank":"电气基础"},{"id":"76d5d2635394","type":"judge","category":"电气基础","stem":"母线充电保护在母线正常运行后应自动退出，无需人工干预。","options":{"A":"对","B":"错"},"answer":"对","explanation":"充电保护仅在充电操作期间投入，充电完成、母线正常运行后通常退出（部分装置可自动退出），避免长时间误动，说法正确。","bank":"电气基础"},{"id":"d31163c31dfe","type":"judge","category":"电气基础","stem":"双母线接线中，母线保护的电压切换回路应根据母线刀闸位置自动切换电压输入。","options":{"A":"对","B":"错"},"answer":"对","explanation":"电压切换回路依据隔离开关（刀闸）辅助接点位置自动将对应母线TV二次电压接入保护，说法正确。","bank":"电气基础"},{"id":"564fdff88604","type":"judge","category":"电气基础","stem":"母线保护的出口回路应配置断路器失灵保护的启动接点，以便在断路器拒动时启动失灵保护。","options":{"A":"对","B":"错"},"answer":"对","explanation":"母差保护动作跳断路器后，若断路器拒动应启动失灵保护跳开相关母线其他元件，故出口回路需配置失灵启动接点，正确。","bank":"电气基础"},{"id":"c0a358b0473a","type":"judge","category":"电气基础","stem":"对于装置间不经附加判据直接启动跳闸的开入量，应经抗干扰继电器重动后开入;抗干扰继电器的启动功率应大于5W,动作电压在额定直流电源电压的55%～70%范围内，额定直流电源电压下动作时间应小于5ms。()","options":{"A
