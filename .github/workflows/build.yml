name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid xz make
          git clone --recursive --depth=1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build IPA
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$PATH"
          make package FINALPACKAGE=1 PACKAGE_FORMAT=ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ExamBuddy-ipa
          path: packages/*.ipa
